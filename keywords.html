<script>
const DATA = [{"name": "安全與 IAM", "tag": "配分最重", "rows": [{"no": "NO.1", "stem": "Your organization is defining the resource hierarchy for its new application in Google Cloud. You need <b class=\"kw\">separate development and production environments</b>. The production environment will be deployed in Compute Engine in two regions. Which structure should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. Create a single <b>project</b> for all environments. Use <b>labels</b> to segregate resources by environment."}, {"L": "B", "ok": false, "html": "B. Create a single <b>project</b> for all environments. Use tags to segregate resources by environment."}, {"L": "C", "ok": true, "html": "C. Create one <b>project</b> for the development environment and one project for the production environment."}, {"L": "D", "ok": false, "html": "D. Create two <b>projects</b> for the development environment and two <b>project</b>s for the production environment (one for each region)."}], "ansL": "C", "ans": "Create one project for the development environment and one project for the production environment（開發、正式各一個 Project）", "trig": "separate development and production environments 分開的開發與正式環境 → 各環境各自一個 Project", "formula": "要「隔離」環境或團隊 → 開不同 Project；只是想「分類看報表」→ 才用 label"}, {"no": "NO.22", "stem": "Your manager wants to restrict communication of all virtual machines with internet access; with resources in another network; or with a resource outside Compute Engine. It is expected that <b class=\"kw\">different teams will create new folders and projects in the near future</b>. How would you restrict all virtual machines from having an external IP address?", "opts": [{"L": "A", "ok": true, "html": "A. Define an <b>organization</b> policy at the root organization node to restrict virtual machine instances from having an external IP address"}, {"L": "B", "ok": false, "html": "B. Define an <b>organization</b> policy on all existing <b>folders</b> to define a constraint to restrict virtual machine instances from having an external IP address"}, {"L": "C", "ok": false, "html": "C. Define an <b>organization</b> policy on all existing <b>projects</b> to restrict virtual machine instances from having an external IP address"}, {"L": "D", "ok": false, "html": "D. Communicate with the different teams and agree that each time a virtual machine is created, it must be configured without an external IP address"}], "ansL": "A", "ans": "Define an organization policy at the root organization node（在組織根節點設 Org Policy）", "trig": "different teams will create new folders and projects in the near future 未來還會新增資料夾與專案 → 政策要下在最上層", "formula": "題目出現「未來還會新增 folder／project」→ 政策一律下在 organization 根節點，靠繼承覆蓋全部"}, {"no": "NO.24", "stem": "An organization has had a data leak scare because one employee made a sensitive Cloud Storage bucket available to the public. Given the nature of the company&#x27;s business, it is understood that there is never any reason to give the public direct access to any file. The security head wants to <b class=\"kw\">ensure that such an event never occurs again</b>. How can you ensure this?", "opts": [{"L": "A", "ok": false, "html": "A. Remove Edit access rights of all <b>Cloud Storage</b> buckets so that no user can make any edits."}, {"L": "B", "ok": true, "html": "B. Set an <b>organization</b>al policy constraint to restrict bucket access set to the public."}, {"L": "C", "ok": false, "html": "C. Use Cloud Scheduler to run a job at a specified interval to scan buckets. Any public permissions can be programmatically changed."}, {"L": "D", "ok": false, "html": "D. Write <b>Cloud Functions</b> code connected to <b>Cloud Storage</b>. Any changes will be notified to the function which can be used to reset the public access."}], "ansL": "B", "ans": "Set an organizational policy constraint to restrict bucket access set to the public（用 Org Policy 禁止公開）", "trig": "ensure that such an event never occurs again 確保這種事再也不會發生 → 從源頭禁止", "formula": "「保證再也不會發生」→ organization policy（事前禁止）；「發現已經發生的問題」→ Security Command Center（事後偵測）"}, {"no": "NO.56", "stem": "Your organization consists of many teams. Each team has many Google Cloud projects. Your organization wants to <b class=\"kw\">simplify the management of identity and access policies</b> for these projects. How can you group these projects to meet this goal?", "opts": [{"L": "A", "ok": false, "html": "A. Group each team&#x27;s <b>projects</b> into a separate domain"}, {"L": "B", "ok": false, "html": "B. Assign <b>labels</b> based on the virtual machines that are part of each team&#x27;s <b>projects</b>"}, {"L": "C", "ok": true, "html": "C. Use <b>folders</b> to group each team&#x27;s <b>projects</b>"}, {"L": "D", "ok": false, "html": "D. Group each team&#x27;s <b>projects</b> into a separate <b>organization</b> node"}], "ansL": "C", "ans": "Use folders to group each team&#x27;s projects（用 Folder 分組）", "trig": "simplify the management of identity and access policies 簡化身分與存取政策的管理 → 用 folder 讓政策繼承", "formula": "「一次管很多 project 的權限」→ Folder；「只是分類看費用」→ label"}, {"no": "NO.65", "stem": "Your organization needs to ensure that the Google Cloud resources of each of your departments are <b class=\"kw\">segregated from one another</b>. Each department has several environments of its own: development, testing, and production. Which strategy should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. Create a <b>project</b> per department, and create a <b>folder</b> per environment in each project."}, {"L": "B", "ok": true, "html": "B. Create a <b>folder</b> per department, and create a <b>project</b> per environment in each folder."}, {"L": "C", "ok": false, "html": "C. Create a Cloud Identity domain per department, and create a <b>project</b> per environment in each domain."}, {"L": "D", "ok": false, "html": "D. Create a Cloud Identity domain per environment, and create a <b>project</b> per department in each domain."}], "ansL": "B", "ans": "Create a folder per department, and create a project per environment in each folder（folder＝部門，project＝環境）", "trig": "segregated from one another 各部門彼此隔離 → 部門用 folder、環境用 project", "formula": "階層固定是 Organization → Folder → Project → 資源；folder 對應組織單位（部門、團隊），project 對應環境或應用"}, {"no": "NO.82", "stem": "Your company needs to segment Google Cloud resources used by each team from the others. The teams&#x27; efforts are changing frequently, and you need to <b class=\"kw\">reduce operational risk and maintain cost visibility</b>. Which approach does Google recommend?", "opts": [{"L": "A", "ok": true, "html": "A. One <b>project</b> per team."}, {"L": "B", "ok": false, "html": "B. One <b>organization</b> per team."}, {"L": "C", "ok": false, "html": "C. One <b>project</b> that contains all of each team&#x27;s resources."}, {"L": "D", "ok": false, "html": "D. One top-level <b>folder</b> per team."}], "ansL": "A", "ans": "One project per team（每個團隊一個 Project）", "trig": "reduce operational risk and maintain cost visibility 降低營運風險並維持成本可視性 → Project 是計費與權限的最小單位", "formula": "強調「成本看得見 cost visibility」→ 選 Project（計費單位）；強調「一次管很多專案的權限」→ 選 Folder"}, {"no": "NO.102", "stem": "Your organization is developing a plan for migrating to Google Cloud. What is a <b class=\"kw\">best practice when initially configuring</b> your Google Cloud environment?", "opts": [{"L": "A", "ok": false, "html": "A. Create a <b>project</b> via Google Cloud Console per department in your company"}, {"L": "B", "ok": true, "html": "B. Define your <b>resource hierarchy</b> with an <b>organization</b> node on top"}, {"L": "C", "ok": false, "html": "C. Create <b>projects</b> based on team members&#x27; requests"}, {"L": "D", "ok": false, "html": "D. Make every member of your company the <b>project</b> owner"}], "ansL": "B", "ans": "Define your resource hierarchy with an organization node on top（組織節點放最上層）", "trig": "best practice when initially configuring 一開始配置時的最佳做法 → 先把 organization node 立在頂端", "formula": "問「上雲第一步怎麼配置」→ 先建 organization node，再往下切 folder、project"}, {"no": "NO.148", "stem": "Your customer is moving to Google Cloud. They have <b class=\"kw\">many teams</b>, <b class=\"kw\">each working on many projects</b>. How should they organize resources?", "opts": [{"L": "A", "ok": true, "html": "A. Let each team have one shared <b>Folder</b> with multiple <b>Projects</b> within it so that there is a separation of concerns."}, {"L": "B", "ok": false, "html": "B. Let each <b>Project</b> have one <b>Folder</b> so that there is a clear separation of concerns."}, {"L": "C", "ok": false, "html": "C. Let each team have an <b>Organization</b> so that they can entirely manage themselves with their own identity."}, {"L": "D", "ok": false, "html": "D. Let each team have one shared <b>Project</b> so that it is easy to manage."}], "ansL": "A", "ans": "Let each team have one shared Folder with multiple Projects within it（每團隊一個共用 Folder，內含多個 Project）", "trig": "many teams, each working on many projects 很多團隊、每團隊很多專案 → 團隊配 folder、底下放多個 project", "formula": "一團隊有「多個」專案 → folder 包 project；一團隊只有「一個」專案 → 直接開 project 就好"}, {"no": "NO.158", "stem": "In Google Cloud IAM: if a policy applied at the project level gives you Owner permissions, your access to an individual resource in that project <b class=\"kw\">might be restricted to View permission</b> if someone applies a more restrictive policy directly to that resource. What is correct below the options", "opts": [{"L": "A", "ok": true, "html": "A. False"}, {"L": "B", "ok": false, "html": "B. None of the above."}, {"L": "C", "ok": false, "html": "C. True"}, {"L": "D", "ok": false, "html": "D. Not defined by GCP."}], "ansL": "A", "ans": "False（敘述為假：IAM 政策是聯集，下層不會被上層收回）", "trig": "might be restricted to View permission 可能被縮限成僅檢視 → 這件事不會發生，故答 False", "formula": "IAM 權限只會「往下加」不會「往下減」；真的要擋掉某件事，要用 organization policy 或 deny policy"}, {"no": "NO.169", "stem": "All Google Cloud Platform services are associated with a project that is used to provide what functions?", "opts": [{"L": "A", "ok": false, "html": "A. Manage Container Deployments"}, {"L": "B", "ok": true, "html": "B. Enable Services and APIs"}, {"L": "C", "ok": false, "html": "C. Manage DNS Services"}, {"L": "D", "ok": false, "html": "D. None of the Above"}], "ansL": "B", "ans": "Enable Services and APIs（Project 的功能是啟用服務與 API）", "trig": "All services are associated with a project 所有服務都必須關聯到一個專案 → 專案是啟用服務與 API 的容器", "formula": "Project 的三大功能：啟用 API、綁定帳單、承載資源與 IAM 權限"}, {"no": "NO.209", "stem": "You are consulting for a client who is migrating to Google Cloud. They presently have a matrix organization. Their IT environments were managed around projects. Each team had multiple projects. All the projects had a <b class=\"kw\">flat structure under the company</b>. What would you advise them when planning for the move?", "opts": [{"L": "A", "ok": true, "html": "A. On Google Cloud, create a <b>folder</b> corresponding to each team. Under that, there could be <b>projects</b> or further sub <b>folders</b> as the team decides."}, {"L": "B", "ok": false, "html": "B. In terms of not disturbing the <b>project</b> developers and testers, advise them that the strategic decision is to retain the structure on Google Cloud also."}, {"L": "C", "ok": false, "html": "C. Since a <b>Project</b> could spawn other sub-<b>Projects</b>, on Google Cloud it is better to assign a <b>folder</b> for each Project."}, {"L": "D", "ok": false, "html": "D. The flat structure is what is currently used in IT <b>organization</b>s, and this can be used as-is which will provide the best results."}], "ansL": "A", "ans": "On Google Cloud, create a folder corresponding to each team（每個團隊建一個 Folder）", "trig": "flat structure under the company 公司底下是扁平結構 → 加一層 folder 對應團隊", "formula": "看到 flat structure（扁平、無階層）→ 答案幾乎都是「加一層 folder 對應團隊或部門」"}, {"no": "NO.272", "stem": "How does the resource hierarchy in Google Cloud help organizations implement security policies?", "opts": [{"L": "A", "ok": true, "html": "A. Policies can be <b>applied at the folder level and are inherited</b> by <b>projects</b> inside the <b>folder</b>"}, {"L": "B", "ok": false, "html": "B. Policies can only be applied to individual <b>projects</b>"}, {"L": "C", "ok": false, "html": "C. <b>Projects</b> in the <b>resource hierarchy</b> are not affected by security policies."}, {"L": "D", "ok": false, "html": "D. Policies can only be applied at the <b>organization</b> level and affect all <b>projects</b>"}], "ansL": "A", "ans": "Policies can be applied at the folder level and are inherited by projects inside the folder（folder 政策被底下 project 繼承）", "trig": "applied at the folder level and are inherited 在資料夾層級套用並被繼承 → 階層繼承機制", "formula": "資源階層一句話：政策在上層設定、下層自動繼承，越往下只會越多不會越少"}, {"no": "NO.397", "stem": "An organization is deciding on the layout of their resource hierarchy in Google Cloud. They have several projects within a folder. What will happen when <b class=\"kw\">user access policies are applied to the folder</b>?", "opts": [{"L": "A", "ok": false, "html": "A. The policy applies to the <b>folder</b> only, and will not be inherited by any <b>projects</b>."}, {"L": "B", "ok": true, "html": "B. The policy will be inherited by the <b>projects</b> and their resources within the <b>folder</b>."}, {"L": "C", "ok": false, "html": "C. The policy will be applied to all <b>folders</b> within the <b>organization</b>."}, {"L": "D", "ok": false, "html": "D. The policy will be inherited by the <b>projects</b> in the <b>folder</b> but will not affect their resources."}], "ansL": "B", "ans": "The policy will be inherited by the projects and their resources within the folder（專案與其資源都會繼承）", "trig": "user access policies are applied to the folder 存取政策套用在資料夾上 → 底下專案「與其資源」一併繼承", "formula": "繼承方向只有「由上往下、一路傳到底」；選項在講「橫向套用」或「不影響資源」一律刪"}, {"no": "NO.7", "stem": "Your organization needs to restrict access to a Cloud Storage bucket. Only employees who are based in Canada should be allowed to view the contents. What is the <b class=\"kw\">most effective and efficient way</b> to satisfy this requirement?", "opts": [{"L": "A", "ok": false, "html": "A. Deploy the <b>Cloud Storage</b> bucket to a Google Cloud region in Canada"}, {"L": "B", "ok": false, "html": "B. Configure Google <b>Cloud Armor</b> to allow access to the bucket only from IP addresses based in Canada"}, {"L": "C", "ok": false, "html": "C. Give each employee who is based in Canada access to the bucket"}, {"L": "D", "ok": true, "html": "D. Create a group consisting of all Canada-based employees, and give the group access to the bucket"}], "ansL": "D", "ans": "Create a group consisting of all Canada-based employees, and give the group access（建群組、授權給群組）", "trig": "most effective and efficient way 最有效又最有效率的做法 → 用 Google Group 授權", "formula": "看到「效率／人員會異動／人數眾多」→ 權限一律給 Google Group，不要給個人"}, {"no": "NO.17", "stem": "Your company security team manages access control to production systems using an <b class=\"kw\">LDAP directory group</b>. How is this access control managed in the Google Cloud production project?", "opts": [{"L": "A", "ok": false, "html": "A. Assign the proper role to the <b>Service Account</b> in the <b>project</b>&#x27;s <b>IAM</b> Policy"}, {"L": "B", "ok": false, "html": "B. Grant each user the roles/<b>iam</b>.serviceAccountUser role on a <b>service account</b> that exists in the Google Group."}, {"L": "C", "ok": true, "html": "C. Assign the proper role to the Google Group in the <b>project</b>&#x27;s <b>IAM</b> Policy."}, {"L": "D", "ok": false, "html": "D. Create the <b>project</b> in a <b>folder</b> with the same name as the LDAP directory group."}], "ansL": "C", "ans": "Assign the proper role to the Google Group in the project&#x27;s IAM Policy（把角色指派給 Google Group）", "trig": "LDAP directory group 用 LDAP 目錄群組管控 → 對應成 Google Group 授權", "formula": "「地端已經用群組管人」→ 上雲後對應 Google Group，角色給群組不給個人"}, {"no": "NO.87", "stem": "The government has ordered an audit of your company&#x27;s data. You have hired an external company to conduct the audit. They <b class=\"kw\">need to be able to review the data</b> stored in your Cloud Storage buckets across eight projects. How would you grant them access?", "opts": [{"L": "A", "ok": false, "html": "A. Give the auditors an Owner role on the eight buckets so that they have proper access."}, {"L": "B", "ok": true, "html": "B. Give them Storage Object Viewer access to the buckets in those eight <b>projects</b>."}, {"L": "C", "ok": false, "html": "C. They might need access to all <b>projects</b> as the audit progresses; so give them access to all Storage buckets so that you don&#x27;t have to do it repeatedly later on."}, {"L": "D", "ok": false, "html": "D. They might need access to all <b>projects</b> as the audit progresses; so give them the Editor role on all Storage buckets so that you don&#x27;t have to do it repeatedly later on."}], "ansL": "B", "ans": "Give them Storage Object Viewer access to the buckets in those eight projects（只給唯讀、只給那八個專案）", "trig": "need to be able to review the data 只需要檢視資料 → 給唯讀的 Viewer 角色", "formula": "只要「看」→ Viewer 角色；範圍就限題目講的那幾個專案，任何「順便多給一些」的選項都是錯的"}, {"no": "NO.111", "stem": "Your organization needs to allow a production job to have access to a BigQuery dataset. The <b class=\"kw\">production job is running on a Compute Engine instance</b> that is part of an instance group. What should be included in the IAM Policy on the BigQuery dataset?", "opts": [{"L": "A", "ok": false, "html": "A. The <b>Compute Engine</b> instance group"}, {"L": "B", "ok": false, "html": "B. The <b>project</b> that owns the <b>Compute Engine</b> instance"}, {"L": "C", "ok": true, "html": "C. The <b>Compute Engine</b> <b>service account</b>"}, {"L": "D", "ok": false, "html": "D. The <b>Compute Engine</b> instance"}], "ansL": "C", "ans": "The Compute Engine service account（該 VM 的服務帳號）", "trig": "production job is running on a Compute Engine instance 工作跑在 VM 上 → 授權對象是該 VM 的服務帳號", "formula": "「程式／VM／服務要存取資源」→ 授權對象一律是 service account，不是機器也不是專案"}, {"no": "NO.135", "stem": "You are running a data warehouse on BigQuery. A partner company is offering a recommendation engine based on the data in your data warehouse. The partner company is also running their application on Google Cloud. They manage the resources in their own project, but <b class=\"kw\">they need access to the BigQuery dataset in your project</b>. You want to provide the partner company with access to the dataset. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Ask the partner to create a <b>Service Account</b> in their <b>project</b>, and have them give the Service Account access to <b>BigQuery</b> in their project."}, {"L": "B", "ok": false, "html": "B. Create a <b>Service Account</b> in your own <b>project</b>, and grant this Service Account access to <b>BigQuery</b> in your project."}, {"L": "C", "ok": false, "html": "C. Create a <b>Service Account</b> in your own <b>project</b>, and ask the partner to grant this Service Account access to <b>BigQuery</b> in their project."}, {"L": "D", "ok": true, "html": "D. Ask the partner to create a <b>Service Account</b> in their <b>project</b>, and grant their Service Account access to the <b>BigQuery</b> dataset in your project."}], "ansL": "D", "ans": "Ask the partner to create a Service Account in their project, and grant their Service Account access to the BigQuery dataset in your project（對方建 SA，你來授權）", "trig": "they need access to the BigQuery dataset in your project 對方要存取「你的」資料集 → 身分在對方、授權在你", "formula": "跨組織授權口訣：身分留在對方（對方建 SA），權限由資源擁有者給（你在自己的資源上授權）"}, {"no": "NO.176", "stem": "Your company has a requirement to run manual tests on their web products for UX research before it is released to end customers. The people who will do the tests are external to the company. They will either use their own Gmail id or be given temporary email ids using the applications and recording their inputs in another app. The UX testing is done in the last week of the month. <b class=\"kw\">Each month the UX testers could be different</b>. How should the IT team manage the users?", "opts": [{"L": "A", "ok": false, "html": "A. Since the app is anyways going to be public, create permanent credentials for the UX testers that they can conveniently use each time."}, {"L": "B", "ok": false, "html": "B. It would be a security issue to have users come and go. Recommend that the testers be permanently hired to plug the vulnerability issue."}, {"L": "C", "ok": false, "html": "C. It would be a security issue to have users come and go. Recommend that the testers be permanently hired to plug the vulnerability issue."}, {"L": "D", "ok": true, "html": "D. Create a Group with the permissions required to do the test and record their inputs. When users arrive each week, add them to the group and after the testing period, remove them from the group."}], "ansL": "D", "ans": "Create a Group with the permissions required ... add them ... remove them（建群組，測試期加入、結束移除）", "trig": "Each month the UX testers could be different 每個月測試人員都可能換人 → 用群組加退成員控管", "formula": "「人員來來去去／短期外部人力」→ 建 Group 用加退成員控管，絕不為個人開永久帳號"}, {"no": "NO.225", "stem": "How does a <b class=\"kw\">least privilege resource access model</b> contribute to cloud security?", "opts": [{"L": "A", "ok": false, "html": "A. Google is responsible for determining access to cloud resources."}, {"L": "B", "ok": false, "html": "B. Employees may only access on-premises software with special permission."}, {"L": "C", "ok": false, "html": "C. Only managers and other senior employees have cloud resource access."}, {"L": "D", "ok": true, "html": "D. Employees only have access to the cloud resources necessary for their job."}], "ansL": "D", "ans": "Employees only have access to the cloud resources necessary for their job（只給工作所需資源）", "trig": "least privilege resource access model 最小權限存取模型 → 只給工作必需的權限", "formula": "least privilege＝只給剛好夠用的權限；選項出現「依職級發放」或「全部開放」一律錯"}, {"no": "NO.313", "stem": "An organization wants to ensure that they grant users <b class=\"kw\">only the permissions they require to perform their job responsibilities</b>. Which security principle describes this approach?", "opts": [{"L": "A", "ok": false, "html": "A. Security by default"}, {"L": "B", "ok": true, "html": "B. Least privilege"}, {"L": "C", "ok": false, "html": "C. Zero-trust"}, {"L": "D", "ok": false, "html": "D. Cyber resilience"}], "ansL": "B", "ans": "Least privilege（最小權限）", "trig": "only the permissions they require to perform their job responsibilities 只給執行職務所需權限 → Least privilege", "formula": "「只給剛好夠的權限」→ Least privilege；「不信任任何連線、每次都驗」→ Zero-trust"}, {"no": "NO.386", "stem": "Several departments in an organization are working together on a project. The organization wants to customize access to resources for each department. What is the <b class=\"kw\">quickest and most efficient way</b> to achieve this?", "opts": [{"L": "A", "ok": true, "html": "A. By mapping <b>IAM</b> roles to job functions for each department"}, {"L": "B", "ok": false, "html": "B. By assigning <b>IAM</b> primitive roles to each employee"}, {"L": "C", "ok": false, "html": "C. By applying least-privilege to roles for each employee"}, {"L": "D", "ok": false, "html": "D. By creating a single shared <b>service account</b> for all departments"}], "ansL": "A", "ans": "By mapping IAM roles to job functions for each department（IAM 角色對應各部門職能）", "trig": "quickest and most efficient way 最快又最有效率的方式 → 用預設角色對應職能", "formula": "「快又有效率地分權」→ 用 predefined role 對應職能、授權給群組；「逐人設定」與「共用帳號」永遠是錯的方向"}, {"no": "NO.34", "stem": "You want to build an application that will <b class=\"kw\">allow customers to register and login</b>. It would be great to have the ability to secure it with multi-factor authentication and the ability to reset credentials. As a small startup, you want to build the main application as quickly as possible and have minimum overhead. Which might be a suitable option for you on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Since identity and credentials should be secure and private, do not trust other service providers."}, {"L": "B", "ok": false, "html": "B. Cloud Identity"}, {"L": "C", "ok": false, "html": "C. Google Workspace"}, {"L": "D", "ok": true, "html": "D. Cloud Identity Platform"}], "ansL": "D", "ans": "Cloud Identity Platform（客戶身分平台）", "trig": "allow customers to register and login 讓「顧客」註冊與登入 → Identity Platform", "formula": "身分題先問「對誰」：員工／內部 → Cloud Identity；顧客／App 使用者 → Identity Platform"}, {"no": "NO.40", "stem": "Your company has multiple internal applications used by your employees. You also have to give access to certain vendors and contractors. What is a good option for you to adopt?", "opts": [{"L": "A", "ok": false, "html": "A. Keep the credentials separate for each application to reduce the blast radius in case of any issues."}, {"L": "B", "ok": false, "html": "B. Use an external identity provider that is famous and popular like Facebook or Twitter; that way, even your vendors and contractors will have an account there."}, {"L": "C", "ok": false, "html": "C. Allow all users, especially contractors and vendors, to bring their own identities, like those at gmail.com."}, {"L": "D", "ok": true, "html": "D. Use an IDaaS (Identity as a Service) product that can <b>centrally manage authentication and authorization</b> for the applications."}], "ansL": "D", "ans": "Use an IDaaS (Identity as a Service) product（用身分即服務集中管理）", "trig": "centrally manage authentication and authorization 集中管理驗證與授權 → IDaaS", "formula": "「內部＋外部人員都要管、而且要集中」→ IDaaS（Cloud Identity 就是 Google 版的 IDaaS）"}, {"no": "NO.51", "stem": "Your organization uses Active Directory to authenticate users. Users&#x27; Google account access must be removed when their Active Directory account is terminated. How should your organization meet this requirement?", "opts": [{"L": "A", "ok": false, "html": "A. Configure two-factor authentication in the Google domain"}, {"L": "B", "ok": false, "html": "B. Remove the Google account from all <b>IAM</b> policies"}, {"L": "C", "ok": false, "html": "C. Configure BeyondCorp and <b>Identity-Aware Proxy</b> in the Google domain"}, {"L": "D", "ok": true, "html": "D. Configure single sign-on in the Google domain"}], "ansL": "D", "ans": "Configure single sign-on in the Google domain（設定 SSO）", "trig": "removed when their Active Directory account is terminated AD 帳號停用時要一併失效 → 驗證交回 AD，也就是 SSO", "formula": "「AD 停用要連動 Google」→ SSO（驗證交回 AD）；「AD 使用者要複製成 Google 帳號」→ Google Cloud Directory Sync"}, {"no": "NO.53", "stem": "Your organization offers public mobile apps and websites. You want to migrate to a Google Cloud-based solution for checking and maintaining your users&#x27; usernames and passwords and controlling their access to different resources based on their identity. Which should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. VPN tunnels"}, {"L": "B", "ok": true, "html": "B. Identity Platform"}, {"L": "C", "ok": false, "html": "C. <b>Compute Engine</b> firewall rules"}, {"L": "D", "ok": false, "html": "D. Private Google Access"}], "ansL": "B", "ans": "Identity Platform（身分平台）", "trig": "public mobile apps and websites ... your users&#x27; usernames and passwords 面向大眾的 App 與網站使用者帳密 → Identity Platform", "formula": "題幹出現 public app／end users／usernames and passwords → 選 Identity Platform，不要選 Cloud Identity"}, {"no": "NO.81", "stem": "What are the key features of Google Cloud Identity.", "opts": [{"L": "A", "ok": false, "html": "A. Multi-factor authentication (MFA)"}, {"L": "B", "ok": false, "html": "B. Single sign-on (SSO)"}, {"L": "C", "ok": false, "html": "C. Works with your favorite apps and Endpoint management"}, {"L": "D", "ok": true, "html": "D. All of the Above"}], "ansL": "D", "ans": "All of the Above（以上皆是）", "trig": "key features of Google Cloud Identity Cloud Identity 的主要功能 → MFA、SSO、端點管理全都是", "formula": "Cloud Identity＝員工身分中心：SSO ＋ MFA ＋ 裝置端點管理 ＋ 應用整合，四項一起記"}, {"no": "NO.107", "stem": "Your large and frequently changing organization&#x27;s user information is stored in an on-premises LDAP database. The database includes user passwords and group and organization membership. How should your organization provision <b class=\"kw\">Google</b> accounts and groups to access Google Cloud resources?", "opts": [{"L": "A", "ok": false, "html": "A. Replicate the LDAP infrastructure on <b>Compute Engine</b>"}, {"L": "B", "ok": false, "html": "B. Use the Firebase Authentication REST API to create users"}, {"L": "C", "ok": true, "html": "C. Use <b>Google</b> Cloud Directory Sync to create users"}, {"L": "D", "ok": false, "html": "D. Use the Identity Platform REST API to create users"}], "ansL": "C", "ans": "Use Google Cloud Directory Sync to create users（用 GCDS 同步帳號）", "trig": "on-premises LDAP database ... provision Google accounts and groups 地端 LDAP 要開通 Google 帳號與群組 → GCDS", "formula": "LDAP／AD 帳號要「複製一份到 Google」→ Google Cloud Directory Sync；只要「借 AD 來驗證」→ SSO"}, {"no": "NO.2", "stem": "The operating systems of some of your organization&#x27;s virtual machines may have a security vulnerability. How can your organization most effectively <b class=\"kw\">identify all virtual machines that do not have the latest security update</b>?", "opts": [{"L": "A", "ok": true, "html": "A. View the <b>Security Command Center</b> to identify virtual machines running vulnerable disk images"}, {"L": "B", "ok": false, "html": "B. View the Compliance Reports Manager to identify and download a recent PCI audit"}, {"L": "C", "ok": false, "html": "C. View the <b>Security Command Center</b> to identify virtual machines started more than 2 weeks ago"}, {"L": "D", "ok": false, "html": "D. View the Compliance Reports Manager to identify and download a recent SOC 1 audit"}], "ansL": "A", "ans": "View the Security Command Center to identify virtual machines running vulnerable disk images（用 SCC 找有漏洞的映像檔）", "trig": "identify all virtual machines that do not have the latest security update 找出沒更新的 VM → Security Command Center", "formula": "「找出我環境裡的風險或漏洞」→ Security Command Center；「下載第三方稽核報告」→ Compliance Reports Manager"}, {"no": "NO.23", "stem": "Which Google Cloud product or feature makes specific <b class=\"kw\">recommendations based on security risks and compliance violations</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Google Cloud firewalls"}, {"L": "B", "ok": true, "html": "B. <b>Security Command Center</b>"}, {"L": "C", "ok": false, "html": "C. Cloud Deployment Manager"}, {"L": "D", "ok": false, "html": "D. Google <b>Cloud Armor</b>"}], "ansL": "B", "ans": "Security Command Center（資安指揮中心）", "trig": "recommendations based on security risks and compliance violations 依資安風險與合規違規給出建議 → SCC", "formula": "題目只要有 risk／vulnerability／misconfiguration／compliance violation 任一個字 → 選 Security Command Center"}, {"no": "NO.32", "stem": "Which Google Cloud product can report on and maintain compliance on your <b class=\"kw\">entire Google Cloud organization to cover multiple projects</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Logging</b>"}, {"L": "B", "ok": false, "html": "B. Identity and Access Management"}, {"L": "C", "ok": false, "html": "C. Google <b>Cloud Armor</b>"}, {"L": "D", "ok": true, "html": "D. <b>Security Command Center</b>"}], "ansL": "D", "ans": "Security Command Center（資安指揮中心）", "trig": "entire Google Cloud organization to cover multiple projects 整個組織、涵蓋多個專案 → 只有 SCC 有組織級視野", "formula": "「跨多個專案、整個組織的資安與合規總覽」→ Security Command Center（唯一具備組織級視野的資安產品）"}, {"no": "NO.178", "stem": "Google Cloud Platform (GCP) provides <b class=\"kw\">three main compliance resource webpages</b>. What are they? (Select Three Answer)", "opts": [{"L": "A", "ok": true, "html": "A. Compliance Reports Manager"}, {"L": "B", "ok": false, "html": "B. Support Hub"}, {"L": "C", "ok": false, "html": "C. Compliance Offerings"}, {"L": "D", "ok": false, "html": "D. GDPR Home Page"}, {"L": "E", "ok": false, "html": "E. TechCentral"}], "ansL": "A", "ans": "A、C、D（複選三項）Compliance Reports Manager／Compliance Offerings／GDPR Home Page", "trig": "three main compliance resource webpages 三個主要的合規資源網頁 → 報告、認證清單、GDPR 專頁", "formula": "合規三網頁記口訣：報告（Reports Manager）＋清單（Offerings）＋歐盟個資（GDPR）"}, {"no": "NO.181", "stem": "A customer deploys an application to App Engine and needs to check for Open Web Application Security Project (<b class=\"kw\">OWASP</b>) vulnerabilities. Which service should be used to accomplish this?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Armor</b>"}, {"L": "B", "ok": true, "html": "B. Cloud Security Scanner"}, {"L": "C", "ok": false, "html": "C. Binary Authorization"}, {"L": "D", "ok": false, "html": "D. Forseti Security"}], "ansL": "B", "ans": "Cloud Security Scanner（網頁安全掃描器，現稱 Web Security Scanner）", "trig": "check for OWASP vulnerabilities 檢查 OWASP 漏洞 → 主動掃描的 Security Scanner", "formula": "「主動掃網頁應用有沒有漏洞」→ Web／Cloud Security Scanner；「即時擋攻擊流量」→ Cloud Armor"}, {"no": "NO.188", "stem": "An e-commerce company&#x27;s business has been booming. To keep up with the growth the IT team also grew. Many new people are being added and new resources are being set up. The CIO is in conversation with you over coffee one day and expresses her growing concern that they might be moving too fast. Their security checks and policies have not kept pace. She worries that somebody would make a <b class=\"kw\">misconfiguration or compliance violation</b> thus exposing the company to data and privacy loss. What can you advise her?", "opts": [{"L": "A", "ok": false, "html": "A. Use Cloud <b>Identity-Aware Proxy</b> to allow only specific users to access the data."}, {"L": "B", "ok": true, "html": "B. Use <b>Security Command Center</b> to have a centralized view of assets and get notified on misconfigurations and vulnerabilities."}, {"L": "C", "ok": false, "html": "C. Use Cloud Data Loss Prevention to prevent the loss of any data."}, {"L": "D", "ok": false, "html": "D. Use <b>Cloud Armor</b> to block any DDoS attacks that could be a threat."}], "ansL": "B", "ans": "Use Security Command Center to have a centralized view of assets（用 SCC 集中檢視並通知）", "trig": "misconfiguration or compliance violation 設定錯誤或違規 → Security Command Center", "formula": "擔心「自己人設定出錯」→ SCC（對內偵測）；擔心「外面來攻擊」→ Cloud Armor（對外防禦）"}, {"no": "NO.246", "stem": "An organization must <b class=\"kw\">identify and fix security vulnerabilities</b> in its cloud infrastructure and applications. Which Google Cloud service should they use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>VPC</b> networks"}, {"L": "B", "ok": true, "html": "B. <b>Security Command Center</b>"}, {"L": "C", "ok": false, "html": "C. Google <b>Cloud Armor</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Storage</b>"}], "ansL": "B", "ans": "Security Command Center（資安指揮中心）", "trig": "identify and fix security vulnerabilities 找出並修復安全漏洞 → SCC", "formula": "同型題一句話：找漏洞、看風險、盤資產 → SCC；擋流量、防攻擊 → Cloud Armor"}, {"no": "NO.398", "stem": "An information security organization must ensure that its service providers have <b class=\"kw\">ISO 27001</b> certification. They must also access supporting documentation. Which Google Cloud tool should they use?", "opts": [{"L": "A", "ok": false, "html": "A. Network Intelligence Center"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Monitoring</b>"}, {"L": "C", "ok": true, "html": "C. Compliance Reports Manager"}, {"L": "D", "ok": false, "html": "D. <b>Security Command Center</b>"}], "ansL": "C", "ans": "Compliance Reports Manager（合規報告管理員）", "trig": "ISO 27001 certification ... access supporting documentation 要 ISO 27001 認證與佐證文件 → Compliance Reports Manager", "formula": "要「Google 自己的合規證明文件」→ Compliance Reports Manager；要「我自己環境的資安狀態」→ SCC"}, {"no": "NO.68", "stem": "Your Google Cloud Platform [GCP] admin has to <b class=\"kw\">manage a bunch of API keys</b> for external services that are accessed by different applications, which are used by a few teams. What is the best way to manage them?", "opts": [{"L": "A", "ok": false, "html": "A. Share the information in a Github repository and grant access to the repo in <b>IAM</b> as required."}, {"L": "B", "ok": true, "html": "B. Store the information in Secret Manager and give <b>IAM</b> read permissions as required."}, {"L": "C", "ok": false, "html": "C. Store the information in Kubernetes Secrets and only grant read permissions to users as required."}, {"L": "D", "ok": false, "html": "D. Encrypt the information and store it in <b>Cloud Storage</b> for centralized access. Give the decrypt key only to the users who need to access it."}], "ansL": "B", "ans": "Store the information in Secret Manager and give IAM read permissions as required（存進 Secret Manager）", "trig": "manage a bunch of API keys 管理一堆 API 金鑰 → Secret Manager", "formula": "密碼、API key、憑證這類「秘密本身」→ Secret Manager；加密用的「金鑰本身」→ Cloud KMS"}, {"no": "NO.114", "stem": "Which Google Cloud product is designed to <b class=\"kw\">reduce the risks of handling personally identifiable information</b> (PII)?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Storage</b>"}, {"L": "B", "ok": false, "html": "B. Google <b>Cloud Armor</b>"}, {"L": "C", "ok": true, "html": "C. Cloud Data Loss Prevention"}, {"L": "D", "ok": false, "html": "D. Secret Manager"}], "ansL": "C", "ans": "Cloud Data Loss Prevention（資料外洩防護，DLP）", "trig": "reduce the risks of handling personally identifiable information (PII) 降低處理個資的風險 → Cloud DLP", "formula": "看到 PII／sensitive data／redact（遮蔽）這幾個字 → Cloud DLP"}, {"no": "NO.150", "stem": "Customer Managed Encryption Keys (CMEK) can be used for encrypting data inside Cloud BigTable, <b class=\"kw\">which of the following statements is/are correct</b>. (<b class=\"kw\">Select two</b> answer)", "opts": [{"L": "A", "ok": false, "html": "A. Administrators can not rotate"}, {"L": "B", "ok": true, "html": "B. Not supported for instances that have clustered in more than one region."}, {"L": "C", "ok": false, "html": "C. <b>CMEK</b> can only be configured at the cluster level."}, {"L": "D", "ok": false, "html": "D. You can not use the same <b>CMEK</b> key in multiple <b>projects</b>"}], "ansL": "B", "ans": "B、C（複選兩項）跨區域叢集不支援／只能在叢集層級設定", "trig": "which of the following statements is/are correct (Select two) 選出兩個正確敘述 → 先刪掉含 can not 的假敘述", "formula": "「選兩個正確敘述」先刪明顯錯的：能不能 rotate、能不能跨專案共用，答案都是「能」，所以含 can not 的先砍"}, {"no": "NO.171", "stem": "Cloud Data Loss Prevention (DLP) is a fully managed service designed to help discover, classify, and protect the most sensitive data. DLP provides <b class=\"kw\">three key features</b> (Select Three Answers)", "opts": [{"L": "A", "ok": true, "html": "A. Classification"}, {"L": "B", "ok": false, "html": "B. De-identification"}, {"L": "C", "ok": false, "html": "C. De-classification"}, {"L": "D", "ok": false, "html": "D. Inspection"}, {"L": "E", "ok": false, "html": "E. Reinspection"}], "ansL": "A", "ans": "A、B、D（複選三項）Classification 分類／De-identification 去識別化／Inspection 檢測", "trig": "three key features 三大主要功能 → 分類、去識別化、檢測", "formula": "DLP 三動作串成一句：找出來（inspect）→ 貼標籤（classify）→ 遮掉（de-identify）"}, {"no": "NO.185", "stem": "You are storing sensitive information in a Cloud Storage bucket. For legal reasons, you need to be able to <b class=\"kw\">record all requests that read any of the stored data</b>. You want to make sure you comply with these requirements. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Scan the bucket using the Data Loss Prevention API."}, {"L": "B", "ok": true, "html": "B. Enable Data Access audit logs for the <b>Cloud Storage</b> API."}, {"L": "C", "ok": false, "html": "C. Enable the Identity Aware Proxy API on the <b>project</b>."}, {"L": "D", "ok": false, "html": "D. Allow only a single <b>Service Account</b> access to read the data."}], "ansL": "B", "ans": "Enable Data Access audit logs for the Cloud Storage API（啟用資料存取稽核記錄）", "trig": "record all requests that read any of the stored data 記錄所有讀取資料的請求 → Data Access audit logs", "formula": "要「留下誰讀過、誰改過的紀錄」→ Cloud Audit Logs；讀取紀錄要另外開 Data Access log，預設只開 Admin Activity"}, {"no": "NO.251", "stem": "How does Google Cloud ensure that customer data <b class=\"kw\">remains secure and private when at rest</b>?", "opts": [{"L": "A", "ok": false, "html": "A. By aggregating training data for customers within each industry"}, {"L": "B", "ok": false, "html": "B. By automatically locking files containing suspicious code"}, {"L": "C", "ok": true, "html": "C. By auditing platform privacy practices against industry standards"}, {"L": "D", "ok": false, "html": "D. By providing privacy reviews for critical customer applications"}], "ansL": "C", "ans": "By auditing platform privacy practices against industry standards（依產業標準稽核平台隱私實務）", "trig": "remains secure and private when at rest 靜態資料維持安全與隱私 → 接受依國際標準的第三方稽核", "formula": "「Google 怎麼保證隱私」→ 對外接受第三方依國際標準稽核；任何「拿客戶資料做別的用途」的選項一律錯"}, {"no": "NO.279", "stem": "<b class=\"kw\">Why is data stored in Google Cloud secure and private</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Data is encrypted by the <b>Security Command Center</b>"}, {"L": "B", "ok": false, "html": "B. Data is encrypted by Cloud Data Loss Prevention"}, {"L": "C", "ok": true, "html": "C. Data is encrypted by default"}, {"L": "D", "ok": false, "html": "D. Data is encrypted when an appropriate tag is applied"}], "ansL": "C", "ans": "Data is encrypted by default（預設就加密）", "trig": "Why is data stored in Google Cloud secure and private 為何存在 Google Cloud 的資料安全私密 → 預設加密", "formula": "問「Google Cloud 的加密要怎麼開」→ 答案永遠是「預設就開，什麼都不用做」"}, {"no": "NO.296", "stem": "<b class=\"kw\">When is data automatically encrypted</b> in Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. When it is at rest only."}, {"L": "B", "ok": true, "html": "B. When it is at rest and in transit."}, {"L": "C", "ok": false, "html": "C. When it is in transit only."}, {"L": "D", "ok": false, "html": "D. Data is not automatically encrypted by default."}], "ansL": "B", "ans": "When it is at rest and in transit（靜態與傳輸中都會）", "trig": "When is data automatically encrypted 何時會自動加密 → 靜態與傳輸中兩種狀態都會", "formula": "加密兩狀態綁在一起記：at rest ＋ in transit 都預設加密；看到「只有其中一種」直接刪"}, {"no": "NO.384", "stem": "An organization is concerned about the unlikely event that Google Cloud infrastructure is <b class=\"kw\">physically accessed by someone with malicious intent</b>. How is data protected in Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Data is immediately deleted whenever an intrusion is detected"}, {"L": "B", "ok": false, "html": "B. Data is stored on quantum computers with unbreakable encryption."}, {"L": "C", "ok": true, "html": "C. Data is stored using robust encryption"}, {"L": "D", "ok": false, "html": "D. Data is stored in random locations around the world to prevent it being found"}], "ansL": "C", "ans": "Data is stored using robust encryption（以強固加密儲存）", "trig": "physically accessed by someone with malicious intent 有人帶著惡意實體接觸機房 → 資料本身已強加密", "formula": "「有人實體偷走硬碟怎麼辦」→ 資料本身已加密，拿到也讀不出內容"}, {"no": "NO.48", "stem": "You are migrating workloads to the cloud. The goal of the migration is to serve customers worldwide as quickly as possible According to local regulations, certain data is <b class=\"kw\">required to be stored in a specific geographic area</b>, <b class=\"kw\">and it can be served worldwide</b>. You need to design the architecture and deployment for your workloads. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Select a public cloud provider that is only active in the required geographic area"}, {"L": "B", "ok": false, "html": "B. Select a private cloud provider that globally replicates data storage for fast data access"}, {"L": "C", "ok": true, "html": "C. Select a public cloud provider that guarantees data location in the required geographic area"}, {"L": "D", "ok": false, "html": "D. Select a private cloud provider that is only active in the required geographic area"}], "ansL": "C", "ans": "Select a public cloud provider that guarantees data location in the required geographic area（選能保證資料落地的公有雲）", "trig": "required to be stored in a specific geographic area, and it can be served worldwide 資料須存在指定地區、但要服務全球 → 保證落地的公有雲", "formula": "「資料要留在某地、服務要給全世界」→ 選能保證資料位置的公有雲（存放固定＋全球網路送服務）"}, {"no": "NO.66", "stem": "How should a multinational organization that is migrating to Google Cloud consider security and privacy regulations to ensure that it is in compliance with global standards?", "opts": [{"L": "A", "ok": true, "html": "A. Comply with data security and privacy regulations in each geographical region"}, {"L": "B", "ok": false, "html": "B. Comply with regional standards for data security and privacy, because they supersede all international regulations"}, {"L": "C", "ok": false, "html": "C. Comply with international standards for data security and privacy, because they supersede all regional regulations"}, {"L": "D", "ok": false, "html": "D. Comply with regional data security regulations, because they&#x27;re more complex than privacy standards"}], "ansL": "A", "ans": "Comply with data security and privacy regulations in each geographical region（各地區法規各自遵守）", "trig": "multinational organization ... in compliance with global standards 跨國組織要符合全球標準 → 每個地區各自遵守", "formula": "法遵題永遠選「每個營運地區各自遵守當地法規」；出現 supersede（誰壓過誰）的選項一律刪"}, {"no": "NO.245", "stem": "An organization has migrated several large databases to the cloud. It wants to <b class=\"kw\">increase the value of its data</b>, <b class=\"kw\">improve cost controls and strengthen regulatory compliance</b>. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Delete data stored for over a year."}, {"L": "B", "ok": true, "html": "B. Establish an effective data governance program."}, {"L": "C", "ok": false, "html": "C. Export relational data to modern NoSQL databases."}, {"L": "D", "ok": false, "html": "D. Create monthly reports on data access and uses."}], "ansL": "B", "ans": "Establish an effective data governance program（建立資料治理計畫）", "trig": "increase the value of its data, improve cost controls and strengthen regulatory compliance 同時要價值、成本、法遵三件事 → 制度面的資料治理", "formula": "一個做法要同時滿足「價值＋成本＋法遵」三個目標 → 一定選制度面的 data governance，不是單一技術動作"}, {"no": "NO.317", "stem": "How can a streaming service <b class=\"kw\">meet global compliance requirements</b> using the cloud?", "opts": [{"L": "A", "ok": true, "html": "A. By automatically encrypting personally identifiable information"}, {"L": "B", "ok": false, "html": "B. By obtaining a business license to operate in a new market"}, {"L": "C", "ok": false, "html": "C. By allowing users to disable two-factor authentication"}, {"L": "D", "ok": false, "html": "D. By adhering only to data polices of the country in which the head office is registered"}], "ansL": "A", "ans": "By automatically encrypting personally identifiable information（自動加密個資）", "trig": "meet global compliance requirements 符合全球法遵要求 → 自動加密 PII", "formula": "全球法遵兩個反射：個資要加密或去識別化；各地法規各自遵守，不能只看總部所在國"}, {"no": "NO.392", "stem": "How does the <b class=\"kw\">legal concept of data sovereignty</b> affect data?", "opts": [{"L": "A", "ok": false, "html": "A. An individual has the right to control their personal data"}, {"L": "B", "ok": false, "html": "B. Data must always be encrypted in transit and at rest."}, {"L": "C", "ok": true, "html": "C. Data is subject to the laws and regulations of the country where it resides."}, {"L": "D", "ok": false, "html": "D. A country has the right to access the data generated within its borders"}], "ansL": "C", "ans": "Data is subject to the laws and regulations of the country where it resides（資料受所在國法律管轄）", "trig": "legal concept of data sovereignty 資料主權的法律概念 → 資料放哪國就歸哪國法律管", "formula": "sovereignty 記成「資料放哪國、歸哪國法律管」；選項在講「個人權利」或「政府調閱」都是別的概念"}, {"no": "NO.103", "stem": "You decide to migrate your on-premises environment to the cloud. You need to determine which resource components still need to be assigned ownership. <b class=\"kw\">Which two functions are owned by a public cloud provider</b>? (Choose two.)", "opts": [{"L": "A", "ok": true, "html": "A. Hardware maintenance"}, {"L": "B", "ok": false, "html": "B. Infrastructure architecture"}, {"L": "C", "ok": false, "html": "C. Infrastructure deployment automation"}, {"L": "D", "ok": false, "html": "D. Hardware capacity management"}, {"L": "E", "ok": false, "html": "E. Fixing application security issues"}], "ansL": "A", "ans": "A、D（複選兩項）Hardware maintenance 硬體維護／Hardware capacity management 硬體容量管理", "trig": "Which two functions are owned by a public cloud provider 哪兩項由公有雲供應商負責 → 帶 hardware 的兩項", "formula": "共同責任分界線：出現 hardware／physical／data center 的一律歸供應商；出現 application／data／access 的一律歸客戶"}, {"no": "NO.143", "stem": "Your company has made plans to roll out <b class=\"kw\">OpenShift</b>, a Kubernetes platform solution offered by IBM Red Hat, across all its on-premises and public cloud environments. Given that you are the lead architect responsible for your company&#x27;s GCP deployments, what type of shared responsibility model will this deployment entail for you?", "opts": [{"L": "A", "ok": false, "html": "A. SaaS"}, {"L": "B", "ok": false, "html": "B. On premises"}, {"L": "C", "ok": false, "html": "C. PaaS"}, {"L": "D", "ok": true, "html": "D. IaaS"}], "ansL": "D", "ans": "IaaS（基礎架構即服務層級的責任）", "trig": "OpenShift, a Kubernetes platform ... across all its on-premises and public cloud environments 自己把平台裝上去跑 → IaaS", "formula": "判斷責任層級看「平台是誰在管」：自己裝在 VM 上＝IaaS；用雲端託管服務＝PaaS；直接用現成軟體＝SaaS"}, {"no": "NO.258", "stem": "An organization is deploying applications to the cloud using platform as a service. In the shared responsibility model, what remains the responsibility of the customer organization?", "opts": [{"L": "A", "ok": false, "html": "A. Physical security"}, {"L": "B", "ok": false, "html": "B. Network security"}, {"L": "C", "ok": false, "html": "C. Operations"}, {"L": "D", "ok": true, "html": "D. Data access policies"}], "ansL": "D", "ans": "Data access policies（資料存取政策）", "trig": "platform as a service ... remains the responsibility of the customer 用 PaaS 時客戶還要負責什麼 → 資料存取政策", "formula": "不管 IaaS／PaaS／SaaS，「資料本身」與「誰能存取資料」永遠是客戶責任——共同責任題的萬用解"}, {"no": "NO.271", "stem": "An organization decides to migrate their on-premises environment to the cloud. They need to determine which resource components still need to be assigned ownership. <b class=\"kw\">Which two functions does a public cloud provider own</b>? (Choose 2)", "opts": [{"L": "A", "ok": false, "html": "A. Fixing application security issues"}, {"L": "B", "ok": false, "html": "B. Infrastructure architecture"}, {"L": "C", "ok": true, "html": "C. Hardware capacity management"}, {"L": "D", "ok": false, "html": "D. Hardware maintenance"}, {"L": "E", "ok": false, "html": "E. Infrastructure deployment automation"}], "ansL": "C", "ans": "C、D（複選兩項）Hardware capacity management 硬體容量管理／Hardware maintenance 硬體維護", "trig": "Which two functions does a public cloud provider own 哪兩項由公有雲供應商負責 → 帶 hardware 的兩項", "formula": "這題與 NO.103 是同一題換排列，記「hardware 開頭的那兩項就是供應商」即可秒選"}, {"no": "NO.349", "stem": "An organization has migrated all workloads to the cloud and is reviewing their cloud security posture. Who is now responsible for <b class=\"kw\">securing the physical infrastructure of the data centers</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Third-party security service providers"}, {"L": "B", "ok": false, "html": "B. The <b>organization</b>"}, {"L": "C", "ok": false, "html": "C. The <b>organization</b> and the cloud service provider"}, {"L": "D", "ok": true, "html": "D. The cloud service provider"}], "ansL": "D", "ans": "The cloud service provider（雲端服務供應商）", "trig": "securing the physical infrastructure of the data centers 保護資料中心的實體基礎架構 → 供應商全責", "formula": "「實體／機房／硬體」＝供應商全責，連「雙方共同負責」這個看起來很安全的選項也不能選"}, {"no": "NO.376", "stem": "What is an organization exclusively responsible for when they access an application through a software as a service (SaaS) <b class=\"kw\">model</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Maintaining overall system operability"}, {"L": "B", "ok": true, "html": "B. Maintaining customer-facing content"}, {"L": "C", "ok": false, "html": "C. Monitoring data center servers"}, {"L": "D", "ok": false, "html": "D. Monitoring computer networks"}], "ansL": "B", "ans": "Maintaining customer-facing content（維護面向客戶的內容）", "trig": "exclusively responsible for ... through a software as a service (SaaS) model 用 SaaS 時「唯獨」還要負責什麼 → 自己放的內容", "formula": "SaaS 客戶只剩兩件事：自己的資料與內容，以及誰能存取；其餘全歸供應商"}, {"no": "NO.381", "stem": "An organization is deploying their servers to the cloud using the infrastructure as a service model. In the shared responsibility model, what is the cloud provider responsible for?", "opts": [{"L": "A", "ok": false, "html": "A. Security of the operating system"}, {"L": "B", "ok": true, "html": "B. Physical security"}, {"L": "C", "ok": false, "html": "C. Data access policies"}, {"L": "D", "ok": false, "html": "D. Security of the software"}], "ansL": "B", "ans": "Physical security（實體安全）", "trig": "infrastructure as a service model ... what is the cloud provider responsible for IaaS 下供應商負責什麼 → 實體安全", "formula": "IaaS 只有「實體層以下」歸供應商；從作業系統往上（含 OS）全部歸客戶"}, {"no": "NO.141", "stem": "You have deployed a new public web application that allows users to register and login with email ids, phone numbers, or user ids. You are seeing some unusual activity with user registrations and logins from a few IPs. <b class=\"kw\">A large number of accounts were created very quickly</b>. Logins are also happening quickly thereafter from these new accounts. Different parts of the application are being explored, all of which are putting a heavy load on the application. What could be a problem and how can you solve it?", "opts": [{"L": "A", "ok": false, "html": "A. A hacker group has hired a bunch of people to create accounts and manually use the system. Use Cloud Asset Inventory to see if there have been changes in the inventory."}, {"L": "B", "ok": true, "html": "B. Bots are creating accounts and then using them. Use Google Cloud&#x27;s Web App and API Protection (WAAP)."}, {"L": "C", "ok": false, "html": "C. Bots are creating accounts and then using them. Use <b>Identity-Aware Proxy</b> to restrict the users to known users."}, {"L": "D", "ok": false, "html": "D. Automated testing tools might still be running and creating accounts. Use <b>Identity-Aware Proxy</b> to restrict the users to known users."}], "ansL": "B", "ans": "Bots are creating accounts ... Use Google Cloud&#x27;s Web App and API Protection (WAAP)（用 WAAP 防機器人）", "trig": "A large number of accounts were created very quickly 大量帳號被極快速建立 → 機器人行為，用 WAAP", "formula": "公開網站遇到「自動化、大量、極快」的行為 → WAAP（Cloud Armor ＋ reCAPTCHA ＋ API 防護）；IAP 只用在內部應用"}, {"no": "NO.168", "stem": "What issues can arise when organizations <b class=\"kw\">integrate third-party systems into their cloud infrastructure</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Third-party systems may not be powerful enough to run many critical business applications."}, {"L": "B", "ok": true, "html": "B. Without sufficient security measures and regular checks, unsecured third-party systems can pose a threat to data security."}, {"L": "C", "ok": false, "html": "C. Over-reliance on third-party systems limits an <b>organization</b>&#x27;s potential for innovation."}, {"L": "D", "ok": false, "html": "D. Third-party systems are less capable of addressing an <b>organization</b>&#x27;s security requirements."}], "ansL": "B", "ans": "Without sufficient security measures and regular checks, unsecured third-party systems can pose a threat（未受保護的第三方系統會威脅資料安全）", "trig": "integrate third-party systems into their cloud infrastructure 把第三方系統接進雲端架構 → 新增的攻擊面", "formula": "供應鏈風險題方向固定：第三方＝多出來的攻擊面，要有安全要求並定期檢查"}, {"no": "NO.191", "stem": "You are working with a government agency. A web application serves users of the country. It allows citizens to receive certain services in providing their national identity. Citizens have complained that they are seeing delays in web page loading compared to before. On investigating, they are seeing a lot of <b class=\"kw\">spurious traffic coming in from a few IPs</b> which they have identified as foreign. What should they do?", "opts": [{"L": "A", "ok": false, "html": "A. Setup Firewall rules to deny access to the malicious IPs."}, {"L": "B", "ok": true, "html": "B. Setup <b>Cloud Armor</b> and add the malicious IPs to the deny list."}, {"L": "C", "ok": false, "html": "C. Setup Firewall rules to allow access only to the IPs from within the country."}, {"L": "D", "ok": false, "html": "D. Setup Cloud NAT and remove all the internal IPs and replace it with a single public IP."}], "ansL": "B", "ans": "Setup Cloud Armor and add the malicious IPs to the deny list（用 Cloud Armor 封鎖惡意 IP）", "trig": "spurious traffic coming in from a few IPs 少數 IP 湧入的異常流量 → Cloud Armor 封鎖清單", "formula": "「網站被外部惡意流量打、要擋 IP」→ Cloud Armor；VPC 防火牆是機器層網路控制，不是網站防護"}, {"no": "NO.284", "stem": "An employee receives an email from their internet service provider asking for their bank account number and password. Which cybersecurity threat is this?", "opts": [{"L": "A", "ok": false, "html": "A. Ransomware"}, {"L": "B", "ok": false, "html": "B. Distributed Denial of Service"}, {"L": "C", "ok": false, "html": "C. Spamming"}, {"L": "D", "ok": true, "html": "D. Phishing"}], "ansL": "D", "ans": "Phishing（網路釣魚）", "trig": "email ... asking for their bank account number and password 用郵件索取帳號密碼 → Phishing", "formula": "「冒充身分騙資訊」＝Phishing；「加密檔案要錢」＝Ransomware；「灌爆流量」＝DDoS"}, {"no": "NO.290", "stem": "An organization is evaluating its defenses against cyber security threats and is concerned about the <b class=\"kw\">risks of social engineering by cyber criminals</b>. How might these attacks happen?", "opts": [{"L": "A", "ok": true, "html": "A. Phishing emails"}, {"L": "B", "ok": false, "html": "B. SQL injection attacks"}, {"L": "C", "ok": false, "html": "C. Physical damage to hardware"}, {"L": "D", "ok": false, "html": "D. Distributed denial-of-service attacks"}], "ansL": "A", "ans": "Phishing emails（釣魚郵件）", "trig": "risks of social engineering by cyber criminals 社交工程的風險 → 釣魚郵件", "formula": "social engineering 的重點是「騙人不是駭機器」→ 選項裡有 phishing 就選它"}, {"no": "NO.344", "stem": "Which <b class=\"kw\">policy helps Google Cloud keep customer data private</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Google tests the service availability of customer applications."}, {"L": "B", "ok": true, "html": "B. Google does not use customer data for advertising pu<b>rpo</b>ses."}, {"L": "C", "ok": false, "html": "C. Google migrates customer data to an offline server when a threat is detected."}, {"L": "D", "ok": false, "html": "D. Google does not allow customers to change encryption keys."}], "ansL": "B", "ans": "Google does not use customer data for advertising purposes（不將客戶資料用於廣告）", "trig": "policy helps Google Cloud keep customer data private 哪項政策讓客戶資料保持私密 → 不拿來投廣告", "formula": "Google Cloud 信任三原則：資料是你的、不拿去投廣告、不拿去訓練別人的模型"}, {"no": "NO.348", "stem": "A manager wants to review Google Cloud data access among their employees. <b class=\"kw\">Who is responsible for defining data access policies</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Identity"}, {"L": "B", "ok": false, "html": "B. Google Cloud Customer Care team"}, {"L": "C", "ok": true, "html": "C. Their <b>organization</b>&#x27;s IT team"}, {"L": "D", "ok": false, "html": "D. Their <b>organization</b>&#x27;s end users"}], "ansL": "C", "ans": "Their organization&#x27;s IT team（該組織自己的 IT 團隊）", "trig": "Who is responsible for defining data access policies 誰負責制定資料存取政策 → 客戶自己的 IT 團隊", "formula": "「誰能存取資料」永遠由客戶自己決定；答案出現 Google 的任何團隊或產品都是錯的"}, {"no": "NO.364", "stem": "An organization wants to <b class=\"kw\">transfer some of its data from Google Cloud</b>. Which of these statements is true?", "opts": [{"L": "A", "ok": false, "html": "A. A technical support ticket must be raised with the correct department"}, {"L": "B", "ok": true, "html": "B. Customers have full control of their data and may transfer it at any time"}, {"L": "C", "ok": false, "html": "C. Outgoing data transfer must be enabled in the Google Cloud console."}, {"L": "D", "ok": false, "html": "D. Customer data may not be transferred out of Google Cloud"}], "ansL": "B", "ans": "Customers have full control of their data and may transfer it at any time（客戶完全掌控、隨時可搬）", "trig": "transfer some of its data from Google Cloud 想把部分資料搬離 Google Cloud → 隨時可搬，不需申請", "formula": "資料可攜題一句話：資料是客戶的，隨時可以搬走，不需要任何人批准"}, {"no": "NO.402", "stem": "When customer data is uploaded to Google Cloud, <b class=\"kw\">who owns the data</b>?", "opts": [{"L": "A", "ok": false, "html": "A. The customer and Google share ownership"}, {"L": "B", "ok": true, "html": "B. The customer"}, {"L": "C", "ok": false, "html": "C. Google"}, {"L": "D", "ok": false, "html": "D. A third party"}], "ansL": "B", "ans": "The customer（客戶）", "trig": "who owns the data 資料歸誰所有 → 客戶", "formula": "資料所有權題永遠選「客戶」；共有、Google、第三方三個選項一律刪"}, {"no": "NO.412", "stem": "In Google&#x27;s cloud security model, <b class=\"kw\">how does availability contribute</b> to a robust security posture for data?", "opts": [{"L": "A", "ok": false, "html": "A. By checking that data is accurate and trustworthy"}, {"L": "B", "ok": true, "html": "B. By ensuring data is reliable and accessible"}, {"L": "C", "ok": false, "html": "C. By ensuring data meets industry standards"}, {"L": "D", "ok": false, "html": "D. By restricting data access to authorized users"}], "ansL": "B", "ans": "By ensuring data is reliable and accessible（確保資料可靠且可存取）", "trig": "how does availability contribute 可用性如何發揮作用 → 讓資料在需要時取得到", "formula": "資安鐵三角 CIA：機密性＝只給該看的人；完整性＝資料沒被竄改；可用性＝需要時取得到"}, {"no": "NO.234", "stem": "An organization operates their entire IT infrastructure from Google Cloud. What should they do to <b class=\"kw\">prepare for data breaches</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Reduce reliance on multi-factor authentication"}, {"L": "B", "ok": false, "html": "B. Data security is Google&#x27;s responsibility, so preparation is minimal"}, {"L": "C", "ok": true, "html": "C. Create an incident plan to mitigate impacts"}, {"L": "D", "ok": false, "html": "D. Strengthen their data center perimeter security"}], "ansL": "C", "ans": "Create an incident plan to mitigate impacts（制定事件應變計畫）", "trig": "prepare for data breaches 為資料外洩事件做準備 → 事前擬定應變計畫", "formula": "「為資安事故做準備」→ 一律選事前擬定 incident response plan；出現「這是 Google 的責任」一律錯"}, {"no": "NO.295", "stem": "<b class=\"kw\">How is privacy defined</b> in the context of cloud technology?", "opts": [{"L": "A", "ok": true, "html": "A. Restrictions on data access and sharing"}, {"L": "B", "ok": false, "html": "B. Procedures to authenticate user identity"}, {"L": "C", "ok": false, "html": "C. Susceptibility to data breaches and cyber attacks"}, {"L": "D", "ok": false, "html": "D. Compliance with regulatory standards"}], "ansL": "A", "ans": "Restrictions on data access and sharing（限制資料的存取與分享）", "trig": "How is privacy defined 隱私如何定義 → 限制誰能存取與分享", "formula": "名詞對定義：privacy＝誰能看與能分享；security＝防護措施；compliance＝符合法規；authentication＝驗身分"}, {"no": "NO.323", "stem": "An organization must <b class=\"kw\">verify the identity of a user seeking access</b> to a system Which aspect of cloud identity management does this action describe?", "opts": [{"L": "A", "ok": false, "html": "A. Auditing"}, {"L": "B", "ok": true, "html": "B. Authentication"}, {"L": "C", "ok": false, "html": "C. Authorization"}, {"L": "D", "ok": false, "html": "D. Encrypting"}], "ansL": "B", "ans": "Authentication（身分驗證）", "trig": "verify the identity of a user seeking access 驗證想存取的使用者身分 → Authentication", "formula": "順序記牢：先 Authentication（你是誰）→ 再 Authorization（你能做什麼）→ 最後 Auditing（你做了什麼）"}, {"no": "NO.363", "stem": "An organization wants to move <b class=\"kw\">from a tactical cloud adoption approach to a transformational approach</b>. How should they change their cloud security?", "opts": [{"L": "A", "ok": false, "html": "A. Provide staff identities using only Google Cloud authentication."}, {"L": "B", "ok": true, "html": "B. Provide multiple layers of network security using a zero-trust model."}, {"L": "C", "ok": false, "html": "C. Emphasize strong perimeter security and trust in their private network."}, {"L": "D", "ok": false, "html": "D. Emphasize three main Identity Access Management roles: owner, editor, and viewer."}], "ansL": "B", "ans": "Provide multiple layers of network security using a zero-trust model（用零信任建立多層網路安全）", "trig": "from a tactical cloud adoption approach to a transformational approach 從戰術性上雲轉為轉型式上雲 → 改採零信任", "formula": "看到 perimeter／trust the internal network＝舊模型（錯）；zero-trust＝新模型（對）"}]}, {"name": "資料庫", "tag": "好拿分", "rows": [{"no": "NO.41", "stem": "Your organization is developing an application that will manage payments and online bank accounts located around the world. The most critical requirement for your database is that each transaction is <b class=\"kw\">handled consistently</b>. Your organization anticipates almost <b class=\"kw\">unlimited growth</b> in the amount of data stored. Which Google Cloud product should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Storage</b>"}, {"L": "C", "ok": false, "html": "C. <b>Firestore</b>"}, {"L": "D", "ok": true, "html": "D. <b>Cloud Spanner</b>"}], "ansL": "D", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "unlimited growth 無限成長 + handled consistently 一致地處理 → Spanner", "formula": "看到 global 全球 + unlimited scale 無限擴展 + transaction 交易 → Cloud Spanner"}, {"no": "NO.63", "stem": "Your organization wants to migrate its data management solutions to Google Cloud because it needs to <b class=\"kw\">dynamically scale up or down</b> and to run <b class=\"kw\">transactional SQL queries</b> against historical data at scale. Which Google Cloud product or service should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>BigQuery</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Bigtable</b>"}, {"L": "C", "ok": false, "html": "C. <b>Pub/Sub</b>"}, {"L": "D", "ok": true, "html": "D. <b>Cloud Spanner</b>"}], "ansL": "D", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "dynamically scale up or down 動態擴縮 + transactional SQL queries 交易型 SQL 查詢 → Spanner", "formula": "題目同時要「SQL 交易」＋「規模／擴縮」→ Spanner；只要「SQL 分析」→ BigQuery"}, {"no": "NO.73", "stem": "Your ed-tech start-up was originally launched in a small geography. Any user sign-ups, course progress, tests taken, etc. are captured on a self-managed MySQL database. Every user generates many such transactions. Now you&#x27;re <b class=\"kw\">taking the application globally</b> and preparing for a much larger influx of users from all over the world. The existing MySQL server is <b class=\"kw\">unlikely to be able to scale</b>. Which convenient option can be considered?", "opts": [{"L": "A", "ok": false, "html": "A. Migrate to <b>BigQuery</b>"}, {"L": "B", "ok": true, "html": "B. Migrate to <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. Migrate to <b>Cloud SQL</b>"}, {"L": "D", "ok": false, "html": "D. Migrate to <b>Bigtable</b>"}], "ansL": "B", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "taking the application globally 應用要全球化 + unlikely to be able to scale 無法擴展 → Spanner", "formula": "現有 MySQL/PostgreSQL 撐不住「全球擴展」→ Spanner；只是想省維運、規模沒變 → Cloud SQL"}, {"no": "NO.74", "stem": "A multinational retail company has approached you to help design its systems. They have millions of transactions at their point of sale systems across the world that need to be captured, stored, and analyzed. They are seeing more growth and expect to <b class=\"kw\">expand into even more geographies</b>. Which database would be appropriate for them?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Datastore"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Storage</b>"}, {"L": "C", "ok": true, "html": "C. <b>Cloud Spanner</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud SQL</b>"}], "ansL": "C", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "millions of transactions ... across the world 全球數百萬筆交易 + expand into even more geographies 擴張到更多地區 → Spanner", "formula": "出現 across the world／more geographies 這種「地理範圍會一直長大」＋交易 → Spanner"}, {"no": "NO.120", "stem": "Which of the following statements is/are true about Cloud Spanner offered by Google Cloud Platform.", "opts": [{"L": "A", "ok": false, "html": "A. It can scale horizontally to support additional capacity."}, {"L": "B", "ok": false, "html": "B. It comes with Zero Downtime, No Maintenance windows, and is proven for large and small workloads."}, {"L": "C", "ok": false, "html": "C. You don&#x27;t need to shard or replicate data."}, {"L": "D", "ok": true, "html": "D. All of the above."}], "ansL": "D", "ans": "All of the above. 以上皆是", "trig": "scale horizontally 水平擴展 + Zero Downtime 零停機 + don&#x27;t need to shard 不必自行分片 → 三句都是 Spanner 招牌", "formula": "Spanner 的敘述題若三句都在講「擴展／零停機／自動分片複製」→ 選 All of the above"}, {"no": "NO.137", "stem": "You are a DevOps Engineer in an E-commerce company that sells products globally, across the countries. Customers buy products, add them to carts or check-in stock from different parts of the world with different timestamps. You need to choose a database that can <b class=\"kw\">scale globally</b> without any hassle and lots of developer support, it should be <b class=\"kw\">consistent across regions</b>, can scale horizontally to support enormous user, <b class=\"kw\">automatically replicates</b>, <b class=\"kw\">shards</b> and even auto transaction processing. Which of the following database do you choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. Cloud <b>Firestore</b>."}, {"L": "D", "ok": false, "html": "D. <b>Cloud Storage</b>."}], "ansL": "B", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "scale globally 全球擴展 + consistent across regions 跨區一致 + automatically replicates, shards 自動複製分片 → Spanner", "formula": "一題裡同時出現 globally + consistent + horizontally + automatically shards → 閉眼選 Spanner"}, {"no": "NO.142", "stem": "You are a cloud architect in a software solution provider company, one of the client that is a National Bank who wants to build an application that deals with transactions processing, and it needs a <b class=\"kw\">relational database</b> with petabyte of scale data. Which of the following Google Cloud Services will you use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Bigtable</b>"}, {"L": "C", "ok": true, "html": "C. <b>Cloud Spanner</b>"}, {"L": "D", "ok": false, "html": "D. Google Cloud <b>BigQuery</b>"}], "ansL": "C", "ans": "Cloud Spanner 全球關聯式資料庫", "trig": "relational database 關聯式資料庫 + petabyte of scale PB 級規模 → Spanner", "formula": "關聯式 + PB 級 → Spanner；關聯式 + TB 級／單區域 → Cloud SQL；PB 級但只做分析 → BigQuery"}, {"no": "NO.173", "stem": "A small scale retailer has been collecting its point of sale transaction in a PostgreSQL Database. They have raised funding for a strategic expansion goal in the next year that will see them <b class=\"kw\">grow significantly in Asia</b>, <b class=\"kw\">Europe</b>, <b class=\"kw\">North America</b>. Which Database option should they choose in Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. <b>BigQuery</b>"}, {"L": "B", "ok": true, "html": "B. Spanner"}, {"L": "C", "ok": false, "html": "C. <b>Cloud SQL</b>"}, {"L": "D", "ok": false, "html": "D. <b>Bigtable</b>"}], "ansL": "B", "ans": "Spanner（Cloud Spanner 全球關聯式資料庫）", "trig": "grow significantly in Asia, Europe, North America 橫跨三大洲顯著成長 → Spanner", "formula": "「現在小、未來要跨洲」是 Spanner 的暗號；只講「現在小」沒講擴張 → Cloud SQL"}, {"no": "NO.231", "stem": "A global organization is developing an application to manage payments and online bank accounts in <b class=\"kw\">multiple regions</b>. Each transaction must be <b class=\"kw\">handled consistently</b> in their database, and they anticipate almost <b class=\"kw\">unlimited growth</b> in the amount of , "formula": "題幹只要出現 key-value／NoSQL + 百萬級讀寫 → Bigtable；NoSQL + 行動 App → Firestore"}, {"no": "NO.208", "stem": "Which of the following statements is/are true about Google Cloud BigTable?", "opts": [{"L": "A", "ok": false, "html": "A. It is not compatible with Hadoop."}, {"L": "B", "ok": true, "html": "B. It <b>Scales from Giga Byte to Peta Byte</b> with No Downtime."}, {"L": "C", "ok": false, "html": "C. It can not be used in Real-time Ad analytics and tracking thousands of IoT Devices Data."}, {"L": "D", "ok": false, "html": "D. It is an enterprise-level Database that offers relational and non-relational features"}], "ansL": "B", "ans": "It Scales from Giga Byte to Peta Byte with No Downtime.（可從 GB 擴展到 PB 且無停機）", "trig": "Scales from Giga Byte to Peta Byte 從 GB 擴展到 PB → 這是 Bigtable 唯一正確的敘述", "formula": "敘述題出現 not／can not 這類否定詞時，先問「它其實做得到嗎」——做得到就是錯的選項"}, {"no": "NO.37", "stem": "Your customer currently has a hybrid cloud setup including their on-premises data center and AWS. They are consolidating all their services on Google Cloud as part of a modernization plan and want to <b class=\"kw\">spend less IT effort</b> in the future. There are about 10 <b class=\"kw\">MySQL and 25 PostgreSQL databases</b> across the two DCs. What is the best option to for them?", "opts": [{"L": "A", "ok": false, "html": "A. Use the Data Catalog Service to manage the metadata of the databases"}, {"L": "B", "ok": false, "html": "B. Use Cloud <b>Dataflow</b> service and setup Google&#x27;s <b>Cloud SQL</b> as the sink and the others as the source, which will cause the data to flow in as expected."}, {"L": "C", "ok": true, "html": "C. Use the Database Migration Service"}, {"L": "D", "ok": false, "html": "D. Use the <b>Bare Metal</b> Solution and copy the databases directly as they are on-premises and on AWS."}], "ansL": "C", "ans": "Use the Database Migration Service（資料庫遷移服務 DMS）", "trig": "10 MySQL and 25 PostgreSQL databases 十套 MySQL 與二十五套 PostgreSQL + spend less IT effort 減少 IT 人力 → DMS", "formula": "MySQL／PostgreSQL／SQL Server 要上雲且要省人力 → Database Migration Service"}, {"no": "NO.42", "stem": "Your organization is moving an application to Google Cloud. As part of that effort, it needs to migrate the application&#x27;s working database from another cloud provider to Cloud SQL. The database runs on the MySQL engine. The migration must cause <b class=\"kw\">minimal disruption</b> to users. Data must be <b class=\"kw\">secured while in transit</b>. Which should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>BigQuery</b> Data Transfer Service"}, {"L": "B", "ok": false, "html": "B. MySQL batch insert"}, {"L": "C", "ok": true, "html": "C. Database Migration Service"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Composer</b>"}], "ansL": "C", "ans": "Database Migration Service（資料庫遷移服務 DMS）", "trig": "minimal disruption 最小中斷 + secured while in transit 傳輸過程加密 → DMS", "formula": "遷移題看兩個關鍵詞：minimal disruption 不停機 + encryption 加密 → DMS"}, {"no": "NO.151", "stem": "A Customer has their current SAP systems using <b class=\"kw\">Microsoft SQL Server</b> as the Database. They are migrating to Google Cloud and also preparing to later migrate to the latest version of SAP. The entire IT team is being directed to focus on the migration to the new version of SAP. The new version of SAP does not use Microsoft SQL Server as the Database. Any but the most critical IT management tasks are being <b class=\"kw\">deprioritized</b>. How should they migrate their current database to Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Spanner"}, {"L": "B", "ok": false, "html": "B. <b>Bare Metal</b>"}, {"L": "C", "ok": false, "html": "C. <b>BigQuery</b>"}, {"L": "D", "ok": true, "html": "D. <b>Cloud SQL</b>"}], "ansL": "D", "ans": "Cloud SQL 託管關聯式資料庫", "trig": "Microsoft SQL Server 作為資料庫 + deprioritized 其他工作被降低優先 → 選最省管理的託管方案", "formula": "題幹強調「IT 人力不足／只想快速搬過去」＋現有引擎是 MySQL/PostgreSQL/SQL Server → Cloud SQL"}, {"no": "NO.196", "stem": "In terms of ansL": "A", "ans": "Product inventory 產品庫存", "trig": "raw data ... in a relational database without any processing 未經處理就能放進關聯式資料庫 → 找結構化的那個", "formula": "能塞進表格欄位的數字／日期／固定選項＝結構化；圖片、影片、語音、自由文字＝非結構化"}, {"no": "NO.370", "stem": "An organization is running <b class=\"kw\">SQL Server on-premises</b> and is struggling with capacity and management overhead. They want to <b class=\"kw\">modernize this database quickly</b> by using Google products or services. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Migrate all SQL Server data to <b>BigQuery</b>"}, {"L": "B", "ok": false, "html": "B. Refactor applications to use a cloud first database like <b>Firestore</b>"}, {"L": "C", "ok": true, "html": "C. Perform a managed database migration to <b>Cloud SQL</b>"}, {"L": "D", "ok": false, "html": "D. Export old tables from SQL Server to <b>Cloud Storage</b>"}], "ansL": "C", "ans": "Perform a managed database migration to Cloud SQL（用託管遷移搬到 Cloud SQL）", "trig": "SQL Server on-premises 地端 SQL Server + modernize this database quickly 快速現代化 → 託管遷移到 Cloud SQL", "formula": "「地端資料庫 + 想快 + 想少管理」→ managed migration 到 Cloud SQL，別選需要改寫應用的方案"}, {"no": "NO.377", "stem": "An organization needs to store daily transactional data such as customer records and purchase history. The data follows a <b class=\"kw\">consistent schema</b> and is <b class=\"kw\">cross-referenced</b>. Which type of service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Non-relational database"}, {"L": "B", "ok": false, "html": "B. Data lake"}, {"L": "C", "ok": true, "html": "C. Relational database"}, {"L": "D", "ok": false, "html": "D. Data warehouse"}], "ansL": "C", "ans": "Relational database 關聯式資料庫", "trig": "consistent schema 一致的資料結構 + cross-referenced 互相參照 → 關聯式資料庫", "formula": "consistent schema／cross-referenced／transactional → 關聯式；flexible model／varied fields → 非關聯式"}, {"no": "NO.394", "stem": "A retail organization has moved all of their inventory data to
