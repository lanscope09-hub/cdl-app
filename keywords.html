ses on Linux and Windows</b>. They want to move to Google Cloud <b class=\"kw\">in the easiest manner</b> possible. What are their best options?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Compute Engine</b> with VMs with either <b>Linux</b> or <b>Windows</b> OS."}, {"L": "B", "ok": false, "html": "B. <b>App Engine</b> Standard"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Functions</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Run</b>"}], "ansL": "A", "ans": "Compute Engine with VMs with either Linux or Windows OS.（Compute Engine 的 Linux／Windows VM）", "trig": "a mix of applications and databases on Linux and Windows 混雜的 Linux 與 Windows 系統 + in the easiest manner 用最簡單的方式 → Compute Engine", "formula": "現有 Linux／Windows 應用要最快上雲又不改程式 → Compute Engine VM，這是預設答案。"}, {"no": "NO.192", "stem": "Your Customer&#x27;s Organization has decided to move to the cloud. They currently run VMs on-premise but their goal on Google cloud is to run containers, primarily on Google Kubernetes Engine. They have a <b class=\"kw\">lease for their private data center for another year</b> that they have already paid for. What could be strategy they could adopt in migrating?", "opts": [{"L": "A", "ok": false, "html": "A. Jump and Ramp."}, {"L": "B", "ok": true, "html": "B. Improve and Move."}, {"L": "C", "ok": false, "html": "C. Rip and Replace."}, {"L": "D", "ok": false, "html": "D. Left and Shift."}], "ansL": "B", "ans": "Improve and Move.（先改造再搬遷）", "trig": "goal ... is to run containers 目標是跑容器 + lease for their private data center for another year 機房租約還有一年 → Improve and Move", "formula": "已經付了地端費用、有時間先改造 → Improve and Move；沒時間先改、急著上雲 → Lift and Shift。"}, {"no": "NO.248", "stem": "An organization wants to <b class=\"kw\">create a new application</b> in the cloud <b class=\"kw\">to replace an existing on-premises application</b>. Which application modernization approach should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Move the application to the cloud, and then change it."}, {"L": "B", "ok": false, "html": "B. Change their application, and then move it to the cloud."}, {"L": "C", "ok": false, "html": "C. Invent in greenfield."}, {"L": "D", "ok": true, "html": "D. <b>Invent</b> in brownfield."}], "ansL": "D", "ans": "Invent in brownfield.（在既有基礎上新建，brownfield）", "trig": "create a new application 建新應用（屬 Invent 類）+ to replace an existing on-premises application 取代既有地端系統（有舊包袱）→ brownfield", "formula": "新建但要銜接既有系統 → brownfield；完全從零、沒有任何舊包袱 → greenfield。有沒有「existing」是分水嶺。"}, {"no": "NO.293", "stem": "An organization has a <b class=\"kw\">large VMWare environment</b> that they want to migrate to the cloud. They want to <b class=\"kw\">retain existing operational processes and tools</b>. Which Google Cloud service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. Google Cloud <b>VMware</b> Engine"}, {"L": "B", "ok": false, "html": "B. <b>Bare Metal</b> Solution"}, {"L": "C", "ok": false, "html": "C. VMWare vSphere"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b>"}], "ansL": "A", "ans": "Google Cloud VMware Engine（Google Cloud 上的 VMware 平台）", "trig": "large VMWare environment 大型 VMware 環境 + retain existing operational processes and tools 保留既有維運流程與工具 → VMware Engine", "formula": "關鍵字 VMware ＋ 保留既有工具流程 → Google Cloud VMware Engine，幾乎是條件反射題。"}, {"no": "NO.322", "stem": "An organization wants to <b class=\"kw\">refactor</b> their application by using a <b class=\"kw\">microservices architecture</b> when migrating to the cloud. Which benefit would this action provide?", "opts": [{"L": "A", "ok": true, "html": "A. The <b>refactor</b>ed application is more efficient and scalable."}, {"L": "B", "ok": false, "html": "B. No code changes will be required."}, {"L": "C", "ok": false, "html": "C. This migration pattern provides the fastest path to the cloud."}, {"L": "D", "ok": false, "html": "D. The application will become PCI-DSS compliant by default."}], "ansL": "A", "ans": "The refactored application is more efficient and scalable.（重構後更有效率且更可擴展）", "trig": "refactor 重構 + microservices architecture 微服務架構 → 更有效率、更可擴展", "formula": "refactor／微服務的好處＝效率與可擴展性；代價＝要改程式、上雲最慢。看到「不用改程式」或「自動合規」直接刪。"}, {"no": "NO.406", "stem": "An organization wants to migrate a workload to the cloud <b class=\"kw\">without changing the application code or architecture</b>. Which migration path describes this approach?", "opts": [{"L": "A", "ok": false, "html": "A. Replatformed"}, {"L": "B", "ok": true, "html": "B. Rehosted"}, {"L": "C", "ok": false, "html": "C. Reimagined"}, {"L": "D", "ok": false, "html": "D. Refactored"}], "ansL": "B", "ans": "Rehosted（原封重新託管）", "trig": "without changing the application code or architecture 不改程式碼也不改架構 → Rehosted", "formula": "完全不改 → Rehost；為配合平台小改 → Replatform；改程式結構 → Refactor；整個重新設計 → Reimagine。"}, {"no": "NO.100", "stem": "Which of the following statements is/are correct about Bare Metal Solutions?", "opts": [{"L": "A", "ok": false, "html": "A. The network, which Google Cloud manages includes a low-latency <b>Cloud Interconnect</b> connection into the customer <b>Bare Metal</b> Solution environment."}, {"L": "B", "ok": false, "html": "B. <b>Bare Metal</b> Solution also includes the provisioning and maintenance of the custom, sole-tenancy hardware with local SAN, and smart hands support."}, {"L": "C", "ok": false, "html": "C. <b>Bare Metal</b> Solution uses a bring-your-own-license (BYOL) model."}, {"L": "D", "ok": true, "html": "D. All of the Above."}], "ansL": "D", "ans": "All of the Above.（以上皆是）", "trig": "low-latency Cloud Interconnect 低延遲互連 + sole-tenancy hardware 單一租戶硬體 + bring-your-own-license 自帶授權 → 三項都是 Bare Metal 的特徵", "formula": "Bare Metal Solution 的關鍵字：專用實體機、低延遲連回 GCP、自帶授權，典型用途是搬 Oracle 這類老資料庫。"}, {"no": "NO.101", "stem": "Which of the following is/are true about Bare Metal Solutions?", "opts": [{"L": "A", "ok": false, "html": "A. Enterprise-grade deployment platform"}, {"L": "B", "ok": false, "html": "B. All your existing investment in tooling and best practices will work as is"}, {"L": "C", "ok": false, "html": "C. Continue to run any version, and feature set, any database option, and any customizations (patchsets)"}, {"L": "D", "ok": true, "html": "D. All of the Above."}], "ansL": "D", "ans": "All of the Above.（以上皆是）", "trig": "existing investment in tooling ... will work as is 既有工具原封可用 + any version, any customizations 任何版本與客製都能繼續跑 → 三項皆是", "formula": "題目描述「舊系統原封照跑、授權與客製全保留」→ Bare Metal Solution。"}, {"no": "NO.187", "stem": "You are a program manager in a company you need to submit a bare metal solution order for a secure, high performance connection with a low-latency network fabric. <b class=\"kw\">What network information you need to submit the order</b> to Bare Metal Solutions.", "opts": [{"L": "A", "ok": false, "html": "A. IP Ranges for example Client IP Address range used for communication between your Google Cloud and <b>Bare Metal</b> Solution environments."}, {"L": "B", "ok": false, "html": "B. Google Cloud <b>Project</b> Id that you are using with your <b>bare metal</b> solution environment."}, {"L": "C", "ok": false, "html": "C. Total number of VLANs you need in your <b>Bare Metal</b> Solution Environment."}, {"L": "D", "ok": true, "html": "D. All of the above"}], "ansL": "D", "ans": "All of the above（以上皆是）", "trig": "What network information you need to submit the order 下單要提供哪些網路資訊 → IP 範圍、專案 ID、VLAN 數量都要", "formula": "Bare Metal Solution 下單要給的網路資訊＝IP 範圍＋專案 ID＋VLAN 數量；選項把三者分開列就選全部。"}, {"no": "NO.287", "stem": "An organization needs to migrate <b class=\"kw\">specialized workloads</b> to the cloud while <b class=\"kw\">maintaining their existing complex licensing and architecture</b>. What Google Cloud solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Compute Engine</b>"}, {"L": "B", "ok": true, "html": "B. <b>Bare Metal</b> Solution"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Run</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Functions</b>"}], "ansL": "B", "ans": "Bare Metal Solution（裸機方案）", "trig": "specialized workloads 特殊工作負載 + maintaining their existing complex licensing and architecture 維持既有複雜授權與架構 → Bare Metal Solution", "formula": "授權綁實體硬體／老舊特殊工作負載（Oracle、SAP 這類）→ Bare Metal Solution。"}, {"no": "NO.60", "stem": "Your organization runs a distributed application in the Compute Engine virtual machines. Your organization <b class=\"kw\">needs redundancy</b>, but it also needs extremely fast communication (<b class=\"kw\">less than 10 milliseconds</b>) between the parts of the application in different virtual machines. Where should your organization locate this virtual machines?", "opts": [{"L": "A", "ok": false, "html": "A. In a single zone within a single region"}, {"L": "B", "ok": true, "html": "B. In different zones within a single region"}, {"L": "C", "ok": false, "html": "C. In multiple regions, using one zone per region"}, {"L": "D", "ok": false, "html": "D. In multiple regions, using multiple zones per region"}], "ansL": "B", "ans": "In different zones within a single region（同一 region 內的不同 zone）", "trig": "needs redundancy 需要備援 + less than 10 milliseconds 延遲低於 10 毫秒 → 同 region 跨 zone", "formula": "要備援又要低延遲 → 同 region 不同 zone；只要極致低延遲 → 同 zone；要抗整個地區級災難 → 多 region。"}, {"no": "NO.117", "stem": "Your organization runs a distributed application in the Compute Engine virtual machines. Your organization needs <b class=\"kw\">redundancy</b>, but it also needs extremely fast communication (<b class=\"kw\">less than 10 milliseconds</b>) between the parts of the application in different virtual machines. Where should your organization locate this virtual machines?", "opts": [{"L": "A", "ok": true, "html": "A. In different zones within a single region"}, {"L": "B", "ok": false, "html": "B. In multiple regions, using one zone per region"}, {"L": "C", "ok": false, "html": "C. In multiple regions, using multiple zones per region"}, {"L": "D", "ok": false, "html": "D. In a single zone within a single region"}], "ansL": "A", "ans": "In different zones within a single region（同一 region 內的不同 zone）", "trig": "redundancy 備援 + less than 10 milliseconds 低於 10 毫秒 → 同 region 跨 zone（與 NO.60 同題，選項順序被換過）", "formula": "遇到選項順序被打亂的重複題，先認「同 region 不同 zone」這串字，不要記字母。"}, {"no": "NO.121", "stem": "An application has become very popular and the <b class=\"kw\">number of requests/users is increasing quickly</b>. There is a meeting to figure out how to scale the systems so that they can accept user requests and still have the <b class=\"kw\">capacity to spare</b>. What is the preferred option?", "opts": [{"L": "A", "ok": false, "html": "A. Circular Scaling takes a round-robin approach to allocate and destroy VMs."}, {"L": "B", "ok": false, "html": "B. Triangular Scaling takes an automated average of Cost, Effort, and Time."}, {"L": "C", "ok": false, "html": "C. Vertical Scaling"}, {"L": "D", "ok": true, "html": "D. Horizontal Scaling"}], "ansL": "D", "ans": "Horizontal Scaling（水平擴展）", "trig": "number of requests/users is increasing quickly 使用者快速增加 + capacity to spare 還要留有餘裕 → Horizontal Scaling", "formula": "使用者暴增要撐住 → 水平擴展（加機器台數）；單機效能不夠才垂直擴展（換更大台）。選項出現沒聽過的擴展名詞，通常是假的。"}, {"no": "NO.152", "stem": "You are discussing scaling requirements with a gaming company. When the game launches, they are expecting <b class=\"kw\">incoming data surges of 2 million users</b> or more during weekends and holidays. Their on-premise systems have had <b class=\"kw\">issues scaling</b> and they want your advice on solving the issue. What do you recommend?", "opts": [{"L": "A", "ok": false, "html": "A. Either <b>Compute Engine</b> VMs or Kubernetes nodes work, but it is better to keep a buffer of an extra 2 million users."}, {"L": "B", "ok": true, "html": "B. We can deploy a <b>Pub/Sub</b> to ingest data which will grow to absorb demand and pass it on to other stages."}, {"L": "C", "ok": false, "html": "C. We will allocate <b>Compute Engine</b> VMs estimating 80% capacity of 2 million users."}, {"L": "D", "ok": false, "html": "D. We will allocate Kubernetes nodes estimating 80% capacity of 2 million users."}], "ansL": "B", "ans": "We can deploy a Pub/Sub to ingest data which will grow to absorb demand and pass it on to other stages.（用 Pub/Sub 吸收流量）", "trig": "incoming data surges of 2 million users 湧入的資料暴增 + issues scaling 擴展有問題 → Pub/Sub 當緩衝層", "formula": "流量會暴衝、要先吸住再慢慢處理 → Pub/Sub 當緩衝層；凡是「先猜一個容量」的選項一律刪。"}, {"no": "NO.29", "stem": "Your organization is migrating to <b class=\"kw\">Google</b> Cloud. As part of that effort, it needs to move terabytes of data from on-premises file servers to Cloud Storage. Your organization wants the migration process to be <b class=\"kw\">automated and to be managed by Google</b>. Your organization has an <b class=\"kw\">existing Dedicated Interconnect</b> connection that it wants to use. Which Google Cloud product or feature should your organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Storage Transfer Service</b>"}, {"L": "B", "ok": false, "html": "B. Migrate for <b>Anthos</b>"}, {"L": "C", "ok": false, "html": "C. <b>BigQuery</b> Data Transfer Service"}, {"L": "D", "ok": false, "html": "D. <b>Transfer Appliance</b>"}], "ansL": "A", "ans": "Storage Transfer Service（儲存轉移服務）", "trig": "automated and to be managed by Google 自動化且由 Google 代管 + existing Dedicated Interconnect 已有專線 → Storage Transfer Service", "formula": "有網路頻寬／專線＋要自動化 → Storage Transfer Service；沒頻寬、資料量又大 → Transfer Appliance（寄硬碟）。"}, {"no": "NO.154", "stem": "Your customer is moving from AWS to Google Cloud. Data also needs to be moved. There is about 50TB of data. On AWS, the <b class=\"kw\">data resides in an S3 bucket</b>. It is going to be moved to Cloud Storage. Data is also being continuously generated on S3 prior to the cutover. It is preferable that this is also periodically transferred. What is the best way to move the data?", "opts": [{"L": "A", "ok": false, "html": "A. Use the gsutil command-line option"}, {"L": "B", "ok": false, "html": "B. Use the Google Cloud console to drag and drop the files easily"}, {"L": "C", "ok": true, "html": "C. Use the <b>Storage Transfer Service</b>"}, {"L": "D", "ok": false, "html": "D. Use a <b>Transfer Appliance</b>"}], "ansL": "C", "ans": "Use the Storage Transfer Service（Storage Transfer Service）", "trig": "data resides in an S3 bucket 資料在 S3 + continuously generated ... periodically transferred 持續產生、要定期同步 → Storage Transfer Service", "formula": "雲對雲（S3 → Cloud Storage）且要定期同步 → Storage Transfer Service，這是它的標準用例。"}, {"no": "NO.206", "stem": "A startup client of yours does offline data processing for a few of its clients. They are migrating their applications and the associated data to Google Cloud. They have 100TB of data to move. They presently have a very small private data center setup connected to a local internet provider. The maximum bandwidth they are able to get is 100Mbps. How long will it take them to transfer the data over the internet if the transfer goes smoothly?", "opts": [{"L": "A", "ok": false, "html": "A. About 12 days."}, {"L": "B", "ok": false, "html": "B. About 2 years."}, {"L": "C", "ok": true, "html": "C. About 100 days."}, {"L": "D", "ok": false, "html": "D. About 24 hours."}], "ansL": "C", "ans": "About 100 days.（約 100 天）", "trig": "100TB of data 100TB 資料 + maximum bandwidth ... 100Mbps 頻寬上限 100Mbps → 約 100 天", "formula": "記死換算：100Mbps ≈ 每天 1TB。天數＝資料量(TB)÷每日可傳 TB 數；估出來要幾週以上就該改用 Transfer Appliance。"}, {"no": "NO.9", "stem": "Your organization is <b class=\"kw\">developing a mobile app</b> and wants to select a <b class=\"kw\">fully featured cloud-based compute platform</b> for it. Which Google Cloud product or feature should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Google Kubernetes Engine</b>"}, {"L": "B", "ok": true, "html": "B. Firebase"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Functions</b>"}, {"L": "D", "ok": false, "html": "D. <b>App Engine</b>"}], "ansL": "B", "ans": "Firebase（行動與網頁應用開發平台）", "trig": "developing a mobile app 開發行動應用 + fully featured cloud-based compute platform 功能齊全的雲端平台 → Firebase", "formula": "題幹出現 mobile app 開發平台 → Firebase，這是它的專屬地盤，不必猶豫。"}, {"no": "NO.194", "stem": "When you update the function in firebase by deploying updated code, instances for older versions are <b class=\"kw\">cleaned up</b> along with <b class=\"kw\">build artifacts</b> in __________________ and replaced by new instances.", "opts": [{"L": "A", "ok": false, "html": "A. Google Cloud console."}, {"L": "B", "ok": true, "html": "B. Storage and Container Registry."}, {"L": "C", "ok": false, "html": "C. Container Registry repository."}, {"L": "D", "ok": false, "html": "D. None of the Above"}], "ansL": "B", "ans": "Storage and Container Registry.（Cloud Storage 與 Container Registry）", "trig": "build artifacts 建置產物 + cleaned up 被清除 → 存放在 Storage 與 Container Registry", "formula": "函式部署的中繼產物落在 Cloud Storage ＋ Container Registry，更新部署時舊的會自動被清掉。"}, {"no": "NO.85", "stem": "Your organization is building an application running in Google Cloud. Currently, software <b class=\"kw\">builds</b>, <b class=\"kw\">tests</b>, <b class=\"kw\">and regular deployments are done manually</b>, but you want to reduce work for the team. Your organization wants to use Google Cloud managed solutions to <b class=\"kw\">automate</b> your build, testing, and deployment process. Which Google Cloud product or feature should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Scheduler"}, {"L": "B", "ok": false, "html": "B. Cloud Code"}, {"L": "C", "ok": true, "html": "C. Cloud Build"}, {"L": "D", "ok": false, "html": "D. Cloud Deployment Manager"}], "ansL": "C", "ans": "Cloud Build（代管的 CI/CD 建置服務）", "trig": "builds, tests, and regular deployments are done manually 建置測試部署都靠手動 + automate 自動化 → Cloud Build", "formula": "CI/CD 自動建置測試部署 → Cloud Build；用設定檔開基礎設施 → Deployment Manager；定時觸發 → Cloud Scheduler。"}]}, {"name": "AI / ML", "tag": "好拿分", "rows": [{"no": "NO.20", "stem": "Your company provides car maintenance services. It is conducting an internal hackathon to identify new ideas that could expand their business. The teams have pitched different ideas and have started working on it. They have to present their application to the judges within 48 hours. A presentation alone is not enough; they have to demonstrate a working proof of concept. The team that you are mentoring is going to recommend additional services to drive in customers based on the brand of car they drive in. They need to be able to identify what brand of car the customer has, based on a photograph automatically taken at entry. They have already discovered an open source database of car images collected by online enthusiasts. How should they implement this solution?", "opts": [{"L": "A", "ok": false, "html": "A. Use Deep Learning Containers that are preconfigured and optimized containers for deep learning environments."}, {"L": "B", "ok": false, "html": "B. Use <b>AutoML</b> Image - upload the images and let it create a working model for you."}, {"L": "C", "ok": false, "html": "C. Use <b>TensorFlow</b> to create a model that will identify the car brands; use the available data to train the model."}, {"L": "D", "ok": true, "html": "D. Use Cloud Vision AI that is able to <b>detect logos</b>. Write only the code to integrate into your workflow."}], "ansL": "D", "ans": "Cloud Vision AI（視覺 AI，偵測 logo）", "trig": "within 48 hours 48 小時內 + detect logos 偵測商標 → 現成 API", "formula": "時間極短／要現成能力→Pre-trained API；有標記資料沒 ML 專家→AutoML；有 ML 團隊要完全控制→自訂訓練"}, {"no": "NO.54", "stem": "Your organization needs to <b class=\"kw\">categorize objects</b> in a large group of <b class=\"kw\">static images</b> using machine learning. Which Google Cloud product or service should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>BigQuery ML</b>"}, {"L": "B", "ok": false, "html": "B. <b>AutoML</b> Video Intelligence"}, {"L": "C", "ok": true, "html": "C. Cloud <b>Vision API</b>"}, {"L": "D", "ok": false, "html": "D. <b>AutoML</b> Tables"}], "ansL": "C", "ans": "Cloud Vision API 視覺 API", "trig": "categorize objects 分類物件 + static images 靜態圖片 → Vision API", "formula": "資料型態對照：圖片→Vision；影片→Video Intelligence；音訊→Speech；文字→Natural Language"}, {"no": "NO.189", "stem": "The Border Security Agency has hired your software services firm to build an application for them that will collect information about visas stamped on passports. You are given <b class=\"kw\">stamped images</b>. You have to find out which country issued the visa and the period of validity. Pull out this data and put it into a database. Which of these applications would be suitable for that?", "opts": [{"L": "A", "ok": true, "html": "A. Use Cloud <b>Vision API</b> - write code to <b>identify the text blocks</b>, copy the data, and store it"}, {"L": "B", "ok": false, "html": "B. Use <b>TensorFlow</b> - write code that will identify the type of visa and the bounding text blocks. Copy the data and then store it."}, {"L": "C", "ok": false, "html": "C. Use <b>AutoML</b> - upload other images of visas and run the model creation process which will automatically identify the visas"}, {"L": "D", "ok": false, "html": "D. Use Data Labeling service - outsource the work of marking and extracting the information to others."}], "ansL": "A", "ans": "Cloud Vision API（辨識文字塊後存入資料庫）", "trig": "stamped images 蓋章圖片 + identify the text blocks 辨識文字區塊 → Vision API 的 OCR", "formula": "圖片裡有文字要抽出來→Vision API OCR；整份制式表單要抽固定欄位→Document AI"}, {"no": "NO.198", "stem": "Your client is a financial services company giving loans based on customer profiles. As part of the regulatory compliance, they have to collect a bunch of different <b class=\"kw\">documents</b> with know your customer (KYC) information. They want to be able to process the information in these documents quickly and at scale. They want to integrate the chosen solution <b class=\"kw\">as quickly as possible</b>. What are your options on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Integrate the Cloud <b>Vision API</b> to create a custom model to handle the documents."}, {"L": "B", "ok": false, "html": "B. Create a model using <b>TensorFlow</b> and integrated it into the process workflow."}, {"L": "C", "ok": true, "html": "C. Integrate the Lending DocAI and <b>Document AI</b> in two there processes workflow of the processing loan requests."}, {"L": "D", "ok": false, "html": "D. Integrate the <b>Natural Language API</b> to read the request sent in by clients and to process the forms."}], "ansL": "C", "ans": "Lending DocAI + Document AI（貸款文件 AI／文件 AI）", "trig": "documents 文件 + as quickly as possible 越快整合越好 → 現成 Document AI", "formula": "大量制式文件抽欄位→Document AI（金融貸款另有專版 Lending DocAI）；純文字語意→Natural Language API"}, {"no": "NO.237", "stem": "An organization needs to categorize a large group of <b class=\"kw\">photographs</b> using <b class=\"kw\">pre-trained</b> machine learning. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Vision API</b>"}, {"L": "B", "ok": false, "html": "B. <b>BigQuery ML</b>"}, {"L": "C", "ok": false, "html": "C. <b>AutoML</b> Vision"}, {"L": "D", "ok": false, "html": "D. <b>Looker</b>"}], "ansL": "A", "ans": "Vision API 視覺 API", "trig": "pre-trained 預先訓練好的 + photographs 照片 → Vision API", "formula": "題幹出現 pre-trained／off-the-shelf→選 API；出現「自己有標記資料＋沒有資料科學家」→AutoML"}, {"no": "NO.312", "stem": "An organization wants to search hundreds of scanned documents for <b class=\"kw\">key information like dates</b>, <b class=\"kw\">names</b>, and other specific words. Why should the organization use application programming interfaces (APIs)?", "opts": [{"L": "A", "ok": false, "html": "A. To replace the scanned documents with an online survey"}, {"L": "B", "ok": false, "html": "B. To ingest data in real time and encrypt unmatched words"}, {"L": "C", "ok": true, "html": "C. To create digital versions of the documents and locate key information"}, {"L": "D", "ok": false, "html": "D. To transform the documents into unstructured data."}], "ansL": "C", "ans": "To create digital versions of the documents and locate key information（數位化文件並定位關鍵資訊）", "trig": "search ... scanned documents 搜尋掃描文件 + key information like dates, names 日期姓名等關鍵資訊 → 數位化＋擷取", "formula": "「紙本／掃描件要變成可搜尋的資料」→OCR／文件 API；資料要能查詢＝更結構化，不是更非結構化"}, {"no": "NO.401", "stem": "An organization has a large dataset that contains <b class=\"kw\">text transcripts</b> of conversations between their customers and service representatives. They want an automated solution to <b class=\"kw\">identify the topics</b> their customers care most about. Which service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud <b>Translation API</b>"}, {"L": "B", "ok": false, "html": "B. <b>Speech-to-Text</b> API"}, {"L": "C", "ok": false, "html": "C. <b>Vision API</b>"}, {"L": "D", "ok": true, "html": "D. <b>Natural Language API</b>"}], "ansL": "D", "ans": "Natural Language API 自然語言 API", "trig": "text transcripts 文字逐字稿 + identify the topics 找出主題 → NL API", "formula": "資料已經是文字→Natural Language；還是聲音檔→先 Speech-to-Text 再接 NL"}, {"no": "NO.411", "stem": "An organization needs to categorize text-based customer reviews on their website using a <b class=\"kw\">pre-trained</b> machine learning model. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. Cloud <b>Natural Language API</b>"}, {"L": "B", "ok": false, "html": "B. <b>Dialogflow</b>"}, {"L": "C", "ok": false, "html": "C. <b>Recommendations AI</b>"}, {"L": "D", "ok": false, "html": "D. <b>TensorFlow</b>"}], "ansL": "A", "ans": "Cloud Natural Language API 自然語言 API", "trig": "text-based reviews 文字評論 + pre-trained 預訓練 → NL API", "formula": "分析既有文字→NL API；要跟人一來一往對話→Dialogflow；要推薦商品→Recommendations AI"}, {"no": "NO.6", "stem": "Which Google Cloud service or feature lets you build machine learning models using <b class=\"kw\">Standard SQL</b> and data in a <b class=\"kw\">data warehouse</b>?", "opts": [{"L": "A", "ok": true, "html": "A. <b>BigQuery ML</b>"}, {"L": "B", "ok": false, "html": "B. <b>TensorFlow</b>"}, {"L": "C", "ok": false, "html": "C. <b>AutoML</b> Tables"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Bigtable</b> ML"}], "ansL": "A", "ans": "BigQuery ML", "trig": "Standard SQL 標準 SQL + data warehouse 資料倉儲 → BigQuery ML", "formula": "資料已在 BigQuery＋只想用 SQL→BigQuery ML（幾乎是題目送分的固定組合）"}, {"no": "NO.69", "stem": "Your organization wants to predict the behavior of visitors to its public website. To do that, you have decided to build a machine learning model. Your team has <b class=\"kw\">database-related skills</b> but <b class=\"kw\">only basic machine learning skills</b>, and would like to use those database skills. Which Google Cloud product or feature should your organization choose?", "opts": [{"L": "A", "ok": true, "html": "A. <b>BigQuery ML</b>"}, {"L": "B", "ok": false, "html": "B. LookML"}, {"L": "C", "ok": false, "html": "C. <b>TensorFlow</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud SQL</b>"}], "ansL": "A", "ans": "BigQuery ML", "trig": "database-related skills 資料庫技能 + only basic machine learning skills 只有基礎 ML 能力 → BigQuery ML", "formula": "「只有 SQL／DBA 技能、沒有資料科學家」是 BigQuery ML 的招牌關鍵字組"}, {"no": "NO.222", "stem": "One of your clients is in the retail sector. They have a small team supporting their operations and a small development team taking care of application development. They have heard of the benefits of machine learning, but they do not have the capacity to hire data scientists or the work to retain them. They have a team of analysts who works primarily on <b class=\"kw\">BigQuery</b> and knows how to run SQL queries. They want to be able to get into the new age of machine learning and artificial intelligence. What options are available to run on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Use the popular open-source libraries SciPy and NumPy to create machine learning models."}, {"L": "B", "ok": false, "html": "B. Use the Unified AI Platform to create a custom <b>TensorFlow</b> model."}, {"L": "C", "ok": true, "html": "C. Use <b>BigQuery</b> ML to create machine learning models using SQL queries."}, {"L": "D", "ok": false, "html": "D. Integrate the Cloud <b>Vision API</b> and the Cloud Speech API to create a custom model that will suit the retail sector."}], "ansL": "C", "ans": "Use BigQuery ML to create machine learning models using SQL queries.（用 SQL 建模）", "trig": "analysts who works primarily on BigQuery ... SQL queries 分析師主要用 BigQuery 寫 SQL → BigQuery ML", "formula": "沒資料科學家＋資料在 BigQuery＋只會 SQL→BigQuery ML"}, {"no": "NO.288", "stem": "A vacation home rental organization wants to predict the popularity of properties in their upcoming busy season. They do not have a data science team, and want to use their <b class=\"kw\">in-house database administration skills</b> to create a machine learning model. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Use custom training in Vertex Al with <b>TensorFlow</b>."}, {"L": "B", "ok": true, "html": "B. Use <b>BigQuery ML</b> and create models using SQL."}, {"L": "C", "ok": false, "html": "C. Build a model in <b>AutoML</b> using labeled data."}, {"L": "D", "ok": false, "html": "D. Integrate pre-trained APIs into their application."}], "ansL": "B", "ans": "Use BigQuery ML and create models using SQL.（用 SQL 建模）", "trig": "no data science team 沒有資料科學團隊 + in-house database administration skills 內部資料庫管理技能 → BigQuery ML", "formula": "出現「DBA／SQL 技能」→BigQuery ML；只有「標記好的資料、沒 ML 專家」→AutoML"}, {"no": "NO.175", "stem": "Certain devices for cracks, rust, etc. Some of these issues are difficult to identify for a human and your company has seen increasing customer complaints - the customer has paid for an inspection and the field agent said there was no problem, but it later turned out there actually was. The team has come up with a proposal to engage AI to identify issues. On evaluating the existing system, it is seen that the mobile phone <b class=\"kw\">network connection is not good or consistent</b>. What solution can work for them?", "opts": [{"L": "A", "ok": true, "html": "A. Use <b>AutoML</b> Vision Edge models."}, {"L": "B", "ok": false, "html": "B. Use the Rust programming language instead of Python to identify issues like rust."}, {"L": "C", "ok": false, "html": "C. Use Cloud <b>TPU</b>s which will be able to do the analysis faster on the cloud. Thus responses also will be fast."}, {"L": "D", "ok": false, "html": "D. Use <b>TensorFlow</b> to create custom models and deploy it as TensorFlow Lite models."}], "ansL": "A", "ans": "Use AutoML Vision Edge models.（邊緣版影像模型）", "trig": "network connection is not good or consistent 網路不穩不一致 → Edge 邊緣模型", "formula": "現場沒網路／要在裝置上即時推論→Edge 版模型；只是想訓練更快→TPU"}, {"no": "NO.270", "stem": "An organization has hired a team of <b class=\"kw\">data scientists</b> and developers. They want to create unique value in their business by <b class=\"kw\">coding an advanced machine learning model</b> in Vertex AI Workbench. Which service should the organization use to train the model?", "opts": [{"L": "A", "ok": false, "html": "A. <b>AutoML</b>"}, {"L": "B", "ok": false, "html": "B. Prebuilt APIs"}, {"L": "C", "ok": true, "html": "C. Custom training"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b>"}], "ansL": "C", "ans": "Custom training 自訂訓練", "trig": "coding an advanced machine learning model 自己寫程式做進階模型 + data scientists 資料科學家 → 自訂訓練", "formula": "有 ML 團隊＋自己寫程式＋要完全控制→Vertex AI Custom training"}, {"no": "NO.352", "stem": "A real estate organization processes photos of properties uploaded by their agents to an internal application. They must manually check and remove photos that contain <b class=\"kw\">personally identifiable information</b> like passports and credit cards. They want a solution that their developer can use to integrate with their app <b class=\"kw\">as quickly as possible</b>. Which solution should they use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>BigQuery ML</b>"}, {"L": "B", "ok": false, "html": "B. Custom training"}, {"L": "C", "ok": true, "html": "C. Pre-trained APIs"}, {"L": "D", "ok": false, "html": "D. <b>AutoML</b>"}], "ansL": "C", "ans": "Pre-trained APIs 預訓練 API", "trig": "personally identifiable information 個人可識別資訊 + as quickly as possible 越快越好 → 預訓練 API", "formula": "需求是「通用常見物件／敏感資訊偵測」＋要快→Pre-trained API，完全不必訓練"}, {"no": "NO.372", "stem": "A manufacturing organization has a large collection of <b class=\"kw\">images labeled as intact or defective</b> parts. They want to use this data to build a simple solution to detect faulty parts on their production line. They have <b class=\"kw\">no data science expertise</b>. Which solution should they use?", "opts": [{"L": "A", "ok": false, "html": "A. Discovery AI for Retail"}, {"L": "B", "ok": false, "html": "B. Pre-trained APIs"}, {"L": "C", "ok": false, "html": "C. <b>Document AI</b>"}, {"L": "D", "ok": true, "html": "D. <b>AutoML</b>"}], "ansL": "D", "ans": "AutoML", "trig": "images labeled as intact or defective 已標記完好／瑕疵的圖片 + no data science expertise 沒有資料科學專業 → AutoML", "formula": "有自己標好的資料＋沒 ML 專家→AutoML；需求是通用能力→API；有 ML 團隊→自訂訓練"}, {"no": "NO.27", "stem": "An organization wants to <b class=\"kw\">search for and share plug-and-play AI components</b> which can easily build ML services into their project. Which Google Cloud product should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Document AI</b>"}, {"L": "B", "ok": true, "html": "B. AI Hub"}, {"L": "C", "ok": false, "html": "C. Cloud Talent Solution"}, {"L": "D", "ok": false, "html": "D. <b>Recommendations AI</b>"}], "ansL": "B", "ans": "AI Hub", "trig": "search for and share plug-and-play AI components 搜尋並分享隨插即用的 AI 元件 → AI Hub", "formula": "「找現成 AI 元件、分享重複使用」→AI Hub；「端到端建模平台」→Vertex AI"}, {"no": "NO.261", "stem": "An organization wants to build custom machine learning models. They require a <b class=\"kw\">managed platform</b> that provides services to <b class=\"kw\">gather data</b>, <b class=\"kw\">build models</b>, and then <b class=\"kw\">deploy and monitor</b> those models. Which service should they use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Document AI</b>"}, {"L": "B", "ok": false, "html": "B. <b>Natural Language API</b>"}, {"L": "C", "ok": false, "html": "C. Kubernetes Engine"}, {"L": "D", "ok": true, "html": "D. <b>Vertex AI</b>"}], "ansL": "D", "ans": "Vertex AI", "trig": "managed platform 代管平台 + gather data, build models, deploy and monitor 蒐集資料、建模、部署、監控 → Vertex AI", "formula": "題幹把「資料→訓練→部署→監控」整條流程列出來→Vertex AI"}, {"no": "NO.346", "stem": "An organization needs a platform to create custom <b class=\"kw\">end-to-end</b> artificial intelligence models. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Dataproc</b>"}, {"L": "B", "ok": false, "html": "B. <b>Compute Engine</b>"}, {"L": "C", "ok": false, "html": "C. <b>Recommendations AI</b>"}, {"L": "D", "ok": true, "html": "D. <b>Vertex AI</b>"}], "ansL": "D", "ans": "Vertex AI", "trig": "end-to-end 端到端 + custom ... AI models 自訂 AI 模型 → Vertex AI", "formula": "看到 end-to-end／custom ML platform→Vertex AI，這是固定搭配"}, {"no": "NO.47", "stem": "Your team has developed a machine learning model for your customer. The test results indicate very strong predictive capability. The model is then deployed in production. Evaluation of the predictions in production show that they are off by a pronounced margin. What is the issue and how can you solve for it?", "opts": [{"L": "A", "ok": false, "html": "A. The model is under fitted. Train with less data."}, {"L": "B", "ok": false, "html": "B. The model is over fitted. Add more features to the model to fix it."}, {"L": "C", "ok": false, "html": "C. The model is fine since the test results are good. Fix the production of incoming data."}, {"L": "D", "ok": true, "html": "D. The model is overfitted. Train with more data."}], "ansL": "D", "ans": "The model is overfitted. Train with more data.（過度配適，用更多資料訓練）", "trig": "test results ... very strong 測試表現極佳 + in production ... off by a pronounced margin 上線後誤差明顯 → overfitting", "formula": "訓練分數高、上線表現爛＝overfitting；解法是加資料／減特徵，不是加特徵"}, {"no": "NO.367", "stem": "An organization is using machine learning to make predictions. One of their datasets mistakenly includes <b class=\"kw\">mislabeled data</b>. How will the prediction be impacted?", "opts": [{"L": "A", "ok": false, "html": "A. Increased risk of privacy leaks"}, {"L": "B", "ok": true, "html": "B. Increased risk of inaccuracy"}, {"L": "C", "ok": false, "html": "C. Decreased model compatibility"}, {"L": "D", "ok": false, "html": "D. Decreased model training time"}], "ansL": "B", "ans": "Increased risk of inaccuracy（不準確的風險增加）", "trig": "mislabeled data 標記錯誤的資料 → 準確度受害", "formula": "資料品質題先問「這個缺陷會傷到哪個結果」：標錯→準確度；缺欄位→完整性"}, {"no": "NO.373", "stem": "A retail organization is training a model to recommend products to customers for an ecommerce website. The model was trained on previous purchases, but <b class=\"kw\">did not include demographic information</b> on each buyer. What dimension of the data is responsible for the model&#x27;s poor performance?", "opts": [{"L": "A", "ok": false, "html": "A. Accuracy"}, {"L": "B", "ok": false, "html": "B. Validity"}, {"L": "C", "ok": false, "html": "C. Timeliness"}, {"L": "D", "ok": true, "html": "D. Completeness"}], "ansL": "D", "ans": "Completeness 完整性", "trig": "did not include demographic information 沒有納入人口統計資料 → 資料不完整", "formula": "少資料→Completeness；值寫錯→Accuracy；格式不合規→Validity；資料太舊→Timeliness"}, {"no": "NO.383", "stem": "An organization is training a machine learning model to make predictions. What could <b class=\"kw\">improve the prediction accuracy</b> of their model?", "opts": [{"L": "A", "ok": false, "html": "A. An increase in storage capacity"}, {"L": "B", "ok": false, "html": "B. Higher network bandwidth"}, {"L": "C", "ok": true, "html": "C. An increase in training data"}, {"L": "D", "ok": false, "html": "D. Faster CPU processors"}], "ansL": "C", "ans": "An increase in training data（增加訓練資料）", "trig": "improve the prediction accuracy 提升預測準確度 → 加訓練資料", "formula": "硬體（CPU／儲存／頻寬）改善的是「速度」；準確度靠資料的量與品質"}, {"no": "NO.84", "stem": "Your team is working on building a machine learning model. There are a bunch of terminologies that are being used. What is an &quot;instance&quot; or an &quot;example&quot;?", "opts": [{"L": "A", "ok": false, "html": "A. An input variable is used in making predictions. E.g. number of rooms in a house price prediction model."}, {"L": "B", "ok": true, "html": "B. One row of a dataset containing one or more input columns and possibly a prediction result."}, {"L": "C", "ok": false, "html": "C. An answer for a prediction task, either the answer produced by a machine learning system or the right answer supplied in training data. E.g. image contains a &quot;cat&quot;."}, {"L": "D", "ok": false, "html": "D. The &quot;knobs&quot; that you tweak during successive runs of training a model. E.g. learning rate"}], "ansL": "B", "ans": "One row of a dataset containing one or more input columns and possibly a prediction result.（資料集的一列）", "trig": "instance / example 實例、範例 → 一列資料", "formula": "術語對照表：一列＝instance／example；一欄＝feature；答案＝label；訓練前調的設定＝hyperparameter"}, {"no": "NO.139", "stem": "When creating machine learning models, a key initial step is to identify the type of model required. One of these is the <b class=\"kw\">classification model</b>. Which of these statements define a classification model?", "opts": [{"L": "A", "ok": true, "html": "A. A type of machine learning model for distinguishing among two or more discrete values. E.g. &quot;book&quot;, &quot;car&quot;."}, {"L": "B", "ok": false, "html": "B. A type of machine learning model is a meta-model maker, which classifies algorithms based on the quality of their ou<b>tpu</b>t."}, {"L": "C", "ok": false, "html": "C. A type of machine learning model that ou<b>tpu</b>ts continuous (typically, floating-point) values. E.g. the predicted price of the house is $120,000."}, {"L": "D", "ok": false, "html": "D. A type of classic model approach that is less used today and which has been replaced by the regression model."}], "ansL": "A", "ans": "distinguishing among two or more discrete values（區分兩個以上離散值）", "trig": "classification model 分類模型 → 離散類別", "formula": "輸出「屬於哪一類」→classification；輸出「多少錢／多少度」這種數字→regression"}, {"no": "NO.274", "stem": "What is <b class=\"kw\">artificial intelligence</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Any system that ingests data in real time"}, {"L": "B", "ok": false, "html": "B. Any system that automatically structures data"}, {"L": "C", "ok": false, "html": "C. Any system capable of a task that requires smart analytics to generate predictions"}, {"L": "D", "ok": true, "html": "D. Any system capable of a task that normally requires human cognition"}], "ansL": "D", "ans": "Any system capable of a task that normally requires human cognition（能做原本需人類認知之事的系統）", "trig": "artificial intelligence 人工智慧 → 取代人類認知", "formula": "AI＝做原本要人腦才能做的事（最大範圍）；ML 是 AI 的子集，靠資料自己學規則"}, {"no": "NO.278", "stem": "What is generative Al?", "opts": [{"L": "A", "ok": true, "html": "A. A specific field of Al that can be used to create content"}, {"L": "B", "ok": false, "html": "B. An umbrella term that includes all types of machine learning algorithms"}, {"L": "C", "ok": false, "html": "C. An Al model for labeling images"}, {"L": "D", "ok": false, "html": "D. A machine learning model for language tran<b>sla</b>tion"}], "ansL": "A", "ans": "A specific field of AI that can be used to create content（用來創造內容的 AI 領域）", "trig": "generative AI 生成式 AI → create content 創造內容", "formula": "生成式 AI＝產出新內容（文字、圖片、程式碼）；只做辨識分類的不算生成"}, {"no": "NO.221", "stem": "Which of the following statements is / are correct about Machine Learning?", "opts": [{"L": "A", "ok": true, "html": "A. Machine learning examples include <b>chatbots and automated virtual assistants</b> to automate routine customer service tasks and speed up issue resolution."}, {"L": "B", "ok": false, "html": "B. Machine learning automates the job of building statistical models with Human Intervention."}, {"L": "C", "ok": false, "html": "C. Robotic process automation (RPA) can not be attached with ML."}, {"L": "D", "ok": false, "html": "D. None of the Above."}], "ansL": "A", "ans": "Machine learning examples include chatbots and automated virtual assistants...（聊天機器人是 ML 應用）", "trig": "chatbots and automated virtual assistants 聊天機器人與自動虛擬助理 → ML 的應用實例", "formula": "敘述型題目先刪「絕對語氣」與「方向相反」的選項（can not、with human intervention）"}, {"no": "NO.236", "stem": "Which scenario uses machine learning to unlock business value from <b class=\"kw\">unstructured data</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Recommending new products based on previous purchases"}, {"L": "B", "ok": false, "html": "B. Analyzing tabular records of product defects to predict future maintenance cycles"}, {"L": "C", "ok": false, "html": "C. Monitoring financial transactions to identify potential fraud and risk"}, {"L": "D", "ok": true, "html": "D. Determining customer sentiments from call center <b>voice recordings</b>"}], "ansL": "D", "ans": "Determining customer sentiments from call center voice recordings（從客服錄音判斷情緒）", "trig": "unstructured data 非結構化資料 + voice recordings 語音錄音 → 音檔是非結構化", "formula": "非結構化＝影音圖文（沒有固定欄位）；結構化＝資料庫的列與欄"}, {"no": "NO.264", "stem": "An organization wants a purpose-built AI solution to increase efficiency and provide <b class=\"kw\">personalized interactions</b> for their <b class=\"kw\">customer care team</b>. Which Google Cloud AI solution should they use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Contact Center AI</b>"}, {"L": "B", "ok": false, "html": "B. Cloud Talent Solution"}, {"L": "C", "ok": false, "html": "C. <b>Document AI</b>"}, {"L": "D", "ok": false, "html": "D. <b>Text-to-Speech</b> API"}], "ansL": "A", "ans": "Contact Center AI 客服中心 AI", "trig": "customer care team 客服團隊 + personalized interactions 個人化互動 → CCAI", "formula": "客服對話→CCAI；徵才→Talent Solution；抽文件欄位→Document AI；單一能力（語音／翻譯／視覺）→對應 API"}, {"no": "NO.268", "stem": "An organization is training a machine learning model to predict extreme weather events in their country. How should they collect data to <b class=\"kw\">maximize prediction accuracy</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Collect all weather data evenly across all cities"}, {"L": "B", "ok": false, "html": "B. Collect all weather data primarily from at-risk cities"}, {"L": "C", "ok": false, "html": "C. Collect extreme weather data evenly across all cities"}, {"L": "D", "ok": false, "html": "D. Collect extreme weather data primarily from at-risk cities"}], "ansL": "A", "ans": "Collect all weather data evenly across all cities（均勻收集所有城市的全部天氣資料）", "trig": "maximize prediction accuracy 最大化預測準確度 → 資料要全面且無偏", "formula": "資料收集題選「最完整、最不偏」的那個；只收極端或只收特定族群＝bias（偏誤）"}, {"no": "NO.289", "stem": "An organization has created an application that can diagnose different medical conditions when users submit images of their affected body parts. Which Google Cloud product or service did the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>App Engine</b>"}, {"L": "B", "ok": true, "html": "B. Machine learning"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Logging</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Profiler</b>"}], "ansL": "B", "ans": "Machine learning 機器學習", "trig": "diagnose ... when users submit images 使用者上傳圖片就能診斷 → ML", "formula": "「輸入圖／音／文，輸出判斷結果」的應用一律歸類為 ML"}, {"no": "NO.294", "stem": "Which scenario is a <b class=\"kw\">good use case for machine learning</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Creating customer recommendations"}, {"L": "B", "ok": false, "html": "B. Solving ethical dilemmas"}, {"L": "C", "ok": false, "html": "C. Classifying data with no prior examples"}, {"L": "D", "ok": false, "html": "D. Tasks that require human experience and intuition"}], "ansL": "A", "ans": "Creating customer recommendations（產生顧客推薦）", "trig": "good use case for machine learning 適合 ML 的情境 → 有大量歷史資料可學", "formula": "ML 適合：有大量歷史資料、可重複、有模式可循；不適合：無資料、講價值觀、靠直覺"}, {"no": "NO.303", "stem": "An organization supplies electric car chargers in a nationwide network. They store customer and charging data in <b class=\"kw\">BigQuery</b>. They want to efficiently upgrade and <b class=\"kw\">maintain their network to reduce waste</b> and achieve their sustainability goals. How can Google Cloud services help the organization?", "opts": [{"L": "A", "ok": false, "html": "A. Secure data access by using Identity and Access Management."}, {"L": "B", "ok": false, "html": "B. Move data from <b>BigQuery</b> to <b>Cloud Storage</b> to reduce storage costs."}, {"L": "C", "ok": false, "html": "C. Provide access to third-party developers by creating an API using <b>Apigee</b>."}, {"L": "D", "ok": true, "html": "D. Create a model in BiaQuery to Dredict future maintenance schedules."}], "ansL": "D", "ans": "Create a model in BigQuery to predict future maintenance schedules.（在 BigQuery 建模預測維護排程）", "trig": "store ... data in BigQuery 資料存在 BigQuery + maintain their network to reduce waste 維護網路以減少浪費 → BigQuery 建模預測", "formula": "資料已在 BigQuery＋要預測未來→BigQuery ML；問「雲端如何幫上忙」選會產生預測或洞察的那個"}, {"no": "NO.331", "stem": "An organization wants to use <b class=\"kw\">multiple marketing datasets</b> to <b class=\"kw\">forecast</b> user acquisition. How should they use cloud technology to gain new insights from the data?", "opts": [{"L": "A", "ok": false, "html": "A. Import the datasets into a custom data warehouse, and then <b>archive</b> old data"}, {"L": "B", "ok": false, "html": "B. Import and selectively <b>archive</b> the datasets in a custom data lake"}, {"L": "C", "ok": false, "html": "C. Separate the datasets and make predictions using machine learning"}, {"L": "D", "ok": true, "html": "D. Combine the datasets and make predictions using machine learning"}], "ansL": "D", "ans": "Combine the datasets and make predictions using machine learning（合併資料集後用 ML 預測）", "trig": "multiple marketing datasets 多個行銷資料集 + forecast 預測 → 合併後建模", "formula": "多來源資料題的預設答案是「合併再分析」，不是分開處理或封存"}, {"no": "NO.339", "stem": "An organization wants to use all available data to offer predictive suggestions on their website that <b class=\"kw\">improve over time</b>. Which method should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Data automation"}, {"L": "B", "ok": false, "html": "B. Trends analysis"}, {"L": "C", "ok": true, "html": "C. Machine learning"}, {"L": "D", "ok": false, "html": "D. Multiple regression"}], "ansL": "C", "ans": "Machine learning 機器學習", "trig": "improve over time 隨時間持續改善 → ML", "formula": "題幹出現 improve over time／learn from new data＝ML 的招牌敘述"}, {"no": "NO.358", "stem": "A financial organization has many customers who close their accounts every year. The organization wants to use data and AI to <b class=\"kw\">identify at-risk customers</b>, so they can retain customers by offering discounts and improved services. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Create a survey for all customers to identify their current level of satisfaction."}, {"L": "B", "ok": false, "html": "B. Create a report based on last year&#x27;s customer feedback."}, {"L": "C", "ok": false, "html": "C. Create a dashboard of previous customers that have exited, and look for obvious correlations in the visualization."}, {"L": "D", "ok": true, "html": "D. Create a ML model based on the demographics and activities of <b>previous customers that exited</b>."}], "ansL": "D", "ans": "Create a ML model based on the demographics and activities of previous customers that exited.（用歷史流失客戶建模）", "trig": "identify at-risk customers 找出可能流失的客戶 + previous customers that exited 過去已流失的客戶 → 建 ML 預測模型", "formula": "要「預測誰將來會怎樣」→ML 模型；只要「看過去發生了什麼」→BI 儀表板或報表"}, {"no": "NO.250", "stem": "An organization is building advanced machine learning models in Google Cloud by using <b class=\"kw\">TensorFlow</b>. They want to develop their models faster with <b class=\"kw\">purpose-built hardware</b>. Which solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. CPUs"}, {"L": "B", "ok": false, "html": "B. <b>GPU</b>s"}, {"L": "C", "ok": true, "html": "C. <b>TPU</b>s"}, {"L": "D", "ok": false, "html": "D. DPUs"}], "ansL": "C", "ans": "TPUs（張量處理器）", "trig": "TensorFlow + purpose-built hardware 專門打造的硬體 → TPU", "formula": "題幹同時出現 TensorFlow 與「專用硬體／加速訓練」→TPU"}, {"no": "NO.282", "stem": "An organization wants to use an <b class=\"kw\">open source library</b> with a flexible ecosystem of tools to create and train its own machine learning models Which product or solution should the organization use1?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Functions</b>"}, {"L": "B", "ok": true, "html": "B. <b>TensorFlow</b>"}, {"L": "C", "ok": false, "html": "C. Apache Beam"}, {"L": "D", "ok": false, "html": "D. <b>Dataflow</b>"}], "ansL": "B", "ans": "TensorFlow", "trig": "open source library 開源函式庫 + create and train its own models 訓練自己的模型 → TensorFlow", "formula": "「open source＋自己建模型」→TensorFlow，這是 CDL 題庫的固定答案"}, {"no": "NO.298", "stem": "An organization needs to increase the speed at which they can train machine learning models Which domain- specific hardware is designed for this task?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Preemptible</b> or <b>Spot VM</b>s"}, {"L": "B", "ok": false, "html": "B. Containers"}, {"L": "C", "ok": false, "html": "C. <b>Bare Metal</b> Solution"}, {"L": "D", "ok": true, "html": "D. Cloud <b>TPU</b>s"}], "ansL": "D", "ans": "Cloud TPUs", "trig": "increase the speed ... train 加快訓練速度 + domain-specific hardware 特定領域專用硬體 → Cloud TPU", "formula": "domain-specific hardware 是 TPU 的固定描述詞，看到就選 TPU"}, {"no": "NO.353", "stem": "An organization is searching for an <b class=\"kw\">open-source machine learning platform</b> to build and deploy their own custom machine learning applications <b class=\"kw\">using TPUs</b>. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>TensorFlow</b>"}, {"L": "B", "ok": false, "html": "B. <b>BigQuery ML</b>"}, {"L": "C", "ok": false, "html": "C. <b>Vision API</b>"}, {"L": "D", "ok": false, "html": "D. <b>AutoML</b> Vision"}], "ansL": "A", "ans": "TensorFlow", "trig": "open-source machine learning platform 開源 ML 平台 + using TPUs 使用 TPU → TensorFlow", "formula": "選項中出現 open-source 這個條件時，先刪掉所有 Google 專屬託管服務"}, {"no": "NO.11", "stem": "You are leading projects in an IT services company. Your customer&#x27;s project requires analyzing images. They have many 10s of 1000s of raw images that they have made available to you. Your small technology team needs to build a machine learning model. The <b class=\"kw\">images are unlabeled</b>. You <b class=\"kw\">don&#x27;t have the people or the capacity</b> to label the images. What is your approach?", "opts": [{"L": "A", "ok": false, "html": "A. Look for open-source labeled images that closely resemble the given images."}, {"L": "B", "ok": true, "html": "B. Request data labeling service from Google."}, {"L": "C", "ok": false, "html": "C. Tell the customer it is their duty to label the images."}, {"L": "D", "ok": false, "html": "D. Hire temporary workers who can quickly label the images."}], "ansL": "B", "ans": "Request data labeling service from Google.（申請 Google 資料標記服務）", "trig": "images are unlabeled 圖片未標記 + don&#x27;t have the people or the capacity 沒人力也沒餘裕 → Data Labeling Service", "formula": "「有資料但沒標記、也沒人力標」→Data Labeling Service；標好之後才輪到 AutoML 訓練"}, {"no": "NO.260", "stem": "A cinema company wants to build a model to predict customer visit patterns for the coming year. They have three years of customer visit data across 300 theaters; however, the data has been <b class=\"kw\">stored in different formats</b> by different theaters. They must train the ML model. What should they do?", "opts": [{"L": "A", "ok": false, "html": "A. Choose an ML model type that can process different formats of input data."}, {"L": "B", "ok": true, "html": "B. Transform the data into a consistent format."}, {"L": "C", "ok": false, "html": "C. Use the last year of data so there are fewer inconsistencies for the model to handle."}, {"L": "D", "ok": false, "html": "D. Group different format types and train a different model for each group."}], "ansL": "B", "ans": "Transform the data into a consistent format.（轉成一致的格式）", "trig": "stored in different formats 存成不同格式 → 先統一格式", "formula": "訓練前資料準備順序：統一格式→補齊缺漏→標記→再訓練；不要用「丟掉資料」解決格式問題"}]}, {"name": "網路・維運・成本", "tag": "題數多", "rows": [{"no": "NO.21", "stem": "Your organization stores <b class=\"kw\">highly sensitive data</b> on-premises that <b class=\"kw\">cannot be sent over the public internet</b>. The data must be processed both on-premises and in the cloud. What should your organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Configure <b>Identity-Aware Proxy</b> (<b>IAP</b>) in your Google Cloud <b>VPC</b> network"}, {"L": "B", "ok": false, "html": "B. Create a <b>Cloud VPN</b> tunnel between Google Cloud and your data center"}, {"L": "C", "ok": true, "html": "C. Order a <b>Partner Interconnect</b> connection with your network provider"}, {"L": "D", "ok": false, "html": "D. Enable Private Google Access in your Google Cloud <b>VPC</b> network"}], "ansL": "C", "ans": "Order a Partner Interconnect connection with your network provider 向網路供應商申請 Partner Interconnect", "trig": "highly sensitive data 高度機密資料 + cannot be sent over the public internet 不可走公共網際網路 → 專線 Interconnect", "formula": "不可走公網／要 SLA 保障→Interconnect（Dedicated 直連 Google／Partner 經電信商）；可走公網加密、要快上線→Cloud VPN"}, {"no": "NO.44", "stem": "Your organization recently migrated its compute workloads to Google Cloud. You want these workloads in Google Cloud to <b class=\"kw\">privately and securely</b> access your large volume of on-premises data, and you also want to <b class=\"kw\">minimize latency</b>. What should your organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Use <b>Storage Transfer Service</b> to securely make your data available to Google Cloud"}, {"L": "B", "ok": false, "html": "B. Create a <b>VPC</b> between your on-premises data center and your Google resources"}, {"L": "C", "ok": true, "html": "C. Peer your on-premises data center to Google&#x27;s Edge Network"}, {"L": "D", "ok": false, "html": "D. Use <b>Transfer Appliance</b> to securely make your data available to Google Cloud"}], "ansL": "C", "ans": "Peer your on-premises data center to Google&#x27;s Edge Network 將機房與 Google 邊緣網路對接（Direct Peering）", "trig": "privately and securely 私密且安全 + minimize latency 降到最低延遲 → 直接對接 Google 網路", "formula": "只連 Google 服務、不進 VPC→Direct Peering；要進 VPC 且要 SLA→Cloud Interconnect；搬一次性大資料→Transfer Appliance"}, {"no": "NO.57", "stem": "Your organization needs to establish private network connectivity between its on-premises network and its workloads running in Google Cloud. You need to be able to set up the connection <b class=\"kw\">as soon as possible</b>. Which Google Cloud product or feature should you use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Interconnect</b>"}, {"L": "B", "ok": false, "html": "B. <b>Direct Peering</b>"}, {"L": "C", "ok": true, "html": "C. <b>Cloud VPN</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud CDN</b>"}], "ansL": "C", "ans": "Cloud VPN 雲端 VPN", "trig": "as soon as possible 越快越好 → Cloud VPN", "formula": "看「時間急不急」：要馬上通→Cloud VPN；要高頻寬＋SLA、可等→Interconnect"}, {"no": "NO.125", "stem": "You have contracted a partner to conduct some medical trials. This is a <b class=\"kw\">limited</b>, 2-<b class=\"kw\">month contract</b>. At the end of each day, you are expecting about 10 Gbs of data. The data is highly sensitive. What networking option would you employ?", "opts": [{"L": "A", "ok": false, "html": "A. As the name indicates, set up <b>Partner Interconnect</b> with your partner company."}, {"L": "B", "ok": false, "html": "B. Setup <b>Dedicated Interconnect</b> with your partner."}, {"L": "C", "ok": true, "html": "C. Setup <b>Cloud VPN</b> and create an IPsec VPN tunnel with your partner."}, {"L": "D", "ok": false, "html": "D. Create a public IP for a VM and share that with your partners so that they can access it over the internet and share the data."}], "ansL": "C", "ans": "Setup Cloud VPN and create an IPsec VPN tunnel with your partner. 建立 Cloud VPN 的 IPsec 加密通道", "trig": "limited, 2-month contract 只有 2 個月的短約 + 10 Gbs per day 每日 10 Gb → 量小期短用 VPN", "formula": "短期＋資料量不大→Cloud VPN；長期＋高頻寬＋要 SLA→Interconnect（注意 Partner 指的是電信商不是你的合作對象）"}, {"no": "NO.30", "stem": "Your organization runs all its workloads on Compute Engine virtual machine instances. Your organization has a security requirement: the virtual machines are <b class=\"kw\">not allowed to access the public internet</b>. The workloads running on those virtual machines <b class=\"kw\">need to access BigQuery and Cloud Storage</b>, using their publicly accessible interfaces, without violating the security requirement. Which <b class=\"kw\">Google</b> Cloud product or feature should your organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Identity-Aware Proxy</b>"}, {"L": "B", "ok": false, "html": "B. Cloud NAT (network address tran<b>sla</b>tion)"}, {"L": "C", "ok": false, "html": "C. <b>VPC</b> internal <b>load balancer</b>s"}, {"L": "D", "ok": true, "html": "D. Private <b>Google</b> Access"}], "ansL": "D", "ans": "Private Google Access 私有 Google 存取", "trig": "not allowed to access the public internet 不可連公網 + need to access BigQuery and Cloud Storage 卻要用 Google 服務 → Private Google Access", "formula": "VM 沒外部 IP 卻要連 Google 服務→Private Google Access；VM 要連外部網際網路（下載更新等）→Cloud NAT"}, {"no": "NO.90", "stem": "What <b class=\"kw\">conditions be true</b> if a VM interface wants to send packets to the external IP addresses of Google APIs and services using <b class=\"kw\">Private Google Access</b>?", "opts": [{"L": "A", "ok": true, "html": "A. VM interface does not have an external IP address assigned."}, {"L": "B", "ok": false, "html": "B. VM interface is connected to a subnet where Private Google Access is disabled"}, {"L": "C", "ok": false, "html": "C. Both A and B"}, {"L": "D", "ok": false, "html": "D. None of the Above."}], "ansL": "A", "ans": "VM interface does not have an external IP address assigned. VM 網路介面沒有被指派外部 IP", "trig": "conditions be true 必須成立的條件 + Private Google Access → 無外部 IP", "formula": "Private Google Access 兩前提：VM 無外部 IP＋子網路已啟用該功能，兩者缺一不可"}, {"no": "NO.91", "stem": "What are the <b class=\"kw\">network requirements</b> for Private Google Access?", "opts": [{"L": "A", "ok": false, "html": "A. Private Google Access automatically enables any API."}, {"L": "B", "ok": true, "html": "B. Your network must have appropriate routes for the destination IP ranges used by Google APIs and services."}, {"L": "C", "ok": false, "html": "C. Both A and B"}, {"L": "D", "ok": false, "html": "D. None of the Above"}], "ansL": "B", "ans": "Your network must have appropriate routes for the destination IP ranges used by Google APIs and services. 網路須有連往 Google API 目的 IP 範圍的正確路由", "trig": "network requirements 網路面的必要條件 → 路由設定", "formula": "Private Google Access 是「網路路徑」層的設定，不管 API 啟用與否；API 要另外在專案裡啟用"}, {"no": "NO.153", "stem": "One of your customers used to have a private data center. While within their data center itself, they were consuming some Google services via API calls and other <b class=\"kw\">public</b>, <b class=\"kw\">well-known addresses</b> published by Google. Now they&#x27;re evacuating their private data center and are moving to Google Cloud. Could they improve some of their existing architecture with respect to security?", "opts": [{"L": "A", "ok": false, "html": "A. Use <b>VPC Peering</b> with the Google Cloud <b>organization</b> so that you can directly use services using only private IPs."}, {"L": "B", "ok": false, "html": "B. Use private addresses only. No additional configuration is required. All Google services will be accessible within Google Cloud on private addresses."}, {"L": "C", "ok": false, "html": "C. Use <b>Shared VPC</b>s with the Google Cloud <b>organization</b> so that you can directly use services using only private IPs."}, {"L": "D", "ok": true, "html": "D. Enable Private Google Access so that they can remove <b>public</b> IP addresses."}], "ansL": "D", "ans": "Enable Private Google Access so that they can remove public IP addresses. 啟用 Private Google Access 以移除公開 IP", "trig": "improve... with respect to security 從安全面改善 + public, well-known addresses 原本走公開位址 → 改走私有路徑", "formula": "題目出現「拿掉 public IP 但仍要用 Google 服務」→ 一律 Private Google Access"}, {"no": "NO.88", "stem": "A partner of yours used to have their own private data center. Your company was already on Google Cloud and now they have also moved to Google Cloud. You are investigating whether there are ways to collaborate better or shared services. What would be one good option to consider?", "opts": [{"L": "A", "ok": false, "html": "A. Use Private Service Access within Google Cloud."}, {"L": "B", "ok": true, "html": "B. Use <b>VPC Peering</b> to <b>share resources privately</b> between your <b>two organizations</b>."}, {"L": "C", "ok": false, "html": "C. Use public IP addresses as before. It will automatically be routed internally only."}, {"L": "D", "ok": false, "html": "D. Use <b>VPC</b> Shared Networks to share common resources."}], "ansL": "B", "ans": "Use VPC Peering to share resources privately between your two organizations. 用 VPC Peering 在兩個組織間私密共用資源", "trig": "two organizations 兩個不同組織 + share resources privately 私密共用 → VPC Peering", "formula": "跨組織／跨專案互連→VPC Peering；同一組織內多專案共用同一張網路→Shared VPC"}, {"no": "NO.130", "stem": "You are working with a user to set up an application in a new VPC behind a firewall and it is noticed that the user is concerned about data egress. Therefore, to provide assistance you want to configure the <b class=\"kw\">fewest open egress ports</b>. Which of the following statement is correct?", "opts": [{"L": "A", "ok": false, "html": "A. Set up a high-priority (1000) rule that blocks all egress and a low-priority (65534) rule that allows only the appropriate ports."}, {"L": "B", "ok": true, "html": "B. Set up a low-<b>priority</b> (65534) rule that blocks all egress and a high-priority rule (1000) that allows only the appropriate ports."}, {"L": "C", "ok": false, "html": "C. Set up a high-priority (1000) rule to allow the appropriate ports."}, {"L": "D", "ok": false, "html": "D. Set up a high-priority (1000) rule that pairs both ingress and egress ports."}], "ansL": "B", "ans": "Set up a low-priority (65534) rule that blocks all egress and a high-priority rule (1000) that allows only the appropriate ports. 低優先序封鎖全部、高優先序只放行必要通訊埠", "trig": "fewest open egress ports 開最少的對外通訊埠 + priority 優先序（數字越小越優先）", "formula": "防火牆最小開放原則＝低優先（大數字）deny all＋高優先（小數字）allow 指定埠"}, {"no": "NO.205", "stem": "What <b class=\"kw\">load balancer type</b> is supported with <b class=\"kw\">Cloud Armor security policies</b>?", "opts": [{"L": "A", "ok": false, "html": "A. SSL Proxy, HTTP(S) and SSL"}, {"L": "B", "ok": false, "html": "B. HTTP(S) and SSL"}, {"L": "C", "ok": false, "html": "C. Regional SSL"}, {"L": "D", "ok": true, "html": "D. HTTP(S) Only"}], "ansL": "D", "ans": "HTTP(S) Only 僅支援 HTTP(S) 負載平衡器", "trig": "Cloud Armor security policies 安全政策 + load balancer type 負載平衡器類型", "formula": "Cloud Armor＝擋 DDoS 與網頁攻擊（第 7 層），搭全球外部 HTTP(S) 負載平衡器使用"}, {"no": "NO.357", "stem": "An organization needs protection against <b class=\"kw\">distributed denial-of-service</b> (DDoS) <b class=\"kw\">attacks</b>. Which Google Cloud service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Build"}, {"L": "B", "ok": true, "html": "B. Google <b>Cloud Armor</b>"}, {"L": "C", "ok": false, "html": "C. <b>Security Command Center</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud VPN</b>"}], "ansL": "B", "ans": "Google Cloud Armor 雲端防護", "trig": "distributed denial-of-service (DDoS) attacks 分散式阻斷服務攻擊 → Cloud Armor", "formula": "DDoS／WAF 網頁攻擊→Cloud Armor；風險盤點與弱點掃描→Security Command Center"}, {"no": "NO.361", "stem": "An organization wants to <b class=\"kw\">control what types of network traffic</b> are allowed to <b class=\"kw\">enter and leave</b> its network and access its applications. Which security measure should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Encryption keys"}, {"L": "B", "ok": false, "html": "B. 2-Step Verification"}, {"L": "C", "ok": true, "html": "C. Firewall rules"}, {"L": "D", "ok": false, "html": "D. Privileged access"}], "ansL": "C", "ans": "Firewall rules 防火牆規則", "trig": "control what types of network traffic 控制哪些網路流量 + enter and leave 進出 → 防火牆規則", "formula": "題幹出現 enter and leave the network 進出網路→Firewall rules；出現身分驗證→IAM／2SV"}, {"no": "NO.404", "stem": "An organization is hosting an application in Europe, and <b class=\"kw\">customers in Asia</b> are reporting slow response times <b class=\"kw\">despite their fast internet</b> connection. What is the problem?", "opts": [{"L": "A", "ok": false, "html": "A. Misconfigured application servers"}, {"L": "B", "ok": true, "html": "B. Network latency"}, {"L": "C", "ok": false, "html": "C. Not enough application servers"}, {"L": "D", "ok": false, "html": "D. Network bandwidth"}], "ansL": "B", "ans": "Network latency 網路延遲", "trig": "hosting in Europe 主機在歐洲 + customers in Asia 客戶在亞洲 + despite their fast internet 網速本身很快 → 距離造成延遲", "formula": "使用者與服務所在地遙遠而慢→latency 延遲；同一地區但尖峰慢→頻寬或容量不足"}, {"no": "NO.409", "stem": "Customers are reporting <b class=\"kw\">very high latencies</b> when accessing an application from the United States. The application is currently running in a <b class=\"kw\">single region in Europe</b>. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Set up a new billing account in the United States."}, {"L": "B", "ok": false, "html": "B. Run the application in additional regions in Europe."}, {"L": "C", "ok": false, "html": "C. Run the application in additional zones in the European region."}, {"L": "D", "ok": true, "html": "D. Run a replica of the application in a region in the United States."}], "ansL": "D", "ans": "Run a replica of the application in a region in the United States. 在美國的區域部署一份應用程式複本", "trig": "very high latencies 極高延遲 + single region in Europe 只在歐洲單一區域 → 到使用者附近開複本", "formula": "跨洲延遲高→在使用者所在 region 建複本；同區容錯→跨多個 zone 部署"}, {"no": "NO.149", "stem": "If you <b class=\"kw\">increase the size of a subnet</b> in a custom VPC network, the IP addresses of virtual machines already on that subnet <b class=\"kw\">might be affected</b>. Which options are Correct.", "opts": [{"L": "A", "ok": true, "html": "A. False"}, {"L": "B", "ok": false, "html": "B. None of the above"}, {"L": "C", "ok": false, "html": "C. True"}, {"L": "D", "ok": false, "html": "D. Not Defined by Google Cloud Platform"}], "ansL": "A", "ans": "False 錯（IP 不會受影響）", "trig": "increase the size of a subnet 擴大子網路範圍 + might be affected 是否受影響 → 不受影響", "formula": "子網路只能「擴大」不能縮小，擴大不影響既有 VM 的 IP；要記「擴容安全、縮容不允許」"}, {"no": "NO.10", "stem": "Your organization is on a critical path with recently developed applications. They are going into production in a month. A few million users are expected to use the new application. They want to ensure <b class=\"kw\">minimum disruption</b> when the application goes live. Any issues have to be <b class=\"kw\">dealt with within minutes</b> and resolved as quickly as possible. Which Support package should they take?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Enhanced Support</b>"}, {"L": "B", "ok": false, "html": "B. <b>Standard Support</b>"}, {"L": "C", "ok": false, "html": "C. <b>Basic Support</b>"}, {"L": "D", "ok": true, "html": "D. <b>Premium Support</b>"}], "ansL": "D", "ans": "Premium Support 頂級支援", "trig": "dealt with within minutes 幾分鐘內就要處理 + minimum disruption 中斷降到最低 → Premium", "formula": "支援等級由低到高＝Basic→Standard→Enhanced→Premium；要「分鐘級回應＋專屬 TAM」只有 Premium"}, {"no": "NO.14", "stem": "Your organization is releasing its first publicly available application in Google Cloud. The application is critical to your business and customers and requires a 2-hour SL", "opts": [{"L": "A", "ok": false, "html": "A. Enroll in <b>Premium Support</b>"}, {"L": "B", "ok": true, "html": "B. Enroll in <b>Enhanced Support</b>"}, {"L": "C", "ok": false, "html": "C. Enroll in <b>Standard Support</b>"}, {"L": "D", "ok": false, "html": "D. Enroll in <b>Basic Support</b>"}], "ansL": "B", "ans": "Enroll in Enhanced Support 加入進階支援", "trig": "2-hour SLA 兩小時回應 + minimize costs 成本最低 → Enhanced（剛好夠用又較便宜）", "formula": "支援題兩步驟：先看「要求多快回應」淘汰不夠的，再看「要省錢」選剛好夠用的那一階"}, {"no": "NO.119", "stem": "You are looking for a <b class=\"kw\">one stop reference page for GCP support</b>. What Page would you select?", "opts": [{"L": "A", "ok": false, "html": "A. Compliance Hub"}, {"L": "B", "ok": false, "html": "B. Google Cloud Platform Status"}, {"L": "C", "ok": true, "html": "C. Support Hub"}, {"L": "D", "ok": false, "html": "D. Pricing Page"}], "ansL": "C", "ans": "Support Hub 支援中心", "trig": "one stop reference page for GCP support 支援資訊的一站式頁面 → Support Hub", "formula": "查支援資源→Support Hub；查服務是否掛掉→Cloud Status Dashboard；查合規文件→Compliance Reports Manager"}, {"no": "NO.124", "stem": "Which of the following are the <b class=\"kw\">current options for paid support</b> in GCP? (Select Three Answer)", "opts": [{"L": "A", "ok": false, "html": "A. Premier"}, {"L": "B", "ok": true, "html": "B. Standard"}, {"L": "C", "ok": true, "html": "C. Enhanced"}, {"L": "D", "ok": false, "html": "D. Role"}, {"L": "E", "ok": true, "html": "E. Premium"}], "ansL": "B + C + E", "ans": "B + C + E. Standard／Enhanced／Premium 標準／進階／頂級（三個付費方案）", "trig": "current options for paid support 目前的付費支援方案 → 三選（複選題）", "formula": "Basic 免費（人人都有）＋付費三階 Standard／Enhanced／Premium；看到 Premier 就是陷阱字"}, {"no": "NO.263", "stem": "An organization is running critical workloads in production and requires a Google Cloud support service with <b class=\"kw\">fast response times</b> and a <b class=\"kw\">dedicated Technical Account Manager</b>. Which customer care service level should the organization choose?", "opts": [{"L": "A", "ok": true, "html": "A. Premium"}, {"L": "B", "ok": false, "html": "B. Standard"}, {"L": "C", "ok": false, "html": "C. Enhanced"}, {"L": "D", "ok": false, "html": "D. Basic"}], "ansL": "A", "ans": "Premium 頂級", "trig": "fast response times 快速回應 + dedicated Technical Account Manager 專屬技術客戶經理 → Premium", "formula": "題幹一出現 dedicated TAM 專屬技術客戶經理→直接選 Premium，不必再比其他條件"}, {"no": "NO.144", "stem": "Which of these are defined by the following statement: a contract you have with your end customers, which, if you don&#x27;t meet, you might even have to <b class=\"kw\">pay fines</b>?", "opts": [{"L": "A", "ok": true, "html": "A. <b>SLA</b> - Service Level Agreement"}, {"L": "B", "ok": false, "html": "B. SLC - Service Level Contract"}, {"L": "C", "ok": false, "html": "C. <b>SLO</b> - Service Level Objective"}, {"L": "D", "ok": false, "html": "D. <b>SLI</b> - Service Level Indicator"}], "ansL": "A", "ans": "SLA - Service Level Agreement 服務等級協議", "trig": "contract with your end customers 與客戶的合約 + pay fines 未達成要賠錢 → SLA", "formula": "SLI＝實際量到的數字；SLO＝自己訂的內部目標（通常比 SLA 嚴格）；SLA＝對客戶的合約，違約賠錢"}, {"no": "NO.146", "stem": "You&#x27;re negotiating SLAs with a customer. You have communicated that there will be a 99.99% (four 9s) availability for the service you are providing. Every aspect of the service is under your control. They want to <b class=\"kw\">modify the reliability to 99.999</b>% (five 9s). What do you tell them? (Choose two answer)", "opts": [{"L": "A", "ok": true, "html": "A. Yes, that could be possible. If yes, there will be a significantly higher charge because the effort is significantly higher too."}, {"L": "B", "ok": false, "html": "B. Yes, that is possible, but there will be an additional charge of 9% for the service because that is the additional effort required."}, {"L": "C", "ok": false, "html": "C. Yes, that is possible. There is hardly any difference to provide another 0.009% availability."}, {"L": "D", "ok": true, "html": "D. Ask them for the reasonable downtime they are willing to absorb. If it is more than 60 minutes in an entire year, explain how the current <b>SLA</b> meets that requirement."}], "ansL": "A + D", "ans": "A + D. 可行但費用大幅增加／先問客戶能接受多少停機時間", "trig": "modify the reliability to 99.999% 提高到五個 9 → 成本大增，且要回頭確認實際需求", "formula": "可用度換算停機：99.9%≈8.8 小時/年、99.99%≈52 分鐘/年、99.999%≈5 分鐘/年；每加一個 9 成本非線性暴增"}, {"no": "NO.167", "stem": "Your company has signed up with a cloud provider and you will be using storage and virtual machines with the provider. The provider has provided your organization some expectations for what the service should perform at. What type of agreement provides a <b class=\"kw\">guarantee of a certain level of service such as</b> &quot;<b class=\"kw\">Uptime</b>&quot;?", "opts": [{"L": "A", "ok": false, "html": "A. Performance Agreement"}, {"L": "B", "ok": false, "html": "B. Interconnection Agreement"}, {"L": "C", "ok": false, "html": "C. Warranty"}, {"L": "D", "ok": true, "html": "D. Service Level Agreement"}], "ansL": "D", "ans": "Service Level Agreement 服務等級協議", "trig": "guarantee of a certain level of service such as &quot;Uptime&quot; 對正常運行時間的保證 → SLA", "formula": "看到 guarantee 保證＋uptime 正常運行時間→SLA；看到 internal target 內部目標→SLO"}, {"no": "NO.232", "stem": "What is the Site Reliability Engineering (SRE) term for an organizations <b class=\"kw\">desired level of reliability</b> and performance?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Enhanced support</b>"}, {"L": "B", "ok": false, "html": "B. Scalable infrastructure"}, {"L": "C", "ok": false, "html": "C. Service-level indicator"}, {"L": "D", "ok": true, "html": "D. Service-level objective"}], "ansL": "D", "ans": "Service-level objective 服務等級目標", "trig": "desired level of reliability 期望達到的可靠度 → objective 目標", "formula": "desired／target 期望目標→SLO；measured 量測值→SLI；contract 合約→SLA"}, {"no": "NO.259", "stem": "How is <b class=\"kw\">service availability measured</b> in the context of cloud technology?", "opts": [{"L": "A", "ok": false, "html": "A. Number of available regions"}, {"L": "B", "ok": true, "html": "B. Percentage of uptime"}, {"L": "C", "ok": false, "html": "C. Speed of response time"}, {"L": "D", "ok": false, "html": "D. Number of downtime incidents"}], "ansL": "B", "ans": "Percentage of uptime 正常運行時間百分比", "trig": "service availability measured 可用性如何衡量 → 用正常運行時間百分比", "formula": "可用度一律以「正常運行時間百分比」表示（99.9% 這種寫法），不是用次數或速度"}, {"no": "NO.283", "stem": "An organization&#x27;s public cloud provider <b class=\"kw\">failed to meet their SLA</b> of 99.99% availability. What is the potential impact on the organization?", "opts": [{"L": "A", "ok": false, "html": "A. The <b>organization</b> risks using up their <b>error budget</b>."}, {"L": "B", "ok": false, "html": "B. Renegotiation of the <b>SLA</b> to put less emphasis on uptime could be necessary."}, {"L": "C", "ok": true, "html": "C. Unexpected downtime could risk the loss of customers."}, {"L": "D", "ok": false, "html": "D. All data stored in their database could be unexpectedly lost."}], "ansL": "C", "ans": "Unexpected downtime could risk the loss of customers. 非預期停機可能導致客戶流失", "trig": "failed to meet their SLA 供應商未達成 SLA → 對組織的實際衝擊是停機、客戶流失", "formula": "SLA 沒達成的後果＝賠償金＋業務衝擊（客戶流失）；error budget 錯誤預算是自己內部 SLO 的餘裕，兩件事別混"}, {"no": "NO.311", "stem": "Within Google&#x27;s Site Reliability Engineering framework, which concept <b class=\"kw\">measures how well a system is performing</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Service-level objective"}, {"L": "B", "ok": false, "html": "B. Service-level agreement"}, {"L": "C", "ok": true, "html": "C. Service-level indicator"}, {"L": "D", "ok": false, "html": "D. <b>Error reporting</b>"}], "ansL": "C", "ans": "Service-level indicator 服務等級指標", "trig": "measures how well a system is performing 衡量系統實際表現得多好 → SLI", "formula": "記三層：量到什麼＝SLI → 想達到什麼＝SLO → 對客戶承諾什麼＝SLA"}, {"no": "NO.341", "stem": "A cloud-native organization is not meeting their service level objective (SLO) but has not exhausted their error budget. What should the organization prioritize?", "opts": [{"L": "A", "ok": false, "html": "A. Innovation to improve user experience"}, {"L": "B", "ok": false, "html": "B. Hardware reliability to improve availability"}, {"L": "C", "ok": true, "html": "C. Stability to avoid prolonged user downtime"}, {"L": "D", "ok": false, "html": "D. Speed to release new features"}], "ansL": "C", "ans": "Stability to avoid prolonged user downtime 優先追求穩定性，避免長時間停機", "trig": "not meeting their SLO 未達成 SLO → 先顧穩定，暫緩衝新功能", "formula": "SLO 沒達成→凍結新功能、先修穩定性；SLO 達標且錯誤預算還有餘→可以放膽發版創新"}, {"no": "NO.413", "stem": "An organization meets their service level objective (SLO) of 99.999% (&quot;<b class=\"kw\">five nines</b>&quot;). How much downtime do their end users experience <b class=\"kw\">per year</b>?", "opts": [{"L": "A", "ok": true, "html": "A. 5 minutes"}, {"L": "B", "ok": false, "html": "B. 500 minutes"}, {"L": "C", "ok": false, "html": "C. 5 hours"}, {"L": "D", "ok": false, "html": "D. 5 days"}], "ansL": "A", "ans": "5 minutes 約 5 分鐘", "trig": "99.999% (&quot;five nines&quot;) 五個 9 + per year 每年 → 約 5 分鐘", "formula": "背停機表：99%≈3.65 天／99.9%≈8.8 小時／99.99%≈52 分鐘／99.999%≈5 分鐘（每多一個 9 除以 10）"}, {"no": "NO.78", "stem": "Your organization runs an application on Google Cloud. Currently, software builds, tests, and regular deployments are done manually, but you want to reduce work for the team. Your organization wants to use Google Cloud managed solutions to automate your build, testing, and deployment process. A startup is planning to create their entire suite of applications on Google Cloud. They are looking at various
