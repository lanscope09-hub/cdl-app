 would they benefit from leveraging cloud technology?", "opts": [{"L": "A", "ok": false, "html": "A. They can expect 100% service availability."}, {"L": "B", "ok": false, "html": "B. They can avoid the limitations of <b>serverless</b> computing."}, {"L": "C", "ok": true, "html": "C. They can have new tools to innovate and optimize resource usage."}, {"L": "D", "ok": false, "html": "D. They can optimize maintenance for their on-premises infrastructure."}], "ansL": "C", "ans": "They can have new tools to innovate and optimize resource usage. 能取得新工具來創新並優化資源使用", "trig": "frustrated by the limitations 受夠了地端限制 → 要的是更多工具與彈性", "formula": "選項出現 100% availability 百分之百可用 → 一律是錯的（雲端只承諾 SLA 幾個 9）。痛點是「被限制」→ 選帶 innovate 創新、new tools 新工具 的選項。"}, {"no": "NO.269", "stem": "An organization wants to develop an application that can be personalized to user preferences throughout the year. Why should they build a <b class=\"kw\">cloud-native</b> application instead of modernizing their existing on-premises application?", "opts": [{"L": "A", "ok": false, "html": "A. Developers can rely on the cloud provider for all source code"}, {"L": "B", "ok": true, "html": "B. Developers can launch new features in an agile way"}, {"L": "C", "ok": false, "html": "C. IT managers can migrate existing application architecture without needing updates"}, {"L": "D", "ok": false, "html": "D. IT managers can accelerate capital expenditure planning"}], "ansL": "B", "ans": "Developers can launch new features in an agile way 開發者能以敏捷方式推出新功能", "trig": "cloud-native 雲端原生 + personalized throughout the year 全年持續個人化 → 需要一直快速改版", "formula": "cloud-native 雲端原生 對比 modernize existing 改造既有 → 前者答案永遠往「更快推新功能／更快迭代」靠；看到 capital expenditure 資本支出 出現在「上雲好處」裡就是錯的。"}, {"no": "NO.319", "stem": "An organization wants to move from a <b class=\"kw\">tactical</b> cloud adoption approach to a transformational approach. How should they adapt the way they lead the organization?", "opts": [{"L": "A", "ok": true, "html": "A. Increase top-down visibility and foster a culture of blamelessness"}, {"L": "B", "ok": false, "html": "B. Shift from an operational expenditure model to capital expenditure"}, {"L": "C", "ok": false, "html": "C. Drive cloud adoption with an individual contributor focus"}, {"L": "D", "ok": false, "html": "D. Invest in on-premises infrastructure to redesign relationships between IT and employees"}], "ansL": "A", "ans": "Increase top-down visibility and foster a culture of blamelessness 提升由上而下的透明度並培養無責備文化", "trig": "tactical → transformational 從戰術層級走向轉型層級 → 領導方式要改成透明＋不追責", "formula": "雲端成熟度四階：tactical 戰術 → strategic 策略 → transformational 轉型。要往上一級 → 選帶 culture 文化、blameless 無責備、visibility 透明、programmatic 自動化 的選項。"}, {"no": "NO.325", "stem": "An organization is making a strategic change to customer support in response to feedback. They plan to extend their helpline availability hours. Why is the organization making this change?", "opts": [{"L": "A", "ok": false, "html": "A. Users expect professional expertise"}, {"L": "B", "ok": false, "html": "B. Users require personalization"}, {"L": "C", "ok": true, "html": "C. Users expect always-on services"}, {"L": "D", "ok": false, "html": "D. Users require regional access"}], "ansL": "C", "ans": "Users expect always-on services 使用者期待全天候不打烊的服務", "trig": "extend helpline availability hours 延長客服專線時段 → 對應「隨時都要能用」", "formula": "動機題只看題幹的關鍵動作對應到哪個「客戶期待」：延長時間→always-on；依喜好推薦→personalization；多國多地→regional access；更快上線→faster time to market。"}, {"no": "NO.328", "stem": "An organization&#x27;s web developers and operations personnel use different systems. How will <b class=\"kw\">increasing communication</b> between the teams reduce issues caused by <b class=\"kw\">silos</b>?", "opts": [{"L": "A", "ok": false, "html": "A. By assigning blame for failures and establishing consequences"}, {"L": "B", "ok": false, "html": "B. By combining job role responsibilities to ensure that everyone has shared access"}, {"L": "C", "ok": false, "html": "C. By increasing data encryption to strengthen workflows"}, {"L": "D", "ok": true, "html": "D. By emphasizing shared ownership of business outcomes"}], "ansL": "D", "ans": "By emphasizing shared ownership of business outcomes 強調共同承擔商業成果", "trig": "silos 穀倉／本位主義 + increasing communication 增加溝通 → 共同承擔成果", "formula": "silos 孤島題 → 選 shared goals 共同目標／shared ownership 共同當責；看到 blame 責備、懲處、或「所有人共用同一組權限」都是錯的。"}, {"no": "NO.338", "stem": "An organization is using new technologies to change its business processes and culture to develop new customer experiences and <b class=\"kw\">adapt to market dynamics</b>. What is the name of this approach?", "opts": [{"L": "A", "ok": true, "html": "A. Digital transformation"}, {"L": "B", "ok": false, "html": "B. Operations optimization"}, {"L": "C", "ok": false, "html": "C. Data center migration"}, {"L": "D", "ok": false, "html": "D. User personalization"}], "ansL": "A", "ans": "Digital transformation 數位轉型", "trig": "change business processes and culture 改變流程與文化 + adapt to market dynamics 適應市場變化 → 這就是數位轉型的定義", "formula": "選項同時出現 transformation 轉型 與 optimization 優化 時：題幹有提到 culture 文化、business model 商業模式 → 選 transformation；只提到流程更有效率 → 選 optimization。"}, {"no": "NO.354", "stem": "An organization has decided to modernize their applications in the cloud to keep up with their customers&#x27; needs. What may have prompted this business decision?", "opts": [{"L": "A", "ok": false, "html": "A. Their on-premises applications only autoscale to meet demand."}, {"L": "B", "ok": false, "html": "B. They want to change from a pay-as-you-go model to a capital expenditure model."}, {"L": "C", "ok": false, "html": "C. Their source code changes erroneously without developer interaction."}, {"L": "D", "ok": true, "html": "D. Their on-premises applications take months to update and deploy."}], "ansL": "D", "ans": "Their on-premises applications take months to update and deploy. 地端應用更新部署要花好幾個月", "trig": "keep up with customers&#x27; needs 跟上客戶需求 → 痛點必定是「太慢」", "formula": "「什麼促成現代化決定」→ 答案幾乎都是「舊做法太慢／太貴／太僵化」；出現 pay-as-you-go 改成 capital expenditure 的選項一律錯。"}, {"no": "NO.365", "stem": "What does the shift toward cloud computing represent for an organization&#x27;s <b class=\"kw\">transformation</b>?", "opts": [{"L": "A", "ok": false, "html": "A. An opportunity that is only relevant to the IT department"}, {"L": "B", "ok": false, "html": "B. An opportunity to continue business as usual with new cost savings"}, {"L": "C", "ok": true, "html": "C. An opportunity to redefine existing business processes and services"}, {"L": "D", "ok": false, "html": "D. An opportunity that is limited to large enterprises"}], "ansL": "C", "ans": "An opportunity to redefine existing business processes and services 重新定義既有商業流程與服務的機會", "trig": "transformation 轉型 → 不只省錢、不只 IT 部門的事", "formula": "只要選項中有「只是省錢」「只有 IT 部門」「只有大公司」這種把範圍縮小的敘述 → 一律淘汰；轉型題選最大格局的那個。"}, {"no": "NO.378", "stem": "An organization delivers a proactive healthcare service. They want to <b class=\"kw\">efficiently and automatically</b> collect patient data. What should the organization encourage the patients to do?", "opts": [{"L": "A", "ok": false, "html": "A. Use at-home health screening devices and then upload their health data daily"}, {"L": "B", "ok": true, "html": "B. Wear Internet of Things (IoT) devices that upload their health data in real time"}, {"L": "C", "ok": false, "html": "C. Self-assess their health data and then document and upload it in real time"}, {"L": "D", "ok": false, "html": "D. Visit a nurse who will use Internet of Things (IoT) devices to collect and upload their health data"}], "ansL": "B", "ans": "Wear Internet of Things (IoT) devices that upload their health data in real time 配戴 IoT 裝置即時上傳健康資料", "trig": "efficiently and automatically 有效率且自動 → 排除所有需要人動手的選項", "formula": "題幹有 automatically 自動 → 淘汰所有含 manually 手動、self-assess 自評、visit 親自前往 的選項；剩下帶 IoT／sensor 感測器／real-time 的就是答案。"}, {"no": "NO.389", "stem": "An organization is <b class=\"kw\">struggling to meet user demand for change</b> and wants to modernize their legacy applications by moving the applications to the cloud. Why would this help the organization satisfy user expectations?", "opts": [{"L": "A", "ok": false, "html": "A. Toil automation helps make automatic updates"}, {"L": "B", "ok": true, "html": "B. Updates can be pushed out more quickly to repair bugs"}, {"L": "C", "ok": false, "html": "C. Customer data can be used to offer tailored content"}, {"L": "D", "ok": false, "html": "D. DevOps requires that industry trends be measured and tracked"}], "ansL": "B", "ans": "Updates can be pushed out more quickly to repair bugs 更新能更快推出以修復問題", "trig": "struggling to meet user demand for change 跟不上使用者的改版需求 → 需要更快出更新", "formula": "先鎖定題幹的痛點名詞（demand for change 改版需求）→ 選項裡描述「解掉這個痛點」的那個才是答案，其他即使敘述正確也是干擾。"}, {"no": "NO.28", "stem": "An organization currently stores its data on-premises and they receive different levels of traffic on their website every month. How could the organization benefit from modernizing their infrastructure with cloud technology?", "opts": [{"L": "A", "ok": false, "html": "A. They can rely on the cloud provider for all website source code."}, {"L": "B", "ok": true, "html": "B. Agile storage scalability."}, {"L": "C", "ok": false, "html": "C. 100% service availability."}, {"L": "D", "ok": false, "html": "D. They can shift from heavy operational expenditure to a capital expenditure model."}], "ansL": "B", "ans": "Agile storage scalability. 儲存空間可彈性擴展", "trig": "different levels of traffic every month 每月流量高低不同 → 需要能伸縮的容量", "formula": "題幹講「流量起伏／需求時高時低」→ 選 scalability 擴展性、elasticity 彈性；看到 100% availability 或 OpEx 改成 CapEx 一律淘汰。"}, {"no": "NO.72", "stem": "An organization wants to move from a <b class=\"kw\">strategic</b> cloud adoption maturity level to a transformational one. How should the organization change the way they scale?", "opts": [{"L": "A", "ok": false, "html": "A. None of these"}, {"L": "B", "ok": false, "html": "B. Deploy changes when problems arise."}, {"L": "C", "ok": true, "html": "C. Deploy changes programmatically."}, {"L": "D", "ok": false, "html": "D. Review changes manually."}], "ansL": "C", "ans": "Deploy changes programmatically. 以程式化方式部署變更", "trig": "strategic → transformational 從策略邁向轉型 + the way they scale 擴展方式 → 自動化部署", "formula": "雲端成熟度題只要問「怎麼擴展／怎麼部署」→ 選 automated 自動化／programmatic 程式化；manual 人工、when problems arise 出事才做 都是低成熟度。"}, {"no": "NO.75", "stem": "Your company has recently acquired three growing startups in three different countries. You want to <b class=\"kw\">reduce overhead in infrastructure management</b> and keep your costs low without sacrificing security and quality of service to your customers. How should you meet these requirements?", "opts": [{"L": "A", "ok": false, "html": "A. Host all your subsidiaries&#x27; services on-premises together with your existing services."}, {"L": "B", "ok": true, "html": "B. Host all your subsidiaries&#x27; services together with your existing services on the public cloud."}, {"L": "C", "ok": false, "html": "C. Build a homogenous infrastructure at each subsidiary, and invest in training their engineers."}, {"L": "D", "ok": false, "html": "D. Build a homogenous infrastructure at each subsidiary, and invest in hiring more engineers."}], "ansL": "B", "ans": "Host all your subsidiaries&#x27; services together with your existing services on the public cloud. 把所有子公司服務與既有服務一起放上公有雲", "trig": "reduce overhead in infrastructure management 降低基礎設施管理負擔 + keep costs low 維持低成本 → 集中上公有雲", "formula": "題幹同時要「降低管理負擔＋低成本＋不犧牲安全品質」→ 選「集中到公有雲」；凡是「每個據點各建一套」「多請人」都與降負擔矛盾。"}, {"no": "NO.97", "stem": "An organization has completely migrated all their infrastructure to the cloud to benefit from its agility. Now they want to <b class=\"kw\">innovate faster</b> and achieve a higher return on investment. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Manually provision all cloud infrastructure for increased control."}, {"L": "B", "ok": true, "html": "B. Modernize their applications."}, {"L": "C", "ok": false, "html": "C. Lower their service level objective (<b>SLO</b>)."}, {"L": "D", "ok": false, "html": "D. Move to a hybrid architecture with some of their infrastructure on-premises."}], "ansL": "B", "ans": "Modernize their applications. 讓應用程式現代化", "trig": "already migrated 已經完成搬遷 + innovate faster 更快創新 → 下一步是改造應用本身", "formula": "上雲三部曲：先 migrate 搬遷 → 再 modernize 現代化 → 才有 innovate 創新。題幹說「已經搬完了，接下來呢」→ 一律選 modernize。"}, {"no": "NO.128", "stem": "A large travel company has thus far invested heavily in their technology team. There is strategic pressure on the company to <b class=\"kw\">focus on their core business</b> and innovate to survive in certain geographies and thrive in others. They are evaluating whether a move to Google Cloud will be good for them. Which of these reasons would be relevant for them? (choose two answer)", "opts": [{"L": "A", "ok": false, "html": "A. Application architecture won&#x27;t be too involved because of <b>serverless</b> options."}, {"L": "B", "ok": true, "html": "B. The IT team won&#x27;t have to manage software upgrades, security patches, etc. for the VMs."}, {"L": "C", "ok": false, "html": "C. The IT team won&#x27;t have to work on procuring and provisioning new hardware and refreshes to existing hardware."}, {"L": "D", "ok": false, "html": "D. Budgeting won&#x27;t be an issue since the cloud takes care of billing."}], "ansL": "B", "ans": "The IT team won&#x27;t have to manage software upgrades, security patches, etc. for the VMs. IT 團隊不必再管 VM 的軟體升級與安全修補（本題為複選，速記卡中文註記同時涵蓋 C. 免採購與汰換硬體）", "trig": "focus on their core business 專注核心業務 → 把非核心的維運與採購交出去", "formula": "「上雲對本業有什麼幫助」複選題 → 選「省掉維運與採購」的兩個；凡是「預算／成本不用擔心」都是錯的，雲端只是換一種花法。"}, {"no": "NO.304", "stem": "An organization wants to build an <b class=\"kw\">entirely new infrastructure and applications</b> in the cloud. Which application modernization approach should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Move the application to the cloud, and then change it."}, {"L": "B", "ok": false, "html": "B. Change their application, and then move it to the cloud."}, {"L": "C", "ok": true, "html": "C. Invent in greenfield."}, {"L": "D", "ok": false, "html": "D. Invent in brownfield."}], "ansL": "C", "ans": "Invent in greenfield. 在全新環境（greenfield）從零打造", "trig": "entirely new infrastructure and applications 全新的基礎設施與應用 → greenfield", "formula": "題幹有 entirely new 全新、from scratch 從零 → greenfield；題幹有 existing 既有、legacy 舊系統 → brownfield 或 move/improve。"}, {"no": "NO.226", "stem": "What is an example of <b class=\"kw\">unstructured data</b> that organizations can capture from social media?", "opts": [{"L": "A", "ok": true, "html": "A. Post comments"}, {"L": "B", "ok": false, "html": "B. Tagging"}, {"L": "C", "ok": false, "html": "C. Profile picture"}, {"L": "D", "ok": false, "html": "D. Location"}], "ansL": "A", "ans": "Post comments 貼文留言", "trig": "unstructured data 非結構化資料 → 選自由書寫的文字", "formula": "非結構化資料題認一個特徵：人自由寫／自由拍的東西（留言、評論、影音、郵件內文）；能塞進表格欄位的（日期、座標、數量、標籤）都是結構化。"}, {"no": "NO.229", "stem": "An organization is transforming their raw data into a format that can be used to derive business insights. Which step of the data value chain does this action represent?", "opts": [{"L": "A", "ok": false, "html": "A. Data collection"}, {"L": "B", "ok": false, "html": "B. Data analysis"}, {"L": "C", "ok": true, "html": "C. Data processing"}, {"L": "D", "ok": false, "html": "D. Data storage"}], "ansL": "C", "ans": "Data processing 資料處理", "trig": "transforming raw data into a format 把原始資料轉成可用格式 → 處理階段", "formula": "資料價值鏈定位題：收進來=collection；轉格式清洗=processing；放起來=storage；找答案=analysis。看到 transform 轉換 就選 processing。"}, {"no": "NO.242", "stem": "An online retail organization wants to optimize their service. What is an example of <b class=\"kw\">unstructured data</b> that they can use to make decisions?", "opts": [{"L": "A", "ok": true, "html": "A. Customer survey comments"}, {"L": "B", "ok": false, "html": "B. Seller location coordinates"}, {"L": "C", "ok": false, "html": "C. Product sales trends"}, {"L": "D", "ok": false, "html": "D. Warehouse inventory records"}], "ansL": "A", "ans": "Customer survey comments 顧客問卷留言", "trig": "unstructured data 非結構化資料 → 自由書寫的文字", "formula": "同 NO.226：選項裡只要有一個是「人寫的文字（comment／review／feedback）」，非結構化題答案就是它。"}, {"no": "NO.301", "stem": "An organization is moving away from an on-premises infrastructure. Instead, they want to <b class=\"kw\">create</b>, <b class=\"kw\">access</b>, <b class=\"kw\">and share information virtually</b> in the cloud. What should the organization consider?", "opts": [{"L": "A", "ok": true, "html": "A. Built-in security when moving their data to the cloud"}, {"L": "B", "ok": false, "html": "B. Replacing their perimeter security with data encryption keys"}, {"L": "C", "ok": false, "html": "C. Optimizing cost-management with a capital expenditure model"}, {"L": "D", "ok": false, "html": "D. Increased hardware capacity when moving their data to the cloud"}], "ansL": "A", "ans": "Built-in security when moving their data to the cloud 資料上雲時的內建安全性", "trig": "create, access, and share information virtually 虛擬地建立存取分享資訊 → 資料離開自家機房，要靠內建安全", "formula": "資料上雲的安全題 → 選帶 built-in security 內建安全、defense in depth 縱深防禦 的選項；看到「取代原有防護」「放寬控管」一律錯。"}, {"no": "NO.368", "stem": "What is the benefit of using a <b class=\"kw\">unified</b> cloud data solution?", "opts": [{"L": "A", "ok": false, "html": "A. Data will always cost less to store"}, {"L": "B", "ok": false, "html": "B. Data can be automatically secured from external threats"}, {"L": "C", "ok": true, "html": "C. Data can enable innovation because it&#x27;s no longer siloed."}, {"L": "D", "ok": false, "html": "D. Data will always be backed up and cannot be lost or deleted"}], "ansL": "C", "ans": "Data can enable innovation because it&#x27;s no longer siloed. 資料不再孤立，因此能帶動創新", "trig": "unified 統一的 → 相對詞就是 siloed 孤島化", "formula": "選項出現 always 總是、never 從不、cannot 絕不 這種絕對字眼 → 幾乎都是錯的。unified data 統一資料 的標準答案就是「打破孤島、帶動創新」。"}, {"no": "NO.266", "stem": "An organization wants to leverage cloud technologies but is concerned about <b class=\"kw\">vendor lock-in</b>. What would mitigate this concern?", "opts": [{"L": "A", "ok": false, "html": "A. Service level agreements"}, {"L": "B", "ok": true, "html": "B. Open standards"}, {"L": "C", "ok": false, "html": "C. Database services"}, {"L": "D", "ok": false, "html": "D. Scalable infrastructure"}], "ansL": "B", "ans": "Open standards 開放標準", "trig": "vendor lock-in 廠商鎖定 → 開放標準是標準解方", "formula": "看到 lock-in 鎖定／portability 可攜性／flexibility 彈性 → 選 open standards 開放標準、open source 開源、multi-cloud 多雲；看到 proprietary 專有 通常錯。"}, {"no": "NO.15", "stem": "A retail store has discovered a cost-effective solution for creating self-service kiosks. They can use <b class=\"kw\">existing check-out hardware</b> and purchase a virtual customer service application. Why do they also need an API?", "opts": [{"L": "A", "ok": false, "html": "A. To connect the check-out hardware to the public cloud."}, {"L": "B", "ok": true, "html": "B. To connect the new application with the legacy system."}, {"L": "C", "ok": false, "html": "C. To migrate all customer data for <b>disaster recovery</b>."}, {"L": "D", "ok": false, "html": "D. To update the check-out hardware remotely."}], "ansL": "B", "ans": "To connect the new application with the legacy system. 把新應用程式接上舊系統", "trig": "existing check-out hardware 沿用既有結帳硬體 + purchase a virtual application 買新應用 → 新舊要對接", "formula": "只要題幹同時出現 existing/legacy 舊有 與 new application 新應用 → API 的答案永遠是「讓新舊互通」。"}, {"no": "NO.131", "stem": "What cloud deployment model is generally deployed between organizations such as non-profits, hospitals or even enterprises that <b class=\"kw\">share similar requirements or interests</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Hybrid"}, {"L": "B", "ok": true, "html": "B. Community"}, {"L": "C", "ok": false, "html": "C. Private"}, {"L": "D", "ok": false, "html": "D. Public"}], "ansL": "B", "ans": "Community 社群雲", "trig": "share similar requirements or interests 有共同需求或利益的組織 → community cloud", "formula": "部署模型四選一：一家自己用=private；大家都能用=public；地端加雲端=hybrid；同性質的一群組織共用（醫院、非營利、政府）=community。"}, {"no": "NO.350", "stem": "An organization is considering the use of <b class=\"kw\">managed services</b> when migrating to the cloud. Which <b class=\"kw\">routine tasks</b> are typically provided automatically by a managed services platform?", "opts": [{"L": "A", "ok": true, "html": "A. Patching and upgrades"}, {"L": "B", "ok": false, "html": "B. Data archiving"}, {"L": "C", "ok": false, "html": "C. Managing user access"}, {"L": "D", "ok": false, "html": "D. Cost optimization"}], "ansL": "A", "ans": "Patching and upgrades 修補與升級", "trig": "managed services 代管服務 + routine tasks 例行工作 → 平台自動幫你打補丁升版", "formula": "代管服務「自動包辦」的清單記三個：patching 修補、upgrades 升版、底層維運。使用者權限、資料政策、成本決策永遠是客戶自己的事。"}, {"no": "NO.379", "stem": "An organization needs to <b class=\"kw\">rapidly scale</b> its use of computing resources and honor its commitment to <b class=\"kw\">environmental sustainability</b>. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Purchase energy-efficient servers for an existing on-premises data center."}, {"L": "B", "ok": false, "html": "B. Refactor application software to use less energy"}, {"L": "C", "ok": false, "html": "C. Use a carbon-neutral energy provider for an existing on-premises data center"}, {"L": "D", "ok": true, "html": "D. Use a public cloud provider with energy-efficient data centers"}], "ansL": "D", "ans": "Use a public cloud provider with energy-efficient data centers 使用擁有節能資料中心的公有雲供應商", "trig": "rapidly scale 快速擴展 + environmental sustainability 環境永續 → 兩個都要滿足才選", "formula": "題幹列出兩個條件時，逐一用兩個條件刷選項，只有兩條都過的才是答案。凡選項還停在 on-premises 地端 → 「快速擴展」這條一定過不了。"}, {"no": "NO.380", "stem": "Why do organizations often struggle to scale their on-premises application infrastructure?", "opts": [{"L": "A", "ok": false, "html": "A. Scaling compute instances could breach compliance and/or regulation"}, {"L": "B", "ok": true, "html": "B. Increasing compute capacity is time-consuming and costly"}, {"L": "C", "ok": false, "html": "C. Their <b>serverless</b> compute functions struggle to meet the demand"}, {"L": "D", "ok": false, "html": "D. Their multi-cloud architecture is complex and expensive"}], "ansL": "B", "ans": "Increasing compute capacity is time-consuming and costly 增加運算容量既耗時又昂貴", "trig": "struggle to scale on-premises 地端難以擴展 → 因為買機器慢又貴", "formula": "「地端為什麼難擴展」→ 標準答案永遠是「買硬體要時間又要錢」；選項若提到 serverless、multi-cloud 這些雲端才有的東西，就與地端前提矛盾。"}, {"no": "NO.405", "stem": "How does a large <b class=\"kw\">hotel chain</b> benefit from storing their customer <b class=\"kw\">reservation data</b> in the cloud?", "opts": [{"L": "A", "ok": false, "html": "A. On-premises hardware access to transaction data"}, {"L": "B", "ok": false, "html": "B. Real-time data transformation at scale within an on-premises database"}, {"L": "C", "ok": true, "html": "C. Real-time business transaction accuracy at scale"}, {"L": "D", "ok": false, "html": "D. Physical hardware access during peak demand"}], "ansL": "C", "ans": "Real-time business transaction accuracy at scale 大規模下仍能維持即時交易的準確性", "trig": "hotel chain 連鎖飯店 + reservation data 訂房資料 → 多據點同時訂房不能重複賣", "formula": "「上雲有什麼好處」題 → 選項只要還在講 on-premises 地端／physical hardware 實體硬體 就直接淘汰，剩下的通常只有一個。"}, {"no": "NO.408", "stem": "An organization finds that the amount of cash in their vending machines doesn&#x27;t match the value of items sold. They have decided to upgrade their vending machines with cloud-based mobile payment systems. How could the organization benefit from this upgrade?", "opts": [{"L": "A", "ok": false, "html": "A. They could relax data access permissions."}, {"L": "B", "ok": false, "html": "B. They could reduce their <b>error budget</b> overspend."}, {"L": "C", "ok": false, "html": "C. They could improve their perimeter security."}, {"L": "D", "ok": true, "html": "D. They could view data history to see transactions."}], "ansL": "D", "ans": "They could view data history to see transactions. 可以查看資料歷史紀錄以檢視交易", "trig": "cash doesn&#x27;t match the value of items sold 現金與銷售金額對不上 → 需要可追溯的交易紀錄", "formula": "題幹是「帳目對不上／查不到紀錄」→ 選帶 data history 歷史紀錄、audit trail 稽核軌跡、visibility 可視性 的選項。"}, {"no": "NO.129", "stem": "What cloud service model would you want to select if you want to solve a particular business problem by <b class=\"kw\">providing CRM services in the cloud</b> to your enterprises?", "opts": [{"L": "A", "ok": false, "html": "A. CaaS"}, {"L": "B", "ok": true, "html": "B. SaaS"}, {"L": "C", "ok": false, "html": "C. PaaS"}, {"L": "D", "ok": false, "html": "D. IaaS"}], "ansL": "B", "ans": "SaaS 軟體即服務", "trig": "providing CRM services in the cloud 在雲端提供 CRM 服務 → 現成軟體直接用 → SaaS", "formula": "題目說「直接提供某個現成商用軟體給使用者用」（CRM、郵件、會計、HR）→ 一律 SaaS；要自己寫程式才是 PaaS；要自己管作業系統才是 IaaS。"}, {"no": "NO.16", "stem": "A customer has new applications to build that has to handle <b class=\"kw\">both batch data and streaming data</b>. Which product should they choose?", "opts": [{"L": "A", "ok": false, "html": "A. Dataprep"}, {"L": "B", "ok": true, "html": "B. <b>Dataflow</b>"}, {"L": "C", "ok": false, "html": "C. <b>Dataproc</b>"}, {"L": "D", "ok": false, "html": "D. <b>Data Fusion</b>"}], "ansL": "B", "ans": "Dataflow", "trig": "both batch data and streaming data 批次與串流都要處理 → Dataflow 兩種模式通吃", "formula": "batch + streaming 兩個字同時出現 → 一律 Dataflow；只提 Hadoop／Spark → Dataproc；只提清理準備 → Dataprep。"}, {"no": "NO.18", "stem": "An IoT platform is providing services to home security systems. They have more than a million customers, each with many home devices. Burglaries or child safety issues are concerns that the clients customers. Therefore, the platform has to respond very quickly in <b class=\"kw\">near real time</b>. What could be a typical <b class=\"kw\">data pipeline</b> used to support this platform on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud <b>Pub/Sub</b>, Cloud <b>Dataflow</b>, Data Studio"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Functions</b>, Cloud <b>Dataproc</b>, <b>Looker</b>"}, {"L": "C", "ok": true, "html": "C. Cloud <b>Pub/Sub</b>, Cloud <b>Dataflow</b>, <b>BigQuery</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Functions</b>, Cloud <b>Dataproc</b>, <b>BigQuery</b>"}], "ansL": "C", "ans": "Cloud Pub/Sub, Cloud Dataflow, BigQuery", "trig": "near real time 近乎即時 + data pipeline 資料管線 → 收訊息→處理→分析 的三段標準組合", "formula": "即時資料管線的黃金三件組：Pub/Sub（收）→ Dataflow（處理）→ BigQuery（分析）。看到 Data Studio／Looker 出現在第三段，那是「呈現」不是「分析儲存」，要小心。"}, {"no": "NO.50", "stem": "Your organization needs to process large amounts of data from an online application that <b class=\"kw\">operates continuously</b>. You do not want to be required to provision infrastructure or create server clusters. What should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Compute Engine</b> with <b>BigQuery</b>"}, {"L": "B", "ok": false, "html": "B. <b>Dataproc</b>"}, {"L": "C", "ok": false, "html": "C. <b>Google Kubernetes Engine</b> with <b>Cloud Bigtable</b>"}, {"L": "D", "ok": true, "html": "D. <b>Dataflow</b>"}], "ansL": "D", "ans": "Dataflow", "trig": "operates continuously 持續運作 + do not want to provision infrastructure or create server clusters 不想佈建機器或建叢集 → 無伺服器的串流處理", "formula": "題幹出現 no servers to manage 不想管機器／no clusters 不建叢集 → 選 serverless 的那個（資料處理就是 Dataflow）；Dataproc、Compute Engine、GKE 都要自己管機器。"}, {"no": "NO.115", "stem": "Your organization needs to build <b class=\"kw\">streaming data pipelines</b>. You don&#x27;t want to manage the individual servers that do the data processing in the pipelines. Instead, you want a <b class=\"kw\">managed service that will automatically scale</b> with the amount of data to be processed. Which Google Cloud product or feature should your organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Pub/Sub</b>"}, {"L": "B", "ok": true, "html": "B. <b>Dataflow</b>"}, {"L": "C", "ok": false, "html": "C. Data Catalog"}, {"L": "D", "ok": false, "html": "D. Dataprep by Trifacta"}], "ansL": "B", "ans": "Dataflow", "trig": "streaming data pipelines 串流資料管線 + managed service that will automatically scale 自動擴展的代管服務 → Dataflow", "formula": "分工要記牢：Pub/Sub 只負責「傳」訊息，Dataflow 負責「算」。題目講 processing 處理、transform 轉換 → Dataflow；講 messaging 傳訊、ingest 接收 → Pub/Sub。"}, {"no": "NO.134", "stem": "The customer has applications that do data processing on-premise. They have been <b class=\"kw\">built using Hadoop and Spark</b>. What product should I use on Google Cloud?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Dataproc</b>"}, {"L": "B", "ok": false, "html": "B. <b>Dataflow</b>"}, {"L": "C", "ok": false, "html": "C. Dataprep"}, {"L": "D", "ok": false, "html": "D. Dataplex"}], "ansL": "A", "ans": "Dataproc", "trig": "built using Hadoop and Spark 用 Hadoop 與 Spark 建的 → Dataproc", "formula": "看到 Hadoop 或 Spark 這兩個字 → 直接選 Dataproc，不用再想；這是最好認的一題。"}, {"no": "NO.195", "stem": "What service is a fully managed <b class=\"kw\">real-time messaging service</b> that allows you to send and receive messages <b class=\"kw\">between independent applications</b>.", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Datastore"}, {"L": "B", "ok": true, "html": "B. Cloud <b>Pub/Sub</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud DNS</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud BigTable</b>"}, {"L": "E", "ok": false, "html": "E. <b>Cloud Spanner</b>"}], "ansL": "B", "ans": "Cloud Pub/Sub", "trig": "real-time messaging service 即時訊息服務 + between independent applications 獨立應用之間 → Pub/Sub", "formula": "題幹出現 send and receive messages 收發訊息、decouple 解耦 → Pub/Sub；其餘選項只要是 database 資料庫或 DNS 就直接淘汰。"}, {"no": "NO.165", "stem": "The government has mandated that companies in a particular section of healthcare must retain all the data they collect for a period of 10 years in case an audit needs to be done. Your client, who is in that industry, needs to follow regulations. In addition, your client wants to do an analysis of the data quite frequently in the first year. They also don&#x27;t want to be liable for any data beyond year 10. What would recommend for your customer?", "opts": [{"L": "A", "ok": false, "html": "A. Use <b>Cloud Storage</b> with <b>nearline</b> storage in year one and <b>Coldline</b> storage thereafter. Use Object lifecycle management to move between storage types and delete them after 10 years."}, {"L": "B", "ok": false, "html": "B. Use <b>Cloud Storage</b> with <b>standard storage</b> in year one and <b>Coldline</b> storage thereafter. Set a Cloud Scheduler trigger for 1 year to change storage types and 10 years to delete the data."}, {"L": "C", "ok": true, "html": "C. Use <b>Cloud Storage</b> with <b>standard storage</b> in year one and archival storage thereafter. Use Object lifecycle management to move between storage types and delete them after 10 years."}, {"L": "D", "ok": false, "html": "D. Use <b>Cloud Storage</b> with <b>standard storage</b> in year one and <b>Coldline</b> storage thereafter. Set a Cloud Tasks to trigger for 1 year to change storage types and 10 years to delete the data."}], "ansL": "C", "ans": "Use Cloud Storage with standard storage in year one and archival storage thereafter. Use Object lifecycle management to move between storage types and delete them after 10 years. 第一年用 Standard，之後轉 Archive，並用物件生命週期管理自動搬移與滿 10 年刪除", "trig": "analysis quite frequently in the first year 第一年常存取 → Standard；retain 10 years 留 10 年不常碰 → Archive；自動化 → Object lifecycle management", "formula": "儲存類別看存取頻率：常存取=Standard；約每月一次=Nearline；約每季一次=Coldline；一年以下甚至幾乎不碰的長期封存=Archive。要「自動轉換或自動刪除」→ 一律選 Object lifecycle management。"}, {"no": "NO.177", "stem": "A developer in your IT team is creating a bucket on Cloud Storage. He is receiving an error that the <b class=\"kw\">bucket name already exists</b>. He has <b class=\"kw\">checked his project</b> and the few other projects in the organization. The name seems to be entirely unique. What would be the issue?", "opts": [{"L": "A", "ok": false, "html": "A. Bucket names ignore any &quot;.&quot; in the name. Look for similar bucket names that have a &quot;.&quot; in it."}, {"L": "B", "ok": false, "html": "B. Previously deleted bucket names in the same <b>project</b> cannot be reused. There must have been an older bucket with the same name."}, {"L": "C", "ok": true, "html": "C. Bucket names in <b>Cloud storage</b> have to be globally unique"}, {"L": "D", "ok": false, "html": "D. Bucket name are case insensitive - look for bucket name in your org that have a different capitalization."}], "ansL": "C", "ans": "Bucket names in Cloud storage have to be globally unique 儲存桶名稱必須全域唯一", "trig": "bucket name already exists 名稱已存在 + checked his project 查過自己專案沒有 → 撞名的是別人的專案", "formula": "「桶名已存在但自己專案找不到」的題目 → 答案永遠是 globally unique 全域唯一；記住 bucket 名稱像網域名稱，全世界先搶先贏。"}, {"no": "NO.197", "stem": "Which of the following storage options should you use when your company is using Cloud Storage to store application <b class=\"kw\">backup files for disaster recovery</b> purposes, provided you want to follow Google&#x27;s recommended practices.", "opts": [{"L": "A", "ok": false, "html": "A. <b>Multi-Region</b>al Storage"}, {"L": "B", "ok": true, "html": "B. <b>Coldline</b> storage"}, {"L": "C", "ok": false, "html": "C. <b>Nearline</b> Storage"}, {"L": "D", "ok": false, "html": "D. Regional Storage"}], "ansL": "B", "ans": "Coldline storage", "trig": "backup files for disaster recovery 災難復原用的備份 → 平常不會碰，但要能取回 → Coldline", "formula": "備份／DR 情境的預設答案是 Coldline；如果題目強調「幾乎永遠不會取用、只為法規保存好幾年」才改選 Archive。"}, {"no": "NO.204", "stem": "A customer in the European Union region is very clear that their <b class=\"kw\">data should not go outside the European Union</b>. Their end users are spread all over the European Union. They have to choose a storage option that serves all the users within Asia via web browsers as quickly as possible. Which storage option will work for them?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Storage</b> with a single region that is known to be within the European Union"}, {"L": "B", "ok": false, "html": "B. Cloud Filestore is connected to virtual machines which are guaranteed to be within the European Union"}, {"L": "C", "ok": true, "html": "C. <b>Cloud Storage</b> with the <b>multi-region</b> option of European Union"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Storage</b> with the <b>dual-region</b> option of European Union"}], "ansL": "C", "ans": "Cloud Storage with the multi-region option of European Union 使用歐盟多地區選項的 Cloud Storage", "trig": "data should not go outside the European Union 資料不得離開歐盟 + end users spread all over 使用者分散各地要快 → 歐盟 multi-region", "formula": "兩個條件同時出現「資料不得離境」＋「使用者分散、要快」→ 選該地理範圍的 multi-region；只要求資料落地不要求速度 → single region 即可。"}, {"no": "NO.156", "stem": "What according to you are <b class=\"kw\">NOT the key capabilities</b> of In-App Messaging?", "opts": [{"L": "A", "ok": false, "html": "A. Target messages accordingly to the change in the behavior pattern of the target audience."}, {"L": "B", "ok": false, "html": "B. Creating customized and flexible alerts"}, {"L": "C", "ok": true, "html": "C. Increasing conversion for user-to-user sharing"}, {"L": "D", "ok": false, "html": "D. Sending relevant messages to the target audience"}], "ansL": "C", "ans": "Increasing conversion for user-to-user sharing 提升使用者互相分享的轉換率", "trig": "NOT the key capabilities 不是核心能力 → 這是反向題，要挑「不屬於」的那個", "formula": "看到題幹有 NOT、EXCEPT、LEAST 大寫或加粗 → 先在題號旁寫個「反」字，答案是唯一「不成立」的那個；三個都對、一個怪怪的就選那個怪的。"}, {"no": "NO.161", "stem": "<b class=\"kw\">Firebase Hosting provides</b> the following services-", "opts": [{"L": "A", "ok": false, "html": "A. Dynamic content"}, {"L": "B", "ok": false, "html": "B. Static content."}, {"L": "C", "ok": false, "html": "C. Microservices."}, {"L": "D", "ok": true, "html": "D. All of the Above."}], "ansL": "D", "ans": "All of the Above. 以上皆是", "trig": "Firebase Hosting provides 提供哪些服務 → 動態、靜態、微服務都涵蓋", "formula": "選項列出的三項若都是同一產品文件上寫得出來的功能 → 選 All of the Above；只有出現明顯不屬於該產品的功能時才排除。"}, {"no": "NO.201", "stem": "&quot;With cloud messaging you can Customize and <b class=\"kw\">deliver messages accordingly to the predetermined time in the user&#x27;s local time zone</b>.&quot; Comment on the above statement.", "opts": [{"L": "A", "ok": false, "html": "A. This statement is undefined."}, {"L": "B", "ok": false, "html": "B. The above statement is partially true."}, {"L": "C", "ok": false, "html": "C. The above statement is completely false."}, {"L": "D", "ok": true, "html": "D. The above statement is completely true."}], "ansL": "D", "ans": "The above statement is completely true. 上述敘述完全正確", "trig": "deliver messages accordingly to the predetermined time in the user&#x27;s local time zone 依使用者當地時區的預定時間送出訊息 → 這確實是雲端訊息服務的排程能力", "formula": "「評論以下敘述」的真假題：先看敘述裡有沒有 always／never／only 這種絕對字；沒有絕對字、而且描述的是產品文件寫得出來的正常功能 → 選 completely true。"}, {"no": "NO.215", "stem": "Google offers Firebase, In terms of Firebase Console, any particular message that has to be delivered to a customer at a certain degree of change in behavior can be <b class=\"kw\">managed through</b> _________________.", "opts": [{"L": "A", "ok": false, "html": "A. A/B testing"}, {"L": "B", "ok": true, "html": "B. Notification Composer"}, {"L": "C", "ok": false, "html": "C. Firebase Remote config."}, {"L": "D", "ok": false, "html": "D. None of the above"}], "ansL": "B", "ans": "Notification Composer 通知編輯器", "trig": "message delivered at a certain degree of change in behavior 依行為變化程度投遞訊息 + managed through 透過什麼管理 → Firebase 主控台裡的通知編輯器", "formula": "Firebase 工具分工：發通知＝Notification Composer；比較版本成效＝A/B testing；不改版就調參數＝Remote Config。看關鍵動詞就能對號入座。"}, {"no": "NO.249", "stem": "What is the purpose of an application programming interface (API)?", "opts": [{"L": "A", "ok": false, "html": "A. To provide cloud plugins for integrated development environments"}, {"L": "B", "ok": false, "html": "B. To manage multiple containerized workloads"}, {"L": "C", "ok": false, "html": "C. To connect networks from different cloud providers"}, {"L": "D", "ok": true, "html": "D. To provide a set of instructions that allow computer programs to communicate with each other"}], "ansL": "D", "ans": "To provide a set of instructions that allow computer programs to communicate with each other 提供一套指令讓程式之間能互相溝通", "trig": "purpose of an API API 的目的 → 定義題，選最貼近「程式之間溝通」的敘述", "formula": "API 定義題認關鍵句：「讓程式與程式互相溝通的一組規則／指令」；只要選項在講容器、網路、開發工具，就都不是 API 的定義。"}]}];
const MK  = 'cdl_cheat_marks_v3';
const POS = 'cdl_cheat_pos_v1';
let marks = JSON.parse(localStorage.getItem(MK) || '{}');
let markOnly = false, lastPos = localStorage.getItem(POS) || '';

function render(){
  let h = '', shown = 0, chips = '';
  DATA.forEach(function(s, si){
    const rows = s.rows.filter(function(r){ return !markOnly || marks[r.no]; });
    if(!rows.length) return;
    chips += '<div class="chip" data-sec="sec' + si + '" onclick="goSec(' + si + ')">' + s.name + '<i>' + rows.length + '</i></div>';
    h += '<section id="sec' + si + '"><h2>' + s.name + ' <small>' + rows.length + ' 題 · ' + s.tag + '</small></h2>';
    rows.forEach(function(r){
      shown++;
      h += '<div class="card' + (marks[r.no] ? ' mark' : '') + '" data-no="' + r.no + '">'
         + '<div class="no">' + r.no + '</div>'
         + '<div class="stem">' + r.stem + '</div><div class="opts">'
         + r.opts.map(function(o){ return '<div class="opt' + (o.ok ? ' ok' : '') + '">' + o.html + '</div>'; }).join('')
         + '</div><div class="detail">'
         + '<div class="ansline">✅ ' + r.ansL + '　' + r.ans + '</div>'
         + '<div class="trig">🔑 ' + r.trig + '</div>'
         + (r.formula ? '<div class="formula">🎯 ' + r.formula + '</div>' : '')
         + '</div></div>';
    });
    h += '</section>';
  });
  document.getElementById('jump').innerHTML = chips;
  document.getElementById('root').innerHTML = h ||
    '<section><p style="color:#94a3b8;padding:24px 8px">還沒有任何記號。回到全部，長按想不起來的題目。</p></section>';
  updateCount(shown);
  bind();
}
function updateCount(n){
  document.getElementById('count').innerText =
    '共 ' + (n !== undefined ? n : document.querySelectorAll('.card').length) +
    ' 題 ｜ 記號 ' + Object.keys(marks).length + ' 題';
}
function bind(){
  document.querySelectorAll('.card').forEach(function(el){
    let timer = null, longPressed = false;
    function start(){
      longPressed = false;
      timer = setTimeout(function(){
        longPressed = true;
        const no = el.dataset.no;
        if(marks[no]) delete marks[no]; else marks[no] = 1;
        localStorage.setItem(MK, JSON.stringify(marks));
        el.classList.toggle('mark');
        updateCount();
      }, 450);
    }
    function end(open){ clearTimeout(timer); if(!longPressed && open) el.classList.toggle('open'); }
    el.addEventListener('touchstart', start, {passive:true});
    el.addEventListener('touchmove', function(){ clearTimeout(timer); });
    el.addEventListener('touchend', function(){ end(true); });
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', function(){ end(true); });
    el.addEventListener('mouseleave', function(){ end(false); });
  });
}
/* ---- 記住位置：捲動時把最上面那張卡的題號存起來 ---- */
let saveTimer = null;
function currentTopCard(){
  const cards = document.querySelectorAll('.card');
  for (let i = 0; i < cards.length; i++){
    const r = cards[i].getBoundingClientRect();
    if (r.bottom > 130) return cards[i];
  }
  return null;
}
window.addEventListener('scroll', function(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    const c = currentTopCard();
    if (c) localStorage.setItem(POS, c.dataset.no);
    highlightChip();
  }, 220);
}, {passive:true});

function highlightChip(){
  const secs = document.querySelectorAll('section');
  let cur = 0;
  secs.forEach(function(s, i){ if (s.getBoundingClientRect().top <= 130) cur = i; });
  document.querySelectorAll('.chip').forEach(function(c, i){ c.className = 'chip' + (i === cur ? ' cur' : ''); });
}
function goSec(i){
  const el = document.getElementById('sec' + i);
  if (!el) return;
  el.scrollIntoView({block:'start'});
  document.querySelectorAll('.chip').forEach(function(c, j){ c.className = 'chip' + (j === i ? ' cur' : ''); });
  const first = el.querySelector('.card');
  if (first) localStorage.setItem(POS, first.dataset.no);
}
function toTop(){ window.scrollTo(0, 0); }
function goCard(no, flash){
  const el = document.querySelector('.card[data-no="' + no + '"]');
  if (!el) return false;
  el.scrollIntoView({block:'center'});
  if (flash){ el.classList.add('here'); setTimeout(function(){ el.classList.remove('here'); }, 2200); }
  return true;
}
function resumeGo(){
  goCard(lastPos, true);
  document.getElementById('resume').style.display = 'none';
}
/* ---- 記號之間跳 ---- */
let mkIdx = -1;
function jumpMark(dir){
  const list = [].slice.call(document.querySelectorAll('.card.mark'));
  if (!list.length){ return; }
  mkIdx = (mkIdx + dir + list.length) % list.length;
  list[mkIdx].scrollIntoView({block:'center'});
  list[mkIdx].classList.add('here');
  setTimeout(function(){ list[mkIdx] && list[mkIdx].classList.remove('here'); }, 1600);
}
function onlyMarked(){ markOnly = !markOnly; document.getElementById('btn-mk').className = markOnly ? 'on' : ''; mkIdx = -1; render(); highlightChip(); }
function toggleBlind(){
  document.body.classList.toggle('blind');
  const on = document.body.classList.contains('blind');
  const b = document.getElementById('btn-blind');
  b.className = on ? 'on' : '';
  b.innerText = on ? '正解已遮' : '遮正解';
  if(on) document.querySelectorAll('.card').forEach(function(e){ e.classList.remove('open'); });
}
render();
highlightChip();
if (lastPos && document.querySelector('.card[data-no="' + lastPos + '"]')){
  const btn = document.getElementById('resume');
  btn.innerText = '↩︎ 回到上次看到的地方（' + lastPos + '）';
  btn.style.display = 'block';
  setTimeout(function(){ btn.style.display = 'none'; }, 12000);
}
</script></body></html>
