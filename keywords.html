a relational database in the cloud. <b class=\"kw\">What functionality does a relational database offer</b>?", "opts": [{"L": "A", "ok": false, "html": "A. It analyzes unstructured data which can then be accessed in multiple regions"}, {"L": "B", "ok": true, "html": "B. It stores transactional data which can then be accessed electronically"}, {"L": "C", "ok": false, "html": "C. It stores large amounts of raw data in its original format"}, {"L": "D", "ok": false, "html": "D. It rapidly analyzes large and multi-dimensional datasets"}], "ansL": "B", "ans": "It stores transactional data which can then be accessed electronically（儲存交易資料並可電子化存取）", "trig": "What functionality does a relational database offer 關聯式資料庫提供什麼功能 → 存交易資料", "formula": "四選項分別對應四種系統時，逐句貼標籤：交易＝關聯式、原始格式＝資料湖、多維分析＝倉儲"}, {"no": "NO.92", "stem": "Your application is onboarding a number of users. The <b class=\"kw\">details of the users vary widely</b>. What kind of database would be most suitable for this use case?", "opts": [{"L": "A", "ok": true, "html": "A. NoSQL database like <b>Firestore</b>"}, {"L": "B", "ok": false, "html": "B. OLAP database like <b>BigQuery</b> which support SQL"}, {"L": "C", "ok": false, "html": "C. SQL database like MySQL or PostgreSQL"}, {"L": "D", "ok": false, "html": "D. OLTP database like <b>Cloud Spanner</b>"}], "ansL": "A", "ans": "NoSQL database like Firestore（Firestore 文件型 NoSQL）", "trig": "details of the users vary widely 使用者的欄位差異很大 → 需要彈性 schema 的 NoSQL", "formula": "每筆資料欄位長得不一樣 → NoSQL（Firestore）；每筆都同結構 → 關聯式"}, {"no": "NO.276", "stem": "What is a <b class=\"kw\">defining feature of a non-relational database</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Reporting across multiple data sources"}, {"L": "B", "ok": false, "html": "B. Queries that join multiple tables"}, {"L": "C", "ok": false, "html": "C. A strictly enforced schema"}, {"L": "D", "ok": true, "html": "D. A flexible data model"}], "ansL": "D + A", "ans": "A flexible data model 彈性的資料模型", "trig": "defining feature of a non-relational database 非關聯式資料庫的定義性特徵 → 彈性資料模型", "formula": "非關聯式＝彈性 schema、無 join；關聯式＝固定 schema、可 join。兩張標籤互為反面"}, {"no": "NO.366", "stem": "An organization needs a <b class=\"kw\">flexible and scalable NoSQL</b> database with strong <b class=\"kw\">web and mobile application support</b>. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Spanner</b>"}, {"L": "B", "ok": false, "html": "B. <b>BigQuery</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Storage</b>"}, {"L": "D", "ok": true, "html": "D. restore"}], "ansL": "D", "ans": "（原檔選項印成 restore，實際應為 Firestore 文件型 NoSQL）", "trig": "flexible and scalable NoSQL 彈性可擴展的 NoSQL + web and mobile application support 網頁與行動應用支援 → Firestore", "formula": "NoSQL + web/mobile App → Firestore；NoSQL + 百萬級時序寫入 → Bigtable"}, {"no": "NO.70", "stem": "What is the difference between Standard and <b class=\"kw\">Coldline</b> storage?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Coldline</b> storage is for data for which a <b>slo</b>w transfer rate is acceptable."}, {"L": "B", "ok": false, "html": "B. Standard and <b>Coldline</b> storage have different durability guarantees."}, {"L": "C", "ok": false, "html": "C. Standard and <b>Coldline</b> storage use different APIs."}, {"L": "D", "ok": true, "html": "D. <b>Coldline</b> storage is for infrequently accessed data."}], "ansL": "D", "ans": "Coldline storage is for infrequently accessed data.（Coldline 用於不常存取的資料）", "trig": "difference between Standard and Coldline Standard 與 Coldline 的差別 → 差在存取頻率", "formula": "Cloud Storage 四種類別只差「存取頻率與費用結構」，耐久度、速度、API 全部相同"}, {"no": "NO.230", "stem": "An organization stores backup files in Cloud Storage. The files will be <b class=\"kw\">accessed annually</b> to test the disaster recovery plans. Which storage class is the most cost-effective?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Nearline</b> class"}, {"L": "B", "ok": false, "html": "B. Standard class"}, {"L": "C", "ok": false, "html": "C. <b>Coldline</b> class"}, {"L": "D", "ok": true, "html": "D. <b>Archive</b> class"}], "ansL": "D", "ans": "Archive class 封存類別", "trig": "accessed annually 一年存取一次 → Archive", "formula": "存取頻率對照表：常常→Standard；每月→Nearline；每季→Coldline；每年→Archive"}, {"no": "NO.247", "stem": "An organization needs frequent access to only a subset of their data. They want to reduce costs by depositing the rest of their data across <b class=\"kw\">Nearline</b>, <b class=\"kw\">Coldline</b>, <b class=\"kw\">and Archive</b> repositories. Which Google Cloud product should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Filestore"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. Data Catalog"}, {"L": "D", "ok": true, "html": "D. <b>Cloud Storage</b>"}], "ansL": "D", "ans": "Cloud Storage 物件儲存", "trig": "Nearline, Coldline, and Archive → 這三個名字就是 Cloud Storage 的儲存類別", "formula": "題幹只要唸出 Nearline／Coldline／Archive／Standard 任一組合 → 答案就是 Cloud Storage"}, {"no": "NO.267", "stem": "An organization is looking for a storage solution that will help them <b class=\"kw\">serve content to users worldwide</b>. They need a solution that offers a <b class=\"kw\">high level of availability</b>. What feature of Cloud Storage would they benefit from?", "opts": [{"L": "A", "ok": false, "html": "A. Global metadata"}, {"L": "B", "ok": false, "html": "B. Object versioning"}, {"L": "C", "ok": false, "html": "C. Data encryption"}, {"L": "D", "ok": true, "html": "D. <b>Multi-region</b>al storage"}], "ansL": "D", "ans": "Multi-regional storage 多區域儲存", "trig": "serve content to users worldwide 對全球使用者供應內容 + high level of availability 高可用性 → 多區域儲存", "formula": "worldwide 全球使用者 + availability 可用性 → multi-regional；只在同一區運算 → single region"}, {"no": "NO.77", "stem": "Your organization wants an <b class=\"kw\">economical</b> solution to store data such as <b class=\"kw\">files</b>, <b class=\"kw\">graphical images</b>, <b class=\"kw\">and videos</b> and to access and share them securely. Which Google Cloud product or service should your organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Cloud Storage</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud SQL</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Spanner</b>"}, {"L": "D", "ok": false, "html": "D. <b>BigQuery</b>"}], "ansL": "A", "ans": "Cloud Storage 物件儲存", "trig": "files, graphical images, and videos 檔案、圖片、影片 + economical 經濟實惠 → Cloud Storage", "formula": "出現 files／images／videos／backups 這類「檔案」字眼 → Cloud Storage，別想資料庫"}, {"no": "NO.118", "stem": "Your customer is moving from AWS to Google Cloud. Data also needs to be moved. There is about 50TB of data. On AWS, the data <b class=\"kw\">resides in an S3 bucket</b>. It is going to be moved to Cloud Storage. Data is also being continuously generated on S3 prior to the cutover. It is preferable that this is also <b class=\"kw\">periodically transferred</b>. What is the best way to move the data?", "opts": [{"L": "A", "ok": false, "html": "A. Use the Google Cloud console to drag and drop the files easily"}, {"L": "B", "ok": true, "html": "B. Use the <b>Storage Transfer Service</b>"}, {"L": "C", "ok": false, "html": "C. Use the gsutil command-line option"}, {"L": "D", "ok": false, "html": "D. Use a <b>Transfer Appliance</b>"}], "ansL": "B", "ans": "Use the Storage Transfer Service（儲存空間移轉服務）", "trig": "resides in an S3 bucket 資料在 S3 + periodically transferred 定期轉移 → Storage Transfer Service", "formula": "雲對雲（S3／Azure）搬資料且要定期同步 → Storage Transfer Service；地端無網路搬大量資料 → Transfer Appliance"}, {"no": "NO.214", "stem": "Your client is building a custom machine learning pipeline to identify lesions in the lungs based on x-rays. Different teams of data scientists are sharing common source data and building many versions of ML models. Which of these Cloud Storage options would be best for them?", "opts": [{"L": "A", "ok": false, "html": "A. Retain the data in use in a single region bucket with <b>nearline</b> storage. Retain the data in use in a <b>dual-region</b> bucket."}, {"L": "B", "ok": true, "html": "B. Retain the data in use in a single region bucket with <b>standard storage</b>."}, {"L": "C", "ok": false, "html": "C. Retain the data in use in a <b>multi-region</b> bucket."}, {"L": "D", "ok": false, "html": "D. Retain the data in use in a <b>dual-region</b> bucket."}], "ansL": "B", "ans": "Retain the data in use in a single region bucket with standard storage.（單一區域 bucket ＋ Standard 類別）", "trig": "teams ... sharing common source data 團隊共用同一份來源資料（反覆讀取、集中在一區運算）→ 單區域 Standard", "formula": "資料常被讀 → Standard；運算與資料在同一區 → single region。跨區只有在「要跨區服務」時才選"}, {"no": "NO.218", "stem": "You are working for a hospital that stores its medical images in an on-premises data room and it is provided that the hospitals want to use Cloud Storage for archival storage of these images. You are required to design and implement a solution where the hospital wants an <b class=\"kw\">automated process to upload any new medical images</b> to Cloud Storage. On the basis of this statements which of the following statement is correct.", "opts": [{"L": "A", "ok": false, "html": "A. Create a <b>Pub/Sub</b> topic, and enable a <b>Cloud Storage</b> trigger for the Pub/Sub topic. Create an application that sends all medical images to the Pub/Sub topic."}, {"L": "B", "ok": true, "html": "B. Create a script that uses the gsutil command line interface to synchronize the on-premises storage with <b>Cloud Storage</b>. Schedule the script as a cron job."}, {"L": "C", "ok": false, "html": "C. In the Cloud Console, go to <b>Cloud Storage</b>. Upload the relevant images to the appropriate bucket."}, {"L": "D", "ok": false, "html": "D. Deploy a <b>Dataflow</b> job from the batch template, &quot;Datastore to <b>Cloud Storage</b>&quot; Schedule the batch job on the desired interval."}], "ansL": "B", "ans": "gsutil 指令稿同步地端與 Cloud Storage，並排成 cron job", "trig": "automated process to upload any new medical images 自動上傳新影像 → 地端排程同步", "formula": "「地端有新檔要自動上雲」→ gsutil rsync ＋ cron；「雲端有新檔要自動觸發後續」才用 Cloud Storage trigger"}, {"no": "NO.374", "stem": "An organization has a <b class=\"kw\">large archive of unstructured data</b>, <b class=\"kw\">including video and audio</b> files. Which storage solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Bigtable</b>"}, {"L": "D", "ok": true, "html": "D. <b>Cloud Storage</b>"}], "ansL": "D", "ans": "Cloud Storage 物件儲存", "trig": "large archive of unstructured data, including video and audio 大量非結構化影音封存 → Cloud Storage", "formula": "unstructured 非結構化 + video/audio/image → Cloud Storage，四個選項裡只有它不是資料庫"}, {"no": "NO.52", "stem": "A prospect wants to be able to store and analyze data. Their <b class=\"kw\">analysts already know SQL</b>, but are not familiar with other technologies. Which of these databases can the analysts use <b class=\"kw\">without additional training</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>, <b>BigQuery</b>, Datastore"}, {"L": "B", "ok": true, "html": "B. Spanner, <b>Cloud SQL</b>, <b>BigQuery</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud SQL</b>, <b>Firestore</b>, Datastore"}, {"L": "D", "ok": false, "html": "D. <b>Cloud SQL</b>, <b>Bigtable</b>, <b>BigQuery</b>"}], "ansL": "B", "ans": "Spanner, Cloud SQL, BigQuery", "trig": "analysts already know SQL 分析師只會 SQL + without additional training 免額外訓練 → 挑三個都支援 SQL 的組合", "formula": "支援 SQL：Cloud SQL、Spanner、BigQuery；不支援：Bigtable、Firestore、Datastore（NoSQL 一律不吃 SQL）"}, {"no": "NO.83", "stem": "Your organization needs to analyze data in order to gather insights into its daily operations. You only want to <b class=\"kw\">pay for the data you store and the queries you perform</b>. Which Google Cloud product should your organization choose for its <b class=\"kw\">data analytics warehouse</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud SQL</b>"}, {"L": "B", "ok": false, "html": "B. <b>Dataproc</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Spanner</b>"}, {"L": "D", "ok": true, "html": "D. <b>BigQuery</b>"}], "ansL": "D", "ans": "BigQuery 無伺服器資料倉儲", "trig": "data analytics warehouse 資料分析倉儲 + pay for the data you store and the queries you perform 按儲存量與查詢量計費 → BigQuery", "formula": "「只為儲存與查詢付費」是 BigQuery 專屬描述，看到就直接選它"}, {"no": "NO.155", "stem": "While on-premise, an enterprise had multiple teams, each with its own analytics data store. Attempts to converge the storage for <b class=\"kw\">centralized</b>, <b class=\"kw\">company-wide analysis</b> <b class=\"kw\">failed because of speed and scaling issues</b>. What would be the preferred destination architecture on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Migrate to <b>Bigtable</b> which provides high throughput reads and writes."}, {"L": "B", "ok": false, "html": "B. Migrate to <b>Cloud Spanner</b> as a globally scalable SQL database."}, {"L": "C", "ok": true, "html": "C. Migrate to <b>BigQuery</b> as a central data warehouse."}, {"L": "D", "ok": false, "html": "D. Migrate to <b>Cloud SQL</b> which supports multiple databases like MySQL, PostgreSQL, and SQL Server - all of the customer&#x27;s SQL databases can be accommodated here."}], "ansL": "C", "ans": "Migrate to BigQuery as a central data warehouse.（遷移到 BigQuery 當中央資料倉儲）", "trig": "centralized, company-wide analysis 全公司集中分析 + failed because of speed and scaling issues 因速度與擴展失敗 → BigQuery", "formula": "各部門分散的分析資料要集中 → BigQuery 中央倉儲，這是 CDL 最常考的「資料孤島」解法"}, {"no": "NO.241", "stem": "An organization recently launched a virtual customer support agent, generating <b class=\"kw\">vast amounts of text and speech data</b>. Why should they use a cloud data warehouse to interpret this data?", "opts": [{"L": "A", "ok": false, "html": "A. To natively visualize both types of data using a dashboard in real time"}, {"L": "B", "ok": true, "html": "B. To ingest and analyze structured and unstructured data at scale, in real time"}, {"L": "C", "ok": false, "html": "C. To secure data transmission between cloud and on-premises environments"}, {"L": "D", "ok": false, "html": "D. To transform data from structured to unstructured"}], "ansL": "B", "ans": "To ingest and analyze structured and unstructured data at scale, in real time（大規模即時擷取並分析結構化與非結構化資料）", "trig": "vast amounts of text and speech data 大量文字與語音資料 → 倉儲要能同時吃結構化與非結構化", "formula": "問「為什麼要用雲端資料倉儲」→ 答案永遠繞著 at scale 大規模 + real time 即時 + 兩種資料都能吃"}, {"no": "NO.277", "stem": "How would an organization <b class=\"kw\">benefit from using Looker</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Optimal identity and access management"}, {"L": "B", "ok": false, "html": "B. Leading <b>serverless</b> warehousing technology"}, {"L": "C", "ok": false, "html": "C. Robust data roll-back accuracy"}, {"L": "D", "ok": true, "html": "D. Advanced business intelligence and analytics"}], "ansL": "D", "ans": "Advanced business intelligence and analytics（進階商業智慧與分析）", "trig": "benefit from using Looker 使用 Looker 的好處 → BI 與分析", "formula": "Looker＝報表與儀表板（給人看）；BigQuery＝倉儲與查詢引擎（給資料用）。兩者常在同一題互相當誘答"}, {"no": "NO.326", "stem": "An organization has petabytes of data gathered from a wide range of sources They want to use the data for <b class=\"kw\">strategic analysis</b> and to guide business decisions What type of service should they use*?", "opts": [{"L": "A", "ok": false, "html": "A. Non-relational document database"}, {"L": "B", "ok": false, "html": "B. Object store"}, {"L": "C", "ok": true, "html": "C. Data warehouse"}, {"L": "D", "ok": false, "html": "D. Relational transactional database"}], "ansL": "C", "ans": "Data warehouse 資料倉儲", "trig": "petabytes of data ... from a wide range of sources 多來源 PB 級資料 + strategic analysis 策略分析 → 資料倉儲", "formula": "「多來源 + 大量 + 為了做決策」→ Data warehouse；「多來源 + 原始格式不動」→ Data lake"}, {"no": "NO.337", "stem": "An organization wants to <b class=\"kw\">analyze data in a data warehouse</b>. How should they proceed?", "opts": [{"L": "A", "ok": true, "html": "A. Choose a system to store structured and semi-structured data that supports ad-hoc analysis and"}, {"L": "B", "ok": false, "html": "B. Copy unstructured data into a single large object store."}, {"L": "C", "ok": false, "html": "C. Ensure data is stored in structured tables and rows to support transactional queries and"}, {"L": "D", "ok": false, "html": "D. Import data into a semi-structured time-series database."}], "ansL": "A", "ans": "選擇能存放結構化與半結構化資料、支援臨時分析的系統", "trig": "analyze data in a data warehouse 在資料倉儲裡分析 → 結構化＋半結構化＋ad-hoc 分析", "formula": "倉儲吃「結構化＋半結構化」；資料湖吃「全部含原始非結構化」；交易庫只吃「結構化」"}, {"no": "NO.359", "stem": "An international bank is looking for a <b class=\"kw\">serverless warehouse</b> solution that lets them perform <b class=\"kw\">smart analytics</b>. Which Google Cloud product or service should the bank use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>BigQuery</b>"}, {"L": "B", "ok": false, "html": "B. <b>Dataflow</b>"}, {"L": "C", "ok": false, "html": "C. <b>Compute Engine</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Spanner</b>"}], "ansL": "A", "ans": "BigQuery 無伺服器資料倉儲", "trig": "serverless warehouse 無伺服器倉儲 + smart analytics 智慧分析 → BigQuery", "formula": "serverless + warehouse／analytics → BigQuery，這組字幾乎是它的專用暗號"}, {"no": "NO.375", "stem": "An organization has collected petabytes of historical data. They need an advanced analysis solution that is fast, scalable, and fully managed. Which Google product or service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>BigQuery</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Storage</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud SQL</b>"}, {"L": "D", "ok": false, "html": "D. <b>Firestore</b>"}], "ansL": "A", "ans": "BigQuery 無伺服器資料倉儲", "trig": "petabytes of historical data PB 級歷史資料 + advanced analysis ... fully managed 進階分析且全託管 → BigQuery", "formula": "歷史資料 + PB 級 + 分析 → BigQuery；歷史資料只要「存著」不分析 → Cloud Storage"}, {"no": "NO.391", "stem": "An organization is looking for a <b class=\"kw\">business intelligence</b> solution that allows <b class=\"kw\">individual employees and end users</b> to analyze business data and generate insights. Which Google Cloud product or service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Looker</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. <b>BigQuery</b>"}, {"L": "D", "ok": false, "html": "D. <b>Dataflow</b>"}], "ansL": "A", "ans": "Looker 商業智慧平台", "trig": "business intelligence 商業智慧 + individual employees and end users 個別員工與終端使用者 → Looker", "formula": "出現 business intelligence 或「讓非技術人員自己看資料」→ Looker，不要選 BigQuery"}, {"no": "NO.403", "stem": "An organization wants to <b class=\"kw\">transform</b> multiple types of structured and unstructured data in the cloud from various sources. The data must be <b class=\"kw\">readily accessible for analysis</b> and insights. Which cloud data storage system should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Relational database"}, {"L": "B", "ok": false, "html": "B. Private data center"}, {"L": "C", "ok": false, "html": "C. Data field"}, {"L": "D", "ok": true, "html": "D. Data warehouse"}], "ansL": "D", "ans": "Data warehouse 資料倉儲", "trig": "transform 轉換 + readily accessible for analysis 可隨時取用做分析 → 資料倉儲（資料已被轉換）", "formula": "有 transform 轉換 → 倉儲；強調 raw／native format 原封不動 → 資料湖。這兩題的分水嶺就在這個字"}, {"no": "NO.415", "stem": "How does Cloud SQL help organizations create business insights?", "opts": [{"L": "A", "ok": true, "html": "A. Integrates with business intelligence and analytics platforms"}, {"L": "B", "ok": false, "html": "B. Generates predictions using machine learning models"}, {"L": "C", "ok": false, "html": "C. Generates real-time charts and intelligent analytics"}, {"L": "D", "ok": false, "html": "D. Transforms business data from unstructured to structured"}], "ansL": "A", "ans": "Integrates with business intelligence and analytics platforms（與 BI 及分析平台整合）", "trig": "How does Cloud SQL help create business insights Cloud SQL 怎麼幫忙產生商業洞察 → 靠整合 BI 平台", "formula": "交易型資料庫（Cloud SQL／Spanner）本身不做分析，它們的「分析價值」一律來自「可整合 BI 工具」"}, {"no": "NO.46", "stem": "An organization has created an ecommerce website. What data on this website would be <b class=\"kw\">considered structured data</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Product photographs"}, {"L": "B", "ok": false, "html": "B. Product reviews"}, {"L": "C", "ok": false, "html": "C. Product descriptions"}, {"L": "D", "ok": true, "html": "D. Product ratings score"}], "ansL": "D", "ans": "Product ratings score 產品評分（數值型）", "trig": "considered structured data 被視為結構化資料 → 找那個能放進固定欄位的", "formula": "review／description／transcript／note 這幾個字＝自由文字＝非結構化；score／rating／count／date＝結構化"}, {"no": "NO.332", "stem": "<b class=\"kw\">structured data</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Customer orders"}, {"L": "B", "ok": false, "html": "B. Product ratings"}, {"L": "C", "ok": false, "html": "C. Historical stock inventory"}, {"L": "D", "ok": true, "html": "D. Call center transcripts"}], "ansL": "D", "ans": "Call center transcripts 客服通話逐字稿（非結構化）", "trig": "structured data?（題幹在來源檔已殘缺，僅剩此片段）→ 依四個選項判斷，唯一非結構化的是逐字稿", "formula": "四選項中三個是數字表格、一個是文字或影音 → 出題點必然是「挑出那個非結構化的」"}, {"no": "NO.336", "stem": "What is an <b class=\"kw\">example of structured data</b> that a healthcare facility stores in their system?", "opts": [{"L": "A", "ok": false, "html": "A. X-ray images"}, {"L": "B", "ok": false, "html": "B. Surgery video recordings"}, {"L": "C", "ok": true, "html": "C. Blood pressure history"}, {"L": "D", "ok": false, "html": "D. Physician-written notes"}], "ansL": "C", "ans": "Blood pressure history 血壓歷史紀錄", "trig": "example of structured data 結構化資料的例子 → 找數值＋時間的那個", "formula": "醫療題的固定套路：影像、錄影、醫師手寫紀錄＝非結構化；量測數值（血壓、體溫、心跳）＝結構化"}, {"no": "NO.395", "stem": "What is an <b class=\"kw\">example of unstructured data</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Product ratings"}, {"L": "B", "ok": false, "html": "B. Historical stock inventory"}, {"L": "C", "ok": false, "html": "C. Customer orders"}, {"L": "D", "ok": true, "html": "D. Call center transcripts"}], "ansL": "D", "ans": "Call center transcripts 客服通話逐字稿", "trig": "example of unstructured data 非結構化資料的例子 → 逐字稿", "formula": "這組四選項在題庫裡反覆出現，記死：orders／ratings／inventory＝結構化，transcripts＝非結構化"}, {"no": "NO.273", "stem": "An organization processes batch sales data at the end of every month to analyze sales trends and derive business insights. They want to improve accuracy and make <b class=\"kw\">near real-time decisions</b>. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Filter the data so reports are generated faster."}, {"L": "B", "ok": true, "html": "B. Switch from batch processing to stream processing."}, {"L": "C", "ok": false, "html": "C. Process batch reports weekly instead of monthly."}, {"L": "D", "ok": false, "html": "D. Change from a relational database to a NoSQL database."}], "ansL": "B", "ans": "Switch from batch processing to stream processing.（從批次處理改為串流處理）", "trig": "near real-time decisions 近即時決策（現況是每月批次）→ 改用串流處理", "formula": "題目說「想從事後知道變成馬上知道」→ 一律 batch 改 stream，別去動資料庫或報表"}, {"no": "NO.300", "stem": "What is a <b class=\"kw\">defining function of streaming analytics</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Processing data records in batches"}, {"L": "B", "ok": true, "html": "B. Processing data records continuously"}, {"L": "C", "ok": false, "html": "C. Accessing data with high latency"}, {"L": "D", "ok": false, "html": "D. Processing a one-off data backfill"}], "ansL": "B", "ans": "Processing data records continuously（持續不斷地處理資料紀錄）", "trig": "defining function of streaming analytics 串流分析的定義性功能 → 持續處理", "formula": "streaming＝continuous 持續 + low latency 低延遲；batch＝分批 + 高延遲。互為反義"}, {"no": "NO.334", "stem": "An organization wants to build a <b class=\"kw\">data pipeline to transform its data</b> so it can be reconciled in a data warehouse. The solution must be scalable and require <b class=\"kw\">little or no management</b>. Which Google product or service should the organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Pub/Sub</b>"}, {"L": "B", "ok": true, "html": "B. <b>Dataflow</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Storage</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Bigtable</b>"}], "ansL": "B", "ans": "Dataflow 無伺服器資料處理服務", "trig": "data pipeline to transform its data 轉換資料的管線 + little or no management 幾乎免管理 → Dataflow", "formula": "transform 轉換 + pipeline 管線 + 免維運 → Dataflow；只是要「傳遞事件」→ Pub/Sub"}, {"no": "NO.387", "stem": "An organization needs to store structured, semi-structured, and unstructured data in its raw, <b class=\"kw\">native format in the same repository</b>. Which cloud data management solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Data field"}, {"L": "B", "ok": true, "html": "B. Data lake"}, {"L": "C", "ok": false, "html": "C. Database"}, {"L": "D", "ok": false, "html": "D. Data warehouse"}], "ansL": "B", "ans": "Data lake 資料湖", "trig": "raw, native format in the same repository 以原始格式存放在同一個儲存庫 → 資料湖", "formula": "raw／native format 不動它 → Data lake；transform 轉換過才進去 → Data warehouse"}, {"no": "NO.133", "stem": "Considering Google Cloud Storage different Options which of the following is / are correct on the basis of their <b class=\"kw\">real world use cases</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Storage</b>: Images, Large Media, files, backups."}, {"L": "B", "ok": false, "html": "B. Google <b>Cloud BigTable</b>: AdTech, Financial and IoT Data."}, {"L": "C", "ok": false, "html": "C. <b>Cloud SQL</b>: User Credentials, customer orders."}, {"L": "D", "ok": true, "html": "D. All of the Above."}], "ansL": "D", "ans": "All of the Above. 以上皆是", "trig": "real world use cases 實際使用情境 → 三組產品與用途的配對全部正確", "formula": "產品用途配對表：檔案影音→Storage；廣告/金融/IoT 高速寫入→Bigtable；帳號訂單→Cloud SQL"}, {"no": "NO.157", "stem": "Cloud SQL is a <b class=\"kw\">fully-managed relational database service</b> for MySQL, PostgreSQL and SQL servers, keeping Cloud SQL Google Cloud Service in mind, which of the following statements is/are correct?", "opts": [{"L": "A", "ok": false, "html": "A. Data inside <b>cloud SQL</b> is automatically Encrypted."}, {"L": "B", "ok": false, "html": "B. <b>Cloud SQL</b> automatically ensures your databases are reliable, secure, and scalable so that your business continues to run without disruption."}, {"L": "C", "ok": false, "html": "C. With DMS (Database Migration Service) it becomes very easy to Migration of Production Database."}, {"L": "D", "ok": true, "html": "D. All of the above"}], "ansL": "D", "ans": "All of the above 以上皆是", "trig": "fully-managed relational database service 全託管關聯式資料庫服務 → 三句都是 Cloud SQL 的正確描述", "formula": "敘述題若每句都是產品官方賣點、沒有一句用否定詞唱反調 → 選 All of the above"}, {"no": "NO.212", "stem": "What are the different <b class=\"kw\">storage</b> &amp; <b class=\"kw\">database services</b> in GCP? Which is Google cloud storage and database below the option", "opts": [{"L": "A", "ok": false, "html": "A. Persistent Disk"}, {"L": "B", "ok": false, "html": "B. <b>Cloud SQL</b>."}, {"L": "C", "ok": false, "html": "C. <b>Cloud Bigtable</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Spanner</b>"}, {"L": "E", "ok": true, "html": "E. All of the Above"}], "ansL": "E", "ans": "All of the Above 以上皆是", "trig": "storage &amp; database services 儲存與資料庫服務 → 四個選項全部屬於這一類", "formula": "「以下哪些屬於 GCP 儲存／資料庫服務」型題目，只要每個選項都是真實產品 → 選 All of the Above"}, {"no": "NO.219", "stem": "Considering Different Storage and database options e.g. Cloud Datastore, Cloud SQL, Cloud Storage, etc. Which of the following statements is/are correct? ( Select two answer)", "opts": [{"L": "A", "ok": true, "html": "A. Cloud DataStore and <b>Cloud SQL</b> have Terabytes + and Terabytes Capacity <b>respectively</b>."}, {"L": "B", "ok": false, "html": "B. <b>Cloud Bigtable</b> and <b>Cloud Storage</b> both have Petabytes + capacity."}, {"L": "C", "ok": false, "html": "C. <b>Cloud Bigtable</b> and <b>Cloud Storage</b> both have not Petabytes + capacity."}, {"L": "D", "ok": false, "html": "D. None of the above."}], "ansL": "A", "ans": "（Cloud Datastore 與 Cloud SQL 分別為 TB+ 與 TB 級容量；本題為複選，B 亦成立）", "trig": "respectively 分別地 + Petabytes + capacity PB 級以上容量 → 容量對照表", "formula": "容量分級記法：Cloud SQL／Datastore 到 TB 級；Bigtable、Cloud Storage、Spanner、BigQuery 到 PB 級以上"}, {"no": "NO.220", "stem": "Which of the following is/are <b class=\"kw\">core storage options</b> available on the Google Cloud Platform?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Storage</b> and Cloud Data Store"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Spanner</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud SQL</b> and Google Big Table"}, {"L": "D", "ok": true, "html": "D. All of the above"}], "ansL": "D", "ans": "All of the above 以上皆是", "trig": "core storage options 核心儲存選項 → 列出的產品全部都是", "formula": "選項只是把同一組核心產品拆開列 → 答案必然是 All of the above"}, {"no": "NO.39", "stem": "Your application has <b class=\"kw\">repeated data requests of the exact same nature</b>. At the same time, the number of user requests is increasing. Monitoring indicates that the load on the existing database is increasing, and there seems to be a bottleneck. An analysis of the data requested shows us that it is application-managed data and that it <b class=\"kw\">changes</b>, <b class=\"kw\">but not often</b>. How can you improve the efficiency of the application?", "opts": [{"L": "A", "ok": true, "html": "A. Use Cloud Memorystore to improve speed via caching"}, {"L": "B", "ok": false, "html": "B. Increase the amount of RAM on the machine hosting the database so that it has higher data throughput."}, {"L": "C", "ok": false, "html": "C. Use <b>Cloud Storage</b> with <b>multi-region</b>al storage so that all users accessing the data will have lower latency"}, {"L": "D", "ok": false, "html": "D. Increase the number of CPUs on the machine hosting the database so that it has higher data throughput."}], "ansL": "A", "ans": "Use Cloud Memorystore to improve speed via caching（用 Memorystore 快取加速）", "trig": "repeated data requests of the exact same nature 完全相同的重複請求 + changes, but not often 資料不常變動 → 快取", "formula": "「同樣的查詢一直重複 + 資料很少變」→ Memorystore 快取，不要選加大機器"}, {"no": "NO.126", "stem": "A customer has tens of applications that are <b class=\"kw\">dependent on Oracle databases</b> in their on-premise data centers. The customer wants to migrate to Google Cloud. Their long term goal is to move to other cloud native database technologies. What options do they have to <b class=\"kw\">initially move</b> their data?", "opts": [{"L": "A", "ok": true, "html": "A. Migrate to a <b>Bare Metal</b> server."}, {"L": "B", "ok": false, "html": "B. Migrate to <b>Cloud SQL</b>."}, {"L": "C", "ok": false, "html": "C. Since there is no hosted Oracle solution, leave the Oracle data on-premise while doing analytics on Google Cloud."}, {"L": "D", "ok": false, "html": "D. Containerize Oracle and run it using <b>Cloud Run</b>."}], "ansL": "A", "ans": "Migrate to a Bare Metal server.（Bare Metal Solution 裸機方案）", "trig": "dependent on Oracle databases 依賴 Oracle 資料庫 + initially move 初期先搬過去 → Bare Metal", "formula": "看到 Oracle → 先想 Bare Metal Solution；Cloud SQL 永遠不支援 Oracle，這是送分的排除點"}, {"no": "NO.170", "stem": "DriveSuper Inc. teaches its clients to drive cars and bikes and helps them get their license. They are planning to build a <b class=\"kw\">mobile application</b> where users can sign up, plan their schedules, and take stock of progress. They want the onboarding process to be <b class=\"kw\">smooth and frictionless</b>, giving users a great experience from the get-go. They want this done as quickly as possible and not be expensive. What is their best option on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Build the mobile app with <b>Cloud SQL</b> as the backend"}, {"L": "B", "ok": false, "html": "B. Build the mobile app with <b>Cloud Storage</b> as the backend"}, {"L": "C", "ok": true, "html": "C. Build the <b>mobile application</b> with Firebase as the backend"}, {"L": "D", "ok": false, "html": "D. Build the mobile app with <b>Cloud Spanner</b> as the backend"}], "ansL": "C", "ans": "Build the mobile application with Firebase as the backend（用 Firebase 當後端）", "trig": "mobile application 行動應用 + smooth and frictionless 順暢無阻的註冊體驗 + quickly ... not be expensive 快又便宜 → Firebase", "formula": "mobile app + 快速上線 + 省錢 → Firebase；如果題目強調 NoSQL 資料模型本身 → Firestore"}]}, {"name": "計算與部署", "tag": "好拿分", "rows": [{"no": "NO.4", "stem": "Which of the following options is/are correct about Preemptible VMs?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Preemptible</b> VMs don&#x27;t have fixed pricing."}, {"L": "B", "ok": false, "html": "B. Both A &amp; B"}, {"L": "C", "ok": true, "html": "C. None of the Above."}, {"L": "D", "ok": false, "html": "D. You can not use <b>Preemptible</b> VMs at fault-tolerant workloads such as high-performance computing, big data and analytics, continuous integration/continuous delivery (CI/CD), rendering/transcoding, and testing."}], "ansL": "C", "ans": "None of the Above.（以上皆非）", "trig": "don&#x27;t have fixed pricing 沒有固定價格 + can not use ... fault-tolerant 不能用於容錯工作 → 兩句都跟事實相反 → 以上皆非", "formula": "Preemptible 的事實面：有固定折扣價、專門用於容錯批次工作。敘述說「沒固定價」或「不能用於容錯」一律是錯的。"}, {"no": "NO.110", "stem": "You are a program manager within a Software as a Service (SaaS) company that offers rendering software for animation studios. Your team needs the ability to allow scenes to be scheduled at will and to be <b class=\"kw\">interrupted at any time</b> to restart later. Any individual scene rendering takes less than 12 hours to complete, and there is no service-level agreement (SLA) for the completion time for all scenes. Results will be stored in a global Cloud Storage bucket. The compute resources are not bound to any single geographical location. This software needs to run on Google Cloud in a <b class=\"kw\">cost-optimized</b> way. What should you do?", "opts": [{"L": "A", "ok": true, "html": "A. Deploy the application on <b>Compute Engine</b> using <b>preemptible</b> instances"}, {"L": "B", "ok": false, "html": "B. Develop the application so it can run in an unmanaged instance group"}, {"L": "C", "ok": false, "html": "C. Create a reservation for the minimum number of <b>Compute Engine</b> instances you will use"}, {"L": "D", "ok": false, "html": "D. Start more instances with fewer virtual centralized processing units (vCPUs) instead of fewer instances with more vCPUs"}], "ansL": "A", "ans": "Deploy the application on Compute Engine using preemptible instances（Compute Engine 可中斷執行個體）", "trig": "interrupted at any time 隨時可被中斷 + cost-optimized 成本最佳化 → Preemptible", "formula": "可中斷 ＋ 不趕時間（無 SLA）＋ 要最便宜 → Preemptible/Spot；要保證有機器可用 → Reservation。"}, {"no": "NO.164", "stem": "You are working in a company where you need to <b class=\"kw\">store Terabytes of Image Data daily</b> and <b class=\"kw\">process</b> them e.g. Taking photos of the entire planet 24 hours every day with satellite and sending data to data centres to store and process it. Which of the following would be the best combination for your infrastructure.", "opts": [{"L": "A", "ok": false, "html": "A. <b>Bare Metal</b> Solutions with Google <b>Cloud Storage</b>."}, {"L": "B", "ok": false, "html": "B. Google <b>Cloud Storage</b> &amp; Google Cloud <b>Compute Engine</b>s"}, {"L": "C", "ok": true, "html": "C. Google <b>Cloud Storage</b> &amp; <b>Preemptible</b> VMs."}, {"L": "D", "ok": false, "html": "D. None of the Above"}], "ansL": "C", "ans": "Google Cloud Storage &amp; Preemptible VMs.（Cloud Storage ＋ 可中斷 VM）", "trig": "store Terabytes of Image Data daily 每天存數 TB 影像 + process 處理 → Cloud Storage 負責存、Preemptible VM 負責便宜地算", "formula": "海量資料要放哪 → Cloud Storage；批次、可重跑、不趕時間的運算 → Preemptible VM。"}, {"no": "NO.186", "stem": "You are a program manager in a company and handling a project and you need to create a virtual machine on google cloud console that will be very simple to set up, by flipping a bit via command, API, or with developer console that gives you 30 seconds to shut down when you&#x27;re <b class=\"kw\">preempted</b>, allow you to save your work that also helps in the company budget upto 70-80% of <b class=\"kw\">less charges</b> than the regular VMs.", "opts": [{"L": "A", "ok": false, "html": "A. <b>Bare Metal</b> Solutions"}, {"L": "B", "ok": true, "html": "B. <b>Preemptible</b> Virtual Machines."}, {"L": "C", "ok": false, "html": "C. Google Cloud VM Instances"}, {"L": "D", "ok": false, "html": "D. None of the above."}], "ansL": "B", "ans": "Preemptible Virtual Machines.（可中斷虛擬機）", "trig": "30 seconds to shut down 30 秒關機緩衝 + preempted 被搶占 + 70-80% less charges 便宜七到八成 → Preemptible VM", "formula": "題幹出現「30 秒通知」「省七八成」「可被回收」任一 → 一律 Preemptible/Spot VM。"}, {"no": "NO.200", "stem": "Which of the following is / are true for Preemptible Instances.", "opts": [{"L": "A", "ok": false, "html": "A. <b>Preemptible</b> Instances have no Service Level Agreement (<b>Compute Engine</b> <b>SLA</b>)."}, {"L": "B", "ok": false, "html": "B. Google Cloud Free Tier credits for <b>compute engine</b> do not apply to <b>preemptible</b> instances."}, {"L": "C", "ok": false, "html": "C. <b>Preemptible</b> instances can&#x27;t live migrate to a regular VM instance, or be set to automatically restart when there is a maintenance event."}, {"L": "D", "ok": true, "html": "D. All of the above."}], "ansL": "D", "ans": "All of the above.（以上皆是）", "trig": "no Service Level Agreement 無 SLA + free tier credits do not apply 免費額度不適用 + can&#x27;t live migrate 不能即時遷移 → 三句都成立 → 以上皆是", "formula": "Preemptible 的三個「沒有」：沒 SLA、不吃免費額度、不能即時遷移。選項敘述全對就選 All of the above。"}, {"no": "NO.202", "stem": "Which of the following statements describe the features of a preemptible VM instance? (Select Three Answer)", "opts": [{"L": "A", "ok": false, "html": "A. Instance is alive for no more than 12 hours"}, {"L": "B", "ok": false, "html": "B. Can be pre-empted with a 30 minute notice"}, {"L": "C", "ok": true, "html": "C. Can be pre-empted with a 30 second notice"}, {"L": "D", "ok": false, "html": "D. Discounted Significantly"}, {"L": "E", "ok": false, "html": "E. Instance is alive for no more than 24 hours"}], "ansL": "C", "ans": "被搶占前 30 秒通知／D. 大幅折扣／E. 最長存活 24 小時（本題選三個）", "trig": "30 second notice 30 秒通知 + Discounted Significantly 大幅折扣 + no more than 24 hours 最長 24 小時 → C／D／E", "formula": "Preemptible 三個數字背死：30 秒通知、24 小時上限、大幅折扣。選項改成 12 小時或 30 分鐘一律刪。"}, {"no": "NO.385", "stem": "An organization runs a batch data analysis workload on a virtual machine (VM). The workload can be <b class=\"kw\">easily restarted without losing work</b>, and is <b class=\"kw\">not time critical</b>. Organizations must choose the <b class=\"kw\">lowest cost</b> option to run the workload. What option should they choose?", "opts": [{"L": "A", "ok": true, "html": "A. A standard VM in a pay-as-you-go model on <b>Compute Engine</b>"}, {"L": "B", "ok": false, "html": "B. A Cloud Function with a small memory limit"}, {"L": "C", "ok": true, "html": "C. A <b>Preemptible</b> or <b>Spot VM</b> on <b>Compute Engine</b>"}, {"L": "D", "ok": false, "html": "D. A custom VM in a pay-as-you-go model on <b>Compute Engine</b>"}], "ansL": "C + A", "ans": "A Preemptible or Spot VM on Compute Engine（可中斷／Spot VM）", "trig": "easily restarted without losing work 可輕易重啟不掉進度 + not time critical 不趕時間 + lowest cost 最低成本 → Preemptible/Spot", "formula": "「可重跑 ＋ 不急 ＋ 要最便宜」三個條件同時出現，答案固定是 Spot/Preemptible。"}, {"no": "NO.116", "stem": "A customer is migrating their on-premises data analytics solution to Google Cloud. The current solution has a lot of data being <b class=\"kw\">read from and written to disk</b>. The performance of this approach has occasionally been a <b class=\"kw\">bottleneck</b> for a scale of operations that your customer has. The application is fault tolerant and can withstand <b class=\"kw\">machines going down frequently</b>. In moving to Google Cloud they are asking your advice on any way to improve performance?", "opts": [{"L": "A", "ok": false, "html": "A. Use <b>BigQuery</b> which has very fast data access and analysis"}, {"L": "B", "ok": false, "html": "B. Use <b>Cloud Storage</b> which can be central, scalable storage"}, {"L": "C", "ok": true, "html": "C. Use local SSDs with the VMs"}, {"L": "D", "ok": false, "html": "D. Use Persistent Disk with the VMs"}], "ansL": "C", "ans": "Use local SSDs with the VMs（本機 SSD）", "trig": "read from and written to disk 大量磁碟讀寫 + bottleneck 瓶頸 + machines going down frequently 機器常掛也沒關係 → Local SSD", "formula": "磁碟 I/O 是瓶頸 ＋ 資料掉了可以重來（容錯）→ Local SSD；資料一定要保住 → Persistent Disk。"}, {"no": "NO.123", "stem": "A client is currently running software on their on-premise systems that is bound by a certain type of <b class=\"kw\">license</b>. They are allowed to run the software on virtualized machines. However, they <b class=\"kw\">cannot run them on virtualized machines that are shared</b> by two different companies, teams, or projects. What option do they have on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Google Cloud is a public cloud accessed by multiple customers."}, {"L": "B", "ok": false, "html": "B. Allocate a <b>Bare Metal</b> machine."}, {"L": "C", "ok": false, "html": "C. Setup exclusive login to the VM with self-generated security keys."}, {"L": "D", "ok": true, "html": "D. Allocate <b>sole-tenant</b> nodes"}], "ansL": "D", "ans": "Allocate sole-tenant nodes（單一租戶節點）", "trig": "cannot run them on virtualized machines that are shared 不能跟別人共用的虛擬機環境 + license 授權限制 → Sole-tenant nodes", "formula": "授權綁實體主機、不能與他人共用硬體，但仍要跑 VM → Sole-tenant nodes；連虛擬化都不要 → Bare Metal。"}, {"no": "NO.174", "stem": "A financial services company is running an experimental application workload that has a very large number of mathematical calculations involving <b class=\"kw\">floating-point numbers</b>. The current application that is running on compute engine is <b class=\"kw\">not providing enough speed and throughput</b>. What are the options to increase the processing performance?", "opts": [{"L": "A", "ok": false, "html": "A. Use a <b>serverless</b> option like <b>Cloud Functions</b> that will automatically scale as much as required."}, {"L": "B", "ok": false, "html": "B. Instead of using a &quot;general pu<b>rpo</b>se&quot; machine family, use &quot;compute-optimized&quot; machine family."}, {"L": "C", "ok": false, "html": "C. Since processing could also be dependent on reading and writing data to the disk, use a fast Local SSD."}, {"L": "D", "ok": true, "html": "D. Attach <b>GPU</b>s to the virtual machine for number crunching."}], "ansL": "D", "ans": "Attach GPUs to the virtual machine for number crunching.（掛載 GPU）", "trig": "floating-point numbers 浮點數運算 + not providing enough speed and throughput 速度與吞吐量不夠 → 掛 GPU", "formula": "大量平行數學／ML 訓練 → GPU（或 TPU）；單執行緒 CPU 吃緊 → compute-optimized 機型；磁碟慢 → Local SSD。"}, {"no": "NO.330", "stem": "What is a benefit of Google&#x27;s <b class=\"kw\">purpose-built servers</b> compared to standard servers?", "opts": [{"L": "A", "ok": false, "html": "A. They run software that cannot be deployed on standard servers."}, {"L": "B", "ok": false, "html": "B. They are backward compatible with legacy disk drives."}, {"L": "C", "ok": true, "html": "C. They are optimized for specific tasks making them more efficient."}, {"L": "D", "ok": false, "html": "D. They are cheaper to build than standard servers."}], "ansL": "C", "ans": "They are optimized for specific tasks making them more efficient.（針對特定任務最佳化，效率更高）", "trig": "purpose-built servers 為特定目的打造的伺服器 → optimized for specific tasks 針對特定任務最佳化", "formula": "看到 purpose-built／custom hardware，答案幾乎都是「針對特定工作最佳化、更有效率」。"}, {"no": "NO.299", "stem": "An organization wants to add a new function to their application. They want to <b class=\"kw\">write the code</b> and <b class=\"kw\">let the public cloud provider handle the infrastructure</b>. Which infrastructure solution should they use?", "opts": [{"L": "A", "ok": false, "html": "A. Virtual machines"}, {"L": "B", "ok": false, "html": "B. <b>Bare Metal</b> Solution"}, {"L": "C", "ok": true, "html": "C. <b>Serverless</b> computing"}, {"L": "D", "ok": false, "html": "D. Container Registry"}], "ansL": "C", "ans": "Serverless computing（無伺服器運算）", "trig": "write the code 只寫程式碼 + let the public cloud provider handle the infrastructure 基礎設施交給雲端商 → Serverless", "formula": "只給程式碼、其他都不碰 → Serverless；要碰 OS → VM／IaaS。"}, {"no": "NO.314", "stem": "An organization wants to <b class=\"kw\">run their custom application</b> in the cloud in a flexible and scalable way <b class=\"kw\">without managing any infrastructure</b>. Which service model should they use?", "opts": [{"L": "A", "ok": false, "html": "A. Infrastructure as a service"}, {"L": "B", "ok": true, "html": "B. Platform as a service"}, {"L": "C", "ok": false, "html": "C. Network as a service"}, {"L": "D", "ok": false, "html": "D. Software as a service"}], "ansL": "B", "ans": "Platform as a service（平台即服務，PaaS）", "trig": "run their custom application 跑自己寫的應用 + without managing any infrastructure 完全不管基礎設施 → PaaS", "formula": "自己寫程式但不管機器 → PaaS；用別人寫好的軟體 → SaaS；自己管機器與 OS → IaaS。"}, {"no": "NO.345", "stem": "An organization wants to <b class=\"kw\">access a software application from a cloud vendor</b> without the need to manage their own servers or write their own code Which service model does this represent?", "opts": [{"L": "A", "ok": false, "html": "A. Functions as a service"}, {"L": "B", "ok": false, "html": "B. Platform as a service"}, {"L": "C", "ok": false, "html": "C. Infrastructure as a service"}, {"L": "D", "ok": true, "html": "D. Software as a service"}], "ansL": "D", "ans": "Software as a service（軟體即服務，SaaS）", "trig": "access a software application from a cloud vendor 直接用雲端商提供的軟體 + without ... write their own code 不用自己寫程式 → SaaS", "formula": "三層模式裡唯一「不用寫程式」的就是 SaaS；看到 without writing code 直接選它。"}, {"no": "NO.8", "stem": "Your company&#x27;s development team is building an application that will be deployed on <b class=\"kw\">Cloud Run</b>. You are designing a CI/CD pipeline so that any new version of the application can be deployed in the fewest number of steps possible using the CI/CD pipeline you are designing. You need to select a storage location for the <b class=\"kw\">images of the application</b> after the CI part of your pipeline has built them. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Create a <b>Compute Engine</b> image containing the application"}, {"L": "B", "ok": true, "html": "B. Store the images in Container Registry"}, {"L": "C", "ok": false, "html": "C. Store the images in <b>Cloud Storage</b>"}, {"L": "D", "ok": false, "html": "D. Create a <b>Compute Engine</b> disk containing the application"}], "ansL": "B", "ans": "Store the images in Container Registry（存進 Container Registry）", "trig": "images of the application 應用程式的容器映像檔 + Cloud Run → Container Registry", "formula": "容器映像檔存放 → Container Registry／Artifact Registry；VM 磁碟或映像才會經過 Cloud Storage。"}, {"no": "NO.13", "stem": "You are a program manager for a team of developers who are building an event-driven application to allow users to follow one another&#x27;s activities in the app. Each time a user adds himself as a follower of another user, a write occurs in the real-time database. The developers will develop a lightweight piece of code that can <b class=\"kw\">respond to database writes</b> and generate a notification to let the appropriate users know that they have gained new followers. The code should integrate with other cloud services such as Pub/Sub, Firebase, and Cloud APIs to streamline the orchestration process. The application requires a platform that automatically manages underlying infrastructure and <b class=\"kw\">scales to zero</b> when there is no activity. Which primary compute resource should your developers select, given these requirements?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Google Kubernetes Engine</b>"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Functions</b>"}, {"L": "C", "ok": false, "html": "C. <b>App Engine</b> flexible environment"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b>"}], "ansL": "B", "ans": "Cloud Functions（雲端函式）", "trig": "respond to database writes 回應資料庫寫入事件 + scales to zero 沒活動時縮到零 → Cloud Functions", "formula": "事件觸發 ＋ 一小段程式碼 ＋ 縮到零 → Cloud Functions；整個容器化服務要跑 → Cloud Run。"}, {"no": "NO.199", "stem": "App Engine has been deployed in your customers GCP cloud deployment. The customer would like to know more about the benefits of <b class=\"kw\">App Engine Flexible</b>. Please advise them on the benefits of App Engine Flexible (Select Two Answers)", "opts": [{"L": "A", "ok": true, "html": "A. Supports <b>autoscaling</b>"}, {"L": "B", "ok": false, "html": "B. Supports Docker containers"}, {"L": "C", "ok": false, "html": "C. Supports mainframe connectivity"}, {"L": "D", "ok": false, "html": "D. Source code is written in specific versions of the supported programming languages only"}], "ansL": "A", "ans": "Supports autoscaling 支援自動擴展／B. Supports Docker containers 支援 Docker 容器（本題選兩個）", "trig": "App Engine Flexible 彈性環境 → autoscaling 自動擴展 + Docker containers 跑 Docker 容器", "formula": "App Engine Standard＝限定語言版本、可縮到零；Flexible＝跑 Docker 容器、可自訂環境但不縮到零。"}, {"no": "NO.203", "stem": "Your customer has a reporting tool that is <b class=\"kw\">only occasionally used</b> by the leadership team. Usage of it is frequent - once a week, once a month, or once the quarter. They want to run this application in a <b class=\"kw\">cost-effective</b> manner. What are the compute options available on Google Cloud which would be suitable? (Choose Two answer)", "opts": [{"L": "A", "ok": true, "html": "A. <b>Cloud Run</b>"}, {"L": "B", "ok": false, "html": "B. Cloud <b>App Engine</b> Standard"}, {"L": "C", "ok": false, "html": "C. <b>Compute Engine</b>"}, {"L": "D", "ok": false, "html": "D. Kubernetes Engine"}], "ansL": "A", "ans": "Cloud Run／B. App Engine Standard（本題選兩個）", "trig": "only occasionally used 只是偶爾使用 + cost-effective 要划算 → 會縮到零的 Cloud Run 與 App Engine Standard", "formula": "使用頻率極低、要省錢 → 選能 scale to zero 的（Cloud Run、App Engine Standard、Cloud Functions）。"}, {"no": "NO.238", "stem": "An organization relies on online <b class=\"kw\">seasonal sales</b> for the majority of their annual revenue. Why should the organization use App Engine for their customer app?", "opts": [{"L": "A", "ok": false, "html": "A. Automatically adjusts physical inventory in real time"}, {"L": "B", "ok": true, "html": "B. Autoscales during peaks in demand"}, {"L": "C", "ok": false, "html": "C. Runs maintenance during seasonal sales"}, {"L": "D", "ok": false, "html": "D. Recommends the right products to customers"}], "ansL": "B", "ans": "Autoscales during peaks in demand（需求尖峰時自動擴展）", "trig": "seasonal sales 季節性促銷（流量會爆衝）→ autoscales during peaks 尖峰自動擴展", "formula": "問「為什麼要用 App Engine／無伺服器」，標準答案永遠是自動擴展＋不用管基礎設施。"}, {"no": "NO.254", "stem": "An organization wants to build <b class=\"kw\">autoscaling web applications</b> <b class=\"kw\">without having to manage application infrastructure</b>. Which Google Cloud product should they use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>App Engine</b>"}, {"L": "B", "ok": false, "html": "B. <b>AutoML</b>"}, {"L": "C", "ok": false, "html": "C. <b>Anthos</b>"}, {"L": "D", "ok": false, "html": "D. <b>Apigee</b>"}], "ansL": "A", "ans": "App Engine（應用平台）", "trig": "autoscaling web applications 可自動擴展的網頁應用 + without having to manage application infrastructure 不用管基礎設施 → App Engine", "formula": "「網頁應用＋自動擴展＋不管基礎設施」是 App Engine 的招牌；A 開頭四兄弟（App Engine／AutoML／Anthos／Apigee）用途要分清楚。"}, {"no": "NO.329", "stem": "An organization has a small development team that has created a web application which <b class=\"kw\">runs in a single container</b>. They need a <b class=\"kw\">simple serverless and scalable</b> way to host their container Which Google service should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Cloud Run</b>"}, {"L": "B", "ok": false, "html": "B. Kubernetes Engine"}, {"L": "C", "ok": false, "html": "C. <b>App Engine</b>"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b>"}], "ansL": "A", "ans": "Cloud Run（全代管容器服務）", "trig": "runs in a single container 跑在單一容器裡 + simple serverless and scalable 簡單、無伺服器、可擴展 → Cloud Run", "formula": "有容器＋不想管 → Cloud Run；有容器＋要細部控制或多服務編排 → GKE。"}, {"no": "NO.369", "stem": "An organization wants to write and run <b class=\"kw\">small pieces of code</b> in a <b class=\"kw\">serverless</b> way that <b class=\"kw\">respond to events</b> like huge discounts. Which Google Cloud compute solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Google Kubernetes Engine</b>"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Functions</b>"}, {"L": "C", "ok": false, "html": "C. <b>Bare Metal</b> Solution"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b>"}], "ansL": "B", "ans": "Cloud Functions（雲端函式）", "trig": "small pieces of code 小段程式碼 + respond to events 回應事件 + serverless 無伺服器 → Cloud Functions", "formula": "events ＋ small code ＋ serverless 三個字湊齊 → Cloud Functions，不必再想別的。"}, {"no": "NO.382", "stem": "An organization wants its users to <b class=\"kw\">validate a series of new features</b> for their app. Why should they use App Engine?", "opts": [{"L": "A", "ok": false, "html": "A. Because their app is containerized and enabled by microservices"}, {"L": "B", "ok": false, "html": "B. Because the updated app will only include new features"}, {"L": "C", "ok": true, "html": "C. To run different versions of the app for different users"}, {"L": "D", "ok": false, "html": "D. To run different versions of the app for the same user"}], "ansL": "C", "ans": "To run different versions of the app for different users（對不同使用者跑不同版本）", "trig": "validate a series of new features 驗證一批新功能 → 用版本並存＋流量分割做測試", "formula": "App Engine 的特有賣點：多版本並存＋traffic splitting（流量分割）做 A/B 測試與灰度發布。"}, {"no": "NO.390", "stem": "What is the benefit of using a <b class=\"kw\">serverless</b> data processing pipeline service?", "opts": [{"L": "A", "ok": true, "html": "A. Pipeline infrastructure is <b>fully managed</b> and scalable."}, {"L": "B", "ok": false, "html": "B. Processed data will not require analysis."}, {"L": "C", "ok": false, "html": "C. Full control over compute resources is provided."}, {"L": "D", "ok": false, "html": "D. Processed data is guaranteed to be free of errors."}], "ansL": "A", "ans": "Pipeline infrastructure is fully managed and scalable.（流程基礎設施全託管且可擴展）", "trig": "serverless 無伺服器 → fully managed and scalable 全託管且可擴展", "formula": "無伺服器的好處只有兩類：不用管基礎設施、自動擴展。看到「完整控制」或「保證正確」直接刪。"}, {"no": "NO.3", "stem": "As your organization increases its release velocity, the VM-based application upgrades take a long time to perform rolling updates <b class=\"kw\">due to OS boot times</b>. You need to make the application deployments faster. What should your organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Migrate your VMs to the cloud, and add more resources to them"}, {"L": "B", "ok": true, "html": "B. Convert your applications into containers"}, {"L": "C", "ok": false, "html": "C. Increase the resources of your VMs"}, {"L": "D", "ok": false, "html": "D. Automate your upgrade rollouts"}], "ansL": "B", "ans": "Convert your applications into containers（把應用轉成容器）", "trig": "rolling updates take a long time 滾動更新太慢 + due to OS boot times 因為 OS 開機時間 → 改用容器", "formula": "瓶頸是「OS 開機慢／部署慢」→ 容器化。容器不用開 OS，這是它跟 VM 最大的速度差。"}, {"no": "NO.95", "stem": "An organization runs their application on a virtual machine, but every time they want to edit specific features, they have to <b class=\"kw\">bring the system offline to update</b> the application. What would be a more appropriate solution for their app?", "opts": [{"L": "A", "ok": false, "html": "A. <b>GPU</b>s"}, {"L": "B", "ok": true, "html": "B. Containers"}, {"L": "C", "ok": false, "html": "C. Hypervisors"}, {"L": "D", "ok": false, "html": "D. Solid State Disk"}], "ansL": "B", "ans": "Containers（容器）", "trig": "bring the system offline to update 更新必須先停機 → 容器", "formula": "更新要停機／部署太慢 → 容器；容器多到需要自動編排 → GKE。"}, {"no": "NO.104", "stem": "Your organization wants to run a container-based application on Google Cloud. This application is expected to increase in complexity. You have a security need for <b class=\"kw\">fine-grained control of traffic between the containers</b>. You also have an operational need to exercise fine-grained control over the application&#x27;s scaling policies. What Google Cloud product or feature should your organization use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Google Kubernetes Engine</b> cluster"}, {"L": "B", "ok": false, "html": "B. <b>App Engine</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Run</b>"}, {"L": "D", "ok": false, "html": "D. <b>Compute Engine</b> virtual machines"}], "ansL": "A", "ans": "Google Kubernetes Engine cluster（GKE 叢集）", "trig": "fine-grained control of traffic between the containers 容器間流量的細緻控制 + fine-grained control over scaling policies 擴展政策細控 → GKE", "formula": "容器＋要細部控制（網路、擴展、排程）→ GKE；容器＋只想跑起來 → Cloud Run。"}, {"no": "NO.140", "stem": "Your customer&#x27;s IT team is in the process of modernizing their customer-facing applications. They&#x27;ve witnessed others getting good results from employing <b class=\"kw\">microservices</b>, and they&#x27;re keen to adopt it themselves. The first application that they are modernizing has about 5 different sub-parts, which they have identified will be the services. They also identify that each of them has <b class=\"kw\">different scale requirements</b> - some services like user login are less frequently used while others like transactions are heavily used. What technical strategy would you recommend for them?", "opts": [{"L": "A", "ok": true, "html": "A. Containerize the services and orchestrate them with <b>Google Kubernetes Engine</b>."}, {"L": "B", "ok": false, "html": "B. Retain the original application in <b>Compute Engine</b> and scale it as needed using Managed Instance Groups."}, {"L": "C", "ok": false, "html": "C. Retain the original application as a backup and also for separately scaling the services, create new application binaries."}, {"L": "D", "ok": false, "html": "D. Retain the original application in <b>Compute Engine</b> and scale it as needed using Unmanaged Instance Groups."}], "ansL": "A", "ans": "Containerize the services and orchestrate them with Google Kubernetes Engine.（容器化＋GKE 編排）", "trig": "microservices 微服務 + different scale requirements 各服務擴展需求不同 → 容器化＋GKE", "formula": "拆成多個服務、各自有不同擴展需求 → 容器化＋GKE；整包不拆只要自動擴縮 → 受管執行個體群組（MIG）。"}, {"no": "NO.162", "stem": "In terms of <b class=\"kw\">Docker</b>s and Kubernetes, which of the following statements are correct?", "opts": [{"L": "A", "ok": false, "html": "A. Kubernetes uses Docker to deploy, manage, and scale containerized applications."}, {"L": "B", "ok": false, "html": "B. Difference between Docker and Kubernetes relates to the role each play in containerizing and running your applications"}, {"L": "C", "ok": false, "html": "C. Kubernetes can be used with or without Docker."}, {"L": "D", "ok": true, "html": "D. All of the above."}], "ansL": "D", "ans": "All of the above.（以上皆是）", "trig": "Kubernetes uses Docker 用 Docker + can be used with or without Docker 也可以不用 Docker → 三句敘述都成立 → 以上皆是", "formula": "Docker 管「打包與跑單一容器」，Kubernetes 管「大規模編排」；兩者互補不互斥，敘述全對就選 All of the above。"}, {"no": "NO.210", "stem": "What is a <b class=\"kw\">key difference</b> between VMs and containers?", "opts": [{"L": "A", "ok": false, "html": "A. Virtual Machines take less time to launch; containers take longer to launch."}, {"L": "B", "ok": false, "html": "B. Virtual Machines can only run Linux; containers can run any operating system."}, {"L": "C", "ok": false, "html": "C. Virtual Machines use a shared operating system and are therefore lighter; containers are heavier on resources."}, {"L": "D", "ok": true, "html": "D. Each Virtual Machine in a machine has its own <b>operating system</b>; containers will share the same operating system."}], "ansL": "D", "ans": "Each Virtual Machine in a machine has its own operating system; containers will share the same operating system.（每台 VM 各有 OS、容器共用 OS）", "trig": "key difference 關鍵差異 + operating system 作業系統 → VM 各自帶 OS、容器共用 OS", "formula": "VM＝每台自帶一整套 OS（重、開機慢）；容器＝共用主機 OS（輕、秒起）。選項把輕重或快慢講反就是錯的。"}, {"no": "NO.244", "stem": "An organization is running Kubernetes applications <b class=\"kw\">across multiple cloud environments</b>. They want a <b class=\"kw\">consistent and centralized management</b> platform. Which service should they choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Run</b>"}, {"L": "B", "ok": false, "html": "B. <b>Compute Engine</b>"}, {"L": "C", "ok": true, "html": "C. <b>GKE</b> Enterprise"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Functions</b>"}], "ansL": "C", "ans": "GKE Enterprise（跨環境的 Kubernetes 管理平台，原 Anthos）", "trig": "across multiple cloud environments 跨多個雲環境 + consistent and centralized management 一致且集中的管理 → GKE Enterprise", "formula": "出現 multi-cloud／hybrid ＋ 一致管理 Kubernetes → GKE Enterprise（就是以前的 Anthos）。"}, {"no": "NO.307", "stem": "An organization is developing applications by using Kubernetes. They want their teams to <b class=\"kw\">spend more time developing rather than managing clusters</b>. Which Google Cloud service should the organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Run</b>"}, {"L": "B", "ok": false, "html": "B. <b>Compute Engine</b>"}, {"L": "C", "ok": true, "html": "C. <b>GKE Autopilot</b>"}, {"L": "D", "ok": false, "html": "D. <b>GKE</b> Standard"}], "ansL": "C", "ans": "GKE Autopilot（全代管模式的 GKE）", "trig": "spend more time developing rather than managing clusters 多寫程式少管叢集 → GKE Autopilot", "formula": "要用 Kubernetes 又不想管節點 → Autopilot；要完整控制節點規格與設定 → Standard。"}, {"no": "NO.327", "stem": "An organization needs to run <b class=\"kw\">frequent updates</b> for their business app. Why should the organization use Google Kubernetes Engine (GKE)?", "opts": [{"L": "A", "ok": false, "html": "A. Customer expectations can be adjusted without using marketing tools"}, {"L": "B", "ok": true, "html": "B. Seamless changes can be made without causing any application downtime."}, {"L": "C", "ok": false, "html": "C. <b>GKE</b> handles version control seamlessly and out of the box"}, {"L": "D", "ok": false, "html": "D. <b>GKE</b> is well suited for all monolithic applications"}], "ansL": "B", "ans": "Seamless changes can be made without causing any application downtime.（可無縫變更、不停機）", "trig": "frequent updates 頻繁更新 → seamless changes without downtime 無縫更新不停機", "formula": "問 GKE／容器的好處 → 滾動更新、不停機部署、可獨立擴展。選項出現「所有」「保證」這種絕對字先刪。"}, {"no": "NO.371", "stem": "An organization is operating <b class=\"kw\">multiple workloads in containers</b> and requires <b class=\"kw\">full control of how the workloads are configured</b>. Which Google Cloud service should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Functions</b>"}, {"L": "B", "ok": false, "html": "B. <b>Compute Engine</b>"}, {"L": "C", "ok": true, "html": "C. Kubernetes Engine"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Run</b>"}], "ansL": "C", "ans": "Kubernetes Engine（GKE）", "trig": "multiple workloads in containers 多個容器化工作負載 + full control of how the workloads are configured 完整掌控設定 → GKE", "formula": "容器＋full control → GKE；容器＋不想管 → Cloud Run。這組對比幾乎每次考試都出現。"}, {"no": "NO.393", "stem": "An organization is developing a new container-based application. They <b class=\"kw\">do not know how popular the application will be</b> when launched and they <b class=\"kw\">do not want to pay for idle infrastructure</b> resources. Which benefit of serverless computing will address this concern?", "opts": [{"L": "A", "ok": false, "html": "A. Reduced development costs"}, {"L": "B", "ok": false, "html": "B. Built-in security"}, {"L": "C", "ok": true, "html": "C. Scalability"}, {"L": "D", "ok": false, "html": "D. <b>Disaster recovery</b>"}], "ansL": "C", "ans": "Scalability（可擴展性）", "trig": "do not know how popular the application will be 不知道會多熱門 + do not want to pay for idle infrastructure 不想為閒置資源付錢 → Scalability", "formula": "「流量不確定＋不想付閒置費」→ 答案永遠是 scalability／自動擴展。"}, {"no": "NO.31", "stem": "Your company has been using a shared facility for data storage and will be migrating to Google Cloud. One of the internal applications uses <b class=\"kw\">Linux custom images</b> that need to be migrated. Which Google Cloud product should you use to <b class=\"kw\">maintain the custom images</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>App Engine</b> flexible environment"}, {"L": "B", "ok": true, "html": "B. <b>Compute Engine</b>"}, {"L": "C", "ok": false, "html": "C. <b>App Engine</b> standard environment"}, {"L": "D", "ok": false, "html": "D. <b>Google Kubernetes Engine</b>"}], "ansL": "B", "ans": "Compute Engine（虛擬機服務）", "trig": "Linux custom images 自訂的 Linux 映像 + maintain the custom images 維護這些自訂映像 → Compute Engine", "formula": "題幹出現 custom image／自訂 OS／特定核心版本 → Compute Engine，其他運算服務都碰不到 OS 層。"}, {"no": "NO.112", "stem": "You are working with the head of the IT team and planning the move of computing systems. The questionnaire indicates that they have a reporting application that <b class=\"kw\">runs almost 24 hours every day</b> of the week. When there is extra load, it <b class=\"kw\">queues up the processing</b> and executes tasks when there is less demand. Which of these compute options would you recommend for them?", "opts": [{"L": "A", "ok": false, "html": "A. Use a <b>serverless</b> option - <b>App Engine</b> Standard for Flex"}, {"L": "B", "ok": true, "html": "B. Use a server-based option - <b>Compute Engine</b>."}, {"L": "C", "ok": false, "html": "C. Use a <b>serverless</b> option - <b>Cloud Functions</b>"}, {"L": "D", "ok": false, "html": "D. <b>Serverless</b> option - <b>Cloud Run</b>"}], "ansL": "B", "ans": "Use a server-based option - Compute Engine.（Compute Engine 長駐 VM）", "trig": "runs almost 24 hours every day 幾乎全天候運行 + queues up the processing 把工作排隊起來慢慢跑 → Compute Engine", "formula": "幾乎不間斷運行 → Compute Engine；流量忽高忽低、會歸零 → 無伺服器。判準是「使用率高不高」，不是「新不新潮」。"}, {"no": "NO.172", "stem": "Which of the following is true while creating a boot persistent disk from a snapshot.", "opts": [{"L": "A", "ok": false, "html": "A. You cannot apply a snapshot to an existing persistent disk, or apply a snapshot to persistent disks that belong to a different <b>project</b> than that snapshot."}, {"L": "B", "ok": false, "html": "B. It is only possible to apply data from a snapshot when you first create a persistent disk."}, {"L": "C", "ok": false, "html": "C. After you create a snapshot of a boot persistent disk, you can apply data from that snapshot to new persistent disks."}, {"L": "D", "ok": true, "html": "D. All of the above."}], "ansL": "D", "ans": "All of the above.（以上皆是）", "trig": "create a boot persistent disk from a snapshot 用快照建立開機用永久磁碟 → 三項敘述皆成立 → 以上皆是", "formula": "快照只能拿來「建新磁碟」，不能覆蓋既有磁碟；三句敘述都對就選 All of the above。"}, {"no": "NO.207", "stem": "A customer has an application running in virtual machines. They are migrating this application to Google Cloud. They have previously had scaling issues when on-premises as VMs had to be pre-allocated. Capacity planning was repeatedly off mark - it&#x27;s either too many VMs or too less. They want to <b class=\"kw\">match the capacity to demand</b> while keeping the application running always. They <b class=\"kw\">don&#x27;t have the time or budget to re-architect</b> the systems using containers and Kubernetes at the moment. What would be your recommendation?", "opts": [{"L": "A", "ok": false, "html": "A. Run a load test on <b>Compute Engine</b> VMs. Get an estimate of usage. Then plan for a VM capacity of 25% above the load test value."}, {"L": "B", "ok": true, "html": "B. Use the Managed Instance Group with <b>Compute Engine</b>"}, {"L": "C", "ok": false, "html": "C. Inform them that new-age companies are using microservices, containers, and Kubernetes for this and they can plan to rewrite the app quickly."}, {"L": "D", "ok": false, "html": "D. Inform them that using a <b>serverless</b> option will take care of the scaling and they can move to <b>Cloud Run</b> or <b>App Engine</b>."}], "ansL": "B", "ans": "Use the Managed Instance Group with Compute Engine（受管執行個體群組＋Compute Engine）", "trig": "match the capacity to demand 容量隨需求調整 + don&#x27;t have the time or budget to re-architect 沒時間預算重新架構 → Managed Instance Group", "formula": "不能改程式＋要自動擴縮 → Managed Instance Group；可以改程式 → 容器或無伺服器。"}, {"no": "NO.216", "stem": "Which of the following methods should you use when you require a <b class=\"kw\">dynamic way of provisioning</b> VMs on Compute Engine when it is observed that the <b class=\"kw\">exact specifications will be in a dedicated configuration file</b> and you want to follow Google&#x27;s recommended practices.", "opts": [{"L": "A", "ok": false, "html": "A. Managed Instance Group"}, {"L": "B", "ok": true, "html": "B. Deployment Manager"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Composer</b>"}, {"L": "D", "ok": false, "html": "D. Unmanaged Instance Group"}], "ansL": "B", "ans": "Deployment Manager（基礎設施佈建服務）", "trig": "exact specifications will be in a dedicated configuration file 規格寫在專用設定檔裡 + dynamic way of provisioning 動態佈建 → Deployment Manager", "formula": "看到「用設定檔描述基礎設施、自動開資源」→ Deployment Manager（Infrastructure as Code）。"}, {"no": "NO.239", "stem": "An organization wants <b class=\"kw\">full control of their virtual machine infrastructure</b> for a custom homegrown application with a product that <b class=\"kw\">autoscales</b> and automatically updates. Which Google Cloud product or solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Cloud Build"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Run</b>"}, {"L": "C", "ok": true, "html": "C. <b>Compute Engine</b>"}, {"L": "D", "ok": false, "html": "D. <b>App Engine</b>"}], "ansL": "C", "ans": "Compute Engine（虛擬機服務）", "trig": "full control of their virtual machine infrastructure 完整掌控 VM 基礎設施 + autoscales 自動擴展 → Compute Engine", "formula": "題幹同時出現 full control ＋ virtual machine → Compute Engine，其他選項一律先刪。"}, {"no": "NO.309", "stem": "Which technology allows organizations to run <b class=\"kw\">multiple computer operating systems</b> on a <b class=\"kw\">single piece of physical hardware</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Hypervisor"}, {"L": "B", "ok": false, "html": "B. Containers"}, {"L": "C", "ok": false, "html": "C. <b>Serverless</b> computing"}, {"L": "D", "ok": false, "html": "D. Open source"}], "ansL": "A", "ans": "Hypervisor（虛擬機監控器）", "trig": "multiple computer operating systems 多個作業系統 + single piece of physical hardware 單一實體硬體 → Hypervisor", "formula": "一台實體機跑多個 OS → Hypervisor／VM；一個 OS 上跑多個隔離應用 → 容器。"}, {"no": "NO.335", "stem": "An organization has an <b class=\"kw\">on-premises</b> IT infrastructure. Their customer-facing application <b class=\"kw\">repeatedly fails during peak usage</b>. What could be causing this issue?", "opts": [{"L": "A", "ok": false, "html": "A. A <b>serverless</b> compute function struggles to scale."}, {"L": "B", "ok": false, "html": "B. The application contains unclean data."}, {"L": "C", "ok": true, "html": "C. They don&#x27;t have enough servers to meet the demand."}, {"L": "D", "ok": false, "html": "D. The application is only configurable on-premises."}], "ansL": "C", "ans": "They don&#x27;t have enough servers to meet the demand.（伺服器數量不足以應付需求）", "trig": "on-premises 地端自建機房 + repeatedly fails during peak usage 尖峰時反覆掛掉 → 實體伺服器不夠", "formula": "地端＋尖峰掛掉 → 實體容量固定不夠用，這正是上雲換取彈性擴展的理由。"}, {"no": "NO.416", "stem": "An organization wants to migrate legacy applications currently hosted in their data center to the cloud. The current architecture dictates that <b class=\"kw\">each application needs its own operating system</b> (OS) <b class=\"kw\">instead of sharing an OS</b>. Which infrastructure solution should they choose?", "opts": [{"L": "A", "ok": true, "html": "A. Virtual machines"}, {"L": "B", "ok": false, "html": "B. Open source"}, {"L": "C", "ok": false, "html": "C. <b>Serverless</b> computing"}, {"L": "D", "ok": false, "html": "D. Containers"}], "ansL": "A", "ans": "Virtual machines（虛擬機）", "trig": "each application needs its own operating system 每個應用都要有自己的 OS + instead of sharing an OS 而不是共用 → Virtual machines", "formula": "「各自要有自己的 OS」→ VM；「共用 OS、輕量快啟」→ 容器。同一組判準的正反面，考題最愛互換著問。"}, {"no": "NO.5", "stem": "How do Migrate for Compute Engine and Migrate for Anthos differ?", "opts": [{"L": "A", "ok": false, "html": "A. Unlike Migrate for <b>Anthos</b>, <b>Migrate for Compute Engine</b> assumes that the migration source is VMware vSphere."}, {"L": "B", "ok": false, "html": "B. <b>Migrate for Compute Engine</b> charges for ingress, but Migrate for <b>Anthos</b> does not."}, {"L": "C", "ok": false, "html": "C. <b>Migrate for Compute Engine</b> is closed source, and Migrate for <b>Anthos</b> is open source."}, {"L": "D", "ok": true, "html": "D. Migrate for <b>Anthos</b> migrates to containers, and <b>Migrate for Compute Engine</b> migrates to virtual machines."}], "ansL": "D", "ans": "Migrate for Anthos migrates to containers, and Migrate for Compute Engine migrates to virtual machines.（Anthos 遷成容器、Compute Engine 遷成 VM）", "trig": "How do ... differ 兩者差在哪 → 差別在「搬到哪裡」：容器 vs 虛擬機", "formula": "名字裡有 Anthos → 目的地是容器；名字裡有 Compute Engine → 目的地是 VM。"}, {"no": "NO.33", "stem": "Your company is running the majority of its workloads in a co-located data center. The workloads are running on virtual machines (VMs) on top of a hypervisor and use either Linux or Windows server editions. As part of your company&#x27;s transformation strategy, you need to <b class=\"kw\">modernize workloads as much as possible</b> by adopting <b class=\"kw\">cloud-native technologies</b>. You need to migrate the workloads into Google Cloud. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Export the VMs into VMDK format, and import them into <b>Compute Engine</b>"}, {"L": "B", "ok": false, "html": "B. Export the VMs into VMDK format, and import them into Google Cloud <b>VMware Engine</b>"}, {"L": "C", "ok": false, "html": "C. Migrate the workloads using <b>Migrate for Compute Engine</b>"}, {"L": "D", "ok": true, "html": "D. Migrate the workloads using Migrate for <b>Anthos</b>"}], "ansL": "D", "ans": "Migrate the workloads using Migrate for Anthos（用 Migrate for Anthos 遷成容器）", "trig": "modernize workloads as much as possible 盡可能現代化 + cloud-native technologies 雲原生技術 → Migrate for Anthos", "formula": "要現代化／容器化 → Migrate for Anthos；要最快最省事、原封不動 → Migrate for Compute Engine 或 VMware Engine。"}, {"no": "NO.38", "stem": "Your customer is making a decision on whether to move to Google Cloud. Their key concern is about 10,000 VMs that are part of their IT infrastructure used across more than 110 applications. They are <b class=\"kw\">apprehensive of too many changes</b> at this stage. They want to get to Google Cloud in the easiest way possible with minimal disruption. What option would you recommend for them?", "opts": [{"L": "A", "ok": false, "html": "A. Use Migrate for <b>Anthos</b>"}, {"L": "B", "ok": false, "html": "B. Lift and shift the VMs to <b>serverless</b> options like <b>App Engine</b> Flex."}, {"L": "C", "ok": false, "html": "C. Re-architect on-prem to use Kubernetes and then <b>slo</b>wly extend and bridge the on-prem data center to the Google Cloud data center."}, {"L": "D", "ok": true, "html": "D. Use Migrate for Compute"}], "ansL": "D", "ans": "Use Migrate for Compute（Migrate for Compute Engine）", "trig": "apprehensive of too many changes 怕改動太多 + easiest way ... with minimal disruption 最簡單、干擾最小 → Migrate for Compute Engine", "formula": "怕改動＋大量 VM＋要快 → Migrate for Compute Engine（就是 lift and shift 的工具）。"}, {"no": "NO.58", "stem": "An organization wants to <b class=\"kw\">scale their existing virtual machine architecture as quickly as possible</b>. Why should the organization use VMware Engine?", "opts": [{"L": "A", "ok": false, "html": "A. To <b>archive</b> virtual machine instances."}, {"L": "B", "ok": false, "html": "B. To deploy custom APIs seamlessly."}, {"L": "C", "ok": false, "html": "C. To migrate virtual machines to containers."}, {"L": "D", "ok": true, "html": "D. To replatform virtual machines as they are."}], "ansL": "D", "ans": "To replatform virtual machines as they are.（原封不動地換平台）", "trig": "scale their existing virtual machine architecture as quickly as possible 盡快擴展既有 VM 架構 → 原樣 replatform", "formula": "既有 VMware 環境要保留工具與維運流程直接上雲 → Google Cloud VMware Engine。"}, {"no": "NO.61", "stem": "Your organization wants to migrate your on-premises environment to Google Cloud. The on-premises environment consists of containers and virtual machine instances. Which Google Cloud products can help to migrate the <b class=\"kw\">container images</b> and the <b class=\"kw\">virtual machine disks</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Compute Engine</b> and Filestore"}, {"L": "B", "ok": true, "html": "B. Artifact Registry and <b>Cloud Storage</b>"}, {"L": "C", "ok": false, "html": "C. <b>Dataflow</b> and <b>BigQuery</b>"}, {"L": "D", "ok": false, "html": "D. <b>Pub/Sub</b> and <b>Cloud Storage</b>"}], "ansL": "B", "ans": "Artifact Registry and Cloud Storage（Artifact Registry ＋ Cloud Storage）", "trig": "container images 容器映像檔 + virtual machine disks 虛擬機磁碟 → 兩種東西各有各的落腳處", "formula": "容器映像 → Artifact／Container Registry；VM 磁碟檔（VMDK 等）→ 先進 Cloud Storage 再匯入成映像。"}, {"no": "NO.108", "stem": "Your organization is running all its workloads in a private cloud on top of a hypervisor. Your organization has decided it wants to move to Google Cloud as quickly as possible. Your organization wants <b class=\"kw\">minimal changes to the current environment</b>, while using the <b class=\"kw\">maximum amount of managed services</b> Google offers. What should your organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Migrate the workloads to Google Cloud <b>VMware Engine</b>"}, {"L": "B", "ok": false, "html": "B. Migrate the workloads to <b>Compute Engine</b>"}, {"L": "C", "ok": false, "html": "C. Migrate the workloads to <b>Bare Metal</b> Solution"}, {"L": "D", "ok": false, "html": "D. Migrate the workloads to <b>Google Kubernetes Engine</b>"}], "ansL": "A", "ans": "Migrate the workloads to Google Cloud VMware Engine（Google Cloud VMware Engine）", "trig": "minimal changes to the current environment 環境改動最少 + maximum amount of managed services 最大化受管服務 → VMware Engine", "formula": "私有雲 hypervisor ＋ 最少改動 ＋ 最多託管 → VMware Engine；若只強調「最少改動」沒提託管，Compute Engine 也可能是答案。"}, {"no": "NO.127", "stem": "A customer has contacted you about migrating to Google Cloud. The customer would like to migrate their data from on premises <b class=\"kw\">as soon as possible</b>. They <b class=\"kw\">don&#x27;t have the budget to rewrite code</b>, and they want the most direct route. What migration option should suggest to the customer?", "opts": [{"L": "A", "ok": false, "html": "A. None, since the customer is not cloud native ready."}, {"L": "B", "ok": false, "html": "B. Rip and Replace"}, {"L": "C", "ok": true, "html": "C. Lift and Shift"}, {"L": "D", "ok": false, "html": "D. Improve and Move"}], "ansL": "C", "ans": "Lift and Shift（原封搬遷）", "trig": "as soon as possible 越快越好 + don&#x27;t have the budget to rewrite code 沒預算改寫程式 → Lift and Shift", "formula": "三種搬法由快到慢：Lift and Shift（完全不改）→ Improve and Move（先改再搬）→ Rip and Replace（打掉重寫）。"}, {"no": "NO.159", "stem": "Your client&#x27;s IT environment has so far been on-premises. They run <b class=\"kw\">a mix of applications and databa
