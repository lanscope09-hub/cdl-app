 open source technologies to build applications. One of the considerations is about having a <b class=\"kw\">well integrated monitoring tool</b>. They have to be able to <b class=\"kw\">constantly review load capacity and performance</b> of their applications and virtual machines. What would you advise them to do?", "opts": [{"L": "A", "ok": false, "html": "A. It is best to build a custom solution so that they know it integrates well with all their custom applications."}, {"L": "B", "ok": false, "html": "B. Since they are using open source for applications, find another open source monitoring tool and integrate it, which could turn out to be very cheap."}, {"L": "C", "ok": true, "html": "C. Use the Google Cloud Operations Suite which contains monitoring among other operations tools."}, {"L": "D", "ok": false, "html": "D. Update the application code to regularly write to ou<b>tpu</b>t logs. Export the logs to <b>BigQuery</b> to analyze them frequently."}], "ansL": "C", "ans": "Use the Google Cloud Operations Suite which contains monitoring among other operations tools. 使用 Google Cloud Operations Suite", "trig": "well integrated monitoring tool 整合良好的監控工具 + constantly review load capacity and performance 持續檢視負載與效能 → Operations Suite", "formula": "題目要「一站式監控／維運工具」→Google Cloud Operations Suite（內含 Monitoring／Logging／Trace／Profiler／Error Reporting）"}, {"no": "NO.163", "stem": "An organization wants to evaluate the performance of their entire cloud infrastructure, including <b class=\"kw\">metrics like server uptime and response rate</b> reports. Which Google Cloud tool should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Trace</b>"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Monitoring</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Profiler</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Debugger</b>"}], "ansL": "B", "ans": "Cloud Monitoring 雲端監控", "trig": "metrics like server uptime and response rate 伺服器運行時間與回應率等指標 → Cloud Monitoring", "formula": "指標／儀表板／uptime 檢查→Monitoring；文字事件記錄→Logging；請求延遲追蹤→Trace；程式效能耗用→Profiler；正式環境看程式碼→Debugger"}, {"no": "NO.224", "stem": "A customer of yours has an SLA with their client that a particular service will respond within 4 seconds. The end client has reported that it feels slower. Your engineers do a trial at the client site and notice that there seems to be a <b class=\"kw\">delay for many of the requests</b>. It&#x27;s your team&#x27;s responsibility to <b class=\"kw\">identify the issue quickly</b> within the strict timeline for fixes according to the contract, and then fix it. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Recommend a move to <b>serverless</b> technologies which will scale automatically on demand."}, {"L": "B", "ok": false, "html": "B. Add logging statements at multiple points in the application, build it, and deploy it. Now new requests will give us information on latency in the logs."}, {"L": "C", "ok": false, "html": "C. Check if the browsers used by the client are different from yours. If they are, that&#x27;s most likely the issue. Ensure that everybody uses the latest version of the browser that you are also using."}, {"L": "D", "ok": true, "html": "D. Use <b>Cloud Trace</b> to collect latency data and track how requests propagate and why there is a delay."}], "ansL": "D", "ans": "Use Cloud Trace to collect latency data and track how requests propagate and why there is a delay. 用 Cloud Trace 蒐集延遲資料、追蹤請求路徑", "trig": "delay for many of the requests 請求出現延遲 + identify the issue quickly 快速定位 → Cloud Trace", "formula": "出現 latency 延遲／request 請求走了哪些服務→Cloud Trace（分散式追蹤），不要選加 log"}, {"no": "NO.228", "stem": "<b class=\"kw\">What is logging</b> within the context of cloud technology?", "opts": [{"L": "A", "ok": true, "html": "A. Writing application and operating system events as text"}, {"L": "B", "ok": false, "html": "B. Monitoring network and resource limitations"}, {"L": "C", "ok": false, "html": "C. Tracking source code across an <b>organization</b>"}, {"L": "D", "ok": false, "html": "D. Recording infrastructure and hardware expenditure"}], "ansL": "A", "ans": "Writing application and operating system events as text 將應用程式與作業系統事件寫成文字紀錄", "trig": "What is logging 日誌是什麼 → 把事件寫成文字", "formula": "logging＝把「發生了什麼事」寫成文字；monitoring＝把「現在狀況如何」變成數字指標"}, {"no": "NO.265", "stem": "<b class=\"kw\">What is monitoring</b> within the context of cloud operations?", "opts": [{"L": "A", "ok": false, "html": "A. Observing cloud expenditure in real time to ensure that budgets are not exceeded"}, {"L": "B", "ok": true, "html": "B. Collecting predefined and custom metrics from applications and infrastructure"}, {"L": "C", "ok": false, "html": "C. Tracking user activities to guarantee compliance with privacy regulations"}, {"L": "D", "ok": false, "html": "D. Tracing user location to document regional access and utilization"}], "ansL": "B", "ans": "Collecting predefined and custom metrics from applications and infrastructure 從應用程式與基礎架構收集預定義與自訂指標", "trig": "What is monitoring 監控是什麼 → 收集指標", "formula": "monitoring 的關鍵字是 metrics 指標（數字）；logging 的關鍵字是 events 事件（文字）"}, {"no": "NO.285", "stem": "An organization wants to <b class=\"kw\">collect and store all logs</b> generated by applications running in Google Cloud. Which service should they use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Cloud Logging</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Trace</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Monitoring</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Profiler</b>"}], "ansL": "A", "ans": "Cloud Logging 雲端記錄", "trig": "collect and store all logs 收集並儲存所有日誌 → Cloud Logging", "formula": "題幹只要出現 logs 日誌這個字→Cloud Logging，不必再看其他線索"}, {"no": "NO.286", "stem": "An organization needs to search an application&#x27;s source code to <b class=\"kw\">identify a potential issue</b>. The application is <b class=\"kw\">distributed across multiple containers</b>. Which Google Cloud product should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Google Cloud Console"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Trace</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Monitoring</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Logging</b>"}], "ansL": "B", "ans": "Cloud Trace 雲端追蹤", "trig": "distributed across multiple containers 分散在多個容器 + identify a potential issue 找出潛在問題 → 跨服務追蹤", "formula": "跨多個服務／容器要找出問題卡在哪→Cloud Trace；要看單一服務發生什麼事→Cloud Logging"}, {"no": "NO.302", "stem": "<b class=\"kw\">What does Cloud Logging help</b> an organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Analyze live source code and log code updates."}, {"L": "B", "ok": false, "html": "B. Deploy infrastructure as code."}, {"L": "C", "ok": true, "html": "C. Analyze logs and accelerate application troubleshooting."}, {"L": "D", "ok": false, "html": "D. Manage storage of custom VM images."}], "ansL": "C", "ans": "Analyze logs and accelerate application troubleshooting. 分析日誌、加速應用程式排錯", "trig": "What does Cloud Logging help 日誌服務能幫上什麼 → 分析日誌加速排錯", "formula": "Logging 的價值敘述一律是「集中日誌＋加快找出問題」，看到 source code 原始碼就換成 Debugger"}, {"no": "NO.320", "stem": "An organization wants to <b class=\"kw\">collect metrics and metadata</b> from their cloud applications and put them into <b class=\"kw\">dashboards</b>. Which Google Cloud tool should they use?", "opts": [{"L": "A", "ok": true, "html": "A. <b>Cloud Monitoring</b>"}, {"L": "B", "ok": false, "html": "B. <b>Cloud Trace</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Logging</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Debugger</b>"}], "ansL": "A", "ans": "Cloud Monitoring 雲端監控", "trig": "collect metrics and metadata 收集指標與中繼資料 + dashboards 儀表板 → Cloud Monitoring", "formula": "看到 metrics 指標＋dashboards 儀表板兩個字同框→Cloud Monitoring"}, {"no": "NO.355", "stem": "An organization is concerned that one of their applications <b class=\"kw\">takes too long to return a result</b>. According to Google&#x27;s &quot;Four Golden Signals&quot; which signal measures this aspect of the applications performance?", "opts": [{"L": "A", "ok": false, "html": "A. Traffic"}, {"L": "B", "ok": false, "html": "B. Saturation"}, {"L": "C", "ok": false, "html": "C. Errors"}, {"L": "D", "ok": true, "html": "D. Latency"}], "ansL": "D", "ans": "Latency 延遲", "trig": "takes too long to return a result 回傳結果花太久 → Latency", "formula": "四大黃金訊號＝Latency 多久回／Traffic 有多少量／Errors 錯多少／Saturation 資源多滿"}, {"no": "NO.362", "stem": "<b class=\"kw\">What does Cloud Debugger help</b> an organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Implement code updates in real time without affecting the service level objective (<b>SLO</b>)."}, {"L": "B", "ok": true, "html": "B. Inspect source code in real time without affecting user downtime."}, {"L": "C", "ok": false, "html": "C. Manage code and accelerate application development."}, {"L": "D", "ok": false, "html": "D. Analyze live source code during user downtime."}], "ansL": "B", "ans": "Inspect source code in real time without affecting user downtime. 即時檢查原始碼且不造成服務中斷", "trig": "What does Cloud Debugger help 除錯器能幫什麼 → 正式環境即時看程式碼、不停機", "formula": "Debugger＝在正式環境「看」程式碼變數狀態，不停機、不改程式；要改程式重部署的敘述一律錯"}, {"no": "NO.396", "stem": "An organization wants a <b class=\"kw\">centralized view</b> of their cloud infrastructure in a fully managed system that includes <b class=\"kw\">uptime checks</b>. Which Google Cloud service should they use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Trace</b>"}, {"L": "B", "ok": true, "html": "B. <b>Cloud Monitoring</b>"}, {"L": "C", "ok": false, "html": "C. <b>Cloud Logging</b>"}, {"L": "D", "ok": false, "html": "D. <b>Cloud Profiler</b>"}], "ansL": "B", "ans": "Cloud Monitoring 雲端監控", "trig": "centralized view 集中檢視 + uptime checks 運行時間檢查 → Cloud Monitoring", "formula": "uptime check 定時探測服務活著沒→只有 Cloud Monitoring 有，是它的招牌關鍵字"}, {"no": "NO.193", "stem": "An organization wants to measure everything as part of its new <b class=\"kw\">DevOps</b> philosophy. What should the organization measure?", "opts": [{"L": "A", "ok": true, "html": "A. The reliability and health of their systems."}, {"L": "B", "ok": false, "html": "B. The satisfaction and happiness of their employees."}, {"L": "C", "ok": false, "html": "C. The risk and reward of their investments."}, {"L": "D", "ok": false, "html": "D. The speed of their cloud adoption process."}], "ansL": "A", "ans": "The reliability and health of their systems. 系統的可靠度與健康狀況", "trig": "measure everything as part of DevOps 以 DevOps 精神量測一切 → 量測系統可靠度與健康", "formula": "DevOps 的 measure everything 指的是系統的可靠度與健康（SLI／SLO），不是人的感受或財務數字"}, {"no": "NO.292", "stem": "What DevOps practice should an organization use when developing their application to help <b class=\"kw\">minimize disruption caused by bugs</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Pause production until all bugs have been eliminated"}, {"L": "B", "ok": false, "html": "B. Prioritize fixing large bugs during production because they are easier to review"}, {"L": "C", "ok": true, "html": "C. Implement small changes incrementally to reduce recovery time when bugs appear"}, {"L": "D", "ok": false, "html": "D. Implement large changes together to make rolling back easier when bugs appear"}], "ansL": "C", "ans": "Implement small changes incrementally to reduce recovery time when bugs appear 以小幅漸進變更縮短復原時間", "trig": "minimize disruption caused by bugs 降低 bug 造成的衝擊 → 小步快跑", "formula": "DevOps 通則：小批次、高頻率部署→影響範圍小、復原快；大批次一次上是反模式"}, {"no": "NO.297", "stem": "An organization wants to leverage <b class=\"kw\">tooling and automation</b> as part of its new DevOps philosophy. Which operational challenge will this resolve?", "opts": [{"L": "A", "ok": true, "html": "A. Repetitive manual tasks that hinder workflows"}, {"L": "B", "ok": false, "html": "B. Time-consuming supervision of creative tasks"}, {"L": "C", "ok": false, "html": "C. Distribution and supply-chain issues"}, {"L": "D", "ok": false, "html": "D. Defective technical equipment that limits innovation"}], "ansL": "A", "ans": "Repetitive manual tasks that hinder workflows 阻礙流程的重複性人工作業", "trig": "tooling and automation 工具化與自動化 → 解決重複性人工作業", "formula": "SRE 稱重複人工作業為 toil 苦工，自動化的首要目標就是消除 toil"}, {"no": "NO.347", "stem": "An organization wants to introduce a new image recognition login system. What should the organization do to <b class=\"kw\">follow SRE principles</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Roll out the new system to a subset of employees to test it out"}, {"L": "B", "ok": false, "html": "B. Roll out the new system to all employees to collect as much data as possible"}, {"L": "C", "ok": false, "html": "C. Avoid rolling out the new system because it may have security flaws"}, {"L": "D", "ok": false, "html": "D. Avoid rolling out the new system because it may violate privacy policy"}], "ansL": "A", "ans": "Roll out the new system to a subset of employees to test it out 先對一部分員工推出測試", "trig": "follow SRE principles 遵循 SRE 原則 → 小範圍先試（canary 金絲雀發布）", "formula": "SRE 發布原則：小範圍先試（canary）→ 觀察指標 → 逐步放大；不接受一次全量上線"}, {"no": "NO.400", "stem": "After rolling out a new update, an organization found a <b class=\"kw\">minor bug</b> in its online video game. How should the organization approach this bug while <b class=\"kw\">following SRE principles</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Accept and learn from the bug because failure is normal"}, {"L": "B", "ok": false, "html": "B. Accept and ignore the bug because it is only minor"}, {"L": "C", "ok": false, "html": "C. Hold a postmortem to reprimand the employee responsible for the bug"}, {"L": "D", "ok": false, "html": "D. Document bug correction to eliminate all future bugs"}], "ansL": "A", "ans": "Accept and learn from the bug because failure is normal 接受並從中學習，因為失敗是常態", "trig": "following SRE principles 遵循 SRE 原則 + minor bug 小 bug → 接受失敗、從中學習", "formula": "SRE 文化＝blameless postmortem 無咎責檢討：對事不對人，失敗是學習資料，不是懲罰理由"}, {"no": "NO.62", "stem": "A company with its own private data center has called you in for help with their <b class=\"kw\">disaster recovery planning</b>. News of multiple <b class=\"kw\">ransomware</b> attacks has made them very anxious. They want to make they are well prepared for such an eventuality. Which of these would be good recommendations?", "opts": [{"L": "A", "ok": false, "html": "A. It is better to have redundancy; so, set up another private data center nearby so that you can quickly go over in case of an emergency."}, {"L": "B", "ok": true, "html": "B. It is better to have redundancy; use one or many of the Google Cloud datacenters as a backup location."}, {"L": "C", "ok": false, "html": "C. The one data center is enough, as long as the data is encrypted; attackers won&#x27;t be able to read the data."}, {"L": "D", "ok": false, "html": "D. The one data center is enough as long as you regularly back up data and save it in another place in the same DC."}], "ansL": "B", "ans": "It is better to have redundancy; use one or many of the Google Cloud datacenters as a backup location. 建立備援，用 Google Cloud 資料中心當備份地點", "trig": "disaster recovery planning 災難復原規劃 + ransomware 勒索軟體 → 異地備援", "formula": "災難復原三原則：備份要「異地」、要定期演練還原、單一地點的備份不算備援"}, {"no": "NO.255", "stem": "An organization is concerned about the risk of data loss that may occur due to hardware failures or cyber attacks. They want to <b class=\"kw\">restore their systems to a previous state</b> if such an event occurs. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Use <b>Cloud Monitoring</b>."}, {"L": "B", "ok": true, "html": "B. Back up data regularly."}, {"L": "C", "ok": false, "html": "C. Set service level objectives (<b>SLO</b>s)."}, {"L": "D", "ok": false, "html": "D. Enable <b>autoscaling</b>."}], "ansL": "B", "ans": "Back up data regularly. 定期備份資料", "trig": "restore their systems to a previous state 還原到先前狀態 → 定期備份", "formula": "題幹出現 restore 還原／recover 復原→備份 backup；出現 avoid single point of failure 避免單點故障→備援 redundancy"}, {"no": "NO.340", "stem": "An organization wants to <b class=\"kw\">duplicate critical system components</b> to enhance reliability and mitigate <b class=\"kw\">single points of failure</b> Which design consideration should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Latency"}, {"L": "B", "ok": false, "html": "B. Security"}, {"L": "C", "ok": false, "html": "C. Backups"}, {"L": "D", "ok": true, "html": "D. Redundancy"}], "ansL": "D", "ans": "Redundancy 備援（冗餘設計）", "trig": "duplicate critical system components 複製關鍵元件 + single points of failure 單點故障 → Redundancy", "formula": "備份 backup 保護「資料」不遺失；備援 redundancy 保護「服務」不中斷，兩者常一起考"}, {"no": "NO.19", "stem": "There are internal compliance requirements that demand that we do not use any APIs or services that are <b class=\"kw\">not backed by SLAs</b>. Which of these are acceptable for us? (Choose two answer)", "opts": [{"L": "A", "ok": false, "html": "A. Alpha, Beta"}, {"L": "B", "ok": false, "html": "B. Early Access, Preview"}, {"L": "C", "ok": true, "html": "C. General Availability"}, {"L": "D", "ok": true, "html": "D. Deprecated, but ensure that the <b>SLA</b> support period is still valid."}], "ansL": "C + D", "ans": "C + D. General Availability／Deprecated 但 SLA 支援期仍有效", "trig": "not backed by SLAs 沒有 SLA 保障的不能用 → 只有 GA 與仍在 SLA 期內的已淘汰版本", "formula": "產品生命週期＝Preview／Alpha／Beta（無 SLA）→GA（有 SLA）→Deprecated（SLA 到期前仍有效）；合規題只收有 SLA 的"}, {"no": "NO.136", "stem": "Which Firebase quality tools help the developer <b class=\"kw\">track</b>, <b class=\"kw\">prioritize</b> &amp; <b class=\"kw\">fix stability issues</b> that erode the application quality?", "opts": [{"L": "A", "ok": false, "html": "A. Performance"}, {"L": "B", "ok": false, "html": "B. App Distribution"}, {"L": "C", "ok": true, "html": "C. Crashlytics"}, {"L": "D", "ok": false, "html": "D. Test Lab"}], "ansL": "C", "ans": "Crashlytics 當機分析工具", "trig": "track, prioritize &amp; fix stability issues 追蹤、排序並修復穩定性問題 → Crashlytics", "formula": "Firebase 四工具：當機→Crashlytics；速度→Performance；發測試版→App Distribution；跑測試→Test Lab"}, {"no": "NO.12", "stem": "Your organization needs a large amount of extra computing power <b class=\"kw\">within the next two weeks</b>. After those two weeks, the need for the additional resources will end. Which is the most cost-effective approach?", "opts": [{"L": "A", "ok": false, "html": "A. Use a <b>committed use discount</b> to reserve a very powerful virtual machine"}, {"L": "B", "ok": false, "html": "B. Purchase one very powerful physical computer"}, {"L": "C", "ok": true, "html": "C. Start a very powerful virtual machine without using a <b>committed use discount</b>"}, {"L": "D", "ok": false, "html": "D. Purchase multiple physical computers and scale workload across them"}], "ansL": "C", "ans": "Start a very powerful virtual machine without using a committed use discount 直接開高規 VM，不簽承諾使用折扣", "trig": "within the next two weeks 只需要兩週 + the need will end 之後就不需要了 → 不要簽長約", "formula": "用量穩定可預測且≥1 年→CUD；短期臨時需求→隨用隨付；可被中斷的批次→Spot／Preemptible"}, {"no": "NO.25", "stem": "You are currently managing workloads running on Windows Server for which your company owns the licenses. Your workloads are <b class=\"kw\">only needed during working hours</b>, which allows you to shut down the instances during the weekend. Your Windows Server licenses are up for renewal in a month, and you want to optimize your license cost. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Renew your licenses for an additional period of 3 years. Negotiate a cost reduction with your current hosting provider wherein infrastructure cost is reduced when workloads are not in use"}, {"L": "B", "ok": false, "html": "B. Renew your licenses for an additional period of 2 years. Negotiate a cost reduction by committing to an automatic renewal of the licenses at the end of the 2 year period"}, {"L": "C", "ok": false, "html": "C. Migrate the workloads to <b>Compute Engine</b> with a bring-your-own-license (BYOL) model"}, {"L": "D", "ok": true, "html": "D. Migrate the workloads to <b>Compute Engine</b> with a pay-as-you-go (PAYG) model"}], "ansL": "D", "ans": "Migrate the workloads to Compute Engine with a pay-as-you-go (PAYG) model 遷移到 Compute Engine 採隨用隨付授權", "trig": "only needed during working hours 只在上班時間需要 + shut down during the weekend 週末可關機 → 按用量付費的授權", "formula": "自有授權且會長期滿載→BYOL 較划算；用量斷斷續續、常關機→PAYG（關機就不計授權費）"}, {"no": "NO.36", "stem": "Your customer has reliable information to indicate that they will use a certain amount of computing and analytics. The workloads are critical and they <b class=\"kw\">don&#x27;t want to take a chance with VMs or BigQuery slots being unavailable</b> during a peak period. How can they ensure that they allocate the capacity?", "opts": [{"L": "A", "ok": false, "html": "A. Send in the filled form to Google Cloud support to reserve the <b>Compute Engine</b> and <b>BigQuery</b> resources required."}, {"L": "B", "ok": true, "html": "B. Create reservations on <b>Compute Engine</b> and <b>BigQuery</b>."}, {"L": "C", "ok": false, "html": "C. On the day the capacity is required, set a scheduled job that will provision as many resources as required and lock it in."}, {"L": "D", "ok": false, "html": "D. Google Cloud is elastic for resources. You cannot reserve resources in advance; it is pay per use."}], "ansL": "B", "ans": "Create reservations on Compute Engine and BigQuery. 在 Compute Engine 與 BigQuery 建立預留容量", "trig": "don&#x27;t want to take a chance with VMs or BigQuery slots being unavailable 不想冒容量不足的風險 → reservations 預留", "formula": "要「保證拿得到容量」→reservations 預留（與折扣分開）；要「省錢」→CUD 承諾折扣；兩者可併用"}, {"no": "NO.79", "stem": "Your organization runs many workloads in different Google Cloud projects, each linked to the same billing account. Each project&#x27;s workload costs can vary from month to month, but the overall combined cost of all projects is relatively stable. Your organization needs to optimize its cost. What should your organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Purchase a commitment per <b>project</b> for each project&#x27;s usual minimum"}, {"L": "B", "ok": false, "html": "B. Create a billing account per <b>project</b>, and link each project to a different billing account"}, {"L": "C", "ok": true, "html": "C. Turn on <b>committed use discount</b> sharing, and create a commitment for the combined usage"}, {"L": "D", "ok": false, "html": "D. Move all workloads from all different <b>projects</b> into one single consolidated <b>project</b>"}], "ansL": "C", "ans": "Turn on committed use discount sharing, and create a commitment for the combined usage 啟用 CUD 折扣共用，針對合計用量簽一份承諾", "trig": "each project&#x27;s cost can vary 各專案用量起伏 + overall combined cost is relatively stable 但總量穩定 → 折扣共用", "formula": "多專案同一帳單帳戶、單一專案起伏但總量穩→開 CUD discount sharing，就總量簽一份承諾"}, {"no": "NO.86", "stem": "Your team is using BigQuery as your central data warehouse. You are running a certain workload that you&#x27;ve run frequently over the last few days. It is a <b class=\"kw\">short</b>, <b class=\"kw\">high capacity analytics workload</b>. Which of the following would be an appropriate pricing model to use?", "opts": [{"L": "A", "ok": false, "html": "A. There is no need for any pricing model the first 1 TB of query data processed per month is free."}, {"L": "B", "ok": false, "html": "B. On-demand pricing"}, {"L": "C", "ok": true, "html": "C. Flex <b>Slo</b>ts"}, {"L": "D", "ok": false, "html": "D. Flat-rate reservations"}], "ansL": "C", "ans": "Flex Slots 彈性運算單位", "trig": "short, high capacity analytics workload 短時間、高運算量的分析工作 → Flex Slots", "formula": "BigQuery 計費：偶爾查→On-demand 依掃描量；長期穩定大量→固定費率預留；短時間爆量→Flex Slots"}, {"no": "NO.94", "stem": "Your organization meant to purchase a 3-year Committed Use Discount, but <b class=\"kw\">accidentally purchased a 1-year Committed Use Discount</b> instead. What should your organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Contact your financial institution."}, {"L": "B", "ok": false, "html": "B. Contact Trust and Safety."}, {"L": "C", "ok": true, "html": "C. Contact Cloud Billing Support."}, {"L": "D", "ok": false, "html": "D. Contact Technical Support."}], "ansL": "C", "ans": "Contact Cloud Billing Support. 聯絡 Cloud Billing Support 計費支援", "trig": "accidentally purchased a 1-year Committed Use Discount 誤買 1 年期承諾折扣 → 找計費支援處理", "formula": "帳單、發票、承諾折扣、退款→Cloud Billing Support（免費）；服務故障、技術問題→Technical Support（需付費方案）"}, {"no": "NO.98", "stem": "Multiple projects within your organization have long-term VM usage. Based on current demand, they are able to project into the future and estimate how many VM hours they will use every year. Going in for a committed use contract seems sensible. How can you configure committed use <b class=\"kw\">easily</b> <b class=\"kw\">across all the projects</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Enable <b>committed use</b> with discount sharing for the <b>projects</b>"}, {"L": "B", "ok": false, "html": "B. Review the usage of resources by each <b>project</b> on a daily basis. Enable <b>committed use</b> for the following day based on that number, so that it gives maximum granularity without wastage."}, {"L": "C", "ok": false, "html": "C. Take a report of each <b>project</b>&#x27;s use in the last year. Enable <b>committed use</b> on a per-project basis based on the previous year&#x27;s numbers."}, {"L": "D", "ok": false, "html": "D. Share a Google Sheet and request each <b>project</b> team to send in their estimate. Enable <b>committed use</b> accordingly on a per-project basis."}], "ansL": "A", "ans": "Enable committed use with discount sharing for the projects 為這些專案啟用承諾使用折扣共用", "trig": "across all the projects 橫跨所有專案 + easily 簡便地 → 折扣共用", "formula": "看到 across all projects 跨專案＋easily 簡便→CUD discount sharing 折扣共用；逐專案設定的選項一律排除"}, {"no": "NO.105", "stem": "Your organization wants to optimize its use of Google Cloud&#x27;s discounts on virtual machine-based workloads. You plan to use 200 <b class=\"kw\">CPUs constantly for the next 3 years</b>, and you forecast that spikes of up to 300 CPUs will occur approximately 30% <b class=\"kw\">of the time</b>. What should you choose?", "opts": [{"L": "A", "ok": false, "html": "A. 1-year <b>committed use discount</b> for 200 CPUs"}, {"L": "B", "ok": false, "html": "B. 3-year <b>committed use discount</b> for 300 CPUs"}, {"L": "C", "ok": true, "html": "C. 3-year <b>committed use discount</b> for 200 CPUs"}, {"L": "D", "ok": false, "html": "D. Regular pay-as-you-go pricing"}], "ansL": "C", "ans": "3-year committed use discount for 200 CPUs 3 年期承諾折扣訂 200 顆 CPU", "trig": "200 CPUs constantly for the next 3 years 未來 3 年固定用 200 顆 + spikes up to 300 only 30% of the time 尖峰只佔 3 成", "formula": "承諾量抓「最低基準線 baseline」，尖峰部分留給隨用隨付；承諾期間依題目講的年限選（3 年折扣最大）"}, {"no": "NO.109", "stem": "Your organization runs an application on virtual machines in Google Cloud. This application processes incoming images. This activity <b class=\"kw\">takes hours to create a result</b> for each image. The workload for this application normally <b class=\"kw\">stays at a certain baseline level</b>, but at regular intervals it spikes to a much greater workload. Your organization needs to control the cost to run this application. What should your organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Purchase <b>committed use discount</b>s for the baseline load"}, {"L": "B", "ok": false, "html": "B. Purchase <b>committed use discount</b>s for the expected spike load"}, {"L": "C", "ok": false, "html": "C. Leverage <b>sustained use discount</b>s for your virtual machines"}, {"L": "D", "ok": false, "html": "D. Run the workload on <b>preemptible</b> VM instances"}], "ansL": "A", "ans": "Purchase committed use discounts for the baseline load 為基準負載購買承諾使用折扣", "trig": "stays at a certain baseline level 維持一定基準量 + takes hours to create a result 每張圖要處理數小時 → 基準量簽 CUD", "formula": "工作長且不能被中斷→不能用 Preemptible／Spot；基準量穩定→買 CUD；尖峰→隨用隨付"}, {"no": "NO.183", "stem": "Virtual Machine vCPU and memory usage for each of these categories can receive one of the following discounts? (Select Three Answer)", "opts": [{"L": "A", "ok": false, "html": "A. Military Discounts"}, {"L": "B", "ok": false, "html": "B. Spot Instances"}, {"L": "C", "ok": true, "html": "C. Committed-Use"}, {"L": "D", "ok": true, "html": "D. Sustained-Use"}, {"L": "E", "ok": true, "html": "E. <b>Preemptible</b> VMs"}], "ansL": "C + D + E", "ans": "C + D + E. Committed-Use／Sustained-Use／Preemptible VMs 承諾使用／持續使用／先占式", "trig": "vCPU and memory usage... receive one of the following discounts 可獲得哪些折扣 → 三選（複選題）", "formula": "VM 三大折扣＝CUD 承諾綁約／SUD 當月久用自動給／Preemptible（Spot）可被回收的超便宜機"}, {"no": "NO.217", "stem": "A large travel services company has been running all their workloads on Google Cloud in the previous year. They looked at their past usage of cloud resources and see that there is a <b class=\"kw\">consistent use of 10</b>,000 <b class=\"kw\">virtual machines throughout the year</b>. Based on the projections for the following year they have a strong indication that they <b class=\"kw\">will use at least this much</b> or more capacity within Google Cloud. What is one way in which they can take advantage of this knowledge?", "opts": [{"L": "A", "ok": false, "html": "A. They can use these numbers to negotiate a better contract with another public cloud number."}, {"L": "B", "ok": false, "html": "B. They can cut costs by cutting down on the number of VMs used."}, {"L": "C", "ok": true, "html": "C. They can get into a <b>committed use</b> contract with Google Cloud to get a significant discount on the usage of VMs."}, {"L": "D", "ok": false, "html": "D. They can ask for a <b>sustained use discount</b>."}], "ansL": "C", "ans": "They can get into a committed use contract with Google Cloud to get a significant discount on the usage of VMs. 簽承諾使用合約取得顯著折扣", "trig": "consistent use of 10,000 virtual machines throughout the year 全年穩定使用 1 萬台 + will use at least this much 明年只多不少 → CUD", "formula": "題幹出現 consistent 穩定／predictable 可預測＋長期用量→CUD；SUD 是自動的，不是可以申請的"}, {"no": "NO.252", "stem": "An organization is using Compute Engine and wants to <b class=\"kw\">receive sustained-use discounts</b>. What should the organization do?", "opts": [{"L": "A", "ok": false, "html": "A. Choose <b>preemptible</b> or spot instances when creating virtual machines."}, {"L": "B", "ok": true, "html": "B. Nothing. <b>Sustained use discount</b>s are automatically applied."}, {"L": "C", "ok": false, "html": "C. Commit to virtual machine usage for a one or three-year period."}, {"L": "D", "ok": false, "html": "D. Choose low-powered virtual machines."}], "ansL": "B", "ans": "Nothing. Sustained use discounts are automatically applied. 什麼都不用做，持續使用折扣會自動套用", "trig": "receive sustained-use discounts 取得持續使用折扣 → 自動套用", "formula": "SUD＝當月用滿一定比例時數自動折扣，零設定；CUD＝要主動簽 1 或 3 年約"}, {"no": "NO.35", "stem": "Your organization wants to be sure that is expenditures on cloud services are in line with the budget. Which two Google Cloud cost management features help your organization gain <b class=\"kw\">greater visibility into its cloud resource costs</b>? (Choose two.)", "opts": [{"L": "A", "ok": true, "html": "A. Billing dashboards"}, {"L": "B", "ok": true, "html": "B. Resource <b>labels</b>"}, {"L": "C", "ok": false, "html": "C. <b>Sustained use discount</b>s"}, {"L": "D", "ok": false, "html": "D. Financial governance policies"}, {"L": "E", "ok": false, "html": "E. Payments profile"}], "ansL": "A + B", "ans": "A + B. Billing dashboards 帳單儀表板／Resource labels 資源標籤", "trig": "greater visibility into its cloud resource costs 提高成本可見度 → 儀表板＋標籤（複選題）", "formula": "提升成本可見度＝帳單儀表板＋資源標籤＋帳單匯出到 BigQuery；折扣類選項屬於「省錢」不是「看見」"}, {"no": "NO.55", "stem": "The CFO is attending one of the preliminary meetings in the migration strategy meeting. She brings up the concern about costs. They have contracts with their vendors and the payments they will need to make when purchasing any kind of infrastructure. This gives them a clear view of numbers for resource budgeting and planning. Can she get the same kind of clarity on Google Cloud?", "opts": [{"L": "A", "ok": false, "html": "A. Yes. Do a trial run of typical workloads. See the billing amount and that becomes the base reference."}, {"L": "B", "ok": false, "html": "B. Yes, the Cloud Native Computing Foundation publishes yearly numbers on the cost of running the cloud. Use that as a reference."}, {"L": "C", "ok": true, "html": "C. Yes, the Pricing Calculator can be used to estimate the cost of resources."}, {"L": "D", "ok": false, "html": "D. Yes, Google provides a typical cost of application workloads by region and industry. Use that as a reference."}], "ansL": "C", "ans": "Yes, the Pricing Calculator can be used to estimate the cost of resources. 可用定價計算機估算資源成本", "trig": "clear view of numbers for budgeting and planning 編列預算需要明確數字 → Pricing Calculator", "formula": "上線前估成本→Google Cloud Pricing Calculator；上線後控成本→預算警示＋帳單報表"}, {"no": "NO.96", "stem": "Your organization needs to <b class=\"kw\">plan its cloud infrastructure expenditures</b>. Which should your organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Review cloud resource costs frequently, because costs change often based on use"}, {"L": "B", "ok": false, "html": "B. Review cloud resource costs annually as part of planning your <b>organization</b>&#x27;s overall budget"}, {"L": "C", "ok": false, "html": "C. If your <b>organization</b> uses only cloud resources, infrastructure costs are no longer part of your overall budget"}, {"L": "D", "ok": false, "html": "D. Involve fewer people in cloud resource planning than your <b>organization</b> did for on-premises resource planning"}], "ansL": "A", "ans": "Review cloud resource costs frequently, because costs change often based on use 因為成本隨用量常變動，要頻繁檢視", "trig": "plan its cloud infrastructure expenditures 規劃雲端支出 → 頻繁檢視（雲端是變動成本）", "formula": "雲端成本＝變動支出 OpEx→頻繁檢視、即時調整；把它當年度固定預算的選項一律是錯的"}, {"no": "NO.138", "stem": "A large organization is struggling to manage their cloud costs effectively. They want to <b class=\"kw\">increase visibility into cloud costs</b>. Which cost management approach should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. Establish a partnership between finance, technology, and business teams."}, {"L": "B", "ok": false, "html": "B. Appoint a single person to monitor cloud spending across the <b>organization</b>."}, {"L": "C", "ok": false, "html": "C. Review any cloud spending that exceeds the <b>organization</b>&#x27;s <b>error budget</b>."}, {"L": "D", "ok": false, "html": "D. Increase monitoring of on-premises infrastructure and services."}], "ansL": "A", "ans": "Establish a partnership between finance, technology, and business teams. 建立財務、技術、業務三方的協作關係", "trig": "increase visibility into cloud costs 提高成本可見度 → 跨部門協作（FinOps 精神）", "formula": "雲端財務治理（FinOps）＝財務＋技術＋業務三方共治；把責任丟給單一角色是錯誤選項"}, {"no": "NO.147", "stem": "You have experimented with Google Cloud using your own credit card and expensed the costs to your company. Your company wants to streamline the billing process and <b class=\"kw\">charge the costs of your projects to their monthly invoice</b>. What should you do?", "opts": [{"L": "A", "ok": false, "html": "A. Grant the financial team the <b>IAM</b> role of &quot;Billing Account User&quot; on the billing account linked to your credit card."}, {"L": "B", "ok": true, "html": "B. Change the billing account of your <b>projects</b> to the billing account of your company."}, {"L": "C", "ok": false, "html": "C. Create a ticket with Google Billing Support to ask them to send the invoice to your company."}, {"L": "D", "ok": false, "html": "D. Set up <b>BigQuery</b> <b>billing export</b> and grant your financial department <b>IAM</b> access to query the data."}], "ansL": "B", "ans": "Change the billing account of your projects to the billing account of your company. 把專案的計費帳戶改成公司的計費帳戶", "trig": "charge the costs of your projects to their monthly invoice 把費用併進公司月結發票 → 更換計費帳戶", "formula": "費用由誰付＝看專案綁哪個 billing account；改付款方就改綁定，權限（IAM）與匯出（BigQuery）都不改變付款方"}, {"no": "NO.343", "stem": "An organization is concerned about their cloud costs. They want to be informed when their spending exceeds a specific threshold, rather than waiting to see their bill at the end of the month. What should the organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Configure a budget threshold rule and alert."}, {"L": "B", "ok": false, "html": "B. Pause virtual machines during non-business hours."}, {"L": "C", "ok": false, "html": "C. Adjust <b>project</b> resource quota policies."}, {"L": "D", "ok": false, "html": "D. Use historical cost data to predict future overspend."}], "ansL": "A", "ans": "Configure a budget threshold rule and alert. 設定預算門檻規則與警示", "trig": "informed when spending exceeds a specific threshold 花費超過門檻時收到通知 → 預算警示", "formula": "要「超過就通知」→Budget alert 預算警示（只通知不會自動停用）；要「硬性上限不得超用」→Quotas 配額"}, {"no": "NO.351", "stem": "An organization notices that some of their cloud <b class=\"kw\">expenditures are too high</b>. What should the organization do to <b class=\"kw\">control costs</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Streamline the hardware procurement process to reduce costs."}, {"L": "B", "ok": true, "html": "B. Share cost views with the departments to establish more accountability."}, {"L": "C", "ok": false, "html": "C. Change the cost model from operational expenditure to capital expenditure."}, {"L": "D", "ok": false, "html": "D. Ensure that all could resources are tagged with a single tag."}], "ansL": "B", "ans": "Share cost views with the departments to establish more accountability. 與各部門共享成本檢視以建立當責", "trig": "expenditures are too high 花費過高 + control costs 控制成本 → 讓花錢的人看見自己的花費", "formula": "控成本三招：成本透明給各部門（當責）→標籤分帳→預算警示；「全部貼同一標籤」永遠是錯選項"}, {"no": "NO.356", "stem": "An organization is <b class=\"kw\">planning to deploy</b> a new workload to Google Cloud. They need an <b class=\"kw\">accurate estimate</b> of the likely costs of running the workload. How should the organization create this estimate?", "opts": [{"L": "A", "ok": true, "html": "A. Use the Google Cloud Pricing Calculator."}, {"L": "B", "ok": false, "html": "B. Deploy workload to test environment to observe costs."}, {"L": "C", "ok": false, "html": "C. Use historic costs of an existing similar workload."}, {"L": "D", "ok": false, "html": "D. Refer to pricing information and manually calculate an estimate."}], "ansL": "A", "ans": "Use the Google Cloud Pricing Calculator. 使用 Google Cloud 定價計算機", "trig": "planning to deploy 尚未部署 + accurate estimate 精準預估 → Pricing Calculator", "formula": "部署前估成本→Pricing Calculator；部署後追成本→帳單報表／Cost Table／匯出 BigQuery"}, {"no": "NO.407", "stem": "An organization is <b class=\"kw\">planning its cloud expenditure</b>. What should the organization do to <b class=\"kw\">control costs</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Consider cloud resource costs as capital expenditure in annual planning."}, {"L": "B", "ok": false, "html": "B. Use only cloud resources; they have no cloud infrastructure costs."}, {"L": "C", "ok": true, "html": "C. Review cloud resource costs frequently because costs depend on usage."}, {"L": "D", "ok": false, "html": "D. Assess cloud resources costs only when <b>SLO</b> is not met by their cloud provider."}], "ansL": "C", "ans": "Review cloud resource costs frequently because costs depend on usage. 因成本取決於用量，要頻繁檢視", "trig": "control costs 控制成本 + planning its cloud expenditure 規劃雲端支出 → 頻繁檢視", "formula": "雲端＝OpEx 變動費用→頻繁檢視；地端＝CapEx 一次投資→年度編列。看到「年度規劃／資本支出」描述雲端就是錯"}, {"no": "NO.253", "stem": "An organization is migrating their business applications from on-premises to the cloud. How could this impact their <b class=\"kw\">operations and personnel costs</b>?", "opts": [{"L": "A", "ok": true, "html": "A. Reduced on-premises infrastructure management costs"}, {"L": "B", "ok": false, "html": "B. Increased on-premises hardware maintenance costs"}, {"L": "C", "ok": false, "html": "C. Reduced cloud software licensing costs"}, {"L": "D", "ok": false, "html": "D. Increased cloud hardware management costs"}], "ansL": "A", "ans": "Reduced on-premises infrastructure management costs 降低地端基礎架構管理成本", "trig": "migrating from on-premises to the cloud 從機房搬上雲 + operations and personnel costs 維運與人力成本 → 機房管理成本下降", "formula": "上雲對成本的標準影響＝地端硬體與維運人力下降、支出型態由 CapEx 轉 OpEx"}, {"no": "NO.257", "stem": "An organization wants to digitize and share <b class=\"kw\">large volumes of historical text and images</b>. Why is a public cloud a better option than an on-premises solution?", "opts": [{"L": "A", "ok": false, "html": "A. In-house hardware management"}, {"L": "B", "ok": false, "html": "B. Provides physical encryption key"}, {"L": "C", "ok": true, "html": "C. Cost-effective at scale"}, {"L": "D", "ok": false, "html": "D. Optimizes capital expenditure"}], "ansL": "C", "ans": "Cost-effective at scale 規模化後更具成本效益", "trig": "large volumes of historical text and images 大量歷史文字與影像 → 規模越大雲端越划算", "formula": "公有雲三大優勢＝規模經濟便宜、彈性隨需擴縮、免自建機房；出現 CapEx 相關描述多半是干擾項"}, {"no": "NO.275", "stem": "An organization is struggling to keep up with the growth of their application which is running on <b class=\"kw\">legacy infrastructure</b>. What might be holding them back?", "opts": [{"L": "A", "ok": false, "html": "A. The inaccessibility of their data due to perimeter security"}, {"L": "B", "ok": false, "html": "B. The overreliance on platform as a service"}, {"L": "C", "ok": false, "html": "C. The time it takes their <b>serverless</b> compute function to scale"}, {"L": "D", "ok": true, "html": "D. The cost of provisioning hardware for peak usage"}], "ansL": "D", "ans": "The cost of provisioning hardware for peak usage 為尖峰用量佈建硬體的成本", "trig": "legacy infrastructure 老舊架構 + struggling to keep up with growth 跟不上成長 → 得為尖峰買硬體", "formula": "傳統架構的痛點＝必須照尖峰買硬體（平時閒置、尖峰仍可能不夠）；雲端用彈性擴縮解決"}, {"no": "NO.281", "stem": "An organization is altering their gaming product so that it is compatible with cloud technology. What can they expect when <b class=\"kw\">moving from traditional technology to cloud technology</b>?", "opts": [{"L": "A", "ok": true, "html": "A. No change to existing responsibilities"}, {"L": "B", "ok": true, "html": "B. A shift toward OpEx"}, {"L": "C", "ok": false, "html": "C. A shift toward using structured data"}, {"L": "D", "ok": false, "html": "D. Increased hardware maintenance"}], "ansL": "B + A", "ans": "A shift toward OpEx 轉向營運支出", "trig": "moving from traditional technology to cloud technology 從傳統轉到雲端 → 支出型態轉向 OpEx", "formula": "上雲的財務通則：CapEx（買斷硬體）→OpEx（按用量付費）；責任模型變成 shared responsibility 共同責任"}, {"no": "NO.306", "stem": "What is a <b class=\"kw\">benefit of the OpEx model</b> for cloud security?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Organization</b>s can deploy custom security hardware."}, {"L": "B", "ok": true, "html": "B. <b>Organization</b>s do not need to make upfront capital investments in cloud security."}, {"L": "C", "ok": false, "html": "C. <b>Organization</b>s do not need to configure any security settings for cloud resources."}, {"L": "D", "ok": false, "html": "D. The cloud provider guarantees security."}], "ansL": "B", "ans": "Organizations do not need to make upfront capital investments in cloud security. 不必為雲端安全做前期資本投資", "trig": "benefit of the OpEx model 營運支出模式的好處 → 免預付大筆投資", "formula": "OpEx 的好處＝免預付、隨用隨付、成本跟著用量走；凡是「供應商全包安全」「不用設定」的敘述都錯"}, {"no": "NO.310", "stem": "When an organization adopts cloud technology, how does their <b class=\"kw\">total cost of ownership</b> (TCO) <b class=\"kw\">shift</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Away from cost management toward capital expenditure"}, {"L": "B", "ok": false, "html": "B. Away from operational expenditure toward cost management"}, {"L": "C", "ok": true, "html": "C. Away from capital expenditure toward operational expenditure"}, {"L": "D", "ok": false, "html": "D. Away from operational expenditure toward capital expenditure"}], "ansL": "C", "ans": "Away from capital expenditure toward operational expenditure 從資本支出轉向營運支出", "trig": "total cost of ownership (TCO) shift 總持有成本如何轉變 → CapEx 轉 OpEx", "formula": "記一句：上雲＝CapEx→OpEx。任何寫成 OpEx→CapEx 的選項一律排除"}, {"no": "NO.316", "stem": "A large retail organization uses traditional technology for their ecommerce website During peaks m traffic <b class=\"kw\">resources are often underutilized or overprovisioned</b> They have decided to migrate to cloud technology What aspect of cloud technology will benefit their ecommerce business?", "opts": [{"L": "A", "ok": true, "html": "A. Agile infrastructure means that they only pay tor what they need, when they need it"}, {"L": "B", "ok": false, "html": "B. <b>Shared responsibility</b> means that the cloud provider brings increased visibility during peaks in"}, {"L": "C", "ok": false, "html": "C. Operational expenditure means that their total cost of ownership is more predictable"}, {"L": "D", "ok": false, "html": "D. Unlimited storage means that their website will never experience downtime"}], "ansL": "A", "ans": "Agile infrastructure means that they only pay for what they need, when they need it 彈性架構讓他們只在需要時為需要的量付費", "trig": "resources are often underutilized or overprovisioned 資源常閒置或過度佈建 → 彈性架構按需付費", "formula": "題幹出現閒置／過度佈建→答案是彈性擴縮＋按用量付費；扯到「無限」「永不停機」的選項一律誇大不選"}, {"no": "NO.321", "stem": "An organization has recently <b class=\"kw\">completed a migration from on-premises to Google Cloud</b>. How has cost management been affected?", "opts": [{"L": "A", "ok": true, "html": "A. Costs will primarily shift from CapEx to OpEx."}, {"L": "B", "ok": false, "html": "B. Costs will primarily shift from OpEx to CapEx."}, {"L": "C", "ok": false, "html": "C. Cost management will stay the same, but the total cost of ownership (TCO) will be lower."}, {"L": "D", "ok": false, "html": "D. Cost management will stay the same, but the total cost of ownership (TCO) will be higher"}], "ansL": "A", "ans": "Costs will primarily shift from CapEx to OpEx. 成本主要從資本支出轉為營運支出", "trig": "completed a migration from on-premises to Google Cloud 完成上雲 → CapEx 轉 OpEx", "formula": "同 NO.310：上雲＝CapEx→OpEx；選項若說「成本管理維持不變」通常是錯的"}, {"no": "NO.324", "stem": "What is the <b class=\"kw\">typical cloud spending behavior</b> of most organizations?", "opts": [{"L": "A", "ok": true, "html": "A. Decentralized and variable"}, {"L": "B", "ok": false, "html": "B. Centralized and variable"}, {"L": "C", "ok": false, "html": "C. Decentralized and fixed"}, {"L": "D", "ok": false, "html": "D. Centralized and fixed"}], "ansL": "A", "ans": "Decentralized and variable 去中心化且變動", "trig": "typical cloud spending behavior 典型的雲端花費行為 → 分散在各團隊、金額浮動", "formula": "雲端花費特性＝去中心化（工程師自己開機器）＋變動（隨用量）；因此才需要 FinOps 跨部門治理"}, {"no": "NO.360", "stem": "Why should an organization consider the total cost of ownership (TCO) when moving from on-premises to the cloud?", "opts": [{"L": "A", "ok": false, "html": "A. To evaluate <b>error budget</b>"}, {"L": "B", "ok": false, "html": "B. To understand service level availability"}, {"L": "C", "ok": true, "html": "C. To evaluate return on investment"}, {"L": "D", "ok": false, "html": "D. To calculate required compute power"}], "ansL": "C", "ans": "To evaluate return on investment 評估投資報酬率", "trig": "consider total cost of ownership (TCO) 為何要看總持有成本 → 評估投資報酬", "formula": "TCO 是「全部成本」，算它的目的是比較上雲划不划算，也就是評估 ROI"}, {"no": "NO.43", "stem": "Your organization is developing and deploying an application on Google Cloud. Tracking your Google Cloud spending needs to stay as simple as possible. What should you do to ensure that workloads in the development environment are <b class=\"kw\">fully isolated</b> from production workloads?", "opts": [{"L": "A", "ok": false, "html": "A. Apply a unique tag to development resources"}, {"L": "B", "ok": false, "html": "B. Associate the development resources with their own network"}, {"L": "C", "ok": false, "html": "C. Associate the development resources with their own billing account"}, {"L": "D", "ok": true, "html": "D. Put the development resources in their own <b>project</b>"}], "ansL": "D", "ans": "Put the development resources in their own project 把開發資源放在各自獨立的專案", "trig": "fully isolated 完全隔離 + tracking spending as simple as possible 成本追蹤要盡量簡單 → 分專案", "formula": "Google Cloud 的隔離單位是 project 專案（同時隔離資源、IAM 權限與帳單）；label 標籤只做分類報表，不做隔離"}, {"no": "NO.49", "stem": "Your team is publishing research results and needs to make large amounts of data available to other researchers within the professional community and the public <b class=\"kw\">at minimum cost</b>. How should you host the data?", "opts": [{"L": "A", "ok": true, "html": "A. Use a <b>Cloud Storage</b> bucket and enable &quot;Requester Pays.&quot;"}, {"L": "B", "ok": false, "html": "B. Use a <b>Cloud Storage</b> bucket and provide Signed URLs for the data files."}, {"L": "C", "ok": false, "html": "C. Use a <b>Cloud Storage</b> bucket and set up a <b>Cloud Interconnect</b> connection to allow access to the data."}, {"L": "D", "ok": false, "html": "D. Host the data on-premises. and set up a <b>Cloud Interconnect</b> connection to allow access to the data."}], "ansL": "A", "ans": "Use a Cloud Storage bucket and enable &quot;Requester Pays.&quot; 使用 Cloud Storage 並啟用「請求者付費」", "trig": "available to other researchers and the public 開放給外界取用 + at minimum cost 自己成本最低 → Requester Pays", "formula": "公開大量資料又不想自己吃流量費→Cloud Storage＋Requester Pays；要控管誰能存取一段時間→Signed URL"}, {"no": "NO.64", "stem": "Your organization needs to minimize how much it pays for data traffic from the Google network to the internet. What should your organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Choose the Standard network service tier."}, {"L": "B", "ok": false, "html": "B. Choose the Premium network service tier."}, {"L": "C", "ok": false, "html": "C. Deploy <b>Cloud VPN</b>."}, {"L": "D", "ok": false, "html": "D. Deploy Cloud NAT."}], "ansL": "A", "ans": "Choose the Standard network service tier. 選擇 Standard 標準網路服務層級", "trig": "minimize how much it pays for data traffic to the internet 把對外流量費壓到最低 → Standard tier", "formula": "網路服務層級：Premium＝走 Google 骨幹、效能佳、較貴（預設）；Standard＝走一般網際網路、較便宜、效能較低"}, {"no": "NO.184", "stem": "Compute Engine provides <b class=\"kw\">machine type recommendations</b> to help you <b class=\"kw\">optimize the resource utilization</b> of your virtual machine (VM) instances. What is this capability called?", "opts": [{"L": "A", "ok": false, "html": "A. <b>App Engine</b>"}, {"L": "B", "ok": false, "html": "B. None of the above"}, {"L": "C", "ok": true, "html": "C. Rightsizing Recommendations"}, {"L": "D", "ok": false, "html": "D. Recommendation Engine"}], "ansL": "C", "ans": "Rightsizing Recommendations 適當規模建議", "trig": "machine type recommendations 機器類型建議 + optimize the resource utilization 優化資源使用率 → Rightsizing Recommendations", "formula": "看到機型過大／使用率低→Rightsizing Recommendations（屬 Active Assist 建議工具家族）"}]}, {"name": "數位轉型・其他", "tag": "常識題多", "rows": [{"no": "NO.99", "stem": "Which of the following NIST Cloud characteristics uses the business model of <b class=\"kw\">shared resources</b> in a cloud environment?", "opts": [{"L": "A", "ok": false, "html": "A. Elasticity"}, {"L": "B", "ok": false, "html": "B. Availability"}, {"L": "C", "ok": false, "html": "C. Broad Network Access"}, {"L": "D", "ok": true, "html": "D. Multi-Tenancy"}], "ansL": "D", "ans": "Multi-Tenancy 多租戶", "trig": "shared resources 共享資源 → 多個客戶共用同一套底層設施", "formula": "問「shared 共享／多客戶共用」→ multi-tenancy；問「按需伸縮」→ elasticity；問「任何裝置連得上」→ broad network access。"}, {"no": "NO.113", "stem": "Each of the three cloud service models - infrastructure as a service (IaaS), platform as a service (PaaS), and software as a service (SaaS) - offers benefits between flexibility and <b class=\"kw\">levels of management</b> by the cloud provider and the customer. Why would SaaS be the right choice of service model?", "opts": [{"L": "A", "ok": false, "html": "A. You want a balance between flexibility for the customer and the level of management by the cloud provider"}, {"L": "B", "ok": true, "html": "B. You want to minimize the level of management by the customer"}, {"L": "C", "ok": false, "html": "C. You want to maximize flexibility for the customer."}, {"L": "D", "ok": false, "html": "D. You want to be able to shift your emphasis between flexibility and management by the cloud provider as business needs change"}], "ansL": "B", "ans": "You want to minimize the level of management by the customer 客戶管理負擔降到最低", "trig": "SaaS + levels of management 管理程度 → 客戶管最少", "formula": "三模型光譜題：要「最大彈性、最多掌控」→ IaaS；要「平衡」→ PaaS；要「最少管理」→ SaaS。"}, {"no": "NO.132", "stem": "You have a well established development and operations team. Your teams were <b class=\"kw\">managing the entire software delivery/deployment cycle</b> on-premise. When migrating to the cloud, you want to <b class=\"kw\">continue having this approach</b>. Which is the ideal option for you?", "opts": [{"L": "A", "ok": false, "html": "A. PaaS - Platform as a Service"}, {"L": "B", "ok": false, "html": "B. SaaS - Software as a Service"}, {"L": "C", "ok": false, "html": "C. IDaaS - Identity as a Service"}, {"L": "D", "ok": true, "html": "D. IaaS - Infrastructure as a Service"}], "ansL": "D", "ans": "IaaS - Infrastructure as a Service 基礎設施即服務", "trig": "managing the entire software delivery/deployment cycle 自己管整條交付部署流程 + continue having this approach 想沿用 → IaaS", "formula": "題目強調「想維持原本自己掌控的做法」→ IaaS；強調「不想管、想交出去」→ PaaS／SaaS。"}, {"no": "NO.213", "stem": "What type of cloud computing service provides <b class=\"kw\">raw compute</b>, <b class=\"kw\">storage</b>, <b class=\"kw\">and network</b>, organized in ways that are familiar to physical data centers?", "opts": [{"L": "A", "ok": false, "html": "A. Database as a Service."}, {"L": "B", "ok": false, "html": "B. Platform as a Service."}, {"L": "C", "ok": true, "html": "C. Infrastructure as a Service."}, {"L": "D", "ok": false, "html": "D. Software as a Service."}], "ansL": "C", "ans": "Infrastructure as a Service. 基礎設施即服務", "trig": "raw compute, storage, and network 原始的運算、儲存、網路 → IaaS", "formula": "出現 raw resources／virtual machines／「跟實體機房一樣的組織方式」→ IaaS。"}, {"no": "NO.223", "stem": "In terms of Infrastructure as a Service (IaaS) <b class=\"kw\">what are the benefits of it</b>?", "opts": [{"L": "A", "ok": false, "html": "A. IaaS offers virtually infinite flexibility and scalability, enterprises can get their work done more efficiently, ensuring faster development life cycles."}, {"L": "B", "ok": false, "html": "B. IaaS resources are regularly available to businesses when they need them. As a result, enterprises reduce delays when expanding infrastructure and, alternatively, don&#x27;t waste resources by overbuilding capacity."}, {"L": "C", "ok": false, "html": "C. IaaS resources are used on demand and enterprises only have to pay for the compute, storage, and networking resources that are actually used, IaaS costs are fairly predictable and can be easily contained and budgeted for."}, {"L": "D", "ok": true, "html": "D. All of the Above"}], "ansL": "D", "ans": "All of the Above 以上皆是", "trig": "what are the benefits of it 它有哪些好處 → 三項都成立", "formula": "選項 A/B/C 各講一項都成立的好處、彼此不衝突，且有 All of the Above → 選 All of the Above。"}, {"no": "NO.233", "stem": "An organization wants to <b class=\"kw\">lease the resources</b> they need for their <b class=\"kw\">customized servers</b> from a cloud provider on a <b class=\"kw\">pay-as-you-go</b> basis, instead of paying one time for hardware. Which service model should they use?", "opts": [{"L": "A", "ok": false, "html": "A. Hybrid cloud"}, {"L": "B", "ok": true, "html": "B. Infrastructure as a service"}, {"L": "C", "ok": false, "html": "C. Platform as a service"}, {"L": "D", "ok": false, "html": "D. Software as a service"}], "ansL": "B", "ans": "Infrastructure as a service 基礎設施即服務", "trig": "lease the resources 租用資源 + customized servers 客製伺服器 + pay-as-you-go 用多少付多少 → IaaS", "formula": "問的是 service model 卻混進 hybrid／private cloud 這種部署模型選項 → 直接刪掉它們。"}, {"no": "NO.26", "stem": "Your multinational organization has servers running mission-critical workloads on its premises around the world. You want to be able to manage these workloads consistently and centrally, and you want to <b class=\"kw\">stop managing infrastructure</b>. What should your organization do?", "opts": [{"L": "A", "ok": true, "html": "A. Migrate the workloads to a public cloud"}, {"L": "B", "ok": false, "html": "B. Migrate the workloads to a central office building"}, {"L": "C", "ok": false, "html": "C. Migrate the workloads to multiple local co-location facilities"}, {"L": "D", "ok": false, "html": "D. Migrate the workloads to multiple local private clouds"}], "ansL": "A", "ans": "Migrate the workloads to a public cloud 遷移到公有雲", "trig": "manage ... consistently and centrally 一致且集中管理 + stop managing infrastructure 不想再管基礎設施 → 公有雲", "formula": "出現「stop managing infrastructure 不想再管基礎設施」→ 一律選 public cloud。"}, {"no": "NO.93", "stem": "What would provide near-unlimited availability of computing resources without requiring your organization to procure and provision new equipment?", "opts": [{"L": "A", "ok": true, "html": "A. Public cloud"}, {"L": "B", "ok": false, "html": "B. Containers"}, {"L": "C", "ok": false, "html": "C. Private cloud"}, {"L": "D", "ok": false, "html": "D. Microservices"}], "ansL": "A", "ans": "Public cloud 公有雲", "trig": "without requiring ... to procure and provision new equipment 不必採購與佈建新設備 → 公有雲", "formula": "看到 procure／provision equipment 而且句子說「不用做」→ 公有雲。"}, {"no": "NO.180", "stem": "In discussions with a prospective customer who wants to move to Google Cloud to make use of the latest, scalable technologies available therein, you learn that there are very <b class=\"kw\">strict regulations</b> concerning the storage of data. They <b class=\"kw\">only have the approval to store it in their current private data center</b>. What would you advise them?", "opts": [{"L": "A", "ok": true, "html": "A. Retain on-premise itself those portions of data and compute which are under regulation. Take advantage of all the other cloud capabilities for remaining workloads."}, {"L": "B", "ok": false, "html": "B. It is too risky to touch anything in such a scenario. It is best to remain entirely on-premise."}, {"L": "C", "ok": false, "html": "C. Regulations are guidelines. As long as the data remains encrypted, you can move it anywhere."}, {"L": "D", "ok": false, "html": "D. Petition the government for changes to such regulations as all industries are moving to the public cloud. Then, when the regulations are eased, move to Google Cloud."}], "ansL": "A", "ans": "Retain on-premise ... those portions of data and compute which are under regulation 受管制的部分留在地端，其餘上雲", "trig": "strict regulations 嚴格法規 + only have the approval to store it in their current private data center 只准存在現有私有機房 → 部分留地端", "formula": "法規要求資料留地端／留境內 → 選「受管制部分留地端＋其餘上雲」（＝混合雲思維）；「全部不動」與「無視法規」永遠是錯的。"}, {"no": "NO.256", "stem": "An organization wants to use BigQuery data analytics to understand their website performance, but wants to <b class=\"kw\">move only some data into the cloud</b>. Which environment should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Private cloud"}, {"L": "B", "ok": false, "html": "B. On-premises"}, {"L": "C", "ok": false, "html": "C. Multi-cloud"}, {"L": "D", "ok": true, "html": "D. Hybrid cloud"}], "ansL": "D", "ans": "Hybrid cloud 混合雲", "trig": "move only some data into the cloud 只搬部分資料上雲 → 混合雲", "formula": "「一部分留地端、一部分上雲」→ hybrid cloud；「用兩家以上雲端供應商」→ multi-cloud。"}, {"no": "NO.262", "stem": "An organization wants to adopt the advanced machine learning capabilities of the Google Cloud. However, <b class=\"kw\">regulations require data to be stored in an on-premises data center</b>. Which approach should the organization use?", "opts": [{"L": "A", "ok": true, "html": "A. A private-cloud approach"}, {"L": "B", "ok": false, "html": "B. A multi-cloud approach"}, {"L": "C", "ok": true, "html": "C. A hybrid-cloud approach"}, {"L": "D", "ok": false, "html": "D. A public-cloud approach"}], "ansL": "C + A", "ans": "A hybrid-cloud approach 混合雲方案", "trig": "regulations require data to be stored in an on-premises data center 法規要求資料存在地端 → 混合雲", "formula": "地端 + 公有雲並存 → hybrid；只有多家公有雲、沒提地端 → multi-cloud。"}, {"no": "NO.315", "stem": "An organization wants to deploy new workloads to the cloud but must <b class=\"kw\">keep some systems on-premises</b> for compliance reasons Both environments must be <b class=\"kw\">managed centrally</b> Which type of environment should the organization use1?", "opts": [{"L": "A", "ok": true, "html": "A. Hybrid cloud environment"}, {"L": "B", "ok": false, "html": "B. Multi cloud environment"}, {"L": "C", "ok": false, "html": "C. Container environment"}, {"L": "D", "ok": false, "html": "D. Virtual machine environment"}], "ansL": "A", "ans": "Hybrid cloud environment 混合雲環境", "trig": "keep some systems on-premises 部分系統留地端 + managed centrally 集中管理 → 混合雲", "formula": "一句話裡同時有「部分地端 + 部分雲端」→ hybrid，不用再糾結其他選項。"}, {"no": "NO.410", "stem": "An organization has servers running mission-critical workloads on-premises around the world. They want to modernize their infrastructure with a <b class=\"kw\">multi-cloud architecture</b>. <b class=\"kw\">What benefit</b> could the organization experience?", "opts": [{"L": "A", "ok": false, "html": "A. Ability to disable regional network connectivity during cyber attacks"}, {"L": "B", "ok": false, "html": "B. Ability to keep backups of their data on-premises in case of failure"}, {"L": "C", "ok": false, "html": "C. Full management access to their regional infrastructure"}, {"L": "D", "ok": true, "html": "D. Reduced likelihood of system failure during high demand events"}], "ansL": "D", "ans": "Reduced likelihood of system failure during high demand events 高需求時降低故障機率", "trig": "multi-cloud architecture 多雲架構 + What benefit 有什麼好處 → 可靠度與擴展性", "formula": "問多雲／公有雲的「好處」→ 選跟可靠度、彈性擴展、避免單點故障有關的；選「自己保有硬體掌控」的一律錯。"}, {"no": "NO.414", "stem": "An organization is using <b class=\"kw\">three cloud vendors</b> to maximize their available deployment locations worldwide. They are using GKE Enterprise to deploy Kubernetes applications <b class=\"kw\">across different clouds</b>. What type is this deployment?", "opts": [{"L": "A", "ok": false, "html": "A. On-premises"}, {"L": "B", "ok": false, "html": "B. Private cloud"}, {"L": "C", "ok": true, "html": "C. Multi-cloud"}, {"L": "D", "ok": false, "html": "D. Hybrid-cloud"}], "ansL": "C", "ans": "Multi-cloud 多雲", "trig": "three cloud vendors 三家雲端供應商 + across different clouds 跨不同雲 → 多雲", "formula": "兩家以上雲端供應商、沒提地端 → multi-cloud；有地端才是 hybrid。"}, {"no": "NO.71", "stem": "Which of the following is/are <b class=\"kw\">true about Anthos</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Enterprise-grade container orchestration and management service."}, {"L": "B", "ok": false, "html": "B. Modernizing your security for hybrid and multi-cloud deployments"}, {"L": "C", "ok": false, "html": "C. <b>Fully managed</b> service mesh with built-in visibility"}, {"L": "D", "ok": true, "html": "D. All of the Above"}], "ansL": "D", "ans": "All of the Above 以上皆是", "trig": "true about Anthos 關於 Anthos 何者正確 → 三項都是它的能力", "formula": "Anthos／GKE Enterprise 的能力列舉題，各選項各講一項真本事 → 選 All of the Above。"}, {"no": "NO.76", "stem": "An organization with hybrid cloud architecture wants to <b class=\"kw\">build an application once</b> and be able to <b class=\"kw\">run it both on-premises and in their public cloud</b>. Which Google Cloud solution should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Functions</b>"}, {"L": "B", "ok": false, "html": "B. <b>App Engine</b>"}, {"L": "C", "ok": false, "html": "C. <b>Compute Engine</b>"}, {"L": "D", "ok": true, "html": "D. <b>Anthos</b>"}], "ansL": "D", "ans": "Anthos", "trig": "build an application once 建置一次 + run it both on-premises and in their public cloud 地端與公有雲都能跑 → Anthos", "formula": "「一次建置、地端與雲端都能跑」或「跨環境一致管理」→ Anthos（現稱 GKE Enterprise）。"}, {"no": "NO.80", "stem": "Which Google Cloud product gives you a <b class=\"kw\">consistent platform</b> for <b class=\"kw\">multi-cloud application deployments</b> and extends other Google Cloud services to your environment?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Google Kubernetes Engine</b>"}, {"L": "B", "ok": false, "html": "B. Virtual Public Cloud"}, {"L": "C", "ok": false, "html": "C. <b>Compute Engine</b>"}, {"L": "D", "ok": true, "html": "D. <b>Anthos</b>"}], "ansL": "D", "ans": "Anthos", "trig": "consistent platform 一致的平台 + multi-cloud application deployments 跨雲部署 → Anthos", "formula": "題目同時出現 consistent 與 multi-cloud／hybrid → 答案是 Anthos。"}, {"no": "NO.166", "stem": "Which of the followings are core components of Anthos?", "opts": [{"L": "A", "ok": false, "html": "A. Infrastructure, container, and cluster management"}, {"L": "B", "ok": false, "html": "B. Secure software supply chain"}, {"L": "C", "ok": false, "html": "C. Multicluster &amp; Configuration management"}, {"L": "D", "ok": true, "html": "D. All of the above are correct."}], "ansL": "D", "ans": "All of the above are correct. 以上皆是", "trig": "core components of Anthos Anthos 的核心元件 → 三項都是", "formula": "平台型產品（Anthos）的涵蓋範圍題，答案通常是最廣的那個 → All of the above。"}, {"no": "NO.179", "stem": "Your client has an on-premises data center. Due to technical limitations, they are unable to scale globally. They have decided to adopt the public cloud. However, they don&#x27;t want to locked into any one vendor and, therefore, would like to work with <b class=\"kw\">multiple cloud providers</b>. They have used <b class=\"kw\">open source container</b> technologies and would like to continue using them.", "opts": [{"L": "A", "ok": false, "html": "A. <b>Cloud Run</b> which supports containers and can scale in a <b>serverless</b> fashion"}, {"L": "B", "ok": false, "html": "B. Kubernetes that runs containers as their core workloads"}, {"L": "C", "ok": false, "html": "C. AppEngine Flexible Environment which supports containers"}, {"L": "D", "ok": true, "html": "D. <b>Anthos</b> that runs containers as their core workloads"}], "ansL": "D", "ans": "Anthos that runs containers as their core workloads 以 Anthos 跑容器", "trig": "don&#x27;t want to be locked into any one vendor 不想被單一廠商綁 + multiple cloud providers 多家雲商 + open source container 開源容器 → Anthos", "formula": "「不想被單一廠商綁 + 要跨多雲 + 已在用容器」→ Anthos；只講「要跑容器」才選 Kubernetes／GKE。"}, {"no": "NO.145", "stem": "Keeping Flavours of Apigee in mind, which of the following statements is/are correct?", "opts": [{"L": "A", "ok": false, "html": "A. A hybrid version consisting of a runtime plane installed on-premises or in a cloud provider of your choice, and a management plane running in <b>Apigee</b>&#x27;s cloud. In this model, API traffic and data are confined within your own enterprise-approved boundaries."}, {"L": "B", "ok": false, "html": "B. A hosted SaaS version in which <b>Apigee</b> maintains the environment, allowing you to concentrate on building your services and defining the APIs to those services."}, {"L": "C", "ok": false, "html": "C. There are two types of Flavours in <b>Apigee</b> i.e. Apigee &amp; Apigee Hybrid."}, {"L": "D", "ok": true, "html": "D. All of the above are correct."}], "ansL": "D", "ans": "All of the above are correct. 以上皆正確", "trig": "Flavours of Apigee Apigee 的版本型態 → 三個敘述都在描述同一套產品的兩種版本", "formula": "Apigee 題出現「兩種版本」「流量留在自家」「SaaS 代管」三種敘述同時列出 → 通常就是 All of the above；只要沒看到明顯錯誤敘述就別怕選「全部」。"}, {"no": "NO.160", "stem": "You are working in a company that provides different services to its customer. Now it also wants to offer some paid API services to its B2B customers for e.g. google provides google maps API, cloud vision API, and language translation API. You need to figure out the best solution for the service.", "opts": [{"L": "A", "ok": false, "html": "A. Java Programming Spring Boot Framework for to solve the problem of APIs management."}, {"L": "B", "ok": false, "html": "B. <b>Cloud Functions</b> with <b>Firestore</b> and payment gateways integration development."}, {"L": "C", "ok": true, "html": "C. <b>Apigee</b> API Management"}, {"L": "D", "ok": false, "html": "D. Frontend &amp; Backend Development with NodeJs and angular etc."}], "ansL": "C", "ans": "Apigee API Management Apigee API 管理平台", "trig": "paid API services to B2B customers 對企業客戶收費的 API 服務 → 需要 API 管理與計費 → Apigee", "formula": "題目出現「把 API 開放給外部／合作夥伴／要收費／要控管流量」→ 一律選 Apigee，不要選自己寫程式的選項。"}, {"no": "NO.182", "stem": "A bank wants to <b class=\"kw\">track the success</b> of their existing ATM network, which has been modernized with APIs to instantly notify customers about their transfers. What is the benefit of using Apigee to achieve this goal?", "opts": [{"L": "A", "ok": true, "html": "A. It has dashboards that chart dimensions and metrics to report on APIs."}, {"L": "B", "ok": false, "html": "B. It replicates banking APIs to create new business value."}, {"L": "C", "ok": false, "html": "C. It measures and tracks their total cost of ownership (TCO)."}, {"L": "D", "ok": false, "html": "D. It allows developers to connect the banking APIs with the public cloud."}], "ansL": "A", "ans": "It has dashboards that chart dimensions and metrics to report on APIs. 有儀表板呈現 API 的維度與指標", "trig": "track the success 追蹤成效 → 要看數據報表 → dashboards 儀表板", "formula": "題目問「怎麼知道 API 做得好不好／追蹤成效」→ 選有 dashboard／metrics／analytics 字眼的選項。"}, {"no": "NO.280", "stem": "A retail company stores their product inventory in a <b class=\"kw\">legacy system</b>. Often, customers find products on the company&#x27;s website and want to purchase them in-store. However, when they arrive, they discover that the products are <b class=\"kw\">out of stock</b>. How could the company benefit from using an application programming interface (API)?", "opts": [{"L": "A", "ok": false, "html": "A. To create personalized product recommendations for customers"}, {"L": "B", "ok": false, "html": "B. To optimize their on-premises legacy system stability"}, {"L": "C", "ok": false, "html": "C. By manually linking each inventory system to the website on a case-by-case basis"}, {"L": "D", "ok": true, "html": "D. By programmatically connecting the inventory system to their website"}], "ansL": "D", "ans": "By programmatically connecting the inventory system to their website 以程式方式把庫存系統接上網站", "trig": "legacy system 舊系統 + out of stock 缺貨 → 資料沒同步 → 用 API 自動串接", "formula": "「新系統要跟舊系統交換資料」的情境 → 選 API／programmatically；看到 manually 手動、case-by-case 逐案 → 一定是錯的。"}, {"no": "NO.291", "stem": "A food delivery service needs access to <b class=\"kw\">real-time menu information</b> from all partner restaurants. They also need to share customer order information with the restaurants in real time. What should the organization use?", "opts": [{"L": "A", "ok": false, "html": "A. Site reliability engineering (SRE)"}, {"L": "B", "ok": true, "html": "B. An application programming interface (API)"}, {"L": "C", "ok": false, "html": "C. A customized machine learning model"}, {"L": "D", "ok": false, "html": "D. A <b>multi-region</b>al database"}], "ansL": "B", "ans": "An application programming interface (API) 應用程式介面", "trig": "real-time menu information + share order information 雙向即時交換資料 → API", "formula": "只要題目是「A 系統要跟 B 系統互相拿資料／傳資料」→ 答案就是 API，不用管題目講的是餐廳、銀行還是零售。"}, {"no": "NO.308", "stem": "An organization <b class=\"kw\">cannot afford to modernize</b> their infrastructure but they want to process data from their legacy system in a modern platform hosted by a business partner What solution should the organization choose to <b class=\"kw\">make their data accessible</b>?", "opts": [{"L": "A", "ok": false, "html": "A. <b>Compute Engine</b>"}, {"L": "B", "ok": false, "html": "B. <b>Anthos</b>"}, {"L": "C", "ok": true, "html": "C. An application programming interlace"}, {"L": "D", "ok": false, "html": "D. <b>Google Kubernetes Engine</b>"}], "ansL": "C", "ans": "An application programming interface API 應用程式介面", "trig": "cannot afford to modernize 沒錢改造舊系統 + make their data accessible 讓資料可被取用 → 不動舊系統，用 API 開一扇門", "formula": "「舊系統不能動／沒預算改造，但要讓別人用到裡面的資料」→ 選 API；出現 Compute Engine、GKE、Anthos 這種要先搬遷的選項就淘汰。"}, {"no": "NO.333", "stem": "An organization wants to use Apigee to manage all their application programming interfaces (APIs). What will Apigee enable the organization to do?", "opts": [{"L": "A", "ok": false, "html": "A. Increase application privacy"}, {"L": "B", "ok": true, "html": "B. Measure and track API performance Most Voted"}, {"L": "C", "ok": false, "html": "C. Analyze application development speed"}, {"L": "D", "ok": false, "html": "D. Market and sell APIs"}], "ansL": "B", "ans": "Measure and track API performance 量測並追蹤 API 效能", "trig": "manage all their APIs 管理所有 API → Apigee 的核心價值是可視化與量測", "formula": "Apigee 概念題的標準答案優先序：量測／監控／分析 &gt; 安全控管 &gt; 變現；看到 privacy 隱私、development speed 開發速度 一律先淘汰。"}, {"no": "NO.388", "stem": "An organization provides a loyalty program for its customers. It recently <b class=\"kw\">partnered with other businesses</b> so that customers can get loyalty points at a range of other stores. Why should the organization use application programming interfaces (APIs)?", "opts": [{"L": "A", "ok": false, "html": "A. To migrate all partner data for <b>disaster recovery</b>"}, {"L": "B", "ok": false, "html": "B. To analyze and publish loyalty program statistics to a dashboard"}, {"L": "C", "ok": false, "html": "C. To personalize recommendations for loyalty card users"}, {"L": "D", "ok": true, "html": "D. To connect third-party systems to ensure up-to-date information"}], "ansL": "D", "ans": "To connect third-party systems to ensure up-to-date information 串接第三方系統以確保資訊即時更新", "trig": "partnered with other businesses 與其他商家合作 → 跨組織資料同步 → API", "formula": "題目出現 partner 合作夥伴、third-party 第三方 且要「資料一致／最新」→ 選 API 串接；看到 personalize 個人化、dashboard 儀表板 是干擾選項。"}, {"no": "NO.399", "stem": "An organization stores its important industry data in a relational database. They want to create a <b class=\"kw\">new revenue stream</b> by enabling third parties to use that data in their applications. Which cloud first approach should the organization choose?", "opts": [{"L": "A", "ok": false, "html": "A. Offer chargeable downloads of <b>archive</b>d data."}, {"L": "B", "ok": false, "html": "B. Transfer data into a non-relational database"}, {"L": "C", "ok": false, "html": "C. Add third-party users to their database"}, {"L": "D", "ok": true, "html": "D. Expose data through a chargeable API"}], "ansL": "D", "ans": "Expose data through a chargeable API 透過收費 API 開放資料", "trig": "new revenue stream 新收入來源 + enable third parties to use that data 讓第三方使用資料 → 收費 API", "formula": "「想用手上的資料賺錢／讓外部開發者使用」→ 選 expose via API；把外人直接加進資料庫的選項永遠是錯的。"}, {"no": "NO.45", "stem": "A video game organization has invested in cloud technology to generate insights from user behaviors. They want to ensure recommendations of games are aligned to players&#x27; interests. What may have prompted this business decision?", "opts": [{"L": "A", "ok": false, "html": "A. Customers expect faster time to market for games."}, {"L": "B", "ok": false, "html": "B. Employees expect source code changes to be deployed faster."}, {"L": "C", "ok": true, "html": "C. Customers expect a personalized experience."}, {"L": "D", "ok": false, "html": "D. Employees expect more predictable data management spending."}], "ansL": "C", "ans": "Customers expect a personalized experience. 客戶期待個人化體驗", "trig": "recommendations aligned to players&#x27; interests 依玩家興趣推薦 → 個人化", "formula": "「什麼促成這個決定」題型：先在題幹找關鍵動作，再找同義的選項。看到 recommendation 推薦／tailored 量身 → 選 personalized 個人化。"}, {"no": "NO.59", "stem": "An organization wants to <b class=\"kw\">dynamically adjust</b> its application to <b class=\"kw\">serve different user needs</b>. What are the benefits of storing their data in the cloud for this use case?", "opts": [{"L": "A", "ok": false, "html": "A. Data can be stored in <b>archive</b> for long term access"}, {"L": "B", "ok": false, "html": "B. Automatic data cleaning and validation"}, {"L": "C", "ok": true, "html": "C. Real-time data ingestion and analysis"}, {"L": "D", "ok": false, "html": "D. No data access management required"}], "ansL": "C", "ans": "Real-time data ingestion and analysis 即時資料擷取與分析", "trig": "dynamically adjust 動態調整 + serve different user needs 服務不同需求 → 要即時資料才調得動", "formula": "題幹有 dynamically 動態、real-time 即時、on the fly 即時反應 → 選帶 real-time 的選項；凡是「完全不需要管理／自動幫你全包」的敘述都是錯的。"}, {"no": "NO.89", "stem": "An organization&#x27;s applications run on an <b class=\"kw\">inflexible</b>, on-premises architecture. The organization has decided to <b class=\"kw\">modernize</b> their existing applications with the cloud. What may have prompted this business decision?", "opts": [{"L": "A", "ok": false, "html": "A. Developers want cloud providers to take full control of their application performance."}, {"L": "B", "ok": false, "html": "B. IT managers want cloud providers to automatically deploy their infrastructure."}, {"L": "C", "ok": false, "html": "C. IT managers want to stop making gradual changes."}, {"L": "D", "ok": true, "html": "D. Developers want to test ideas and experiment with more ease."}], "ansL": "D", "ans": "Developers want to test ideas and experiment with more ease. 開發者想更輕鬆地測試與實驗", "trig": "inflexible 不靈活 + modernize 現代化 → 想要更容易試錯", "formula": "痛點是 inflexible／rigid 僵化 → 答案要挑「更容易嘗試、更快迭代」；凡出現「雲商全權負責」「不再做漸進改變」都是錯的。"}, {"no": "NO.122", "stem": "What characteristics should an organization adopt to be a DevOps organization?", "opts": [{"L": "A", "ok": false, "html": "A. Teamwork over individual work"}, {"L": "B", "ok": false, "html": "B. Obsession with Automation over preoccupation with manual work"}, {"L": "C", "ok": false, "html": "C. Product based teams over component teams."}, {"L": "D", "ok": true, "html": "D. All of the Above"}], "ansL": "D", "ans": "All of the Above 以上皆是", "trig": "DevOps organization DevOps 組織 → 團隊合作、自動化、產品型團隊三者都是特徵", "formula": "DevOps 文化題出現「合作、自動化、共同承擔、產品導向」的組合 → 選 All of the Above；只有出現「個人英雄」「追究責任」「手動控管」才是錯的。"}, {"no": "NO.227", "stem": "An organization wants to upskill their IT staff. How can they do this in a <b class=\"kw\">transformational way</b>?", "opts": [{"L": "A", "ok": false, "html": "A. Prioritize training current employees instead of hiring new recruits with cloud experience."}, {"L": "B", "ok": false, "html": "B. Prioritize giving privileged access to third-party partners and contractors to fill IT knowledge gaps."}, {"L": "C", "ok": false, "html": "C. Create a culture of self-motivated, isolated learning with official training materials."}, {"L": "D", "ok": true, "html": "D. Create a culture of continuous peer-to-peer learning with official training materials."}], "ansL": "D", "ans": "Create a culture of continuous peer-to-peer learning with official training materials. 建立同儕間持續學習的文化並搭配官方教材", "trig": "transformational way 轉型式的做法 → 要改的是「文化」而不是單點措施", "formula": "題目問 transformational 轉型式做法 → 選帶 culture 文化、continuous 持續、shared 共享、peer 同儕 的選項；看到 isolated 孤立、blame 責備、one-off 一次性就淘汰。"}, {"no": "NO.235", "stem": "How does switching from on-premises to the cloud help organizations <b class=\"kw\">gain value over time</b>?", "opts": [{"L": "A", "ok": true, "html": "A. They can focus their efforts on solution development"}, {"L": "B", "ok": false, "html": "B. They can relax their on-premises data security protocols"}, {"L": "C", "ok": false, "html": "C. They can expand their internal application hosting infrastructure"}, {"L": "D", "ok": false, "html": "D. They can increase development of data recovery systems"}], "ansL": "A", "ans": "They can focus their efforts on solution development 能把心力放在解決方案開發上", "trig": "gain value over time 隨時間累積價值 → 不用顧硬體，人力轉去做產品", "formula": "「上雲長期好處」題 → 選「把人力從維護搬到創新／開發」的選項；凡是「可以放寬安全」「繼續擴自家機房」都是錯的。"}, {"no": "NO.240", "stem": "An organization&#x27;s developers are growing increasingly <b class=\"kw\">frustrated by the limitations</b> of their on-premises infrastructure. How
