function lookup(raw){
  let k = raw.toLowerCase().replace(/[’']s$/,'').replace(/’/g,"'");
  const t = [k];
  if (k.endsWith('ies')) t.push(k.slice(0,-3)+'y');
  if (k.endsWith('ied')) t.push(k.slice(0,-3)+'y');
  if (k.endsWith('es'))  t.push(k.slice(0,-2));
  if (k.endsWith('s'))   t.push(k.slice(0,-1));
  if (k.endsWith('ed'))  { t.push(k.slice(0,-2)); t.push(k.slice(0,-1)); }
  if (k.endsWith('ing')) { t.push(k.slice(0,-3)); t.push(k.slice(0,-3)+'e'); }
  if (k.endsWith('ly'))  t.push(k.slice(0,-2));
  if (!lookup.all) { lookup.all = {}; LESSONS.forEach(l => { for (const w in (l.gloss||{})) if (!(w in lookup.all)) lookup.all[w] = l.gloss[w]; }); }
  const cur = UI.view === 'lesson' ? LESSONS.find(x => x.id === UI.id) : null, LG = (cur && cur.gloss) || {};
  for (const x of t) { const v = LG[x] || G[x] || lookup.all[x]; if (v) return { key:x, zh:v }; }
  return { key:k, zh:'' };

`<h3>🔓 Open source vs Open standard：官方卡片逐字定義</h3>
<p class="big">一個管<b>程式碼</b>，一個管<b>規格</b>。官方定義——<span class="en-t">open standard</span>：軟體遵循<b>公開、任何人都能存取使用的規格</b>，避免 <span class="en-t">vendor lock-in</span>、確保<b>互通</b>，例如 <span class="en-t">HTTP</span>（網頁請求內容）、<span class="en-t">XML</span>（儲存結構化資料）。<span class="en-t">open source</span>：<b>原始碼公開</b>、任何人可免費使用、修改、分享，通常由<b>去中心化社群</b>基於<b>透明</b>與<b>開放交流</b>共同開發，是 <span class="en-t">open cloud</span> 提供<b>可攜性</b>（<span class="en-t">portability</span>）的關鍵。</p>
<div class="tw"><table>
<tr><th>項目</th><th class="en-t">Open standard</th><th class="en-t">Open source</th></tr>
<tr><td>管什麼</td><td>公開規格，大家都能照做</td><td>原始碼公開、可修改</td></tr>
<tr><td>官方舉例</td><td class="en-t">HTTP, XML</td><td>去中心化社群協作</td></tr>
<tr><td>重點</td><td>互通性（不綁定某家程式碼）</td><td>程式碼本身、可攜性</td></tr>
</table></div>
<div class="kw"><span class="k en-t">open source</span><span class="k en-t">open standard</span><span class="k en-t">interoperability</span><span class="k en-t">specification</span><span class="k en-t">portability</span></div>

`<h3>🏭 真實世界長怎樣：拿「連鎖實體書店轉型」看雲端與 AI 效益</h3>
<p class="big">想像你在營運一家老牌實體連鎖書店，這課的核心觀念在實際業務轉型中是這樣跑起來的：</p>
<p><b>1. 過去自建機房的痛苦</b> ➔ 以前每年花大錢買伺服器擺在地下室（<span class="en-t">capital expenditures</span>），平時閒置浪費電；每逢開學搶書季湧入暴量人潮，伺服器卻直接死當（缺乏 <span class="en-t">scalability</span> 擴展性 與 <span class="en-t">elasticity</span> 彈性）。</p>
<p><b>2. 數位轉型（Digital Transformation）</b> ➔ 不只是把紙本書上架到網路賣（那只是 <span class="en-t">cloud migration</span> 搬家）；而是重新打造讀者閱讀社群、門市與線上即時查庫存、根據閱讀喜好動態推薦，連內部營運流程與組織文化全部升級（<span class="en-t">digital transformation</span>）。</p>
<p><b>3. 雲端核心效益四部曲</b>：<br>
・<b class="en-t">Scalable</b>：雙 11 或暑假書展湧入百萬流量，自動加開運算資源，搶購結束自動縮回，完全不用預先買一堆昂貴硬體。<br>
・<b class="en-t">Flexible</b>：店員在門市用平板、讀者在家用手機、主管在出差路上，隨處連上網路都能無縫使用（<span class="en-t">flexible access</span>）。<br>
・<b class="en-t">Agile</b>：工程師開發「線上二手書交換」新功能，不用等幾個月採購機房，幾天內就能快速上線測試市場反應（<span class="en-t">agile development</span>）。<br>
・<b class="en-t">Fast</b>：依靠 Google 自家的全球私有光纖網路（<span class="en-t">global private network</span>），海外讀者秒開網頁，延遲極低。</p>
<p><b>4. 自主 AI 助理（Agentic AI）</b> ➔ 推出 24 小時線上閱讀秘書。它不只會聊天，還能自主推理、主動查詢各分店庫存、聯繫出版社調貨、甚至替讀者完成調書與取件通知整套多步驟流程（<span class="en-t">agentic AI</span>，而不是死板的固定規則自動化）。</p>
<p><b>5. 擁抱開源與開放標準</b> ➔ 全面採用開放規格與開源技術（<span class="en-t">open source</span> 與 <span class="en-t">open standard</span>），避免日後被特定單一廠商鎖死綁架（<span class="en-t">avoid vendor lock-in</span>）。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">create or modify business processes and customer experiences</span>（數位轉型）、<span class="en-t">avoid vendor lock-in</span>（開源標準）、<span class="en-t">scale up or down on demand</span>（彈性擴展）。</p>`,

  hunt: [
    {chunks:['A traditional retail chain is under pressure from nimble digital-first competitors,',' so leadership decides to modernize its checkout systems, retrain staff,',' and redesign customer service processes',' to keep pace with changing market expectations.'], keys:[1,2], opts:['Digital transformation','Cloud migration','Data governance'], ans:'Digital transformation', why:'<br><b>💡 這個概念在講什麼</b>：官方對 digital transformation 的定義是「用新科技去改變<b>業務流程、文化、顧客體驗</b>，跟上市場的變化」。重點在「人和做事的方法一起變」，光換機器不算。像一家老麵包店，換了新烤箱只是升級設備；連店員的訓練、點餐流程、跟客人互動的方式都改了，才叫轉型。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>retrain staff</b>＝文化（人的做法）在變；<b>redesign customer service processes</b>＝流程和顧客體驗在變。技術、人、流程三個一起動，就是轉型。<br><b>❌ 其他選項為什麼不對</b>：Cloud migration（上雲搬遷）只是把系統搬到雲上，題目重點是整家公司的做法在改，範圍大很多。Data governance（資料治理）管的是資料誰能用、怎麼保管，題目完全沒提資料。<br><b>🔄 換個說法就換答案</b>：如果題目只寫「把收銀系統整套搬到雲端，員工和流程都不變」，那就只是 cloud migration，還沒到轉型。'},
    {chunks:['A retailer bolts new AI tools onto its old, one-size-fits-all cloud platform,',' and soon notices hidden costs',' showing up as extra complexity, higher latency, and new security risks',' that slow its innovation to a crawl.'], keys:[0,1], opts:['Integration tax','Vendor lock-in','Data-driven insights'], ans:'Integration tax', why:'<br><b>💡 這個概念在講什麼</b>：integration tax（整合稅）是把新的 AI 工具，硬裝在一套沒為 AI 設計的舊雲端上，結果一直付出看不見的代價。就像老房子加蓋一層，管線、電路全是舊的，接不順就得一直花力氣補。官方列的代價有四種：複雜度、延遲高、新的資安風險、成本失控（C1 官方課程）。叫它「稅」，是因為這筆錢不會寫在帳單上，但你每天都在繳。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>bolts new AI tools onto its old … cloud platform</b>＝新工具硬接到舊平台，這是成因；<b>hidden costs</b>＝看不見的代價，這是結果。成因和結果都出現，就是 integration tax。後面列的複雜度、延遲、資安風險，是在幫你確認這個判斷。<br><b>❌ 其他選項為什麼不對</b>：Vendor lock-in（被廠商綁住）講的是「想換一家雲卻換不掉」，題目裡沒有人想換廠商。Data-driven insights（用資料做決策）是好處，題目講的是苦頭，方向相反。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家零售商想換到別家雲，卻發現資料和程式都搬不走」，答案就變成 Vendor lock-in。'},
    {chunks:['A research lab needs to train and deploy large AI models with exceptional performance,',' so it chooses Google Cloud infrastructure built around custom-designed TPUs,',' native support for open-source frameworks like PyTorch and JAX,',' and a flexible consumption model with pay-as-you-go options.'], keys:[0,1], opts:['AI Hypercomputer','Global network','Cost-effectiveness'], ans:'AI Hypercomputer', why:'<br><b>💡 這個概念在講什麼</b>：AI Hypercomputer 是 Google 專門給 AI 用的整套基礎設施，官方說它讓客戶用極好的效能和效率去<b>訓練、部署</b> AI。把它想成一座專門蓋來跑 AI 的工廠：機器用 Google 自己設計的 TPU（專為 AI 打造的晶片），工人可以用他們熟的開源工具（PyTorch、JAX），付費方式也彈性（用多少付多少）。硬體、軟體、付費三件事打包在一起（C1、C3 官方課程）。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>train and deploy large AI models with exceptional performance</b>＝這是 AI Hypercomputer 的官方用途原句；<b>custom-designed TPUs</b>＝它最招牌的硬體。看到 TPU 加上訓練 AI，就往 AI Hypercomputer 想。<br><b>❌ 其他選項為什麼不對</b>：Global network（全球網路）講的是 Google 的海底電纜和機房網路，讓資料傳得快，題目重點是訓練 AI 的算力。Cost-effectiveness（划算）只對應題目最後那段付費方式，是其中一個優點，沒辦法代表整套基礎設施。<br><b>🔄 換個說法就換答案</b>：如果題目寫「用戶在世界各地都要低延遲存取，靠 Google 的私有光纖網路」，答案就變成 Global network。'},
    {chunks:['A nonprofit wants its data pipeline software to stay portable across any cloud provider it might use in the future,',' so it chooses code that a decentralized community can freely inspect, modify, and share,',' built on a philosophy of transparency and open exchange of ideas,',' rather than one vendor’s proprietary format.'], keys:[1,2], opts:['Open source','Open standard','Proprietary format'], ans:'Open source', why:'<br><b>💡 這個概念在講什麼</b>：open source（開放原始碼）是<b>程式碼本身</b>公開，任何人都能免費使用、修改、分享，通常由一群分散各地的人一起開發（C1 官方課程）。它容易跟 open standard（開放標準）搞混。開放標準公開的是<b>規格</b>，像 HTTP、XML，大家照同一套規則做，產品就能互通。比喻一下：open source 像把整份食譜連作法公開，誰都能改；open standard 像規定插頭長什麼樣，各家自己做電器，但都插得進同一個插座。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>a decentralized community can freely inspect, modify, and share</b>＝程式碼公開、大家一起改；<b>transparency and open exchange of ideas</b>＝官方對 open source 的原話。重點落在「程式碼和社群」，所以選 open source。<br><b>❌ 其他選項為什麼不對</b>：Open standard 講的是公開規格，題目講的是公開程式碼、社群一起改。Proprietary format（廠商私有格式）正好是題目說不要的東西（rather than）。<br><b>🔄 換個說法就換答案</b>：如果題目寫「採用大家公認的公開規格（例如 HTTP），讓不同廠商的產品能互相溝通」，答案就變成 Open standard。'},
  ],
  mcq: [
    {stem:'A logistics company moves its scheduling software from its own servers onto a cloud provider\'s virtual machines, without changing how dispatchers work, how routes are planned, or how customers are served. What has this company done?',
     opts:['Completed a cloud migration, but not a digital transformation','Completed a digital transformation','Adopted agentic AI','Achieved high availability'], ans:'A',
     key:'without changing how dispatchers work',
     why:{A:'只搬了系統、業務流程和顧客體驗都<b>沒有</b>跟著改變，這是 cloud migration，還沒達到 digital transformation 的門檻。',B:'⚠️ 雙陷阱：表面上「上雲了」很像轉型，但官方定義的 digital transformation 一定要有業務流程、文化、顧客體驗的改變，這題三者都沒變，所以還不算。',C:'題目完全沒提到自主規劃或執行任務的 AI 系統，跟 agentic AI 無關。',D:'題目沒提到可用性或跨區複寫，跟 high availability 無關。'}},
    {stem:'A company adds new AI features on top of its old, one-size-fits-all cloud setup and immediately runs into unexpected complexity, slower response times, and new security gaps that were never budgeted for. Which challenge is this company experiencing?',
     opts:['Integration tax','Vendor lock-in','High availability','Cost-effectiveness'], ans:'A',
     key:'unexpected complexity, slower response times, and new security gaps',
     why:{A:'<b>unexpected complexity</b>、<b>slower response times</b>（延遲）、<b>new security gaps</b>，正是官方定義「把 AI 硬裝在舊雲端上」冒出的 integration tax。',B:'vendor lock-in 講的是被單一廠商綁死、換不了平台，跟這裡「疊加 AI 冒出隱藏成本」不是同一件事。',C:'high availability 講的是可用性，跟這裡的複雜度、延遲、資安問題無關。',D:'cost-effectiveness 講的是用多少付多少，這題反而是意外冒出的成本，方向相反。'}},
    {stem:'A logistics platform is given a high-level goal to reduce delivery delays. Without step-by-step instructions, it independently plans a new route, uses a third-party carrier tool to book a driver, and adjusts the plan again when a delay occurs, completing the entire multi-step workflow with minimal human intervention. Which capability does this best describe?',
     opts:['Agentic AI','A fixed if-this-then-that automation rule','A generative AI chatbot that answers one question at a time','A business intelligence dashboard'], ans:'A',
     key:'multi-step workflow with minimal human intervention',
     why:{A:'<b>independently plans</b>、<b>uses a … tool</b>、完成 <b>multi-step workflow</b>，中間只需 <b>minimal human intervention</b> = agentic AI 的官方定義。',B:'⚠️ 雙陷阱：固定規則的 automation 也「不用人盯著」，但它只會照事先寫死的條件觸發，不會自己規劃、推理、換工具應變——agentic AI 的關鍵是自主規劃與推理能力，不是單純自動化。',C:'一般 generative AI chatbot 是針對單一個 prompt 產出內容，不會自己串起一連串決策與行動。',D:'dashboard 只負責呈現數據，不會自己做決定或採取行動。'}},
    {stem:'A research lab needs to train a large AI model and wants performance-optimized custom hardware paired with open software and a flexible, pay-as-you-go consumption model. Which Google Cloud offering best matches this need?',
     opts:['AI Hypercomputer','Apigee API Management','Security Command Center','Cloud Armor'], ans:'A',
     key:'performance-optimized custom hardware',
     why:{A:'<b>performance-optimized custom hardware</b>（如自研 TPU）＋開放軟體＋彈性付費，正是 AI Hypercomputer 整合硬體、軟體、付費模式的定義。',B:'Apigee API Management 管的是 API 的發布與管理，跟 AI 訓練用的硬體無關。',C:'Security Command Center 是資安風險視覺化工具，跟 AI 訓練基礎設施無關。',D:'Cloud Armor 是防 DDoS 與 Web 攻擊的服務，跟 AI 訓練硬體無關。'}},
    {stem:'A company only builds new services on technologies that follow open, publicly accessible specifications, such as HTTP, so that products from many different vendors can work together. Which risk is this decision primarily protecting against?',
     opts:['Vendor lock-in','High availability','Data-driven insights','Integration tax'], ans:'A',
     key:'publicly accessible specifications',
     why:{A:'官方課程小測驗（改寫自 M1_L4 hybrid/multicloud 小測驗其中一項正解：avoid vendor lock-in concerns and take advantage of … different cloud providers）：遵循<b>公開規格</b>、確保<b>相容互通</b>，正是 open standard 用來避開 vendor lock-in 的做法。',B:'high availability 講的是可用性、複寫備援，跟規格公不公開無關。',C:'data-driven insights 講的是用資料和機器學習做決策，跟規格互通無關。',D:'integration tax 講的是疊加新技術冒出的隱藏成本，跟「選開放規格」這個動作本身方向不同。'}}
  ],
  exam: [
    {no:338, stem:'An organization is using new technologies to change its business processes and culture to develop new customer experiences and adapt to market dynamics. What is the name of this approach?',
     opts:['Digital transformation','Operations optimization','Data center migration','User personalization'],
     ans:'A', keys:['change its business processes and culture','adapt to market dynamics'],
     why:{A:'<b>change its business processes and culture</b> ＋新顧客體驗＋<b>adapt to market dynamics</b>，這正是官方對 digital transformation 的逐字定義。',B:'operations optimization 只講作業效率，沒有涵蓋文化與顧客體驗的全面改變。',C:'data center migration 只是機房搬遷，層次比 digital transformation 小很多。',D:'user personalization 只是顧客體驗改善的其中一種手法，不是整體的轉型 approach。'}},
    {no:45, stem:"A video game organization has invested in cloud technology to generate insights from user behaviors. They want to ensure recommendations of games are aligned to players' interests. What may have prompted this business decision?",
     opts:['Customers expect faster time to market for games.','Employees expect source code changes to be deployed faster.','Customers expect a personalized experience.','Employees expect more predictable data management spending.'],
     ans:'C', keys:["aligned to players' interests",'a personalized experience'],
     why:{A:'題目在講「推薦要貼合玩家興趣」，跟遊戲多快上市無關，這是誘餌。',B:'部署程式碼的速度是開發流程議題，跟「依玩家興趣推薦」沒有關係。',C:'<b>recommendations … aligned to players\' interests</b> = 顧客期待 <b>a personalized experience</b>，呼應官方驅動因子第 4 項「connected architecture」裡「客戶要頂尖 AI 公司那種 speed and personalization」的說法。',D:'資料管理支出可預測性是成本考量，跟這題「依興趣推薦」的情境對不上。'}},
    {no:128, stem:"A large travel company has thus far invested heavily in their technology team. There is strategic pressure on the company to focus on their core business and innovate to survive in certain geographies and thrive in others. They are evaluating whether a move to Google Cloud will be good for them. Which of these reasons would be relevant for them? (choose two answer)",
     opts:["Application architecture won't be too involved because of serverless options.","The IT team won't have to manage software upgrades, security patches, etc. for the VMs.","The IT team won't have to work on procuring and provisioning new hardware and refreshes to existing hardware.","Budgeting won't be an issue since the cloud takes care of billing."],
     ans:'B', keys:['manage software upgrades, security patches', 'focus on their core business'],
     why:{A:'serverless 架構單純與否跟題目「聚焦核心業務」的策略壓力沒有直接對應，屬於較弱的理由。',B:'<b>won\'t have to manage software upgrades, security patches</b> = IT 團隊不用再顧這些維運瑣事，正好對應官方 cost-effective 效益裡「they can deploy IT staff to work on more strategic initiatives」的說法 → 速記卡標的正解。',C:'不用採購硬體也是雲端常見好處，語意上跟 B 同樣成立（原題是 choose two），但本課系統僅支援單選，依速記卡取 B 為代表答案，詳見 notes。',D:'雲端計費仍需要團隊自己做預算管理，「budgeting won\'t be an issue」講得太絕對，不是恰當理由。'}},
    {no:240, stem:"An organization's developers are growing increasingly frustrated by the limitations of their on-premises infrastructure. How would they benefit from leveraging cloud technology?",
     opts:['They can expect 100% service availability.','They can avoid the limitations of serverless computing.','They can have new tools to innovate and optimize resource usage.','They can optimize maintenance for their on-premises infrastructure.'],
     ans:'C', keys:['new tools to innovate and optimize resource usage'],
     why:{A:'沒有任何服務能保證 <b>100%</b> 可用性（官方講的是 99.999%），這個選項講得太絕對，是誘餌。',B:'題目在講擺脫 on-premises 的限制，不是要避開 serverless 的限制，選項邏輯反了。',C:'<b>new tools to innovate and optimize resource usage</b> 呼應官方 strategic value 效益「working with the latest technology advancements」——上雲後拿到最新技術帶來的競爭優勢。',D:'目標是脫離 on-premises，繼續「優化 on-premises 維護」跟情境方向相反。'}},
    {no:328, stem:"An organization's web developers and operations personnel use different systems. How will increasing communication between the teams reduce issues caused by silos?",
     opts:['By assigning blame for failures and establishing consequences','By combining job role responsibilities to ensure that everyone has shared access','By increasing data encryption to strengthen workflows','By emphasizing shared ownership of business outcomes'],
     ans:'D', keys:['emphasizing shared ownership of business outcomes'],
     why:{A:'究責、訂罰則反而會讓團隊更不敢溝通，跟打破 silo 的方向相反。',B:'合併職責、共享權限是組織設計問題，不是「增加溝通」本身能解決的事。',C:'加密資料是資安措施，跟部門間的溝通、silo 問題無關。',D:'<b>emphasizing shared ownership of business outcomes</b> = 讓兩邊團隊一起對結果負責，這正是官方定義裡「文化」要一起轉型的具體展現，也是增加溝通能化解 silo 對立的原因。'}},
    {no:319, stem:'An organization wants to move from a tactical cloud adoption approach to a transformational approach. How should they adapt the way they lead the organization?',
     opts:['Increase top-down visibility and foster a culture of blamelessness','Shift from an operational expenditure model to capital expenditure','Drive cloud adoption with an individual contributor focus','Invest in on-premises infrastructure to redesign relationships between IT and employees'],
     ans:'A', keys:['top-down visibility and foster a culture of blamelessness'],
     why:{A:'<b>top-down visibility</b> ＋ <b>culture of blamelessness</b> = 由上而下透明、不究責的文化，正是把雲端採用從「戰術性」拉高到「轉型性」（呼應官方定義裡的「文化」）該有的領導做法。',B:'雲端轉型的財務方向是從 CapEx 轉向 OpEx，這個選項方向講反了。',C:'只靠個人貢獻者推動，缺乏由上而下的領導力，不足以達到轉型層級的改變。',D:'目標是往雲端轉型，繼續投資 on-premises 基礎設施跟方向相反。'}},
    {no:405, stem:'How does a large hotel chain benefit from storing their customer reservation data in the cloud?',
     opts:['On-premises hardware access to transaction data','Real-time data transformation at scale within an on-premises database','Real-time business transaction accuracy at scale','Physical hardware access during peak demand'],
     ans:'C', keys:['Real-time business transaction accuracy at scale'],
     why:{A:'題目在講「存到雲端」的好處，答案卻繞回 on-premises 硬體，方向不對。',B:'同樣把場景拉回 on-premises 資料庫，跟「存在雲端」的情境矛盾。',C:'<b>Real-time business transaction accuracy at scale</b> = 訂房這種大量即時交易，雲端能靠 scalable／high availability 兩項效益保持即時且準確地擴展處理，正是存雲端的好處。',D:'尖峰時期還要靠實體硬體，跟雲端隨需擴充的精神相反。'}},
    {no:89, stem:"An organization's applications run on an inflexible, on-premises architecture. The organization has decided to modernize their existing applications with the cloud. What may have prompted this business decision?",
     opts:['Developers want cloud providers to take full control of their application performance.','IT managers want cloud providers to automatically deploy their infrastructure.','IT managers want to stop making gradual changes.','Developers want to test ideas and experiment with more ease.'],
     ans:'D', keys:['test ideas and experiment with more ease'],
     why:{A:'把應用效能的<b>全部控制權</b>交給雲端供應商講得太絕對，不是企業現代化的合理動機。',B:'自動部署基礎設施是技術手段之一，不是驅動「現代化決策」的核心理由。',C:'題目講的是要脫離僵化架構，「停止漸進式改變」邏輯上跟現代化的精神相反。',D:'<b>test ideas and experiment with more ease</b> 正是官方 agile 效益的定義「develop new applications and rapidly get them into production」——更容易做實驗、快速迭代。'}}
  ],
  odd: [
    {items:['A bank rethinks how its branches, staff, and mobile app work together so customers can open accounts in minutes instead of days.',' A hospital uses new digital tools to change its patient check-in process and trains nurses to work in a more data-driven way.','A logistics company copies its existing servers to a public cloud exactly as they are, with no changes to its processes or customer experience.','A publisher changes its business model, internal culture, and reader experience to adapt to how people now consume news online.'].map(x=>x.trim()), odd:2, main:'Digital transformation', opts:['Cloud migration','Integration tax','Open standard'], ans:'Cloud migration', why:'<br><b>💡 差在哪</b>：另外 3 句都有「流程、文化、顧客體驗」至少一項跟著改變，這是官方對 digital transformation 的定義（C1 官方課程）。第 3 句只是把伺服器原封不動搬上雲（<b>exactly as they are, with no changes</b>），做事方法完全沒變，所以只算 cloud migration。<br><b>🔑 考場怎麼用</b>：看到「搬上雲」先別急著選 transformation，再找有沒有講到人、流程或顧客體驗也在變。沒有的話，就只是 migration。<br><b>❌ 其他選項</b>：Integration tax 講的是新 AI 工具硬裝在舊平台上產生的隱形代價，這句沒有提到任何代價。Open standard 是公開的技術規格（像 HTTP），跟搬家無關。'},
    {items:['Developers around the world can read, change, and share the code of this database engine for free.','A decentralized community builds this software in public, guided by transparency and the open exchange of ideas.','Every web browser and server follows the same publicly available HTTP specification, so products from different vendors can talk to each other.','Because its source code is public, a company can take this tool to any cloud provider without asking permission.'], odd:2, main:'Open source', opts:['Open standard','Vendor lock-in','Scalability'], ans:'Open standard', why:'<br><b>💡 差在哪</b>：另外 3 句講的都是<b>程式碼本身</b>公開、社群一起改，這是 open source（C1 官方課程）。第 3 句講的是大家遵守同一份<b>公開規格</b>（<b>publicly available HTTP specification</b>），各家產品自己做、但能互通，這是 open standard。官方舉的 open standard 例子正好就是 HTTP 和 XML。<br><b>🔑 考場怎麼用</b>：看到 code、community、modify 就往 open source 想；看到 specification、guidelines、interoperable、HTTP／XML 就往 open standard 想。<br><b>❌ 其他選項</b>：Vendor lock-in 是被單一廠商綁住、想走走不掉，這句剛好相反，講的是大家都能互通。Scalability 是資源能跟著需求放大縮小，跟規格無關。'}
  ],

  cards: [
`<h3>🏢☁️ IT 基礎架構三兄弟：On-premises／Private cloud／Public cloud</h3>
<p class="big">看基礎架構在<b>誰的機房</b>、<b>跟誰共用</b>：<span class="en-t">on-premises</span> ＝機房在自己家；<span class="en-t">private cloud</span> ＝雲端規格但只給一個組織用；<span class="en-t">public cloud</span> ＝廠商的機房，跟其他租戶（<span class="en-t">tenants</span>）共用。</p>
<p>🎨 畫面：<span class="en-t">on-premises</span> 是自己蓋房子自己住；<span class="en-t">private cloud</span> 是包一整棟新蓋大樓自己住；<span class="en-t">public cloud</span> 是住進一整棟公寓，每戶鎖起來互不干擾，物業公司幫你管維修。</p>
<div class="kw"><span class="k en-t">on-premises</span><span class="k en-t">private cloud</span><span class="k en-t">public cloud</span><span class="k en-t">multi-tenant</span><span class="k en-t">tenants</span></div>
<div class="ex"><span class="en-t">In a public cloud deployment model, infrastructure is managed by a third party provider and shared with multiple <mark>tenants</mark> through the public internet.</span><button class="speak" title="唸給我聽">🔊</button></div>
<div class="tw"><table>
<tr><th></th><th>誰管基礎設施</th><th>效益</th><th>要注意的取捨</th></tr>
<tr><td><b class="en-t">On-premises</b></td><td>自己公司全包</td><td>不用第三方介入，硬體軟體完全自己掌控，不用付持續使用費</td><td>採購跑流程要好幾個月，還要機房空間跟專業人力，需求一多很難迅速擴充；容易買多或買少造成浪費</td></tr>
<tr><td><b class="en-t">Private cloud</b></td><td>自己或代管廠商，但只服務一家</td><td>有公有雲的自助服務、擴充彈性，客製化程度比 on-premises 更高</td><td>適合已經砸大錢在自家基礎設施、或法規要求資料留本地的組織</td></tr>
<tr><td><b class="en-t">Public cloud</b></td><td>第三方廠商（如 Google Cloud）</td><td>隨用隨有，不用自己採購設定管理，用多少付多少</td><td>資源跟其他租戶共用機房，但彼此資料互相看不到</td></tr>
</table></div>
<p class="tiny">口訣：全部自己扛 → on-premises；規格是雲但只給我一家用 → private cloud；跟其他租戶共用機房 → public cloud。</p>`,

`<h3>🌉 Hybrid cloud：公有雲 +（私有雲 或 自家機房）</h3>
<p class="big"><span class="en-t">Hybrid cloud</span>（混合雲）：應用程式同時跑在<b>不同環境的組合</b>裡。官方最常舉的例子是<b>自家機房（on-premises）加公有雲</b>，但只要是<b>私有雲或自家機房，跟公有雲搭在一起用</b>，都算 hybrid cloud——不是只有「自家機房 + 公有雲」這一種組合才算。</p>
<p>🎨 畫面：家裡有自己的廚房，也常叫外送，兩邊互相支援、缺哪個補哪個——廚房是自己蓋的，還是包一整層私廚，都算「有自己的廚房」。</p>
<div class="kw"><span class="k en-t">hybrid cloud</span><span class="k en-t">combination</span><span class="k en-t">on-premises</span><span class="k en-t">private cloud</span><span class="k en-t">public cloud</span></div>
<div class="ex"><span class="en-t">A <mark>hybrid cloud</mark> is one in which applications run in a combination of a private cloud environment and a public cloud environment.</span><button class="speak">🔊</button></div>
<p class="tiny">選 hybrid 的常見理由：已經在自家基礎設施砸了大錢、或法規要求資料留在本地，但仍想用公有雲的新功能。這是目前最常見的架構之一。</p>`,

`<h3>☁️☁️ Multicloud：兩家以上公有雲</h3>
<p class="big"><span class="en-t">Multicloud</span>（多雲）：架構<b>結合兩個以上的公有雲廠商</b>（例如 Google Cloud 加 AWS 或 Azure），重點是「不只用一家公有雲」，跟有沒有自家機房沒有必然關係。組織也可能同時有自家機房加好幾家公有雲，那就同時是 hybrid 又是 multicloud。</p>
<p>🎨 畫面：叫外送不只叫一家，好幾個平台輪流用，怕被單一店家綁住，也想吃到各家的招牌菜。</p>
<div class="kw"><span class="k en-t">multicloud</span><span class="k en-t">at least two</span><span class="k en-t">public cloud providers</span></div>
<div class="ex"><span class="en-t"><mark>Multicloud</mark> architectures combine at least two public cloud providers, such as Google Cloud, Amazon Web Services, or Microsoft Azure.</span><button class="speak">🔊</button></div>
<p class="tiny">選 multicloud 的常見理由：想截長補短，用到不同雲端廠商各自最強的服務。</p>`,

`<h3>🔀 易混：Private／Hybrid／Multicloud</h3>

<tr><td><b class="en-t">Private cloud</b></td><td>只給一個組織用，沒有跟公有雲搭</td><td class="en-t">dedicated, single organization</td></tr>
<tr><td><b class="en-t">Hybrid cloud</b></td><td>公有雲 ＋（私有雲 <b>或</b> 自家機房）</td><td class="en-t">combination, on-premises, private cloud, public cloud</td></tr>
<tr><td><b class="en-t">Multicloud</b></td><td>兩家以上公有雲，不需要自家機房</td><td class="en-t">at least two public cloud providers</td></tr>

<div class="box key">🗣️ 口訣：<b>只有一家在用、沒接公有雲 → private cloud；有自己的機房或私有雲、還接了公有雲 → hybrid；完全沒有自己的機房，只是跟好幾家公有雲廠商打交道 → multicloud。</b></div>`,

`<h3>🎯 為什麼選 Hybrid／Multicloud：官方 8 個理由</h3>
<p class="big">官方課程列了 8 個組織會選 hybrid 或 multicloud 的原因，分兩組記，<b>一個都不能漏</b>：</p>
<div class="tw"><table>
<tr><th>理由</th><th>白話講</th></tr>
<tr><td class="en-t">Access to latest technologies</td><td>用到各家雲端廠商最新的技術與能力，截長補短</td></tr>
<tr><td class="en-t">Modernize at the right pace</td><td>照自己的步調把系統一步步搬上雲端，不用一次到位</td></tr>
<tr><td class="en-t">Improve ROI</td><td>加一家公有雲擴充算力，不用再花錢蓋機房，投報率變好</td></tr>
<tr><td class="en-t">Choice of tools</td><td>不同專案能挑最適合的工具跟人才，也避免被單一廠商綁死</td></tr>
<tr><td class="en-t">Improve reliability and resiliency</td><td>把核心工作分散到好幾個環境，降低單一故障點的風險</td></tr>
<tr><td class="en-t">Maintain regulatory compliance</td><td>符合特定地區的資料治理、落地或主權法規</td></tr>
<tr><td class="en-t">Running apps on-premises</td><td>受規範的應用或老舊主機系統留在自家機房，同時還能創新</td></tr>
<tr><td class="en-t">Running apps at the edge</td><td>零售據點、電信網路這種遠端邊緣位置，靠 hybrid 就近運作、降低延遲</td></tr>
</table></div>
<div class="ex"><span class="en-t">Organizations can <mark>distribute core workloads</mark> across multiple cloud and on-premises infrastructures to reduce downtime.</span><button class="speak">🔊</button></div>
<p class="tiny">官方小測驗特別點名一個<b>錯的</b>理由：「完全不需要自家機房 IT 人力或舊系統」——hybrid 剛好相反，是<b>保留</b>自家機房跟舊系統，不是消滅它們。</p>`,

`<h3>🚗🚕🚌 IaaS／PaaS／SaaS：租車、搭計程車、搭公車</h3>
<p class="big">三種服務模式，用交通工具比喻：<span class="en-t">IaaS</span> 像<b>租車</b>——只租最底層的運算、儲存、網路，其他自己開；<span class="en-t">PaaS</span> 像<b>搭計程車</b>——你負責目的地（應用程式、資料），路線和車子廠商幫你顧；<span class="en-t">SaaS</span> 像<b>搭公車</b>——路線固定、跟別人共乘，最簡單但客製化最少。</p>
<p>🎨 畫面：租車自己開（IaaS）、招計程車報地址（PaaS）、買票上公車（SaaS）——愈往右愈不用管細節，但能改的也愈少。</p>
<div class="kw"><span class="k en-t">iaas</span><span class="k en-t">paas</span><span class="k en-t">saas</span><span class="k en-t">abstraction</span></div>
<div class="ex"><span class="en-t"><mark>IaaS</mark> gives on-demand access to fundamental resources like compute and storage, and frees IT teams from managing physical hardware.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th></th><th>效益</th><th>Google Cloud 例子</th></tr>
<tr><td><b class="en-t">IaaS</b></td><td>能快速調整資源、用多少付多少，IT 團隊不用管實體硬體</td><td class="en-t">Compute Engine, Cloud Storage</td></tr>
<tr><td><b class="en-t">PaaS</b></td><td>廠商包辦修補、更新、維護，開發者專心寫程式，上市更快</td><td class="en-t">Gemini Enterprise Agent Platform（舊名 Vertex AI）, Cloud Run, BigQuery</td></tr>
<tr><td><b class="en-t">SaaS</b></td><td>不用下載安裝維護，訂閱就能用，任何裝置都能存取</td><td class="en-t">Google Workspace</td></tr>
</table></div>
<p class="tiny">由下到上愈來愈「不用管底層」的概念叫 <span class="en-t">abstraction</span>（抽象化）：愈往上層，愈不用懂底層怎麼運作，但控制權也愈少——就像開車不用懂引擎怎麼轉，但也改不了引擎。三種模式不是只能選一種，多數組織依情境混著用。</p>`,

`<h3>🛡️ Shared responsibility model：誰負責什麼</h3>
<p class="big"><span class="en-t">Shared responsibility model</span>：雲端安全是廠商跟客戶一起分擔。廠商顧「雲的安全」（security of the cloud）——硬體、網路、機房這些廠商直接掌控的部分；客戶顧「雲裡面的安全」（security in the cloud）——自己設定的東西、存取權限、資料，永遠是客戶的責任。</p>
<p>🎨 畫面：廠商顧大樓的門禁保全，你顧自己房間有沒有鎖好、鑰匙給了誰。</p>
<div class="kw"><span class="k en-t">shared responsibility</span><span class="k en-t">security of the cloud</span><span class="k en-t">security in the cloud</span></div>
<div class="ex"><span class="en-t">If you configure or store it, you are responsible for <mark>securing it</mark>.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th></th><th class="en-t">On-premises</th><th class="en-t">IaaS</th><th class="en-t">PaaS</th><th class="en-t">SaaS</th></tr>
<tr><td>誰管實體基礎設施</td><td>客戶</td><td>廠商</td><td>廠商</td><td>廠商</td></tr>
<tr><td>誰管作業系統</td><td>客戶</td><td>客戶</td><td>廠商</td><td>廠商</td></tr>
<tr><td>誰管存取權限與資料</td><td>客戶</td><td>客戶</td><td>客戶</td><td>客戶</td></tr>
</table></div>
<p class="tiny">往右走廠商管越多，但<b>資料、內容、存取政策</b>永遠是客戶的責任——這是這課唯一該記的重點，責任表細節不是這課主考點。</p>`,

`<h3>🏭 真實世界長怎樣：拿「連鎖餐飲生活圈」看服務模型與混合多雲</h3>
<p class="big">想像你在經營一家快速擴張的連鎖咖啡輕食餐飲品牌，這課的架構分工長這樣：</p>
<p><b>1. 三大雲端服務模型（自己管多少）</b>：<br>
・<b class="en-t">IaaS</b>（基礎架構即服務）：租毛胚屋（像 <span class="en-t">Compute Engine</span> 虛擬主機）。Google 只負責建築物硬體，裡面的作業系統、修補更新、安全軟體全部自己動手裝潢（自己管最多）。<br>
・<b class="en-t">PaaS</b>（平台即服務）：租裝潢好且水電廚具齊全的現成店面（像 <span class="en-t">Cloud Run</span>）。水電瓦斯都由房東維護，自己只要帶廚師和菜單程式碼就能開門營業（自己只管程式與資料）。<br>
・<b class="en-t">SaaS</b>（軟體即服務）：像直接點外送平台，或直接使用 <span class="en-t">Google Workspace</span> 辦公。打開瀏覽器就能用，底層所有東西完全由廠商包辦。</p>
<p><b>2. 三種基礎架構部署模式</b>：<br>
・<b class="en-t">Private cloud</b>（私有雲）：總部財務會計與機密配方伺服器鎖在自家機房，只給內部專屬使用，掌控度百分之百。<br>
・<b class="en-t">Hybrid cloud</b>（混合雲）：門市 POS 結帳機與線上點餐 App 跑在 Google Cloud 扛尖峰流量，但機密會員與核心系統放在地端機房，兩邊打通互連（地端＋雲端）。<br>
・<b class="en-t">Multicloud</b>（多雲）：主力跑在 Google Cloud，但把第二份冷備份放 AWS，防止任何單一雲端供應商發生大規模中斷，徹底分散風險避免廠商鎖定（<span class="en-t">vendor lock-in</span>）。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">on-premises and public cloud combined</span>（混合雲）、<span class="en-t">two or more cloud providers</span>（多雲）、<span class="en-t">avoid vendor lock-in</span>（多雲關鍵理由）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：以為 hybrid 只有「自家機房 + 公有雲」</b><br>
官方定義是公有雲 ＋（<span class="en-t">private cloud</span> <b>或</b> <span class="en-t">on-premises</span>），看到「自己的私有雲接公有雲」也是 hybrid，不是只有自家機房那一種才算。</div>
<div class="box warn"><b>誘餌 2：以為 hybrid／multicloud 是為了「甩掉自家機房」</b><br>
官方小測驗特別考過這個錯誤選項：hybrid／multicloud <b>不是</b>為了消滅自家 IT 人力或淘汰舊系統，恰恰相反，是<b>讓舊系統跟法規要求的本地資料繼續留著</b>，同時接上公有雲的新功能。</div>
<div class="box warn"><b>誘餌 3：Hybrid vs Multicloud，別被「好幾個環境」騙到</b><br>
有 <span class="en-t">private cloud</span> 或 <span class="en-t">on-premises</span> 混進來 → <span class="en-t">hybrid cloud</span>；完全沒有自己的機房或私有雲，只是同時跟好幾家 <span class="en-t">public cloud</span> 廠商打交道 → <span class="en-t">multicloud</span>。</div>
<div class="box warn"><b>誘餌 4：IaaS vs PaaS vs SaaS，看「誰還要自己管」</b><br>
還要自己裝作業系統、管到系統以上 → <span class="en-t">IaaS</span>；作業系統跟執行環境廠商包了，但還要自己寫程式部署 → <span class="en-t">PaaS</span>；完全不寫程式、直接用現成軟體 → <span class="en-t">SaaS</span>。</div>
<p>看完了 🎉 接下來換你動手：② 先練「情境 → 選架構或服務模式」的反射動作。</p>`

    {chunks:['A software team wants to build and deploy a new application', ' without provisioning any servers', ' or configuring the operating system and runtime,', ' so they can focus purely on writing code.'], keys:[1,2,3], opts:['Platform as a service','Infrastructure as a service','Software as a service'], ans:'Platform as a service', why:'<br><b>💡 這個概念在講什麼</b>：<b>PaaS</b>（Platform as a Service）官方定義是給開發者一整個平台去建置、執行應用程式，不用煩惱底層基礎架構，修補、更新、維護這些瑣事全部由廠商處理（C1 官方課程）。官方比喻是<b>搭計程車</b>：你只要講目的地（你的應用程式和資料），路線、路況、車子都交給司機。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>without provisioning any servers</b> 加上 <b>configuring the operating system and runtime</b>＝不用架伺服器、不用設定作業系統和執行環境，底層全部交給廠商；<b>focus purely on writing code</b>＝只專心寫程式，這正是官方講 PaaS 讓開發者專心創新的精神。<br><b>❌ 其他選項為什麼不對</b>：Infrastructure as a service（IaaS）要自己裝作業系統、自己管到系統以上，題目卻明講不用碰這些。Software as a service（SaaS）是直接用現成軟體、連程式都不用寫，題目卻要求 build and deploy a new application，需要自己寫程式碼，範圍不同。<br><b>🔄 換個說法就換答案</b>：如果題目改成「直接訂閱使用現成軟體，完全不寫任何程式碼」，答案就變成 Software as a service。'},
    {chunks:['A bank keeps its customer transaction records', ' in its own on-premises data center because of strict regulations,', ' while connecting that data center to a public cloud', " so it can still use the cloud providers advanced analytics tools."], keys:[1,2,3], opts:['Hybrid cloud','Multicloud','Private cloud'], ans:'Hybrid cloud', why:'<br><b>💡 這個概念在講什麼</b>：<b>Hybrid cloud</b> 官方定義是應用程式同時跑在不同環境的組合裡，最常見的例子就是自家機房（on-premises）加公有雲一起用（C1 官方課程）。官方也提到，組織常因為法規要求資料留在本地，選擇繼續留著自家機房，同時接上公有雲用新功能。像家裡有自己的廚房，也常叫外送，兩邊互相支援。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>in its own on-premises data center because of strict regulations</b>＝法規要求資料留在自家機房，這是選 hybrid 的官方理由之一；<b>connecting that data center to a public cloud</b>＝同時把這個機房接上公有雲，這是 hybrid 的核心動作，自家機房和公有雲搭著一起用。<br><b>❌ 其他選項為什麼不對</b>：Multicloud 講的是同時用兩家以上公有雲廠商，題目只有一個自家機房加一家公有雲，不符合。Private cloud 是只給一個組織自己用、不接公有雲，題目卻明講這個機房有連上公有雲用它的分析工具，跟 private cloud 的定義矛盾。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家銀行同時用 Google Cloud、AWS 兩家公有雲廠商，完全沒提自家機房」，答案就變成 Multicloud。'},
    {chunks:['An enterprise wants to avoid being locked into a single cloud vendor,', ' so it distributes its workloads', ' across Google Cloud and two other public cloud providers', ' and manages all three environments together.'], keys:[0,2], opts:['Multicloud','Hybrid cloud','Private cloud'], ans:'Multicloud', why:'<br><b>💡 這個概念在講什麼</b>：<b>Multicloud</b> 官方定義是架構結合兩個以上的公有雲廠商，例如 Google Cloud 加 AWS 或 Azure（C1 官方課程）。官方也點名，避免被單一廠商綁住（vendor lock-in）正是組織選 multicloud 的常見理由之一。像叫外送不只叫一家，好幾個平台輪流用，怕被單一店家綁住。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>avoid being locked into a single cloud vendor</b>＝避免被單一雲端廠商綁死，這是官方講 multicloud 好處的原話；<b>across Google Cloud and two other public cloud providers</b>＝同時橫跨三家公有雲廠商，符合官方「至少兩家公有雲」的定義。<br><b>❌ 其他選項為什麼不對</b>：Hybrid cloud 要有自家機房或私有雲搭配公有雲一起用，題目完全沒提到自家機房，只講了三家公有雲廠商，跟 hybrid 的組合不同。Private cloud 是只給一個組織自己用、規格是雲但不共用，題目卻是橫跨三家公有雲廠商，方向完全相反。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家企業把核心系統留在自家機房，另外接上一家公有雲擴充算力」，答案就變成 Hybrid cloud。'}

/*L3*/{ id: 3, title: '網路基礎與 Google 全球網路', ch: 'S1 · 18%', ready: true,
  mind: '這課所有題目都在考同一件事：想清楚<b>使用者在哪裡、伺服器在哪裡</b>——<span class="en-t">bandwidth</span> 是網路能塞多少資料，<span class="en-t">latency</span> 是資料要跑多久多遠；<span class="en-t">region、zone、edge location</span> 決定資料實際擺哪裡、使用者從哪連進來；<span class="en-t">IP address、DNS</span> 則是網路上怎麼找到彼此。',
  cards: [
`<h3>🔢 IP address：裝置在網路上的門牌號碼</h3>
<p class="big"><span class="en-t">IP address</span>（Internet Protocol 地址）是一串數字，用來標示網路上某個裝置或網路本身的位置。</p>
<p>🎨 畫面：郵差要送信，一定要有門牌號碼才找得到你家——IP address 就是裝置在網路世界裡的門牌號碼。</p>
<div class="kw"><span class="k en-t">IP address</span><span class="k en-t">Internet Protocol</span><span class="k en-t">domain name</span></div>
<div class="ex"><span class="en-t">An <mark>IP address</mark> is a series of numbers that identifies a device's location on a network.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">網址（domain name，像 google.com）是給人看的好記名字，背後其實對應一個 IP address；接下來的 DNS 就是負責把兩者互翻的系統。</p>`,

`<h3>📖 DNS：網路的電話簿</h3>
<p class="big"><span class="en-t">DNS</span>（Domain Name System）存了一份「網址對應 IP address」的資料庫，負責把好記的網址翻譯成機器看得懂的數字地址。</p>
<p>🎨 畫面：翻電話簿查「某某披薩店」對應的電話號碼——DNS 就是把 <span class="en-t">www.google.com</span> 這種名字翻成 IP address 的電話簿。</p>
<div class="kw"><span class="k en-t">DNS</span><span class="k en-t">Domain Name System</span><span class="k en-t">lookup</span></div>
<div class="ex"><span class="en-t">The <mark>DNS</mark> translates a web address into the IP address of the computer hosting that site.</span><button class="speak">🔊</button></div>
<p class="tiny">每次開網頁，電腦都先做一次 DNS lookup，查完才知道要連到哪個 IP address。</p>`,

`<h3>⏱️ Latency：資料跑一趟要花多久</h3>
<p class="big"><span class="en-t">Latency</span> 是一個資料封包從伺服器送到使用者、再回來的時間，主要受<b>實體距離</b>影響。</p>
<p>🎨 畫面：從台北打視訊電話給美國朋友，就算網路再快，聲音訊號還是要飛過半個地球，多少會有一點延遲。</p>
<div class="kw"><span class="k en-t">latency</span><span class="k en-t">round trip</span><span class="k en-t">milliseconds</span><span class="k en-t">distance</span></div>
<div class="ex"><span class="en-t">Latency is the time it takes for a single packet of data to travel from the server to the user.</span><button class="speak">🔊</button></div>
<p class="tiny">使用者離伺服器越遠，latency 越高——跟頻寬夠不夠大完全是兩件事。</p>`,

`<h3>🛣️ Bandwidth：網路能塞多少資料</h3>
<p class="big"><span class="en-t">Bandwidth</span> 是網路在一段時間內能傳輸多少資料的量，單位是 Mbps 或 Gbps。</p>
<p>🎨 畫面：一條十線道的高速公路，車道數（bandwidth）決定一次能塞多少車，但塞再多車道，車子還是要花時間才能開到終點（那是 latency 的事）。</p>
<div class="kw"><span class="k en-t">bandwidth</span><span class="k en-t">throughput</span><span class="k en-t">Mbps</span><span class="k en-t">Gbps</span></div>
<div class="ex"><span class="en-t">Bandwidth is the measure of how much data your network can transfer in a given amount of time.</span><button class="speak">🔊</button></div>
<p class="tiny">官方課程的經典案例：公司把 bandwidth 加到很大，東京同事還是覺得慢——因為問題出在 latency（距離），不是 bandwidth（車道數）。</p>`,

`<h3>🌍 Region：獨立的地理區域</h3>
<p class="big"><span class="en-t">Region</span> 是一個獨立的地理區域，底下由好幾個 <span class="en-t">zone</span> 組成。例如倫敦（<span class="en-t">europe-west2</span>）這個 region 目前有三個 zone。</p>
<p>🎨 畫面：region 像是「城市」這個層級的行政區——一個城市裡分成好幾個行政區（zone）。</p>
<div class="kw"><span class="k en-t">region</span><span class="k en-t">multi-region</span></div>
<div class="ex"><span class="en-t">A region represents an independent geographic area and is composed of zones.</span><button class="speak">🔊</button></div>
<p class="tiny">有些服務還能選 <span class="en-t">multi-region</span>（例如 Cloud Storage 的 Europe multi-region），把資料同時存在相隔至少 160 公里的兩個地點以上，防的是整個 region 等級的天災。</p>`,

`<h3>🏢 Zone：資源實際跑在哪裡</h3>
<p class="big"><span class="en-t">Zone</span> 是 region 底下、Google Cloud 資源實際部署的地方。例如開一台 Compute Engine 虛擬機器，就要指定它跑在哪個 zone。</p>
<p>🎨 畫面：zone 像同一座城市裡不同的辦公大樓——分散到不同大樓，其中一棟停電，另一棟還能正常運作。</p>
<div class="kw"><span class="k en-t">zone</span><span class="k en-t">redundancy</span></div>
<div class="ex"><span class="en-t">A zone is an area where Google Cloud resources are deployed.</span><button class="speak">🔊</button></div>
<p class="tiny">要備援又要低延遲的黃金組合：同一個 region 裡選<b>不同 zone</b>——這正是 NO.60／NO.117 在考的事。</p>`,

`<h3>🚪 Edge location：使用者連進網路的入口</h3>
<p class="big"><span class="en-t">Edge location</span>（Google 的 edge network）是裝置或組織的網路連上網際網路的入口，讓 Google 用同一套支撐 Gmail、Search、YouTube 的高效能基礎設施，把常用內容快取在離使用者最近的地方。</p>
<p>🎨 畫面：edge location 像社區門口的超商——常用的東西先囤在門口，不用每次都跑到市中心的大倉庫（伺服器所在的 region）拿貨。</p>
<div class="kw"><span class="k en-t">edge location</span><span class="k en-t">edge network</span><span class="k en-t">cache</span><span class="k en-t">ISP</span></div>
<div class="ex"><span class="en-t">A network's edge is defined as the place where a device, or an organization's network, connects to the internet.</span><button class="speak">🔊</button></div>
<p class="tiny">region、zone 決定資料放哪裡；edge location 決定使用者連進來的那一段路快不快。</p>`,

`<h3>🏭 真實世界長怎樣：拿「跨國影音娛樂串流平台」看全球網路佈局</h3>
<p class="big">想像你在營運類似 Netflix 的跨國影音串流平台，這課的網路名詞是這樣合作送出 4K 影片的：</p>
<p><b>1. DNS 與 IP address</b> ➔ 觀眾在手機瀏覽器打上網址 <span class="en-t">stream.example.com</span>，<span class="en-t">DNS</span> 就像網路電話簿，一秒幫忙查出該服務對應的 <span class="en-t">IP address</span> 門牌號碼。</p>
<p><b>2. Region（區域）與 Zone（分區）</b> ➔<br>
・亞洲服務大本營選在「台灣 <span class="en-t">Region</span>（asia-east1）」，讓台灣觀眾連線距離最近。<br>
・這個 Region 底下有三個互相獨立的機房園區（<span class="en-t">Zone</span> a、b、c）。<br>
・就算 Zone a 遭遇地震停電，Zone b 與 Zone c 毫秒級自動接手，觀眾追劇完全不受影響（達到 <span class="en-t">high availability</span> 高可用性 與 <span class="en-t">fault tolerance</span> 容錯能力）。</p>
<p><b>3. Edge location（邊緣節點）</b> ➔ 在全球各大城市甚至各家電信業者門口擺放快取站點。熱門新劇直接放在離觀眾家門口最近的邊緣節點，根本不用大老遠跨海跑回主資料中心讀檔。</p>
<p><b>4. Latency（延遲）與 Bandwidth（頻寬）</b> ➔<br>
・邊緣節點把傳輸距離縮到最短，觀眾點擊「播放」到畫面彈出的等待時間極小化（低 <span class="en-t">latency</span>）。<br>
・Google 全球私有光纖海底電纜提供超大管徑水管（高 <span class="en-t">bandwidth</span>），幾萬人同時看高畫質直播也不會轉圈圈卡頓。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">minimize latency for global users</span>（選 Edge location）、<span class="en-t">replicate across zones</span>（選 High availability）、<span class="en-t">geographically isolated areas</span>（選 Region）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：網路很快卻還是慢 → 別選 bandwidth，是 latency</b><br>
題目描述「已經加大頻寬」或「網路連線很快」<b>但使用者還是覺得慢</b>，這是官方案例的經典陷阱：頻寬夠不代表距離近，真正的兇手是 <span class="en-t">latency</span>。NO.404 就是這個陷阱。</div>
<div class="box warn"><b>誘餌 2：要備援又要低延遲 → 同一 region 選不同 zone，不是跨 region</b><br>
題目同時要「redundancy」和「extremely fast communication」時，正解通常是<b>同一個 region 裡選不同 zone</b>；跨 region 雖然更能防天災，但距離太遠一定會超過毫秒級的延遲要求。NO.60／NO.117 是同一題、選項順序不同——認內容，不要背字母。</div>
<div class="box warn"><b>誘餌 3：延遲高，加 zone 沒用，要加 region</b><br>
使用者抱怨從很遠的地方連線延遲很高時，解法是在使用者<b>附近的 region</b> 開一個複本，而不是在原本那個 region 裡多加幾個 zone——多加 zone 只增加備援，不會縮短實體距離。NO.409 考的就是這件事。</div>
<div class="box warn"><b>誘餌 4：頻寬換算題，先換算成同一個單位再除</b><br>
看到「多少 TB 的資料、多少 Mbps 的頻寬，要傳多久」，先把 TB 換算成 Mb（1TB ≈ 8,000,000 Mb），再除以 Mbps 的速度，最後把秒數換算成天。NO.206 就是這種算法題。</div>
<p>看完了 🎉 接下來換你動手：② 先練「看到英文片語 → 反射出是哪個名詞」。</p>`

`<h3>📋 Structured／Semi-structured／Unstructured：資料整不整齊</h3>
<p class="big"><span class="en-t">structured data</span> 是整整齊齊的表格資料，列、欄、關聯都定義好；<span class="en-t">unstructured data</span> 完全沒有固定格式，像文字、圖片、影音、log；<span class="en-t">semi-structured data</span> 介於中間，有標籤但沒有嚴格表格，官方舉的例子是 email、HTML、JSON、XML 四種。</p>
<p>🎨 畫面：structured 像排好座位號碼的教室；unstructured 像下課後亂丟一地的書包；semi-structured 像貼了標籤但沒上分類架的紙箱——看得出裝什麼，但沒整齊上架。</p>
<div class="kw"><span class="k en-t">structured data</span><span class="k en-t">semi-structured data</span><span class="k en-t">unstructured data</span></div>
<div class="ex"><span class="en-t">Unstructured data either doesn't have a predefined data model or isn't organized in a <mark>predefined manner</mark>, such as text, images, audio, and video.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th>類型</th><th>特徵</th><th>例子</th></tr>
<tr><td><b class="en-t">Structured</b></td><td>表格、schema 固定</td><td>product ratings score（數值評分）</td></tr>
<tr><td><b class="en-t">Semi-structured</b></td><td>有標籤但無嚴格表格</td><td class="en-t">emails, HTML, JSON, XML</td></tr>
<tr><td><b class="en-t">Unstructured</b></td><td>完全無固定格式</td><td class="en-t">call center transcripts, social posts</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>能塞進 Excel 欄位的是 structured；有標籤但塞不進表格的是 semi-structured；純文字、圖片、影音一律 unstructured。</b></div>`,

`<h3>🏭 Data supply chain：資料的生產線</h3>
<p class="big">官方教材把資料處理比喻成汽車組裝線，一共 6 站：<span class="en-t">genesis</span>（誕生）→ <span class="en-t">collection</span>（蒐集）→ <span class="en-t">processing</span>（處理）→ <span class="en-t">storage</span>（儲存）→ <span class="en-t">analysis</span>（分析）→ <span class="en-t">activation</span>（行動），原始資料進去、變成商業行動出來。</p>
<p>🎨 畫面：一條汽車組裝線——零件誕生上線（genesis）→ 送進廠（collection）→ 組裝成形（processing）→ 放進倉庫（storage）→ 品管檢驗（analysis）→ 交車上路（activation）。</p>
<div class="kw"><span class="k en-t">data genesis</span><span class="k en-t">data collection</span><span class="k en-t">data processing</span><span class="k en-t">data storage</span><span class="k en-t">data analysis</span><span class="k en-t">data activation</span></div>
<div class="ex"><span class="en-t">Data genesis is the initial creation of a unit of data, such as a click on a website or a <mark>sensor recording</mark> from an IoT device.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th>站</th><th>在做什麼</th></tr>
<tr><td><b class="en-t">Genesis</b></td><td>資料第一次被創造出來（點擊、刷卡、感測器紀錄）</td></tr>
<tr><td><b class="en-t">Collection</b></td><td>用 ingestion 把資料從原本系統搬進新系統</td></tr>
<tr><td><b class="en-t">Processing</b></td><td>把蒐集到的原始資料整理、合併成可分析的形狀</td></tr>
<tr><td><b class="en-t">Storage</b></td><td>資料落地存放，等著被分析</td></tr>
<tr><td><b class="en-t">Analysis</b></td><td>從處理好的資料中產出方向性的洞見</td></tr>
<tr><td><b class="en-t">Activation</b></td><td>把分析結果推給決策者或應用程式，真正拿去用</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>生、收、處理、存、析、動——跟做車一樣，原料進去、動作出來。</b></div>`,

`<h3>📜 Data governance：資料的家規</h3>
<p class="big"><span class="en-t">data governance</span> 就是幫資料訂「家規」：訂清楚資料怎麼蒐集、儲存、處理，誰能存取、什麼時候該銷毀，同時要符合法規。官方教材列的好處包括：讓資料更有價值、幫大家做出更即時的決策、改善<span class="en-t">cost controls</span>、強化<span class="en-t">regulatory compliance</span>、贏得客戶信任、降低風險、讓對的人存取到對的資料。</p>
<p>🎨 畫面：資料館的圖書館員——書不能亂丟上架，要分類編號，貴重書要鎖進特藏室，誰能借哪一類書都有規矩。</p>
<div class="kw"><span class="k en-t">data governance</span><span class="k en-t">cost controls</span><span class="k en-t">regulatory compliance</span></div>
<div class="ex"><span class="en-t">Establishing an effective data governance program makes data more valuable, improves <mark>cost controls</mark>, and strengthens regulatory compliance.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「建立資料治理計畫、改善成本控管、強化法規遵循」這種組合 → 直接鎖定 data governance，這正是 NO.245 的考點。</p>`,

`<h3>🔓 Openness & Interoperability：別把自己綁死</h3>
<p class="big">用<span class="en-t">open standards</span>（開放標準）、有<span class="en-t">interoperability</span>（互通性）的資料管理平台，才能打破<span class="en-t">data silos</span>（資料孤島），也才不會被單一廠商綁死（<span class="en-t">vendor lock-in</span>）。資料不再各自孤立，才有辦法互相串接、激發創新。</p>
<p>🎨 畫面：資料孤島像一座座沒有橋的小島，各自守著自己的資料上不了岸；開放標準就是蓋橋，讓資料能在小島間自由通行，也不用被唯一的擺渡人（單一廠商）綁住。</p>
<div class="kw"><span class="k en-t">open standards</span><span class="k en-t">interoperability</span><span class="k en-t">data silos</span><span class="k en-t">vendor lock-in</span></div>
<div class="ex"><span class="en-t">Data can enable innovation because it is no longer <mark>siloed</mark>, thanks to a unified, open cloud data solution.</span><button class="speak">🔊</button></div>
<p class="tiny">題目問「怎麼避免被單一廠商綁死」或「資料不再孤立才能怎樣」，都是在考這張卡，跟開放標準是同一個考點的不同問法。</p>`,

`<h3>🏭 真實世界長怎樣：拿「大型連鎖量販賣場」看資料容器與資料治理</h3>
<p class="big">想像你在營運像好市多或家樂福這樣的大型零售量販，這課的資料概念是這樣分工的：</p>
<p><b>1. 三大資料容器（裝什麼、怎麼用）</b>：<br>
・<b class="en-t">Database</b>（資料庫）：收銀機刷條碼結帳當下，每秒扣庫存、紀錄發票金額，絕對不能出錯（交易型 <span class="en-t">OLTP</span>）。<br>
・<b class="en-t">Data warehouse</b>（資料倉儲）：每天半夜把全台門市幾十萬筆整齊的交易發票拉出來倒進去，供採購與行銷主管用 <span class="en-t">SQL</span> 分析哪種零食毛利最高（分析型 <span class="en-t">OLAP</span>，如 <span class="en-t">BigQuery</span>）。<br>
・<b class="en-t">Data lake</b>（資料湖）：賣場監視器錄影檔、走道熱點攝影、冰櫃溫度日誌等各式各樣未經處理的原始雜亂資料，全部先丟進大池子存好（如 <span class="en-t">Cloud Storage</span>），未來需要再拿來訓練 AI。</p>
<p><b>2. 資料結構三兄弟</b>：<br>
・<span class="en-t">Structured</span>（結構化）：收銀機固定格式的表格（有欄有列）。<br>
・<span class="en-t">Semi-structured</span>（半結構化）：商品標籤或訂單 <span class="en-t">JSON</span>（有鍵值標籤，但欄位可隨時增減）。<br>
・<span class="en-t">Unstructured</span>（非結構化）：賣場監視器影片、顧客語音投訴錄音檔、商品宣傳海報照片。</p>
<p><b>3. 資料來源與資料治理</b>：<br>
・第一方資料（<span class="en-t">first-party data</span>）：會員自己的消費與紅利點數紀錄（最真實、最值錢）。<br>
・第二方資料（<span class="en-t">second-party data</span>）：跟合作銀行交換的聯名卡消費彙整。<br>
・第三方資料（<span class="en-t">third-party data</span>）：向外部市調公司購買的全國消費趨勢報告。<br>
・<b class="en-t">Data governance</b>（資料治理）：制定資料家規，誰能讀取會員身分證？敏感資料有沒有遮蔽？確保資料乾淨合規不外洩。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">serverless data warehouse for SQL analytics</span>（資料倉儲）、<span class="en-t">raw data of all formats</span>（資料湖）、<span class="en-t">data directly from customers</span>（第一方資料）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：Database vs Data warehouse vs Data lake，別選錯容器</b><br>
題目講「原始、任何格式、同一個地方存放、之後再探索」→ <span class="en-t">data lake</span>；講「已經整理好的結構化／半結構化資料、拿來做分析報表」→ <span class="en-t">data warehouse</span>；講「支援每天交易、有固定 schema」→ <span class="en-t">database</span>。三個常常一起出現互相當誘餌。</div>
<div class="box warn"><b>誘餌 2：Semi-structured vs Unstructured，別被「有點格式」騙到</b><br>
JSON、XML、email 這種<b>有標籤但沒有嚴格表格</b>的資料是 <span class="en-t">semi-structured</span>，不是 unstructured；只有完全沒有固定格式（純文字、圖片、影音、log）才是 <span class="en-t">unstructured</span>——像 <span class="en-t">call center transcripts</span>（客服逐字稿）就是道地的 unstructured，別以為它「有文字」就想成 semi-structured。</div>
<div class="box warn"><b>誘餌 3：Data collection vs Data processing，別搞混生產線站別</b><br>
把資料「從原本系統搬過來」是 <span class="en-t">collection</span>（ingestion）；把搬來的資料「整理、合併成可分析的形狀」才是 <span class="en-t">processing</span>——題目講 <span class="en-t">merge</span>、<span class="en-t">adjust</span>、<span class="en-t">transform</span> 通常在講 processing，不是 collection。</div>
<div class="box warn"><b>誘餌 4：Open standards 不是 SLA，也不是資料庫服務</b><br>
題目問「怎麼避免被單一廠商綁死」，正解是 <span class="en-t">open standards</span>（開放標準）；別被 <span class="en-t">service level agreements</span>（服務等級協議）或 <span class="en-t">database services</span> 這種聽起來也很專業的選項騙走，這兩個都跟「綁不綁得住」無關。</div>
<p>看完了 🎉 接下來換你動手：② 先練「情境 → 選容器（database／warehouse／lake）或選資料類型」的反射動作。</p>`

    {chunks:['An organization wants to combine sales, marketing, and customer data from multiple systems', ' to run ad hoc analysis and generate long-range business trend reports,', ' so it needs a service', ' that stores structured and semi-structured data for reporting and analysis.'], keys:[1,3], opts:['Data warehouse','Data lake','Relational database'], ans:'Data warehouse', why:'<br><b>💡 這個概念在講什麼</b>：官方對 data warehouse 的定義是「enterprise system used for the analysis and reporting of structured and semi-structured data from multiple sources」，是<b>已經整理好的資料</b>集中起來做分析報表用的中央倉庫，能同時存 <b>current</b> 和 <b>historical</b> 資料，拉出長期趨勢，是 BI（商業智慧）的核心元件。像一間分類整齊、按季盤點的倉庫，貨物早就照類別上架好，隨時能調出過去幾年的紀錄來比對趨勢。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>run ad hoc analysis and generate long-range business trend reports</b>＝官方講的「suited for both ad hoc analysis and custom reporting」加上「long-range view of data over time」；<b>stores structured and semi-structured data for reporting and analysis</b>＝跟官方逐字定義幾乎一模一樣。兩句都在講「整理好的資料、拿來做分析報表」，正是 data warehouse 的標誌。<br><b>❌ 其他選項為什麼不對</b>：Data lake 存的是<b>原始、未加工</b>的資料，官方明講 data warehouse「不是用來處理大量 unstructured 資料」的工具；題目裡的資料已經是 structured／semi-structured，目的是做分析報表，不是先堆著以後再探索。Relational database 撐的是<b>每天的交易運作</b>，重點在記帳存取，不是拉長期趨勢報表。<br><b>🔄 換個說法就換答案</b>：如果題目改成「要把感測器和影片檔用原始格式先堆進同一個地方，之後再用機器學習慢慢探索」，答案就變成 Data lake。'},
    {chunks:['A team of data scientists wants to store raw video, sensor, and log files in their original format', ' without applying any schema or structure up front,', ' so that they can later explore and experiment', ' with the data using machine learning.'], keys:[0,1,2], opts:['Data lake','Data warehouse','Relational database'], ans:'Data lake', why:'<br><b>💡 這個概念在講什麼</b>：官方對 data lake 的定義是「a repository designed to ingest, store, explore, process, and analyze any type or volume of raw data, regardless of the source」，能把各種格式的資料用<b>原始形態</b>存下來，不先加工、不先套 schema——先整理反而可能污染資料或帶入偏見。官方還點名 data lake 的典型使用者就是 <b>data scientists</b>，用來 explore、mine、experiment。像一個什麼原料都先堆進去的貨櫃場，還沒決定要做成什麼產品，先把原料留住，之後再慢慢挑。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>raw … in their original format</b>＝官方「store different types of data in its original format」；<b>without applying any schema or structure up front</b>＝官方「without much preprocessing or adding structure」；<b>later explore and experiment</b>＝官方點名 data lake 使用者「explore, mine, and experiment with the data」。三句合起來剛好對上 data lake 的定義加使用情境。<br><b>❌ 其他選項為什麼不對</b>：Data warehouse 存的是<b>已經清理過、有結構</b>的資料，拿來做分析報表，題目卻在講「不套 schema、原始格式」，方向剛好相反。Relational database 需要<b>固定欄位的表格</b>才能存資料，題目裡的影片、感測器資料沒有固定 schema，塞不進關聯式資料庫。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這些資料已經清理成結構化格式，行銷主管要用它做季報表分析銷售趨勢」，答案就變成 Data warehouse。'},
    {chunks:['After migrating to the cloud, a company discovers its data is duplicated across many teams with no consistent rules for who can access it,', ' raising compliance risk and wasted storage costs,', ' so leadership decides', ' to set clear policies for how data is collected, accessed, and disposed of.'], keys:[0,1,3], opts:['Data governance','Data supply chain','Open standards'], ans:'Data governance', why:'<br><b>💡 這個概念在講什麼</b>：官方把 data governance 講成幫資料訂「house rules」：建立內部政策，規定資料怎麼<b>蒐集、儲存、處理、最後銷毀</b>，也規定誰能存取哪些資料。官方列的好處包含「改善成本控管（能消除因資訊孤島造成的資料重複）」和「強化法規遵循」。像圖書館員，不是把書隨便亂丟上架，要分類編號、貴重書鎖進特藏室，誰能借哪一類書都有規矩。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>data is duplicated across many teams with no consistent rules for who can access it</b>＝對應官方「消除因資訊孤島造成的資料重複」和「governs who can access certain data」；<b>raising compliance risk and wasted storage costs</b>＝對應官方兩項好處「enhances regulatory compliance」與「improves cost controls」；<b>set clear policies for how data is collected, accessed, and disposed of</b>＝幾乎是官方定義的逐字翻版。<br><b>❌ 其他選項為什麼不對</b>：Data supply chain 講的是資料從誕生到被拿去行動的<b>六個處理階段</b>（genesis 到 activation），跟題目在講「訂規則、控管誰能存取」是不同的東西。Open standards 處理的是<b>技術規格互不互通</b>的問題，用來避免被單一廠商綁死，題目裡沒提到任何跟廠商或格式相容有關的事。<br><b>🔄 換個說法就換答案</b>：如果題目改成「公司想確保換到別家雲端平台時，資料格式不會被鎖死、能自由搬走」，答案就會變成 Openness and interoperability。'},
    {chunks:["A company worries that building everything on one vendor's proprietary data format", ' will make it hard to move its data out later,', ' so it chooses a data platform', ' built on open formats and interoperable tools to keep data portable and avoid depending on a single provider.'], keys:[0,1,3], opts:['Openness and interoperability','Data governance','Data warehouse'], ans:'Openness and interoperability', why:'<br><b>💡 這個概念在講什麼</b>：官方在課程總結明講「openness and interoperability are critical for eliminating data silos and avoiding vendor lock-in」，資料平台要用<b>公開格式、能互通的工具</b>，資料才能自由搬動，不會被綁死在單一廠商身上。像用萬國插頭規格做的電器，走到哪個國家都插得上電，不用整批換新設備。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>one vendor’s proprietary data format</b>＝廠商自己專屬、封閉的格式，是 vendor lock-in 的成因；<b>will make it hard to move its data out later</b>＝lock-in 帶來的具體風險；<b>open formats and interoperable tools to keep data portable and avoid depending on a single provider</b>＝官方定義「eliminating data silos and avoiding vendor lock-in」的具體做法，幾乎逐字對應。<br><b>❌ 其他選項為什麼不對</b>：Data governance 管的是資料的<b>存取權限與生命週期政策</b>，跟題目講的「格式能不能搬家、會不會被單一廠商綁住」是不同的問題。Data warehouse 只是一種<b>資料容器</b>，題目根本沒提到要做分析報表，跟這個名詞對不上。<br><b>🔄 換個說法就換答案</b>：如果題目改成「零售商想把整理好的結構化和半結構化資料集中起來做業績分析報表」，答案就會變成 Data warehouse。'}
  ],
  mcq: [
    {stem:'Which term best describes a repository designed to ingest, store, explore, process, and analyze any type or volume of raw data, regardless of the source?',
     opts:['Data lake','Database','Data warehouse','Data archive'], ans:'A',
     key:'any type or volume of raw data, regardless of the source',
     why:{A:'官方課程小測驗原題：<b>any type or volume of raw data, regardless of the source</b> 就是 data lake 的定義。',B:'database 是表格化、schema 固定的資料，不是「任何類型的原始資料」。',C:'data warehouse 存的是已經清理過的結構化／半結構化資料，不是原始資料。',D:'data archive 不是這課教的官方名詞，只是聽起來合理的干擾選項。'}},
    {stem:'A retailer wants its recommendation engine to make instant, personalized product suggestions to customers as they browse the website. Which reason best explains why data is considered a valuable asset in this situation?',
     opts:['Data fuels AI models that generate real-time business insights and personalized decisions.','Data always reduces the total cost of running a website.','Data automatically complies with all regulations once it is collected.','Data eliminates the need for a company to have a data governance program.'], ans:'A',
     key:'fuels AI models that generate real-time business insights',
     why:{A:'<b>fuels AI models</b>＋<b>real-time … insights</b> = 官方教材講的「資料餵給 AI、產生即時洞見」，正是資料有價值的理由。',B:'資料不會「自動」降低成本，這是編造的因果關係。',C:'資料被蒐集後不會自動合規，還是需要 data governance 來把關。',D:'剛好相反，資料量越大越需要 data governance，不是不需要。'}},
    {stem:'A hospital already stores raw, unprocessed sensor readings, video files, and PDF documents from many departments in their original native formats, with no fixed schema, so that data scientists can later explore and experiment with them freely. Which data management solution is this?',
     opts:['Data lake','Data warehouse','Relational database','Non-relational database'], ans:'A',
     key:'original native formats, with no fixed schema',
     why:{A:'<b>original native formats, with no fixed schema</b>＋<b>later explore and experiment</b> = data lake 的典型定義。',B:'⚠️雙陷阱：data warehouse 存的是已清理過的結構化／半結構化資料，不是「原始、無 schema」的多格式資料。',C:'relational database 有固定的表格 schema，跟「無固定 schema」直接矛盾。',D:'⚠️雙陷阱：non-relational database 雖然彈性，但仍是設計來被查詢的資料庫，不是拿來「探索原始多格式資料」的 repository，重點在 data lake 才是「ingest 任何類型原始資料」的容器。'}},
    {stem:'A company merges sales data from three different systems and adjusts the formats so that the combined dataset is ready for analysts to derive insights from. Which stage of the data supply chain does this represent?',
     opts:['Data processing','Data collection','Data analysis','Data activation'], ans:'A',
     key:'adjusts the formats so that the combined dataset is ready',
     why:{A:'<b>merges … and adjusts the formats</b> = 把原始資料整理、合併成可分析的形狀 → data processing。',B:'⚠️雙陷阱：data collection 只是把資料從原系統搬過來（ingestion），不包含合併與調整格式這個動作。',C:'data analysis 是從已經處理好的資料中產出洞見，這題還在整理資料階段，還沒到分析。',D:'data activation 是把分析結果推去給決策者或應用程式用，跟這題「整理資料」的階段不同。'}},
    {stem:'An organization wants to make sure it can freely move its data between different cloud providers in the future without being forced to redesign its systems around one vendor. What should the organization prioritize when choosing a data management platform?',
     opts:['Openness and interoperability through open standards','Locking all data into a single provider database format','Reducing the number of employees who can access the data','Increasing the total volume of data collected each day'], ans:'A',
     key:'freely move its data between different cloud providers',
     why:{A:'<b>freely move its data between different cloud providers</b> = 避免 vendor lock-in，靠的就是 open standards 帶來的 interoperability。',B:'鎖進單一廠商格式正是 vendor lock-in 本身，跟目標完全相反。',C:'限制存取人數是資安措施，跟能不能搬家、跨廠商互通無關。',D:'增加蒐集的資料量跟能不能自由移動資料、避免綁定無關。'}}
  ],
  exam: [
    {no:387, stem:'An organization needs to store structured, semi-structured, and unstructured data in its raw, native format in the same repository. Which cloud data management solution should the organization use?',
     opts:['Data field','Data lake','Database','Data warehouse'],
     ans:'B', keys:['raw, native format in the same repository'],
     why:{A:'data field 不是資料管理方案，只是欄位這個概念，答非所問。',B:'<b>structured, semi-structured, and unstructured … in its raw, native format in the same repository</b> = data lake 的官方定義，什麼格式都收、原始未加工。',C:'database 是表格化、schema 固定的資料，裝不下「任何格式的原始資料」。',D:'data warehouse 只處理結構化與半結構化、而且是清理過的資料，不收原始未加工的資料。'}},
    {no:326, stem:'An organization has petabytes of data gathered from a wide range of sources They want to use the data for strategic analysis and to guide business decisions What type of service should they use*?',
     opts:['Non-relational document database','Object store','Data warehouse','Relational transactional database'],
     ans:'C', keys:['strategic analysis and to guide business decisions'],
     why:{A:'非關聯式文件資料庫適合彈性多變的應用資料，不是為了整合多來源資料做策略分析設計的。',B:'物件儲存適合存放非結構化的原始檔案，不會直接拿來做策略分析與報表。',C:'<b>strategic analysis and to guide business decisions</b> = 官方教材說的 data warehouse 用途：整合多來源資料、做分析找趨勢、支援決策。',D:'關聯式交易型資料庫是設計來支撐日常交易（transactional），不是拿來做長期策略分析。'}},
    {no:395, stem:'What is an example of unstructured data?',
     opts:['Product ratings','Historical stock inventory','Customer orders','Call center transcripts'],
     ans:'D', keys:['Call center transcripts'],
     why:{A:'產品評分是有固定欄位的數值資料，屬於 structured data。',B:'歷史庫存數字是表格化的結構化資料。',C:'客戶訂單通常存在固定欄位的交易紀錄裡，屬於 structured data。',D:'<b>call center transcripts</b>（客服逐字稿）是沒有固定格式的文字紀錄，官方教材明確把客服對話這類文字歸類為 unstructured data。'}},
    {no:46, stem:'An organization has created an ecommerce website. What data on this website would be considered structured data?',

    {no:245, stem:'An organization has migrated several large databases to the cloud. It wants to increase the value of its data, improve cost controls and strengthen regulatory compliance. What should the organization do?',
     opts:['Delete data stored for over a year.','Establish an effective data governance program.','Export relational data to modern NoSQL databases.','Create monthly reports on data access and uses.'],
     ans:'B', keys:['increase the value of its data, improve cost controls and strengthen regulatory compliance'],
     why:{A:'刪除舊資料無法同時做到「提升資料價值＋改善成本控管＋強化法規遵循」這三件事，還可能違反法規要求的保存年限。',B:'<b>increase the value of its data, improve cost controls and strengthen regulatory compliance</b> 這三個好處，逐字對應官方教材列出的 data governance 益處清單 → 建立資料治理計畫。',C:'把關聯式資料搬去 NoSQL 是資料庫遷移，跟「治理、成本控管、法規遵循」這三個目標沒有直接關係。',D:'每月做存取報告只是治理裡的一小塊監控動作，不足以達成題目要的三個完整目標，資料治理計畫才是完整答案。'}},
    {no:368, stem:'What is the benefit of using a unified cloud data solution?',
     opts:['Data will always cost less to store','Data can be automatically secured from external threats','Data can enable innovation because it’s no longer siloed.','Data will always be backed up and cannot be lost or deleted'],
     ans:'C', keys:['no longer siloed'],
     why:{A:'統一資料方案不保證「一定」比較便宜，這是誇大的絕對說法。',B:'統一資料方案不會「自動」擋掉所有外部威脅，安全性要靠額外的防護機制。',C:'<b>no longer siloed</b>（不再孤立）＝ 打破 data silos，讓資料可以互相串接、激發創新，是官方教材對 openness／統一資料方案的核心說法。',D:'統一資料方案不代表「絕對不會遺失或被刪除」，這是誇大的絕對說法。'}},
    {no:266, stem:'An organization wants to leverage cloud technologies but is concerned about vendor lock-in. What would mitigate this concern?',
     opts:['Service level agreements','Open standards','Database services','Scalable infrastructure'],
     ans:'B', keys:['vendor lock-in'],
     why:{A:'服務等級協議是保證服務品質的合約條款，跟能不能自由換廠商無關。',B:'<b>vendor lock-in</b> 的解法就是新版考綱明列的 openness／interoperability：<span class="en-t">open standards</span> 讓資料格式與工具保持通用，才不會被單一廠商綁死。',C:'資料庫服務本身不能保證跨廠商可攜性，用得越深入反而可能更綁定廠商。',D:'可擴展的基礎架構跟能不能換廠商是兩件事，擴展性高不代表不會被綁定。'}},
    {no:229, stem:'An organization is transforming their raw data into a format that can be used to derive business insights. Which step of the data value chain does this action represent?',
     opts:['Data collection','Data analysis','Data processing','Data storage'],
     ans:'C', keys:['transforming their raw data into a format that can be used to derive'],
     why:{A:'data collection 是把資料從原系統搬進來（ingestion），這題講的是「把原始資料轉換成格式」，是更後面一步。',B:'data analysis 是從已經處理好的資料中產出洞見方向，這題還在「轉換格式」階段，還沒到分析。',C:'<b>transforming their raw data into a format that can be used to derive … insights</b> = 把蒐集到的原始資料整理轉換成可分析的形狀，正是官方教材定義的 data processing。',D:'data storage 只是資料落地存放，跟「轉換格式」這個動作無關。'}}

  cards: [
`<h3>🗄️ Relational vs Non-relational：資料要不要塞進固定格子</h3>
<p class="big"><span class="en-t">Relational database</span>（關聯式資料庫）把資料存進<b>有固定欄位（schema）的表格</b>，用 <span class="en-t">SQL</span> 查詢，表格之間可以互相 join；<span class="en-t">Non-relational database</span>（也叫 <span class="en-t">NoSQL</span>）不用這種表格格式，走<b>彈性資料模型</b>，資料常常變動或型態很雜的時候特別好用。</p>
<p>🎨 畫面：relational 像整齊的 Excel 表格，每一欄位都固定；non-relational 像一個百寶箱，什麼形狀的東西都塞得進去。</p>
<div class="kw"><span class="k en-t">relational database</span><span class="k en-t">non-relational database</span><span class="k en-t">NoSQL</span><span class="k en-t">schema</span><span class="k en-t">flexible data model</span></div>
<div class="ex"><span class="en-t">Non-relational databases follow a <mark>flexible data model</mark>, which makes them ideal for data that changes its organization frequently.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">看到「表格、schema、SQL、join」→ relational；看到「彈性、資料型態多變、常改結構」→ non-relational (NoSQL)。</p>`,

`<h3>🧰 Cloud SQL：中小型關聯式資料庫的省心選擇</h3>
<p class="big"><span class="en-t">Cloud SQL</span>：全代管的<b>關聯式資料庫</b>服務，支援 <span class="en-t">MySQL、PostgreSQL、SQL Server</span>。不用自己裝軟體、不用自己管修補更新和備份，適合<b>不需要全球規模、只要區域內</b>就好的應用，是<b>成本效益最好</b>的做法。</p>
<p>🎨 畫面：租一間管家全包的公寓，水電維修都幫你顧好，但只在同一個城市，不會幫你在全世界都開一間分店。</p>
<div class="kw"><span class="k en-t">Cloud SQL</span><span class="k en-t">fully managed</span><span class="k en-t">MySQL, PostgreSQL, SQL Server</span><span class="k en-t">cost-effective</span></div>
<div class="ex"><span class="en-t">If you don't need horizontal scaling or a globally available system, <mark>Cloud SQL</mark> is a cost-effective solution.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「單一區域、成本考量、不用管維護」→ Cloud SQL。</p>`,

`<h3>🚀 AlloyDB：PostgreSQL 相容、效能開外掛</h3>
<p class="big"><span class="en-t">AlloyDB for PostgreSQL</span>：100% 相容<b>開源 PostgreSQL</b> 的全代管資料庫，交易處理比標準 PostgreSQL 快 <b>4 倍以上</b>、分析查詢快到 <b>100 倍</b>，專門給<b>最吃重、最關鍵</b>的企業工作負載用，也適合同時要<b>交易＋分析混合</b>工作負載的場景。</p>
<p>🎨 畫面：一樣是 PostgreSQL 那台車，但引擎整台換成賽車引擎，同一條路開起來快超多。</p>
<div class="kw"><span class="k en-t">AlloyDB</span><span class="k en-t">PostgreSQL-compatible</span><span class="k en-t">four times faster</span><span class="k en-t">mixed workloads</span></div>
<div class="ex"><span class="en-t">AlloyDB is <mark>100% compatible</mark> with the open-source PostgreSQL ecosystem while running transactions <mark>over four times faster</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「PostgreSQL、要更快、要同時做交易和分析（mixed workload）」→ AlloyDB。</p>`,

`<h3>🌍 Spanner：全球規模還要求強一致</h3>
<p class="big"><span class="en-t">Spanner</span>：全代管的<b>關聯式資料庫</b>，能<b>橫向擴展</b>撐住業務暴衝，全球分散部署還維持 <span class="en-t">ACID</span> 交易一致性，自動處理備援、分片、交易，官方形容它是「<b>SQL 的結構＋NoSQL 的無限橫向擴展</b>」。</p>
<p>🎨 畫面：把同一本帳本同時放在全世界好幾個分行，每個分行看到的數字永遠一致，還能隨時開新分行不停機。</p>

`<h3>📱 Firestore：手機／網頁 App 的即時文件資料庫</h3>
<p class="big"><span class="en-t">Firestore</span>：彈性、可橫向擴展的 <span class="en-t">NoSQL</span> 資料庫，資料存成<b>文件（document）</b>放在 <span class="en-t">collection</span> 裡，不用 SQL 查詢。可以被<b>手機、網頁 App 直接存取</b>、即時同步，還支援<b>離線快取</b>，斷網也能先用本機資料，連線恢復再同步。</p>
<p>🎨 畫面：像一格一格的資料夾（document），不用照 Excel 那種固定欄位，手機 App 可以直接打開資料夾看，就算沒網路也先看本機存的那份。</p>
<div class="kw"><span class="k en-t">Firestore</span><span class="k en-t">document-oriented</span><span class="k en-t">NoSQL</span><span class="k en-t">mobile and web applications</span><span class="k en-t">real time</span><span class="k en-t">offline</span></div>
<div class="ex"><span class="en-t">Firestore is a flexible, horizontally scalable, NoSQL cloud database for storing and <mark>syncing data in real time</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">看到「手機／網頁 App、不用 SQL、即時同步、離線也能用」→ Firestore。</p>`,

`<h3>⚡ Bigtable：巨量、極低延遲的 NoSQL</h3>

<p>🎨 畫面：像機場的行李輸送帶，量再大也要用最快速度不斷送出去，講究的是「量大又快」，不是精雕細琢查一筆資料。</p>

<div class="kw"><span class="k en-t">BigQuery</span><span class="k en-t">serverless</span><span class="k en-t">data warehouse</span><span class="k en-t">petabytes</span><span class="k en-t">standard SQL</span></div>

`<h3>🏭 真實世界長怎樣：拿「外送平台」看六大資料庫各司其職</h3>
<p class="big">想像你在營運類似 Uber Eats 的跨國外送平台，各個資料庫在真實系統裡的精準分工：</p>
<p><b>1. 瀏覽餐廳菜單、個人偏好、即時聊天</b> ➔ <b class="en-t">Firestore</b><br>

<p><b>2. 外送員在路上騎車，每秒回傳 GPS 座標</b> ➔ <b class="en-t">Bigtable</b><br>
幾萬台機車同時在路上跑，每秒幾百萬筆位置訊號灌進來。這裡不需複雜關聯，只求吞吐量極大、寫入延遲極低（<span class="en-t">low latency</span>、<span class="en-t">IoT</span> 感測巨量資料）。</p>
<p><b>3. 客人按結帳、信用卡扣款、商家庫存扣減</b> ➔ <b class="en-t">Spanner</b> 或 <b class="en-t">Cloud SQL</b><br>
牽涉到錢與交易一致性（<span class="en-t">ACID</span>）。跨國跨洲跨區要求帳目百分之百對齊、無限橫向擴展選 Spanner；單一區域營運、追求省錢高性價比選 Cloud SQL。</p>
<p><b>4. 高併發關鍵交易＋即時報表</b> ➔ <b class="en-t">AlloyDB</b><br>

<p><b>5. 半夜 2 點，行銷主管分析「信義區宵夜熱賣排行榜」</b> ➔ <b class="en-t">BigQuery</b><br>

<p class="tiny">題目英文常這樣考：<span class="en-t">document database with offline support</span>（Firestore）、<span class="en-t">IoT low latency at massive scale</span>（Bigtable）、<span class="en-t">global scale strong consistency SQL</span>（Spanner）。</p>`,

    {stem:'A company is running a mission-critical PostgreSQL application that needs both fast transactional processing and complex real-time analytics on the same dataset, with performance well beyond standard PostgreSQL. Which service best meets this requirement?',

     why:{A:'PostgreSQL 相容＋交易與分析混合負載＋效能遠超標準 PostgreSQL，正是 AlloyDB 的定位（交易快 4 倍以上、分析快到 100 倍）。',B:'⚠️雙陷阱：Cloud SQL 也是 PostgreSQL 相容的關聯式資料庫，但沒有「效能遠超標準 PostgreSQL」或「交易＋分析混合」這種強化能力，題目要的是更高效能，不是單純成本考量。',C:'Spanner 走全球規模與強一致性路線，題目沒提到全球或無限擴展，也不是 PostgreSQL 相容服務。',D:'Bigtable 是 NoSQL，不是 PostgreSQL 相容的關聯式資料庫。'}},
    {stem:'A financial firm wants to build a real-time fraud-detection system that reads and writes millions of records per second with very low latency, and does not require SQL. Which product should they choose?',

    {stem:'A mobile game studio needs a NoSQL database that lets player profile data sync instantly across devices and still work while a player is offline. Which product should they choose?',

    {stem:'A retailer wants to store customer order records where each order always has the same set of fields (order ID, date, amount, customer ID) and needs to run SQL queries that join order data with customer data. Which type of database fits this requirement?',
     opts:['Relational database','Non-relational database','Data lake','Object storage'], ans:'A',

  exam: [
    {no:41, stem:'Your organization is developing an application that will manage payments and online bank accounts located around the world. The most critical requirement for your database is that each transaction is handled consistently. Your organization anticipates almost unlimited growth in the amount of data stored. Which Google Cloud product should your organization choose?',

    {no:67, stem:"Your organization is developing an application that will capture a large amount of data from millions of different sensor devices spread all around the world. Your organization needs a database that is suitable for worldwide, high-speed data storage of a large amount of unstructured data. Which Google Cloud product should your organization choose?",

    {no:151, stem:'A Customer has their current SAP systems using Microsoft SQL Server as the Database. They are migrating to Google Cloud and also preparing to later migrate to the latest version of SAP. The entire IT team is being directed to focus on the migration to the new version of SAP. The new version of SAP does not use Microsoft SQL Server as the Database. Any but the most critical IT management tasks are being deprioritized. How should they migrate their current database to Google Cloud?',

    {no:211, stem:"With respect to the Core Feature of Standby Instances of Cloud SQL which one of the options is correct.?",

/*L6*/{ id: 6, title: 'Cloud Storage 分層＋資料庫遷移', ch: 'S2 · 18%', ready: true,
  mind: '這課只考兩件事：東西<b>多常被碰</b>決定要放哪個 Cloud Storage <span class="en-t">storage class</span>（懶得猜就交給 <span class="en-t">Autoclass</span>）；資料庫要搬家，先想清楚<b>要不要順便換引擎</b>，再決定用哪種搬法跟工具。',
  cards: [
`<h3>🎞️ Unstructured data：沒有固定格式的資料</h3>
<p class="big"><span class="en-t">Unstructured data</span>（非結構化資料）指的是不照固定規則、塞不進標準表格的資料：你串流的影片、上傳的圖片、音檔、感測器資料，甚至 PDF 裡的文字都算。這種資料量又大又沒統一格式，沒辦法直接塞進傳統資料表。</p>
<p>🎨 畫面：倉庫裡什麼形狀都有的雜物箱，沒辦法像檔案櫃一樣排得整整齊齊。</p>
<div class="kw"><span class="k en-t">unstructured data</span></div>
<div class="ex"><span class="en-t">Unstructured data is everything else: the videos you stream, the images you upload, audio files, sensor data, and even the text in a PDF document.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">看到「影片、圖片、音檔、感測器資料」這種沒有固定欄位的東西 → 先認出這是 unstructured data，下一步就是找 Cloud Storage。</p>`,

`<h3>🗂️ Object storage：把資料當「物件」存</h3>
<p class="big"><span class="en-t">Object storage</span>（物件儲存）是一種把資料當作獨立「物件」來管理的儲存架構，不是傳統的檔案／資料夾階層，也不是切成固定大小區塊的 <span class="en-t">block storage</span>。每個物件都打包成「實際資料（<span class="en-t">binary</span>）＋ <span class="en-t">metadata</span>（建立日期、作者、資源類型、權限）＋ 全球唯一識別碼」，識別碼是 <span class="en-t">URL</span> 形式，天生適合放在網路上直接存取。</p>
<p>🎨 畫面：每個箱子外面貼一張獨一無二的條碼（<span class="en-t">URL</span>），旁邊附一張說明卡（<span class="en-t">metadata</span>），全世界的人都能靠這組條碼直接找到它。</p>
<div class="kw"><span class="k en-t">object storage</span><span class="k en-t">metadata</span><span class="k en-t">globally unique identifier</span></div>
<div class="ex"><span class="en-t">These objects are stored in a packaged format that contains the binary form of the actual data, relevant associated metadata, and a globally unique identifier.</span><button class="speak">🔊</button></div>
<p class="tiny"><span class="en-t">Cloud Storage</span> 就是靠這套 <span class="en-t">object storage</span> 架構，讓你存無限量資料，還能直接用網址存取，不用管理檔案系統。</p>`,

`<h3>📦 Cloud Storage 四個 storage class：越常拿越貴</h3>
<p class="big">官方把 <span class="en-t">Cloud Storage</span> 依「多常被存取」分成四個 <span class="en-t">storage class</span>：越常存取的等級儲存費越貴、但沒有取出費；越少存取的等級儲存費越便宜、但取出要收費，而且有最短保存天數的限制。</p>
<div class="tw"><table>
<tr><th>等級</th><th>官方存取頻率</th><th>成本／保存限制</th></tr>
<tr><td><b class="en-t">Standard</b></td><td class="en-t">frequently accessed（常態存取）</td><td>儲存費最貴，沒有取出費、沒有最短保存天數</td></tr>
<tr><td><b class="en-t">Nearline</b></td><td class="en-t">once per month or less（大約一個月一次）</td><td>較低儲存費＋小額取出費，最短保存 30 天</td></tr>
<tr><td><b class="en-t">Coldline</b></td><td class="en-t">at most once a quarter（大約一季一次）</td><td>更低儲存費＋較高取出費，最短保存 90 天</td></tr>
<tr><td><b class="en-t">Archive</b></td><td class="en-t">less than once a year（一年不到一次）</td><td>最低儲存費＋最高取出費，最短保存 365 天</td></tr>
</table></div>
<div class="ex"><span class="en-t">Nearline: Lower storage cost with a small retrieval fee. Ideal for data accessed about once a month.</span><button class="speak">🔊</button></div>
<div class="box key">🗣️ 口訣：<b>越常拿越貴，越少拿越便宜；拿越少次的那一級，鎖越久（30 → 90 → 365 天）。</b></div>`,

`<h3>🤖 Autoclass：自動幫你搬家，不用自己猜</h3>
<p class="big"><span class="en-t">Autoclass</span> 這個功能會依每個物件<b>實際的存取狀況</b>自動搬到適合的 <span class="en-t">storage class</span>：太久沒被存取 → 自動搬去更冷的等級省錢；突然又被存取 → 自動搬回 <span class="en-t">Standard</span> 加速下一次存取，全程自動、不用手動管理。</p>
<p>🎨 畫面：有個管家一直盯著每箱東西最近有沒有人碰，自動幫你搬到倉庫深處或搬回門口，你什麼都不用做。</p>
<div class="kw"><span class="k en-t">autoclass</span><span class="k en-t">access pattern</span></div>
<div class="ex"><span class="en-t">Autoclass is a feature that automatically transitions objects to appropriate storage classes based on each object's access pattern.</span><button class="speak">🔊</button></div>
<p class="tiny">題目說「存取模式無法預測、不想自己手動管理等級」→ 答案是 <span class="en-t">Autoclass</span>，不是叫你猜 <span class="en-t">Nearline</span> 還是 <span class="en-t">Coldline</span>。</p>`,

`<h3>🌍 Location type：region／dual-region／multi-region（跟 storage class 是不同事）</h3>
<p class="big"><span class="en-t">Cloud Storage</span> 的「位置」跟「<span class="en-t">storage class</span>」是兩個不同維度：<span class="en-t">storage class</span> 管多常存取、多少成本；<span class="en-t">location type</span> 管資料實際放在哪些地理範圍——<span class="en-t">region</span>（單一區域）、<span class="en-t">dual-region</span>（兩個區域）、<span class="en-t">multi-region</span>（一大片區域）。官方課程提到，資料放在 <span class="en-t">multi-region</span> 或 <span class="en-t">dual-region</span> 會有 <span class="en-t">geo-redundancy</span>：伺服器分散在不同地理位置的資料中心，防天災，還能就近服務全球流量、做負載平衡。</p>
<p>🎨 畫面：<span class="en-t">storage class</span> 決定東西放在倉庫的哪一層架子（多常拿）；<span class="en-t">location type</span> 決定倉庫本身開在幾個城市（多廣）。</p>
<div class="kw"><span class="k en-t">region</span><span class="k en-t">dual-region</span><span class="k en-t">multi-region</span><span class="k en-t">geo-redundancy</span></div>
<div class="ex"><span class="en-t">Geo-redundancy if data is stored in a multi-region or dual region, which means placing physical servers in geographically diverse data centers to protect against catastrophic events and load-balancing traffic for optimal performance.</span><button class="speak">🔊</button></div>
<div class="box warn"><b>舊名注意：</b>以前 Google Cloud 有獨立的「<span class="en-t">Multi-Regional storage class</span>」「<span class="en-t">Regional storage class</span>」，現在已經合併——現在的講法是「<span class="en-t">Standard storage class</span> ＋ 選 <span class="en-t">multi-region</span> 這個 <span class="en-t">location type</span>」，<span class="en-t">multi-region</span>／<span class="en-t">regional</span> 變成位置的分類，不再是獨立的 <span class="en-t">storage class</span>。考古題如果寫「<span class="en-t">Multi-regional storage</span>」，那是舊名，觀念一樣：要跨區、高可用、就近服務全球使用者就選 <span class="en-t">multi-region</span>。</div>`,

`<h3>🔀 Database migration and modernization：資料庫怎麼搬家</h3>
<p class="big">官方課程講兩種搬法：<b>① <span class="en-t">Lift and shift platform migration</span></b>——把資料庫原封不動搬到 <span class="en-t">Google Cloud</span> 上「同一種資料庫」（例如 on-prem 的 <span class="en-t">SQL Server</span> 搬到 <span class="en-t">Google Cloud</span> 上繼續跑 <span class="en-t">SQL Server</span>），好處是變動最小、交給雲端代管基礎設施，缺點是比較難順便現代化。<b>② <span class="en-t">Managed database migration</span></b>——把 <span class="en-t">SQL Server</span>、<span class="en-t">MySQL</span>、<span class="en-t">PostgreSQL</span> 等資料庫搬進 <span class="en-t">Google Cloud</span> 全代管的資料庫服務（例如 <span class="en-t">Cloud SQL</span>），需要比較仔細規劃、可能有些變動，換來的是可以專心做真正有價值的事，不用自己管維運。官方指定工具：<b><span class="en-t">Database Migration Service</span>（<span class="en-t">DMS</span>）</b>負責把資料庫搬進 <span class="en-t">Google Cloud</span>；<b><span class="en-t">Datastream</span></b>負責在資料庫、儲存系統、應用程式之間同步資料。</p>
<p>🎨 畫面：<span class="en-t">Lift and shift</span> 像整棟房子直接吊車搬到新地基，格局不變；<span class="en-t">managed database migration</span> 像搬進一間裝潢好、水電都幫你顧的新房子。</p>
<div class="kw"><span class="k en-t">lift and shift</span><span class="k en-t">managed database migration</span><span class="k en-t">database migration service</span><span class="k en-t">datastream</span></div>
<div class="ex"><span class="en-t">Google Cloud's Database Migration Service can easily migrate your databases to Google Cloud, or Datastream can be used to synchronize data across databases, storage systems, and applications.</span><button class="speak">🔊</button></div>
<p class="tiny">真實案例：官方課程提到零售商 <span class="en-t">Wayfair</span> 先用 <span class="en-t">lift and shift</span> 把 on-prem <span class="en-t">SQL Server</span> 搬到 <span class="en-t">Cloud SQL for SQL Server</span>，再慢慢用 <span class="en-t">Spanner</span> 等服務現代化——先搬家、再裝潢。</p>`,

`<h3>🏭 真實世界長怎樣：拿「智慧醫療影像中心」看檔案分層與無痛搬家</h3>
<p class="big">想像你在營運一家醫院的放射科與醫療影像中心，這課的物件儲存與遷移工具是這樣落地的：</p>
<p><b>1. 四大儲存層級（越不常用越省錢）</b>：<br>
・<b class="en-t">Standard</b>（標準儲存）：最近一個月病患每天回診要看的 X 光片（頻繁存取，讀取費用最低）。<br>
・<b class="en-t">Nearline</b>（近線儲存，30 天）：每季或半年追蹤一次的定期健檢影像（偶爾存取，每個月頂多看一次）。<br>
・<b class="en-t">Coldline</b>（冷儲存，90 天）：三年才看一次的舊病歷影像，平時放在那裡當災難備援（很少存取，一年看一次）。<br>
・<b class="en-t">Archive</b>（封存儲存，365 天）：醫療法規強制規定封存 10 年以備查核的歷史病歷，幾乎永不讀取，儲存成本像防空洞一樣便宜到極致。</p>
<p><b>2. 智慧自動搬家（Autoclass）</b> ➔ 醫院檔案成千上萬，沒人有空手動切換層級。開啟 <span class="en-t">Autoclass</span>，系統自動根據檔案多久沒被摸過，自動沉降到省錢層級，有病患突然調閱又自動升回，完全不需人工管理。</p>
<p><b>3. 資料庫無痛搬遷（Database Migration Service）</b> ➔ 醫院原本在地下室機房跑舊版 MySQL / PostgreSQL 病歷庫，用 <span class="en-t">DMS</span> 可以在「不停機、醫療系統不中斷（<span class="en-t">minimal downtime</span>）」的狀況下，把整座資料庫平順同步搬上雲端 <span class="en-t">Cloud SQL</span>。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">accessed at most once a year</span>（Coldline）、<span class="en-t">regulatory compliance archival</span>（Archive）、<span class="en-t">minimal downtime migration</span>（Database Migration Service）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：搬檔案 vs 搬資料庫，工具不一樣</b><br>
<span class="en-t">Database Migration Service</span>（<span class="en-t">DMS</span>）搬的是「資料庫」進 <span class="en-t">Google Cloud</span> 代管資料庫；<span class="en-t">Storage Transfer Service</span> 搬的是「檔案／物件」進 <span class="en-t">Cloud Storage</span>（可以用現有的網路連線像 <span class="en-t">Dedicated Interconnect</span> 自動化搬）；<span class="en-t">Transfer Appliance</span> 是寄實體硬體來離線搬超大量資料。看到 <span class="en-t">migrate database</span> 選 <span class="en-t">DMS</span>，看到 <span class="en-t">migrate files</span> 進 <span class="en-t">Cloud Storage</span> 選 <span class="en-t">Storage Transfer Service</span>。</div>
<div class="box warn"><b>誘餌 2：Autoclass vs 手動選等級，雙重陷阱</b><br>
存取模式會變、不想自己盯 → 選 <span class="en-t">Autoclass</span>；已經知道明確的保存排程（例如「第 1 年常用、滿 10 年就砍掉」）→ 用 <span class="en-t">Object lifecycle management</span> 設時間規則，不是 <span class="en-t">Autoclass</span>（<span class="en-t">Autoclass</span> 是照「實際存取狀況」自動搬，<span class="en-t">Object lifecycle management</span> 是照你設好的「時間／年齡」規則自動搬或刪）。手動把全部物件都設成同一個等級，既不自動也常常不划算，這是最常見的誤答。</div>
<div class="box warn"><b>誘餌 3：Multi-region 是位置，不是 storage class</b><br>
看到「服務全球使用者、要高可用、要跨資料中心備援」先想 <span class="en-t">multi-region</span> 這個 <span class="en-t">location type</span>，不要跟依存取頻率分的 <span class="en-t">Nearline</span>／<span class="en-t">Coldline</span> 這種 <span class="en-t">storage class</span> 搞混——兩個是不同維度，可以同時存在（例如 <span class="en-t">Standard storage class</span> ＋ <span class="en-t">multi-region location</span>）。</div>
<p>看完了 🎉 接下來換你動手練習。</p>`
