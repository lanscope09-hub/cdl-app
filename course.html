  hunt: [
    {chunks:["A hospital keeps ten years of patient backup records that must be retained for legal compliance,",' and the retrieval team expects to open these records less than once a year,',' so the architect needs the most cost-effective Cloud Storage class',' for data that is almost never accessed.'], keys:[1,3], opts:['Archive','Nearline','Coldline'], ans:'Archive', why:'<br><b>💡 這個概念在講什麼</b>：官方對 Archive storage 的定義是「一年不到存取一次」，四個 storage class 裡存取最少、儲存費最低、但取出費最高、要保留最久（一放至少 365 天）的等級。這種資料留著是為了應付萬一要查，不是為了常常打開來看。像把幾乎不會再翻的老報稅單鎖進倉庫最深處，平常沒人會碰，但法規要求不能丟。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>less than once a year</b>＝官方 Archive 存取頻率的逐字定義；<b>almost never accessed</b>＝再次確認這批資料幾乎不會被打開。兩個一起出現，直接鎖定 Archive。<br><b>❌ 其他選項為什麼不對</b>：Nearline 的官方存取頻率大約是一個月一次，比題目描述的「一年不到一次」頻繁太多，選它會多付不必要的儲存費。Coldline 大約一季存取一次，同樣比題目情境頻繁，也不是最省錢的選擇。<br><b>🔄 換個說法就換答案</b>：如果題目改成「稽核團隊大約每季要調閱一次這批備份」，存取頻率變成一季一次，答案就會變成 Coldline。'},
    {chunks:["A media company stores thousands of video files whose access patterns change unpredictably over time,",' some clips go viral and get accessed heavily for a week then go cold again,',' and the team wants Cloud Storage to automatically move each object',' to the most cost-effective class without any manual intervention.'], keys:[0,2,3], opts:['Autoclass','Nearline storage','Archive storage'], ans:'Autoclass', why:'<br><b>💡 這個概念在講什麼</b>：官方對 Autoclass 的定義是「依每個物件實際的存取狀況，自動把它搬到合適的 storage class」——不常被碰就自動搬去更冷、更省錢的等級，突然又被存取就自動搬回 Standard，全程不用人手動判斷。它解決的正是「存取模式沒有固定規律」這種情境。像有個管家一直盯著每箱東西最近有沒有人碰，自己決定搬去倉庫深處還是搬回門口。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>access patterns change unpredictably</b>＝存取模式沒有固定規律，沒辦法事先猜好要選哪個等級；<b>automatically move each object...without any manual intervention</b>＝完全對應官方 Autoclass「automatically transitions objects to appropriate storage classes」的定義，還明講不用手動介入。<br><b>❌ 其他選項為什麼不對</b>：Nearline storage 是固定的一個等級，選了它就等於猜死「這些影片都大約一個月存取一次」，但題目說存取模式忽冷忽熱、無法預測，硬套一個固定等級不合理也不划算。Archive storage 同樣是固定等級，而且是給幾乎不存取的資料用的，跟題目「有些影片會突然爆紅被大量存取」完全矛盾。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這些影片的存取排程是固定的：第一年常態存取，滿三年後幾乎不再打開」，那是已知的時間規則，該用 Object lifecycle management 依年齡設定搬移規則，而不是 Autoclass（Autoclass 照的是實際存取狀況，不是你事先排好的時間表）。'},
    {chunks:["An online retailer wants to serve product images to customers across multiple continents",' with the lowest possible latency',' and needs Cloud Storage to keep redundant copies',' spread across geographically diverse data centers for disaster protection.'], keys:[0,3], opts:['Multi-region location','Nearline storage class','Coldline storage class'], ans:'Multi-region location', why:'<br><b>💡 這個概念在講什麼</b>：<span class="en-t">location type</span>（region／dual-region／multi-region）管的是資料實際放在哪些地理範圍，跟依存取頻率分等級的 storage class 是完全不同的維度。官方明講：資料放在 multi-region 或 dual-region 會有 geo-redundancy——伺服器分散放在不同地理位置的資料中心，防天災，還能就近服務全球流量、做負載平衡。就像 storage class 決定東西放倉庫哪層架子（多常拿），location type 決定倉庫本身開在幾個城市（多廣）。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>serve product images to customers across multiple continents</b>＝要服務跨洲的使用者，這是地理範圍的需求；<b>spread across geographically diverse data centers for disaster protection</b>＝完全對應官方 geo-redundancy 的逐字定義「placing physical servers in geographically diverse data centers to protect against catastrophic events」。<br><b>❌ 其他選項為什麼不對</b>：Nearline storage class 講的是「大約一個月存取一次」這種存取頻率，跟題目要的跨洲服務、地理備援完全是不同的問題，選它答不到題目的需求。Coldline storage class 同樣是依存取頻率分的等級，跟資料放在哪些地理範圍無關。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這批產品圖片一年最多只會被打開一次，用來做年度稽核」，問題就變成存取頻率，答案會變成 Archive（storage class），跟地理位置無關。'},
    {chunks:["An organization is moving its production database from another cloud provider to Cloud SQL,",' and the migration must run with minimal disruption to end users',' while keeping the data encrypted',' during the transfer itself.'], keys:[0,1], opts:['Database Migration Service','Storage Transfer Service','Transfer Appliance'], ans:'Database Migration Service', why:'<br><b>💡 這個概念在講什麼</b>：<span class="en-t">Database Migration Service</span>（DMS）是 Google Cloud 官方指定用來把資料庫搬進 Google Cloud 代管資料庫服務的工具，設計上就是要讓搬遷過程對正在使用系統的人影響最小。它跟搬「檔案」用的 Storage Transfer Service 是不同賽道的兩個工具。像請專業搬家公司幫你把正在營業中的店面整個搬到新地址，中途盡量不打烊、不影響客人。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>moving its production database...to Cloud SQL</b>＝明講要搬的是「資料庫」、目的地是 Cloud SQL 這個代管資料庫服務；<b>minimal disruption to end users</b>＝直接對應官方講資料庫遷移要「minimal upheaval」的核心訴求，這正是 DMS 被設計出來解決的問題。<br><b>❌ 其他選項為什麼不對</b>：Storage Transfer Service 是設計來搬「檔案／物件」進 Cloud Storage 的服務，題目要搬的是正在運作中的資料庫，不是檔案。Transfer Appliance 是寄實體硬體做離線大量資料搬遷，題目資料庫還在正常服務中、要求低中斷，跟離線搬硬碟的情境完全不合。<br><b>🔄 換個說法就換答案</b>：如果題目改成「要把上百 TB 的舊檔案伺服器資料搬進 Cloud Storage，而且想用既有的 Dedicated Interconnect 網路連線自動化搬」，答案就會變成 Storage Transfer Service。'}

     opts:['Nearline class','Standard class','Coldline class','Archive class'],
     ans:'D', keys:['accessed annually','most cost-effective'],
     why:{A:'Nearline 對應大約一個月存取一次，比題目「一年才存取一次」頻繁很多，不是最省錢的選擇。',B:'Standard 是給常態、高頻率存取用，儲存費最貴，跟一年才用一次的備份檔完全不符。',C:'Coldline 對應大約一季存取一次，仍比題目描述的頻率高，不是最省錢的等級。',D:'<b>accessed annually</b>（一年一次）對應官方定義 less than once a year → Archive class 是四個等級裡最省錢的選擇。'}},
    {no:267, stem:'An organization is looking for a storage solution that will help them serve content to users worldwide. They need a solution that offers a high level of availability. What feature of Cloud Storage would they benefit from?',
     opts:['Global metadata','Object versioning','Data encryption','Multi-regional storage'],
     ans:'D', keys:['serve content to users worldwide','high level of availability'],
     why:{A:'Global metadata 不是 Cloud Storage 的正式功能名稱，題目要的是「服務全球使用者、要有高可用」的地理配置能力。',B:'Object versioning 是保留物件的歷史版本，用來防止誤刪或誤改，跟服務全球使用者、拉高可用性沒有直接關係。',C:'Data encryption 是資料加密，保護的是機密性，不是解決全球服務、可用性的問題。',D:'<b>serve content to users worldwide</b> ＋ <b>high level of availability</b> = 需要跨區備援；舊名叫 Multi-regional storage，現在官方講法是 storage class 選 Standard、位置選 multi-region 這個 location type，觀念不變：要跨地理區備援、就近服務全球流量就選 multi-region。'}},
    {no:42, stem:"Your organization is moving an application to Google Cloud. As part of that effort, it needs to migrate the application's working database from another cloud provider to Cloud SQL. The database runs on the MySQL engine. The migration must cause minimal disruption to users. Data must be secured while in transit. Which should your organization use?",
     opts:['BigQuery Data Transfer Service','MySQL batch insert','Database Migration Service','Cloud Composer'],
     ans:'C', keys:['minimal disruption to users','secured while in transit'],
     why:{A:'BigQuery Data Transfer Service 是把資料匯入 BigQuery 做分析用的，不是搬遷正式運作中的資料庫。',B:'自己手動寫 MySQL batch insert 沒有官方保證的最小停機時間，也沒有內建的傳輸中加密，風險高、不符合題目要求。',C:'<b>migrate...database...to Cloud SQL</b> 加上 <b>minimal disruption to users</b>、<b>secured while in transit</b> 正是 Database Migration Service（DMS）設計來做的事：安全、低停機把資料庫搬進 Cloud SQL。',D:'Cloud Composer 是工作流程協調工具，不是資料庫搬遷服務。'}},
    {no:165, stem:"The government has mandated that companies in a particular section of healthcare must retain all the data they collect for a period of 10 years in case an audit needs to be done. Your client, who is in that industry, needs to follow regulations. In addition, your client wants to do an analysis of the data quite frequently in the first year. They also don't want to be liable for any data beyond year 10. What would recommend for your customer?",
     opts:['Use Cloud Storage with nearline storage in year one and Coldline storage thereafter. Use Object lifecycle management to move between storage types and delete them after 10 years.','Use Cloud Storage with standard storage in year one and Coldline storage thereafter. Set a Cloud Scheduler trigger for 1 year to change storage types and 10 years to delete the data.','Use Cloud Storage with standard storage in year one and archival storage thereafter. Use Object lifecycle management to move between storage types and delete them after 10 years.','Use Cloud Storage with standard storage in year one and Coldline storage thereafter. Set a Cloud Tasks to trigger for 1 year to change storage types and 10 years to delete the data.'],
     ans:'C', keys:['standard storage in year one and archival storage thereafter','Object lifecycle management'],
     why:{A:'第一年用 nearline storage 而不是 standard storage，跟題目「第一年常常分析資料（要常態存取）」的情境不合，nearline 的取出成本會比較貴。',B:'用 Cloud Scheduler 手動觸發搬遷跟刪除，不是 Cloud Storage 官方設計用來管理生命週期的做法，而且第一年用 Coldline 也不合理（存取太頻繁不划算）。',C:'<b>standard storage in year one</b>（第一年常存取用 Standard）接著轉 <b>archival storage</b>（十年幾乎不存取用 Archive），再用 <b>Object lifecycle management</b> 依規則自動搬移＋到期刪除，完全對應題目「第一年常分析、之後長期保存、滿 10 年就不留」的需求。',D:'用 Cloud Tasks 排程觸發不是 Cloud Storage 官方設計的生命週期管理工具，而且一樣用了 Coldline 當第一年等級，不符合「第一年頻繁分析」。'}},
    {no:204, stem:'A customer in the European Union region is very clear that their data should not go outside the European Union. Their end users are spread all over the European Union. They have to choose a storage option that serves all the users within Asia via web browsers as quickly as possible. Which storage option will work for them?',
     opts:['Cloud Storage with a single region that is known to be within the European Union','Cloud Filestore is connected to virtual machines which are guaranteed to be within the European Union','Cloud Storage with the multi-region option of European Union','Cloud Storage with the dual-region option of European Union'],
     ans:'C', keys:['should not go outside the European Union','multi-region option of European Union'],
     why:{A:'單一 single region 只在一個地理區域內，沒辦法像 multi-region 一樣做到跨資料中心的地理備援與更廣的就近服務範圍。',B:'Cloud Filestore 是給 Compute Engine VM 用的檔案系統儲存，不是拿來對外快速服務大量使用者的物件儲存方案，題目要的是儲存服務不是掛載檔案系統。',C:'<b>should not go outside the European Union</b>（資料不可離開歐盟）＋ 要服務範圍廣、速度快 → 選在歐盟境內的 <b>multi-region option</b>，資料仍留在歐盟境內的多個資料中心，兼顧法規與速度。',D:'dual-region 只涵蓋兩個資料中心，範圍比 multi-region 小，題目要「serve all the users」代表要更廣的地理覆蓋跟備援，multi-region 更合適。'}},
    {no:29, stem:'Your organization is migrating to Google Cloud. As part of that effort, it needs to move terabytes of data from on-premises file servers to Cloud Storage. Your organization wants the migration process to be automated and to be managed by Google. Your organization has an existing Dedicated Interconnect connection that it wants to use. Which Google Cloud product or feature should your organization use?',
     opts:['Storage Transfer Service','Migrate for Anthos','BigQuery Data Transfer Service','Transfer Appliance'],
     ans:'A', keys:['Dedicated Interconnect','automated and to be managed by Google'],
     why:{A:'<b>automated and...managed by Google</b> ＋ 使用現有 <b>Dedicated Interconnect</b> 搬檔案進 Cloud Storage，正是 Storage Transfer Service 設計的情境：全代管、自動化的檔案搬遷服務。',B: 'Migrate for Anthos 是把整台虛擬機器搬進容器化環境用的服務，跟搬「檔案」進 Cloud Storage 是兩件事。順便記：<b>Anthos 是舊名，新考綱叫 GKE Enterprise</b>，考古題原題還寫舊名，判斷邏輯不變。',C:'BigQuery Data Transfer Service 是把外部資料來源匯入 BigQuery 做分析用的，不是搬檔案進 Cloud Storage。',D:'Transfer Appliance 是用實體硬體離線搬遷資料，題目已經有現成的 Dedicated Interconnect 網路連線可以直接自動化搬，不需要用離線硬體設備。'}},
    {no:374, stem:'An organization has a large archive of unstructured data, including video and audio files. Which storage solution should the organization use?',
     opts:['Cloud SQL','Cloud Spanner','Cloud Bigtable','Cloud Storage'],
     ans:'D', keys:['unstructured data','video and audio files'],
     why:{A:'Cloud SQL 是給結構化的關聯式資料用的資料庫服務，不是用來存放影音檔案這種非結構化資料。',B:'Cloud Spanner 一樣是關聯式資料庫，設計給結構化資料的全球一致性交易用，不適合存放大量影音檔案。',C:'Cloud Bigtable 是給半結構化的 NoSQL 大量資料用（例如時間序列資料），不是設計來存放整個影音檔案本身的。',D:'<b>unstructured data</b>（影片、音檔這類 <b>video and audio files</b>）正是 Cloud Storage 的 object storage 架構設計來存放的資料類型。'}}

  mind: '這課全部都在考同一件事：資料存好了之後，怎麼被<b>看懂</b>（Looker）、怎麼<b>即時</b>被用（streaming analytics）、怎麼<b>被送進送出</b>（Pub/Sub、Dataflow、Managed Service for Apache Spark）。',
  cards: [
`<h3>🔍 資料倉儲之後呢：讓資料「有用、可取用」</h3>
<p class="big">資料放進資料倉儲只是第一步，重點是接下來能不能被<b>拿來分析、產生洞察</b>——這一課的主題就是怎麼讓資料真的<span class="en-t">useful</span>（有用）又<span class="en-t">accessible</span>（可取用）。</p>
<p>🎨 畫面：倉庫貨都堆好了（資料存好了），這課教你怎麼把貨架整理成客人一眼就找得到、看得懂的展示區。</p>
<div class="kw"><span class="k en-t">useful</span><span class="k en-t">accessible</span><span class="k en-t">actionable intelligence</span></div>
<div class="ex"><span class="en-t">This section explores the transformation of raw data into <mark>actionable intelligence</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">接下來三件事都是在解決「資料有了，然後呢」：Looker 讓大家都看得懂、streaming analytics 讓資料即時可用、三個管線產品負責把資料送進送出。</p>`,

`<h3>📊 Looker：讓全公司都能自己挖資料</h3>
<p class="big"><span class="en-t">Looker</span> 是 Google Cloud 的<b>商業智慧（business intelligence）</b>平台，讓個人和團隊都能自己分析、視覺化、共享資料，做出好懂又能互動的儀表板和報表。</p>
<p>🎨 畫面：以前查資料要排隊找懂資料庫的工程師；有了 Looker，人人都能自己開一扇窗直接看資料、自己問自己答。</p>
<div class="kw"><span class="k en-t">Looker</span><span class="k en-t">business intelligence</span><span class="k en-t">dashboards</span><span class="k en-t">visualize</span></div>
<div class="ex"><span class="en-t">Looker helps individuals and teams <mark>analyze, visualize, and share data</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">官方 Cloud Corner 用「clear the fog」形容 Looker 的角色——把擋在資料前面的霧撥開，讓每個人都看得到。</p>`,

`<h3>🤝 BigQuery ＋ Looker：資料庫接分析工具</h3>
<p class="big"><span class="en-t">Looker</span> 支援 <span class="en-t">BigQuery</span>，加上 60 多種 SQL 資料庫。兩者搭配能做出<b>即時、互動的儀表板</b>，而且不用犧牲效能、規模、安全性或資料新鮮度。它還是 <span class="en-t">100% web-based</span>，開瀏覽器就能用，方便整合進現有工作流程、跟多個團隊分享。</p>
<p>🎨 畫面：BigQuery 是廚房囤好的新鮮食材，Looker 是把菜端上桌、擺盤給客人看的服務生——食材再新鮮，沒人端出來也是白搭。</p>
<div class="kw"><span class="k en-t">interactive dashboards</span><span class="k en-t">data freshness</span><span class="k en-t">100% web-based</span><span class="k en-t">workflows</span></div>
<div class="ex"><span class="en-t">Looker is <mark>100% web-based</mark>, which makes it easy to integrate into existing workflows and share with multiple teams.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">官方小測驗考過：Looker 能簡化跨團隊整合與分享的關鍵，就是<b>100% web-based</b>——不用裝軟體，開瀏覽器就能用。</p>`,

`<h3>⚡ Streaming analytics：資料一產生就馬上分析</h3>
<p class="big"><span class="en-t">Streaming analytics</span> 是<b>持續</b>處理資料紀錄，不是像 <span class="en-t">batch processing</span> 那樣整批囤著、排時間才處理一次。事件一發生，馬上就能分析、回報。</p>
<p>🎨 畫面：batch 像等晚間新聞才知道今天發生什麼事；streaming 像手機上的即時動態，事情發生當下就跳出來。</p>
<div class="kw"><span class="k en-t">streaming analytics</span><span class="k en-t">continuously</span><span class="k en-t">batch processing</span><span class="k en-t">real time</span></div>
<div class="ex"><span class="en-t">Streaming analytics is the processing and analyzing of data records <mark>continuously</mark>, instead of in batches.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">常見來源：equipment sensors、clickstreams、social media feeds、stock market quotes、app activity——共同點是資料一小包一小包、源源不絕地進來。</p>`,

`<h3>📨 Pub/Sub：接住四面八方湧進來的訊息</h3>
<p class="big"><span class="en-t">Pub/Sub</span>（<span class="en-t">Publish</span>／<span class="en-t">Subscribe</span> 的縮寫）是<b>分散式訊息服務</b>，負責接住從各種裝置串流（遊戲事件、IoT 裝置、應用程式串流）湧進來的訊息，是資料管線最前面的<b>擷取（ingestion）</b>階段。</p>
<p>🎨 畫面：一個超大型郵局，同時有上百萬個寄件人（感測器、App）不斷寄信進來，Pub/Sub 負責先全部收下、分類轉寄。</p>
<div class="kw"><span class="k en-t">Pub/Sub</span><span class="k en-t">distributed messaging service</span><span class="k en-t">ingestion</span><span class="k en-t">device streams</span></div>
<div class="ex"><span class="en-t">Pub/Sub is a <mark>distributed messaging service</mark> that can receive messages from various device streams.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">資料先進 Pub/Sub，才輪到下一棒 Dataflow 接手處理——順序記牢：先收（Pub/Sub）再送（Dataflow）。</p>`,

`<h3>🔧 Dataflow：把資料一路 ETL 進倉庫</h3>
<p class="big"><span class="en-t">Dataflow</span> 建立管線來處理<b>串流</b>和<b>批次</b>資料，做的是 <span class="en-t">extract, transform, load</span>（<span class="en-t">ETL</span>）。它是 <span class="en-t">serverless</span>、<span class="en-t">fully managed</span>：不用自己顧基礎設施，還能可靠地自動擴展。</p>
<p>🎨 畫面：Pub/Sub 收到一堆包裹後，Dataflow 是自動分揀＋加工的輸送帶，全自動運作，包裹一多就自己加開輸送帶。</p>
<div class="kw"><span class="k en-t">Dataflow</span><span class="k en-t">serverless</span><span class="k en-t">fully managed</span><span class="k en-t">auto scaling</span></div>
<div class="ex"><span class="en-t">Dataflow handles much of the complexity for infrastructure setup and maintenance and allows for reliable <mark>auto scaling</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">官方原文的重點字：serverless（不用自己開伺服器）＋ fully managed（不用自己維運）——這兩個字一起出現，十之八九在講 Dataflow。</p>`,

`<h3>🔥 Managed Service for Apache Spark：舊名 Dataproc</h3>
<p class="big"><span class="en-t">Managed Service for Apache Spark</span>（舊名 <span class="en-t">Dataproc</span>）主要用來連接 Pub/Sub，扮演<b>串流擷取與發布</b>用的分散式處理引擎，用的是開源 <span class="en-t">Apache Spark</span> 框架自己的用戶端函式庫。傳統上要用伺服器，但也有無伺服器版本 <span class="en-t">Serverless for Apache Spark</span>。</p>
<p>🎨 畫面：公司本來就有一批用 Hadoop、Spark 寫好的資料處理程式，這個產品就是幫你把那套原班人馬直接搬上 Google Cloud，不用重寫。</p>
<div class="kw"><span class="k en-t">Managed Service for Apache Spark</span><span class="k en-t">Dataproc</span><span class="k en-t">Apache Spark</span><span class="k en-t">Hadoop</span></div>
<div class="ex"><span class="en-t">Another tool to create pipelines is <mark>Managed Service for Apache Spark</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">考古題舊題會寫「Dataproc」，看到就直接換算成新名字，觀念完全一樣。</p>`,

`<h3>🔑 三個管線產品一張表</h3>
<div class="tw"><table>
<tr><th>產品</th><th>角色</th><th>看到這些英文</th></tr>
<tr><td><b class="en-t">Pub/Sub</b></td><td>接收即時訊息（ingestion）</td><td class="en-t">distributed messaging, publish, subscribe</td></tr>
<tr><td><b class="en-t">Dataflow</b></td><td>處理管線（ETL），串流＋批次都可</td><td class="en-t">serverless, fully managed, auto scaling</td></tr>
<tr><td><b class="en-t">Managed Service for Apache Spark</b></td><td>搬既有 Hadoop／Spark 工作到雲端</td><td class="en-t">Apache Spark, Hadoop, Dataproc</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>資料進來找 Pub/Sub、資料要加工送進倉庫找 Dataflow、原本就用 Hadoop／Spark 的舊系統搬家找 Managed Service for Apache Spark。</b></div>`,

`<h3>🏭 真實世界長怎樣：拿「智慧低溫冷鏈物流車隊」看即時串流與 BI 戰情室</h3>
<p class="big">想像你在營運全台幾萬輛冷凍物流貨車車隊，這課的大數據管線是這樣即時連動的：</p>
<p><b>1. 訊息收發超級郵局</b> ➔ <b class="en-t">Pub/Sub</b><br>
每輛冷凍車上的溫度感測器、胎壓計與 GPS，每秒都在發送最新數據。Pub/Sub 扮演超級郵局，以非同步方式瞬間吞吐數十萬筆訊息，完全不漏接（<span class="en-t">ingest streaming data</span>）。</p>
<p><b>2. 即時加工清洗水管</b> ➔ <b class="en-t">Dataflow</b><br>
水管中間的加工廠。Dataflow 一邊接收 Pub/Sub 的即時訊息，一邊即時篩選出「溫度超過 7 度的超溫警報車輛」，並將清洗後的乾淨數據送入資料倉儲（<span class="en-t">streaming data pipeline</span>）。</p>
<p><b>3. 巨量批次運算</b> ➔ <b class="en-t">Managed Service for Apache Spark</b>（舊名 Dataproc）<br>
每季物流總監要用開源生態系的 Spark 或 Hadoop 跑複雜的歷史路線最佳化演算法，全代管服務幾分鐘內開好運算叢集，算完自動關機省錢。</p>
<p><b>4. 即時商業智慧視覺化戰情室</b> ➔ <b class="en-t">Looker</b><br>
物流調度中心的電視大牆。主管看著地圖上的即時互動儀表板，哪輛車溫度異常、哪條國道塞車圖表一目了然，甚至能直接下指令自動重派工（<span class="en-t">business intelligence</span> 視覺化報表）。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">ingest real-time messages at scale</span>（Pub/Sub）、<span class="en-t">stream and batch processing</span>（Dataflow）、<span class="en-t">open-source Spark / Hadoop</span>（Spark / Dataproc）、<span class="en-t">modern BI and data visualization</span>（Looker）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：Pub/Sub vs Dataflow，傻傻分不清</b><br>
題目問「怎麼<b>接收</b>大量即時湧入的訊息／事件」→ <span class="en-t">Pub/Sub</span>；問「怎麼把資料<b>轉換、處理後送進</b>資料倉庫，還要求 serverless、少管理」→ <span class="en-t">Dataflow</span>。兩個常常一起出現在同一題的選項裡，考的就是你分不分得清「收」跟「送＋加工」是兩個不同階段。</div>
<div class="box warn"><b>誘餌 2：舊名 Dataproc 別看到陌生就跳過</b><br>
考古題原題會寫 <span class="en-t">Dataproc</span>，新版考綱已經改名 <span class="en-t">Managed Service for Apache Spark</span>——看到題目寫 Dataproc，觀念上直接當作在講 Managed Service for Apache Spark，功能完全一樣。</div>
<div class="box warn"><b>誘餌 3：BigQuery vs Dataflow，一個是倉庫一個是輸送帶</b><br>
<span class="en-t">BigQuery</span> 是<b>存放＋分析</b>資料的倉庫；<span class="en-t">Dataflow</span> 是把資料<b>搬進倉庫前先加工</b>的管線。題目問「serverless 資料倉儲、可以做 smart analytics」是 BigQuery；問「建立可擴展、少管理的資料處理管線來轉換資料」才是 Dataflow。</div>
<div class="box warn"><b>誘餌 4：Batch processing vs streaming analytics，看「持續」還是「排時間」</b><br>
官方 Cloud Corner 舉的例子：發薪水系統一個月跑一次，是典型 <span class="en-t">batch processing</span>（整批、有延遲）；但即時球賽比分等不得，這就是 <span class="en-t">streaming analytics</span>（持續處理，事件發生當下就分析）。題目問「defining function」問的就是這個差異，答案永遠是 continuously 那一個。</div>
<p>看完了 🎉 接下來換你動手：② 先練「看到英文情境 → 反射出是 Pub/Sub、Dataflow、還是 Managed Service for Apache Spark」。</p>`

  hunt: [
    {chunks:['A ride-sharing app has thousands of vehicles sending GPS location data every few seconds,',' and the company needs a service',' that can receive all of these constant, high-volume message streams',' before any processing takes place.'], keys:[2,3], opts:['Pub/Sub','Dataflow','Looker'], ans:'Pub/Sub', why:'<br><b>💡 這個概念在講什麼</b>：Pub/Sub 是分散式訊息服務，負責資料管線最前面的「擷取」（ingestion）階段——在任何加工、分析發生之前，先把從各種裝置（遊戲事件、IoT 裝置、應用程式串流）湧進來的訊息全部接住。官方形容這個階段的資料「可能同時從上千、上百萬個不同事件非同步地傳進來」。像一個超大型郵局，先把上百萬個寄件人（感測器、App）寄來的信全部收下、分類，之後才輪到別的部門處理內容。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>receive all of these constant, high-volume message streams</b>＝完全對應官方 Pub/Sub 定義「a distributed messaging service that can receive messages from various device streams」；<b>before any processing takes place</b>＝點出這是加工之前「收」的階段，正是 Pub/Sub 的定位，還沒輪到 Dataflow 出場。<br><b>❌ 其他選項為什麼不對</b>：Dataflow 負責的是訊息被收下「之後」的轉換、加工（ETL），題目講的是處理發生之前先接住訊息，順序上還沒輪到 Dataflow。Looker 是商業智慧視覺化工具，用來做儀表板、報表，跟接收即時訊息完全無關。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這些 GPS 資料收到後，需要即時轉換、清洗，再送進資料倉儲，而且要求 serverless、少管理」，答案就會變成 Dataflow。'},
    {chunks:['An online retailer needs a pipeline that can transform both its real-time clickstream data and its overnight batch orders,',' and the team wants a serverless option',' so they never have to provision or manage the underlying servers themselves.'], keys:[0,1], opts:['Dataflow','Pub/Sub','Managed Service for Apache Spark'], ans:'Dataflow', why:'<br><b>💡 這個概念在講什麼</b>：Dataflow 建立管線來處理串流和批次資料，做的是 extract, transform, load（ETL）——重點在「轉換」，這是它跟只負責「接收」的 Pub/Sub 最大的差別。它是 serverless、fully managed：不用自己顧基礎設施，還能可靠地自動擴展。像 Pub/Sub 收到一堆包裹後，Dataflow 是自動分揀＋加工的輸送帶，全自動運作，包裹一多就自己加開輸送帶。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>transform both its real-time clickstream data and its overnight batch orders</b>＝官方明講 Dataflow「creates a pipeline to process both streaming data and batch data」，串流＋批次都能轉換正是它的招牌；<b>a serverless option</b>＝直接點出「serverless」這個字，對應官方「Dataflow is serverless and fully managed」。<br><b>❌ 其他選項為什麼不對</b>：Pub/Sub 只負責接收（ingest）訊息，不做轉換這個加工動作，題目要的是「transform」兩種資料，Pub/Sub 做不到。Managed Service for Apache Spark 是給已經用 Hadoop／Spark 寫好的既有工作直接搬家用的，題目沒提到既有 Hadoop／Spark 程式碼要搬，用不上它。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家零售商已經用 Hadoop 和 Spark 寫好資料處理程式，只想直接搬上雲端、不重寫」，答案就會變成 Managed Service for Apache Spark。'},
    {chunks:['A logistics company already has data processing jobs built with Hadoop and Spark running in its own data center,',' and it wants to move those exact jobs to Google Cloud',' without rewriting them for a completely different framework.'], keys:[0,2], opts:['Managed Service for Apache Spark','Dataflow','Pub/Sub'], ans:'Managed Service for Apache Spark', why:'<br><b>💡 這個概念在講什麼</b>：Managed Service for Apache Spark（舊名 Dataproc）是設計來直接接手既有的 Hadoop／Spark 工作的服務，用的是開源 Apache Spark 框架自己的用戶端函式庫，不用把程式改寫成別的框架。它主要用來連接 Pub/Sub，扮演串流擷取與發布用的分散式處理引擎。像公司本來就有一批用 Hadoop、Spark 寫好的資料處理程式，這個產品把原班人馬直接請上 Google Cloud 繼續上班，不用重新招募一批人改寫。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>data processing jobs built with Hadoop and Spark</b>＝點名既有工作用的正是 Hadoop 和 Spark 這兩個開源框架，這是 Managed Service for Apache Spark 的招牌對象；<b>without rewriting them for a completely different framework</b>＝要求不重寫成別的框架，正是它「用開源框架自己的用戶端函式庫直接接手」的定位。<br><b>❌ 其他選項為什麼不對</b>：Dataflow 用的是 Apache Beam 的管線模型，既有的 Hadoop／Spark 程式碼沒辦法直接搬過去用，跟題目「不重寫」的要求矛盾。Pub/Sub 是接收訊息的擷取服務，不是拿來接手既有處理工作負載的引擎，題目也沒提到即時訊息。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家物流公司想把即時 GPS 事件接進管線，做串流加批次的通用轉換，還要求 serverless、少管理」，答案就會變成 Dataflow。'},
    {chunks:['A hospitality company used to rely on scattered spreadsheets and gut instinct for every business decision,',' and it wants every team, not just data experts,',' to explore the same trusted data',' and build their own dashboards without waiting on a specialist.'], keys:[1,3], opts:['Looker','Managed Service for Apache Spark','Pub/Sub'], ans:'Looker', why:'<br><b>💡 這個概念在講什麼</b>：Looker 是 Google Cloud 的商業智慧平台，讓個人和團隊自己分析、視覺化、共享資料，不用每次都排隊找懂資料庫的專家。官方形容它讓「anyone on a team can explore it, ask and answer their own questions」，而且 100% 透過瀏覽器使用，容易整合進既有工作流程、跨團隊分享。像以前查資料要找工程師開一扇窗，有了 Looker 人人都能自己開窗直接看資料、自問自答。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>every team, not just data experts</b>＝直接對應官方「not just experts」、讓全公司都能自己用資料的定位；<b>build their own dashboards without waiting on a specialist</b>＝呼應官方「anyone on a team can explore it...and create visualizations」，不用等專家代勞。<br><b>❌ 其他選項為什麼不對</b>：Managed Service for Apache Spark 是資料處理引擎，負責搬既有 Hadoop／Spark 工作，不是給團隊自己做儀表板用的 BI 工具。Pub/Sub 是訊息擷取服務，負責接收即時訊息，跟「讓每個團隊自己探索資料、做儀表板」完全無關。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家公司想把地端跑的 Hadoop、Spark 工作直接搬上雲端繼續用，不想重寫」，答案就會變成 Managed Service for Apache Spark。'}
  ],
  mcq: [
    {stem:'A company wants to give every team across the organization a business intelligence tool that is easy to integrate into its existing workflows and share broadly, without installing any client software on each computer. Which feature best supports this requirement?',
     opts:['A 100% web-based platform','A cost-effective licensing model','An intuitive report visualization engine','Broad support for diverse data sources'], ans:'A',
     key:'100% web-based',
     why:{A:'官方課程小測驗原題：Looker 是 <b>100% web-based</b> 平台，不用裝軟體，開瀏覽器就能整合進工作流程、跨團隊分享。',B:'授權模式便不便宜跟能不能無安裝分享是兩件事。',C:'視覺化引擎做得好不代表不用裝軟體就能分享。',D:'支援多種資料來源是另一個賣點，跟本題問的「易整合易分享」無關。'}},
    {stem:'A ride-hailing company receives a continuous stream of GPS events from thousands of drivers and needs a serverless, fully managed pipeline that can transform this streaming data and load it into a data warehouse for analysis. Which product should the team use?',
     opts:['Dataflow','Pub/Sub','Managed Service for Apache Spark','Looker'], ans:'A',
     key:'transform this streaming data and load it into a data warehouse',
     why:{A:'<b>serverless, fully managed</b> ＋ <b>transform … and load into a data warehouse</b> 正是 Dataflow 的 ETL 管線角色。',B:'⚠️雙陷阱：Pub/Sub 只負責接收（ingest）GPS 事件，不負責轉換資料或把資料送進倉庫，很容易被「streaming」兩個字誘導選它。',C:'Managed Service for Apache Spark 是給既有 Hadoop／Spark 工作搬家用的，不是這種通用 ETL 情境。',D:'Looker 是 BI 視覺化工具，不是資料處理管線。'}},
    {stem:'A financial services firm wants to detect abnormal account activity and generate a security alert the moment suspicious behavior occurs, rather than discovering it in a report the next day. Which approach should the firm adopt?',
     opts:['Streaming analytics','Batch processing','Data warehousing','Object storage'], ans:'A',
     key:'the moment suspicious behavior occurs',
     why:{A:'<b>the moment … occurs</b> = 事件發生當下就要分析、示警 → streaming analytics，官方案例正是 financial services 用串流分析偵測異常行為。',B:'batch processing 是整批、有延遲，跟「當下發現」相反。',C:'data warehousing 講的是存放與分析基礎，不是即時偵測本身的做法。',D:'object storage 是存放物件檔案的方式，跟即時偵測異常行為無關。'}},
    {stem:'A manufacturing company already runs its on-premises data processing jobs using Hadoop and Spark, and it wants to move those exact workloads to Google Cloud without rewriting them in a new framework. Which Google Cloud product should the company use?',
     opts:['Managed Service for Apache Spark','Dataflow','Pub/Sub','BigQuery'], ans:'A',
     key:'Hadoop and Spark',
     why:{A:'Managed Service for Apache Spark（舊名 Dataproc）就是設計來直接接手既有的 Hadoop／Spark 工作，不用重寫。',B:'Dataflow 用的是 Apache Beam 的管線模型，既有 Hadoop／Spark 程式碼不能直接搬過去用。',C:'Pub/Sub 是接收訊息的擷取服務，不是處理既有工作負載的引擎。',D:'BigQuery 是分析倉儲，不是拿來搬移既有處理工作的產品。'}},
    {stem:'An organization stores all of its data in BigQuery and now wants every team, not just data specialists, to explore that data and build their own interactive dashboards without moving the data anywhere else. Which product should the organization add to its stack?',

     key:'explore that data and build their own interactive dashboards',
     why:{A:'Looker 支援 BigQuery，讓非專家團隊也能自己 <b>explore … and build their own interactive dashboards</b>，這正是官方講的 democratize data。',B:'Managed Service for Apache Spark（舊名 Dataproc）是資料處理引擎，不是 BI 視覺化工具。',C:'Pub/Sub 是訊息擷取服務，跟「探索資料、做儀表板」無關。',D:'Cloud Storage 是物件儲存，不能讓團隊自己探索、視覺化資料。'}}

  exam: [
    {no:83, stem:'Your organization needs to analyze data in order to gather insights into its daily operations. You only want to pay for the data you store and the queries you perform. Which Google Cloud product should your organization choose for its data analytics warehouse?',
     opts:['Cloud SQL','Dataproc','Cloud Spanner','BigQuery'], ans:'D',
     keys:['pay for the data you store and the queries you perform','data analytics warehouse'],
     why:{A:'Cloud SQL 是交易型關聯式資料庫，不是分析用的資料倉儲，也沒有這種「存＋查」計價模式。',B:'Dataproc（舊名，現稱 Managed Service for Apache Spark）是資料處理引擎，本身不是資料倉儲。',C:'Cloud Spanner 是全球分散式交易型資料庫，不是分析倉儲。',D:'<b>pay for the data you store and the queries you perform</b> 正是 BigQuery 這種 serverless 分析倉儲的計價方式，依存量和查詢量收費。'}},
    {no:277, stem:'How would an organization benefit from using Looker?',
     opts:['Optimal identity and access management','Leading serverless warehousing technology','Robust data roll-back accuracy','Advanced business intelligence and analytics'], ans:'D',
     keys:['benefit from using Looker'],
     why:{A:'身分與存取管理不是 Looker 的定位，是 IAM 產品的事。',B:'serverless warehousing 描述的是 BigQuery，不是 Looker。',C:'資料回溯精準度不是 Looker 的賣點。',D:'<b>Advanced business intelligence and analytics</b> 正是 Looker 的定位：讓團隊自己分析、視覺化、共享資料。'}},
    {no:359, stem:'An international bank is looking for a serverless warehouse solution that lets them perform smart analytics. Which Google Cloud product or service should the bank use?',
     opts:['BigQuery','Dataflow','Compute Engine','Cloud Spanner'], ans:'A',
     keys:['serverless warehouse solution','smart analytics'],
     why:{A:'<b>serverless warehouse</b> ＋ <b>smart analytics</b> 正是 BigQuery 的定位。',B:'Dataflow 是資料處理管線，不是資料倉儲。',C:'Compute Engine 是運算用的虛擬機，跟資料倉儲無關。',D:'Cloud Spanner 是交易型資料庫，不是分析倉儲。'}},
    {no:300, stem:'What is a defining function of streaming analytics?',
     opts:['Processing data records in batches','Processing data records continuously','Accessing data with high latency','Processing a one-off data backfill'], ans:'B',
     keys:['defining function of streaming analytics'],
     why:{A:'整批處理是 batch processing 的做法，跟 streaming analytics 相反。',B:'官方定義：streaming analytics 就是<b>持續處理資料紀錄</b>，而不是整批處理。',C:'streaming analytics 追求的是低延遲即時分析，high latency 剛好相反。',D:'一次性資料回填是 batch 的情境，不是 streaming 的定義。'}},
    {no:334, stem:'An organization wants to build a data pipeline to transform its data so it can be reconciled in a data warehouse. The solution must be scalable and require little or no management. Which Google product or service should the organization choose?',

     keys:['transform its data','scalable and require little or no management'],
     why:{A:'⚠️雙陷阱：Pub/Sub 只負責接收訊息（ingestion），不做 transform 這個 ETL 加工動作，容易被「pipeline」兩個字誘導選它。',B:'<b>transform</b> 資料＋<b>scalable, little or no management</b> 正是 serverless、fully managed 的 Dataflow。',C:'Cloud Storage 是物件儲存，不是處理管線。',D:'Cloud Bigtable 是 NoSQL 資料庫，不是轉換資料的管線工具。'}},
    {no:134, stem:'The customer has applications that do data processing on-premise. They have been built using Hadoop and Spark. What product should I use on Google Cloud?',

     keys:['built using Hadoop and Spark'],
     why:{A:'這題原題用舊名 <b>Dataproc</b>，新版考綱已改名 Managed Service for Apache Spark——觀念沒變：既有 Hadoop／Spark 工作直接搬上雲端用這個。',B:'Dataflow 用的是 Apache Beam 的管線模型，不是直接接手既有 Hadoop／Spark 程式碼。',C:'Dataprep 是資料清理準備工具，不是處理引擎。',D:'Dataplex 是資料治理／目錄工具，不是處理引擎。'}},
    {no:18, stem:'An IoT platform is providing services to home security systems. They have more than a million customers, each with many home devices. Burglaries or child safety issues are concerns that the clients customers. Therefore, the platform has to respond very quickly in near real time. What could be a typical data pipeline used to support this platform on Google Cloud?',
     opts:['Cloud Pub/Sub, Cloud Dataflow, Data Studio','Cloud Functions, Cloud Dataproc, Looker','Cloud Pub/Sub, Cloud Dataflow, BigQuery','Cloud Functions, Cloud Dataproc, BigQuery'], ans:'C',
     keys:['near real time','typical data pipeline'],
     why:{A:'Pub/Sub＋Dataflow 這段對，但 Data Studio 只是輕量報表工具，不是這種近即時 IoT 串流情境要接的分析端。',B:'用 Cloud Functions＋Dataproc（舊名，現稱 Managed Service for Apache Spark）不是官方教的「即時串流三段式管線」標準組合。',C:'Pub/Sub（接收）→ Dataflow（處理）→ BigQuery（分析），正是官方課程教的現代化串流資料管線標準組合。',D:'跟 B 一樣的問題，且沒有串流層（Pub/Sub＋Dataflow）先接住即時資料再送進 BigQuery。'}},
    {no:152, stem:'You are discussing scaling requirements with a gaming company. When the game launches, they are expecting incoming data surges of 2 million users or more during weekends and holidays. Their on-premise systems have had issues scaling and they want your advice on solving the issue. What do you recommend?',
     opts:['Either Compute Engine VMs or Kubernetes nodes work, but it is better to keep a buffer of an extra 2 million users.','We can deploy a Pub/Sub to ingest data which will grow to absorb demand and pass it on to other stages.','We will allocate Compute Engine VMs estimating 80% capacity of 2 million users.','We will allocate Kubernetes nodes estimating 80% capacity of 2 million users.'], ans:'B',
     keys:['incoming data surges','ingest data'],
     why:{A:'預留一個固定「多兩百萬」的緩衝不是彈性擴展，遊戲熱度變化很難用固定 buffer 準確覆蓋。',B:'<b>Pub/Sub</b> 正是設計來接住忽大忽小的即時資料湧入（ingestion），會自動隨需求量成長，把資料往下一階段送。',C:'用固定 80% 容量配置 VM 一樣是猜一個固定值，沒解決「資料量忽然暴衝」的彈性擴展問題。',D:'跟 C 同樣的問題，只是換成 Kubernetes 節點。'}}

  cards: [
`<h3>🧠 AI、ML、生成式 AI：三層俄羅斯娃娃</h3>
<p class="big"><span class="en-t">AI</span> 是最大的傘：讓機器<b>模仿人類的認知功能</b>（看、懂語言、分析、建議）都算。<span class="en-t">ML</span> 是傘下的一種做法：讓機器自己從資料裡學，不用工程師把規則寫死。<span class="en-t">Generative AI</span> 又是裡面專門「<b>生出全新內容</b>」的一種。</p>
<p>🎨 畫面：三層俄羅斯娃娃，最外層是 AI，中間是 ML，最裡面那顆專門「生東西」的是生成式 AI。</p>
<div class="kw"><span class="k en-t">artificial intelligence</span><span class="k en-t">machine learning</span><span class="k en-t">generative AI</span><span class="k en-t">mimic cognitive functions</span></div>
<div class="ex"><span class="en-t">Artificial intelligence refers to systems that can <mark>mimic cognitive functions</mark> associated with human intelligence.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">定義題先抓關鍵動詞：mimic（模仿人類認知）＝ AI、learn from data（自己從資料學）＝ ML、produce new content（生新東西）＝生成式 AI。</p>`,

`<h3>🤖 Agentic AI：不只生內容，還會自己動手做完</h3>
<p class="big"><span class="en-t">Agentic AI</span> 能自己<b>推理、規劃、執行多步驟行動</b>，只要很少人類介入就能完成複雜目標。生成式 AI 負責生一份草稿，agentic AI 是接下來自己排程、寄送、追蹤回覆——整個流程自己跑完。</p>
<p>🎨 畫面：生成式 AI 像幫你寫好一封信；agentic AI 像真的把信寄出去、還會盯著有沒有人回信的助理。</p>
<div class="kw"><span class="k en-t">agentic AI</span><span class="k en-t">autonomy</span><span class="k en-t">multi-step actions</span><span class="k en-t">minimal human supervision</span></div>
<div class="ex"><span class="en-t">Agentic AI can reason, plan, and execute <mark>multi-step actions</mark> with <mark>minimal human supervision</mark>.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th>官方講的三個效益</th><th>官方例子</th></tr>
<tr><td class="en-t">Boost productivity</td><td>員工要讀十份文件加十幾張表才寫得出報告，交給 agent 去查、去分析，幾分鐘生出草稿，人就空出來做策略性的事</td></tr>
<tr><td class="en-t">Drive growth</td><td>客服端：讀懂複雜問題、查 CRM 裡的客戶歷史、直接在工單系統執行修復。業務端：自動做售前研究、生客製化簡報、擬追蹤信</td></tr>
<tr><td class="en-t">Accelerate innovation</td><td>一次分析上千個來源的顧客回饋、跑研發模擬、產出有數據撐腰的新功能提案，把「想法到驗證」的時間壓短</td></tr>
</table></div>
<p class="tiny">官方只給三個效益，考題常把它們寫成情境（幫員工寫報告＝productivity、幫業務跑客戶＝growth、幫研發做模擬＝innovation）。認情境，別背字面。</p>`,

`<h3>📊 Data analytics／BI 看過去，AI/ML 看未來</h3>
<p class="big"><span class="en-t">Data analytics</span> 是檢查原始資料、整理出結論的科學；<span class="en-t">business intelligence</span> 是一整套蒐集、分析、呈現、監控營運資訊的策略與工具，兩者都是在回答「<b>過去發生了什麼</b>」。AI/ML 不一樣，它是用資料去預測「<b>接下來會怎樣</b>」。</p>
<p>🎨 畫面：官方例子——航空公司員工 Maya 看去年的年報做出報表，那是 data analytics/BI；如果她想預測「哪班飛機接下來容易被客訴」，就要靠 ML。</p>
<div class="kw"><span class="k en-t">data analytics</span><span class="k en-t">business intelligence</span><span class="k en-t">backward-looking</span><span class="k en-t">predictive</span></div>

<p class="tiny">題目說「報表、儀表板、彙整過去資料」→ data analytics/BI；說「預測接下來、還沒發生的事」→ AI/ML。</p>`,

`<h3>📐 資料品質六維度：訓練 ML 前先健檢這 6 件事</h3>
<p class="big">高品質的資料要通過 6 個維度檢查，任何一個維度出問題，模型學出來的東西就會走鐘。</p>
<div class="tw"><table>
<tr><th>維度</th><th>一句話定義</th><th>官方例子</th></tr>
<tr><td class="en-t">Completeness</td><td>該有的欄位資料都在，沒有缺漏</td><td>顧客交易紀錄漏填交易日期</td></tr>
<tr><td class="en-t">Uniqueness</td><td>資料不能有一堆重複記錄</td><td>訓練辨識狗品種的圖庫幾千張都是拉布拉多</td></tr>

<tr><td class="en-t">Validity</td><td>資料符合規定的格式／型別／範圍標準</td><td>日期存成 08-12-2019，規定格式卻是 YYYY/mm/dd</td></tr>
<tr><td class="en-t">Accuracy</td><td>資料內容本身是對的，不是格式對就好</td><td>圖庫裡有些狗的照片被標成貓</td></tr>
<tr><td class="en-t">Consistency</td><td>同一件事在不同地方講法要一致，不能自相矛盾</td><td>同一客戶一筆叫 John Smith，另一筆叫 J. Smith</td></tr>

`<h3>🛡️ Responsible AI 跟 Explainable AI：一個管方向，一個管解釋</h3>
<p class="big"><span class="en-t">Responsible AI</span> 是一整套治理架構，管 AI 系統夠不夠公平、有沒有人負責。<span class="en-t">Explainable AI</span> 是這套架構底下更聚焦的一塊，專門處理「模型內部邏輯看不看得懂、預測結果解釋得出來」。兩者都是為了讓人信任 AI、降低風險。</p>
<p>🎨 畫面：responsible AI 像公司的治理章程，explainable AI 像章程裡專門管「黑盒子要打開來給大家看」的那一條。</p>
<div class="kw"><span class="k en-t">responsible AI</span><span class="k en-t">explainable AI</span><span class="k en-t">governance framework</span><span class="k en-t">interpretability</span><span class="k en-t">data drift</span></div>
<div class="ex"><span class="en-t">Explainable AI is a specific subset of this framework that is focused on the <mark>internal logic and interpretability</mark> of model outputs.</span><button class="speak">🔊</button></div>
<p class="tiny">題目問「要不要監控模型跟現況脫節」→ responsible AI 治理範圍裡的 data drift 監控；問「要能講出模型為什麼這樣判斷」→ explainable AI。</p>`,

`<h3>🏭 真實世界長怎樣：拿「純網銀線上秒批信貸」看 AI 與資料品質</h3>
<p class="big">想像你在經營一家純網路銀行，這課的 AI 與資料品質原則在線上核貸中是這樣運作的：</p>
<p><b>1. BI 看過去 vs AI 看未來</b>：<br>
・<b class="en-t">BI</b>（商業智慧）：產出報表告訴董事會「過去一年全台灣違約的信貸客戶有幾成、主要在哪些年齡層」（分析歷史事實）。<br>
・<b class="en-t">AI / ML</b>（機器學習）：眼前這位剛送出申請的新客戶，系統根據他的特徵預測「他未來 3 年違約的機率有多高」（預測未來未知結果）。<br>
・<b class="en-t">Generative AI</b>（生成式 AI）：審核通過後，自動生成一封語氣溫馨、附帶量身打造還款建議的個人化通知信。</p>
<p><b>2. 資料品質六維度（飼料不健康，AI 就會算錯）</b>：<br>
・完整性（<span class="en-t">completeness</span>）：客戶月收入欄位不能空白。<br>
・準確性（<span class="en-t">accuracy</span>）：填報的年薪必須跟扣繳憑單完全吻合。<br>
・唯一性（<span class="en-t">uniqueness</span>）：同一個客戶在系統裡不能有兩筆重複的身分證字號。<br>
・及時性（<span class="en-t">timeliness</span>）：必須用最近 3 個月的聯徵信用紀錄，不能拿 5 年前過期資料來評分。</p>
<p><b>3. 負責任 AI（Responsible AI）與可解釋 AI（Explainable AI）</b>：<br>
・<span class="en-t">Responsible AI</span>：確保核貸模型不會因為客戶的性別、種族或婚姻狀況產生不公平的偏見與歧視（避免 bias 與 unfairness）。<br>
・<span class="en-t">Explainable AI</span>：當銀行拒絕借錢時，不能敷衍說是「AI 算的」，必須向主管機關與客戶解釋具體原因：「是因為近三個月信用卡循環利息過高」（決策具備透明度與可解釋性）。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">predict future outcomes</span>（AI/ML）、<span class="en-t">report on historical data</span>（BI）、<span class="en-t">ensure fairness and reduce bias</span>（Responsible AI）、<span class="en-t">understand the rationale behind decisions</span>（Explainable AI）。</p>`,

    {chunks:['A search engine used to rely on thousands of hand-coded rules to decide which result to show for a query,', ' but as the number of queries and users grew,', ' the rulebook became too complex to maintain,', ' so the team trained a model on click data to predict the best ranking instead.'], keys:[0,2,3], opts:['Machine learning','Generative AI','Data analytics'], ans:'Machine learning', why:'<br><b>💡 這個概念在講什麼</b>：ML 是 AI 底下的一種做法，讓機器自己從資料裡學，不用工程師把規則寫死（explicitly programmed）。官方明講 ML 特別適合解決「取代或簡化規則系統」這種商業問題：規則多到維護不動時，改成讓模型從實際資料（像使用者點擊紀錄）自己學出規律。官方原例就是 Google 搜尋：以前用手刻規則判斷「giants」該顯示棒球隊還是美式足球隊，規則寫到程式碼複雜到炸掉，後來改用 ML 從點擊資料學排序。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>hand-coded rules</b> 加上 <b>the rulebook became too complex to maintain</b>＝對應官方「the whole codebase became [too complex]. This is a perfect problem for ML to solve」；<b>trained a model on click data to predict the best ranking</b>＝幾乎逐字對應官方「a machine learning model can be trained to predict the rank for search results」，這正是官方舉的第一種 ML 商業問題。<br><b>❌ 其他選項為什麼不對</b>：Generative AI 是用來生出全新內容（像文字、圖片），題目講的是訓練模型預測排序、取代規則，不是生內容，方向不對。Data analytics 是彙整原始資料、看過去發生了什麼，題目講的是訓練模型去預測排序（面向未來的判斷），跟只看過去的 data analytics 方向相反。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家公司想產生一份去年每項查詢量的月報表，給主管檢視趨勢」，那就是彙整過去資料做報表，答案會變成 data analytics/business intelligence，不是 ML。'},
    {chunks:["A bank's loan-approval model keeps making decisions that customers do not understand,", ' so regulators ask the bank to show why each application was approved or denied,', " which means the bank needs tools that can interpret the model's internal logic", ' rather than just monitoring whether the output looks reasonable.'], keys:[1,2], opts:['Explainable AI','Responsible AI','Data analytics'], ans:'Explainable AI', why:'<br><b>💡 這個概念在講什麼</b>：Explainable AI 是 responsible AI 這套治理架構底下更聚焦的一塊，專門處理「模型內部邏輯看不看得懂、預測結果解釋得出來」。官方用「黑盒子」比喻模型不透明的問題，Explainable AI 就是專門幫你解讀這些預測、確保透明度的一套工具。像 responsible AI 是公司的治理章程，Explainable AI 是章程裡專門管「把黑盒子打開來給大家看」的那一條。<br><b>🔑 題目哪幾個字帶你到這裡</b>：<b>regulators ask the bank to show why each application was approved or denied</b>＝監管機關要求銀行講出「為什麼」核准或拒絕，正是官方情境裡「模型做出奇怪的決定卻講不出原因，就沒辦法讓使用者信任」的翻版；<b>interpret the model’s internal logic</b>＝幾乎逐字對應官方對 explainable AI 的定義「help you interpret these predictions」。<br><b>❌ 其他選項為什麼不對</b>：Responsible AI 管的是整套治理架構——公平性、有沒有人負責、要不要監控 data drift，範圍比題目大；題目聚焦在「解釋單一決策的內部邏輯」這個更窄的問題，屬於 Explainable AI 專門處理的範圍。Data analytics 是彙整歷史資料做報表，跟解釋模型內部判斷邏輯完全無關。<br><b>🔄 換個說法就換答案</b>：如果題目改成「這家銀行想確保核貸模型不會因為性別、種族產生不公平的偏見，並持續監控模型有沒有跟現況脫節（data drift）」，答案就會變成 Responsible AI。'},

    {stem:'A company wants to build a fully custom AI agent for its business without setting up its own data centers, training a foundation model from scratch, or assembling every development tool separately. Which benefit of Google Cloud AI offerings best matches this need?',

  exam: [
    {no:373, stem:"A retail organization is training a model to recommend products to customers for an ecommerce website. The model was trained on previous purchases, but did not include demographic information on each buyer. What dimension of the data is responsible for the model's poor performance?",
     opts:['Accuracy','Validity','Timeliness','Completeness'],
     ans:'D', keys:['did not include demographic information'],
     why:{A:'accuracy 管內容本身對不對，這裡的問題指的是「整個欄位沒收集到」，而不只是「資料填錯」，跟 accuracy 無關。',B:'validity 管格式、型別、範圍符不符合標準，這裡沒有格式問題。',C:'timeliness 管資料新不新，這裡沒提到資料過時。',D:'demographic information 整個沒被收集進資料集 = <b>completeness</b>（完整性）出問題，官方定義就是「該有的資訊都要在」。'}},
    {no:278, stem:'What is generative Al?',
     opts:['A specific field of Al that can be used to create content','An umbrella term that includes all types of machine learning algorithms','An Al model for labeling images','A machine learning model for language translation'],
     ans:'A', keys:['generative Al'],
     why:{A:'<b>A specific field of Al that can be used to create content</b> 對應官方定義：generative AI 是一種能產生新內容的 AI 類型。',B:'generative AI 不是「涵蓋所有 ML 演算法的傘狀詞」，那個角色是 AI/ML 本身，不是 generative AI。',C:'圖片標籤模型是判別式任務，不是生成內容的 generative AI。',D:'單純翻譯模型是特定任務的 ML 模型，不等於整個 generative AI 領域。'}},
    {no:274, stem:'What is artificial intelligence?',

     ans:'D', keys:['normally requires human cognition'],

    {no:139, stem:'When creating machine learning models, a key initial step is to identify the type of model required. One of these is the classification model. Which of these statements define a classification model?',

     ans:'A', keys:['discrete values'],
     why:{A:'離散分類（像 book、car 這種類別標籤）正是官方對 <b>classification model</b> 的定義。',B:'這是虛構的說法，現實中沒有「用來給演算法打分的 meta-model maker」這種分類模型定義。',C:'輸出連續數值（像房價 $120,000）描述的是 regression model，不是 classification model。',D:'classification 沒有被 regression 取代，兩種模型現在都在用，只是解決的問題不同（離散類別 vs 連續數值）。'}},
    {no:383, stem:'An organization is training a machine learning model to make predictions. What could improve the prediction accuracy of their model?',

    {no:358, stem:'A financial organization has many customers who close their accounts every year. The organization wants to use data and AI to identify at-risk customers, so they can retain customers by offering discounts and improved services. What should the organization do?',

    {no:260, stem:'A cinema company wants to build a model to predict customer visit patterns for the coming year. They have three years of customer visit data across 300 theaters; however, the data has been stored in different formats by different theaters. They must train the ML model. What should they do?',

    {no:237, stem:'An organization needs to categorize a large group of photographs using pre-trained machine learning. Which Google Cloud product or service should the organization use?',

    {no:352, stem:'A real estate organization processes photos of properties uploaded by their agents to an internal application. They must manually check and remove photos that contain personally identifiable information like passports and credit cards. They want a solution that their developer can use to integrate with their app as quickly as possible. Which solution should they use?',

     keys:['as quickly as possible'],

    {no:372, stem:'A manufacturing organization has a large collection of images labeled as intact or defective parts. They want to use this data to build a simple solution to detect faulty parts on their production line. They have no data science expertise. Which solution should they use?',

    {no:6, stem:'Which Google Cloud service or feature lets you build machine learning models using Standard SQL and data in a data warehouse?',

    {no:69, stem:'Your organization wants to predict the behavior of visitors to its public website. To do that, you have decided to build a machine learning model. Your team has database-related skills but only basic machine learning skills, and would like to use those database skills. Which Google Cloud product or feature should your organization choose?',

/*L10*/{ id: 10, title: '上雲遷移策略與運算術語', ch: 'S4 · 18%', ready: true,
  mind: '這課全部都在考同一件事：組織把 workload（工作負載）搬上雲端，官方一路教了 6 個動作（<b>retire、retain、rehost、replatform、refactor、reimagine</b>），加上運算世界從 <b>VM → container → serverless</b> 一路變輕的抽象化光譜。',
  cards: [
`<h3>🚀 上雲第一步：先盤點，再決定每個 workload 怎麼搬</h3>
<p class="big">搬去雲端之前，組織通常先做 <span class="en-t">discovery and assessment</span>（探索與盤點）：把地端環境的應用程式、相依關係、成本都摸清楚，才能決定每個 <span class="en-t">workload</span>（工作負載，例如 container、資料庫、VM）該怎麼處理。</p>
<p>🎨 畫面：搬家前先開一張清單，把每個房間的家具（workload）都列出來，再決定哪些要丟、哪些留在原地、哪些要搬去新家。</p>
<div class="kw"><span class="k en-t">workload</span><span class="k en-t">discovery and assessment</span><span class="k en-t">retire</span><span class="k en-t">retain</span></div>
<div class="ex"><span class="en-t">The goal here is to determine <mark>which migration strategy is appropriate</mark> for each.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny"><span class="en-t">retire</span>＝這個 workload 不划算、不安全、不相容，直接淘汰；<span class="en-t">retain</span>＝刻意留在地端或混合雲，不搬。這兩個認得定義就好，接下來四個才是這課主秀。</p>`,

`<h3>🏠 Rehost：原封不動搬過去（Lift and Shift）</h3>
<p class="big"><span class="en-t">Rehost</span> 指的是把 workload 搬到雲端時，<b>完全不改</b>它的程式碼或架構，也就是常說的 <span class="en-t">lift and shift</span>。這通常是遷移的第一步，最簡單最快，但代價是沒吃到雲端的完整好處，搬過去之後要擴展、管理也比較吃力。</p>
<p>🎨 畫面：家具原封不動整箱搬進新家，連包裝都沒拆——快是快，但沒有照新家格局重新擺放，住起來還是舊的樣子。</p>
<div class="kw"><span class="k en-t">rehost</span><span class="k en-t">lift and shift</span></div>
<div class="ex"><span class="en-t">Rehost refers to the migration of a workload to the cloud <mark>without changing anything</mark> in the workload's code or architecture.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">官方舉的例子是特殊的地端老系統（<span class="en-t">legacy applications</span>），搬家工具是 <span class="en-t">Google Cloud VMware Engine</span> 和 <span class="en-t">Bare Metal Solution</span>——保留原本的維運方式，又用得到雲端的擴展性、可靠性、安全性。</p>`,

`<h3>🔧 Replatform：邊搬邊小改（Move and Improve）</h3>
<p class="big"><span class="en-t">Replatform</span> 是搬去雲端的同時，對程式碼或架構做<b>一些調整</b>，也叫 <span class="en-t">move and improve</span>。這樣能靠雲端原生的擴展性和可靠性提升效能、降低維運成本，但改動和測試的過程比較複雜、花時間。</p>
<p>🎨 畫面：搬家時順便把舊沙發送去翻新，不整套換新，但坐起來更舒服。</p>
<div class="kw"><span class="k en-t">replatform</span><span class="k en-t">move and improve</span></div>
<div class="ex"><span class="en-t">Replatform refers to the process of migrating a workload to the cloud while <mark>making some changes</mark> to the workload's code or architecture.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">判斷 rehost 還是 replatform 就看「有沒有動到程式碼或架構」——完全沒動是 rehost，動一點是 replatform。</p>`,

`<h3>🛠️ Refactor：整個重寫成雲原生</h3>
<p class="big"><span class="en-t">Refactor</span> 是真的去改 workload 的程式碼，例如把它改寫成 <span class="en-t">microservices</span>（微服務）架構或 serverless 架構。好處是應用程式會變得<b>更有效率、更能擴展、更安全</b>，是值得投資的做法；缺點是過程複雜又耗時。</p>
<p>🎨 畫面：舊沙發直接送去回收，照新家格局訂做一套全新的家具。</p>
<div class="kw"><span class="k en-t">refactor</span><span class="k en-t">microservices</span></div>
<div class="ex"><span class="en-t">Refactoring does have benefits. It means that workloads can become <mark>more efficient, scalable, or secure</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">考古題 NO.322 考的就是這個好處——把應用程式改成微服務架構做 refactor，換來的正是「更有效率、更能擴展」。</p>`,

`<h3>💡 Reimagine：連怎麼用技術都重新想過</h3>
<p class="big"><span class="en-t">Reimagine</span> 講的不只是搬家或改程式碼，而是重新思考整個組織要怎麼用技術達成商業目標，包括重新檢視雲端策略、以及像 <span class="en-t">AI</span>、<span class="en-t">machine learning</span> 這類技術的用法。做得好可以<b>提升效率、降低成本、提高敏捷度</b>，也更能滿足客戶和夥伴的需求。</p>
<p>🎨 畫面：不只是換家具，而是重新設計整棟房子的生活方式。</p>
<div class="kw"><span class="k en-t">reimagine</span></div>
<div class="ex"><span class="en-t">Reimagining cloud computing can help organizations to <mark>improve their efficiency, reduce costs, and increase agility</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">四個策略力道由小到大：<span class="en-t">rehost</span>（不動）＜<span class="en-t">replatform</span>（小改）＜<span class="en-t">refactor</span>（重寫）＜<span class="en-t">reimagine</span>（連怎麼用技術的想法都重新來過）。</p>`,

`<h3>🔑 六種策略一次對照 ＋ 兩個額外常考詞</h3>
<div class="tw"><table>
<tr><th>策略</th><th>動了什麼</th><th>官方關鍵字</th></tr>
<tr><td><b class="en-t">retire</b></td><td>直接淘汰</td><td class="en-t">not cost-effective, not secure, incompatible</td></tr>
<tr><td><b class="en-t">retain</b></td><td>留在原地</td><td class="en-t">kept on-premises or hybrid</td></tr>
<tr><td><b class="en-t">rehost</b></td><td>什麼都沒動</td><td class="en-t">without changing anything, lift and shift</td></tr>
<tr><td><b class="en-t">replatform</b></td><td>動一點</td><td class="en-t">making some changes, move and improve</td></tr>
<tr><td><b class="en-t">refactor</b></td><td>整個重寫</td><td class="en-t">changing the code</td></tr>
<tr><td><b class="en-t">reimagine</b></td><td>連想法都重來</td><td class="en-t">rethinking how to use technology</td></tr>
</table></div>
<div class="box key">🗣️ 口訣：<b>retire 丟掉、retain 留著、rehost 不動、replatform 小動、refactor 重寫、reimagine 重新想。</b></div>
<div class="box warn">⚠️ 另外兩個字：<span class="en-t">greenfield</span>（全新建置，沒有舊系統包袱）、<span class="en-t">brownfield</span>（延用既有系統的脈絡去建新的）。這兩個字<b>不在 CDL 六門官方課程全文裡</b>，是為了對上 2 題考古題（NO.248、NO.304）另外查證補充的雲端業界通用說法——概念是：問「要<b>取代</b>既有系統」比較常對應 brownfield；問「<b>完全從零開始</b>、沒有舊系統」對應 greenfield。</div>`,

`<h3>📦 Container vs VM：虛擬化「硬體」還是「作業系統」</h3>
<p class="big"><span class="en-t">Virtual machine</span>（VM）靠 <span class="en-t">hypervisor</span> 在實體硬體和 VM 之間拉出一層抽象層，把 CPU、記憶體、儲存空間分配給每台 VM——每台 VM 都有<b>自己完整的作業系統</b>。<span class="en-t">Container</span>（容器）不虛擬化整台硬體，只在作業系統之上打包執行檔和它需要的相依套件，多個 container <b>共用同一個 host 作業系統</b>，所以啟動快、用的記憶體也少很多。</p>
<p>🎨 畫面：VM 像每人一整棟獨立套房（自己的水電系統）；container 像共享辦公室裡的個人工作桌（同一套水電，各自佔一張桌子）。</p>
<div class="kw"><span class="k en-t">container</span><span class="k en-t">virtual machine</span><span class="k en-t">hypervisor</span></div>
<div class="ex"><span class="en-t">The key difference between VMs and containers is that VMs virtualize an entire machine, whereas <mark>containers only virtualize software layers above the operating system level</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">NO.210 考的就是這句話的白話版：每台 VM 各自有自己的 OS，container 則共用同一個 OS。</p>`,

`<h3>🌈 從 VM 到 Container 到 Serverless：抽象化光譜</h3>
<p class="big">官方用「房間」比喻三種運算方式：VM 像一整套獨立客房，什麼都自己顧；container 像共享辦公室裡各自的工作桌，比 VM 輕巧；<span class="en-t">serverless computing</span> 更進一步，像用廚房家電——你不用管線路怎麼接，按下按鈕，那個功能跑完就自動關掉，provider 全部包辦基礎設施，你只要寫程式碼裡那一個 <span class="en-t">function</span>。管理大量 container 要靠 <span class="en-t">Kubernetes</span> 這個開源的容器編排平台，負責排程、擴展、自動上線和回滾。</p>
<p>🎨 畫面：VM 是獨立套房、container 是共享辦公桌、serverless 是烤麵包機——插電按鈕就好，沒在用的時候完全不占資源。</p>
<div class="kw"><span class="k en-t">Kubernetes</span><span class="k en-t">serverless computing</span><span class="k en-t">function</span></div>
<div class="ex"><span class="en-t">You provide the code for the function you want to run, and <mark>the public cloud provider does everything else</mark>.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">Kubernetes 是「管很多 container」的工具，serverless 則是「連 container 都不用你管」——兩者都是為了不同規模的容器化／抽象化需求。下一課會教 Google Cloud 把這些概念做成哪些實際產品，這課先把觀念釘牢。</p>`,

`<h3>🏭 真實世界長怎樣：拿「50 年老牌傳統百貨公司資訊大搬家」看上雲遷移</h3>
<p class="big">想像你在幫一家有 50 年歷史的老牌百貨公司搬遷核心系統上雲，這課的遷移路徑與技術分工：</p>
<p><b>1. 四種上雲遷移策略（怎麼搬）</b>：<br>
・<b class="en-t">Rehost</b>（Lift and Shift，原封不動搬家）：地下室的老舊庫存管理主機，直接一字不改照抄搬到雲端 VM（<span class="en-t">Compute Engine</span>）上跑。最快、風險最低、完全不需改程式碼。<br>
・<b class="en-t">Replatform</b>（Move and Improve，換底座小改）：原本自己裝在虛擬機裡的 MySQL 資料庫，搬家時順便換成全代管的 <span class="en-t">Cloud SQL</span>，核心程式不改，但從此不用自己管作業系統補丁。<br>
・<b class="en-t">Refactor</b>（重構打掉重練）：把龐大笨重、牽一髮動全身的單體購物系統完全重寫，拆成會員、購物車、促銷等獨立微服務，改用雲端原生容器架構。<br>
・<b class="en-t">Retire</b>（退休淘汰）：清點時發現 15 年前用的紙本報表歸檔小程式根本沒人碰，直接關閉停用省成本。</p>
<p><b>2. 現代運算術語（行李箱與起重機）</b>：<br>
・<b class="en-t">Container</b>（容器）：像標準化隨身行李箱（Docker）。把程式碼跟需要的函式庫打包在一起，不管在哪台電腦開箱跑起來結果一模一樣。<br>
・<b class="en-t">Kubernetes</b>（K8s）：碼頭調度起重機。當系統有幾百個行李箱在跑時，負責自動安排哪台機器扛行李、哪箱當機自動換新的、尖峰時自動增加箱子。<br>
・<b class="en-t">Serverless</b>（無伺服器）：像隨招隨到的計程車。只為實際搭車里程付費，完全不用管計程車怎麼保養、加水換機油。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">lift and shift with minimal or no code changes</span>（Rehost）、<span class="en-t">take advantage of cloud-managed services</span>（Replatform）、<span class="en-t">redesign into microservices</span>（Refactor）、<span class="en-t">orchestrate containers</span>（Kubernetes）。</p>`,

`<h3>🪤 常見誘餌</h3>
<div class="box warn"><b>誘餌 1：rehost、replatform、refactor 別搞混</b><br>
看「動了多少」：完全不動程式碼／架構 → <span class="en-t">rehost</span>；動一點點（例如換個 managed 資料庫）→ <span class="en-t">replatform</span>；整個改寫（例如改成微服務）→ <span class="en-t">refactor</span>。</div>
<div class="box warn"><b>誘餌 2：retire vs retain，方向別選反</b><br>
<span class="en-t">retire</span> 是把 workload <b>丟掉</b>（不划算、不安全、不相容）；<span class="en-t">retain</span> 是<b>刻意留著</b>不搬，繼續放在地端或混合雲環境。</div>
<div class="box warn"><b>誘餌 3：greenfield vs brownfield</b><br>
題目問「要<b>取代</b>既有的地端系統」→ <span class="en-t">brownfield</span>；問「<b>完全從零開始</b>建全新環境」→ <span class="en-t">greenfield</span>。這組詞不是官方課程全文的定義，見上一張卡的揭露說明。</div>
<div class="box warn"><b>誘餌 4：serverless 不是「沒有伺服器」</b><br>
伺服器還是存在，只是<b>你不用管它</b>——provider 幫你顧基礎設施，你只寫 function 的程式碼。</div>
<div class="box warn"><b>誘餌 5：container vs VM 別選反</b><br>
<span class="en-t">VM</span> 每台各自有自己的作業系統（較重、啟動慢）；<span class="en-t">container</span> 共用 host 作業系統（較輕、啟動快）。</div>
<p>看完了 🎉 接下來換你動手：② 先練「看到英文情境 → 反射出是哪個遷移策略或運算術語」。</p>`

  mcq: [

  mind: '這課全部都在考「情境對到哪個產品」：先看<b>誰要扛維運責任</b>——自己全扛選 <span class="en-t">Compute Engine</span>，要客製選 <span class="en-t">GKE</span>，圖方便選 <span class="en-t">Cloud Run</span>，只跑一下下選 <span class="en-t">Cloud Run functions</span>；舊系統原封不動搬家要看<b>能不能虛擬化</b>；API 題目考的是<b>讓程式互相溝通的定義</b>跟<b>拿它賺錢的方法</b>。',
  cards: [
`<h3>🖥️ Compute Engine：IaaS，作業系統以上你自己管</h3>
<p class="big"><span class="en-t">Compute Engine</span> 是 Google Cloud 的 <span class="en-t">Infrastructure as a Service（IaaS）</span>產品，讓你在 Google 的基礎設施上建立、執行<span class="en-t">虛擬機器（virtual machine，VM）</span>，不用先付一大筆錢買硬體。每台 VM 都有完整作業系統的功能，可以像實體伺服器一樣設定：你自己選 <span class="en-t">machine type</span>，決定要多少虛擬 CPU、記憶體、儲存空間、什麼作業系統。</p>
<p>🎨 畫面：租一整棟水電都接好的空屋，格局、家具、怎麼擺全部自己決定，房東只負責把房子蓋好、水電接通。</p>
<div class="kw"><span class="k en-t">Compute Engine</span><span class="k en-t">IaaS</span><span class="k en-t">virtual machine</span><span class="k en-t">machine type</span></div>
<div class="ex"><span class="en-t">Compute Engine is Google Cloud's Infrastructure as a Service (IaaS) product that lets users create and run VMs on Google infrastructure.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">計費是每秒計費、最低收 1 分鐘，跑越久還會自動套用 sustained-use 折扣；想更省錢可以用 <span class="en-t">Spot VMs</span>（第 9 課教過），這裡認得它是 Compute Engine 的計費選項就好。</p>`,

`<h3>☸️ GKE：完整掌控的容器調度平台</h3>
<p class="big"><span class="en-t">Google Kubernetes Engine（GKE）</span>是 Google 代管的 <span class="en-t">Kubernetes</span> 服務，環境由多台 <span class="en-t">Compute Engine</span> 執行個體組成叢集（<span class="en-t">cluster</span>），可以自訂機器類型、節點數量、網路設定。GKE 提供 API 跟網頁介面，讓應用程式在幾分鐘內部署完成，還能視需求擴縮，並附監控、資源管理、除錯的功能。</p>
<p>🎨 畫面：像自己承租一整層辦公室，隔間、動線、門禁規則都自己設計，換來的是完全照自己的規矩運作。</p>
<div class="kw"><span class="k en-t">Google Kubernetes Engine</span><span class="k en-t">GKE</span><span class="k en-t">cluster</span><span class="k en-t">GKE Autopilot</span></div>
<div class="ex"><span class="en-t">GKE is an ideal choice when you need full control over your setup. It's great for complex applications that require custom settings, specific networking, or a dedicated Kubernetes environment.</span><button class="speak">🔊</button></div>
<p class="tiny">不想自己管叢集細節，也有 <span class="en-t">GKE Autopilot</span> 模式：Google 幫你管好整個叢集的基礎設施，改成用 Pod 計費，官方案例 Ubie 用它省了 20% 基礎設施成本。</p>`,

`<h3>🏃 Cloud Run：全代管、可縮到 0 的容器平台</h3>
<p class="big"><span class="en-t">Cloud Run</span> 是全代管的無伺服器環境，用來跑容器化應用程式，把底層基礎設施藏起來，開發團隊不用自己準備或管理伺服器。因為任何能容器化的語言或函式庫都能跑，對 <span class="en-t">stateless</span>（無狀態）應用程式來說彈性很高。平台會自動處理所有維運工作，包含依流量自動擴縮資源，甚至可以縮到 0。</p>
<p>🎨 畫面：像叫外送，你只管點餐（寫程式碼），廚房怎麼開火、什麼時候關火（伺服器的開關與擴縮）全部交給對方處理。</p>
<div class="kw"><span class="k en-t">Cloud Run</span><span class="k en-t">stateless</span><span class="k en-t">scale to zero</span></div>
<div class="ex"><span class="en-t">Cloud Run is a fully managed environment for running containerized applications. It abstracts away the underlying infrastructure, meaning development teams do not need to provision or manage servers.</span><button class="speak">🔊</button></div>
<p class="tiny">跟 GKE 怎麼選：官方講得很直接——<b>需要多少控制權 vs. 願意讓雲端代管商處理多少事</b>。簡單、想快速擴縮就選 Cloud Run；要客製、要專屬 Kubernetes 環境就選 GKE。</p>`,

`<h3>⚡ Cloud Run functions：單一用途、事件驅動的小段程式碼</h3>
<p class="big"><span class="en-t">Cloud Run functions</span>（舊名 <span class="en-t">Cloud Functions</span>）是一個平台，用來放置附掛在雲端基礎設施與服務事件上的簡單、單一用途函式。這種 <span class="en-t">event-driven</span>（事件驅動）模式讓程式碼能自動因應特定觸發條件執行，例如資料庫變動、檔案上傳、<span class="en-t">Pub/Sub</span> 訊息。很適合輕量自動化，例如網站有新訂單時自動推播通知，不需要一台常駐的伺服器。</p>
<p>🎨 畫面：裝一個感應式電燈，有人經過（事件發生）才自動亮燈，平常完全不耗電，不用一直開著等。</p>
<div class="kw"><span class="k en-t">Cloud Run functions</span><span class="k en-t">event-driven</span></div>
<div class="ex"><span class="en-t">Cloud Run Functions is a platform for hosting simple, single-purpose functions that are attached to events emitted from cloud infrastructure and services.</span><button class="speak">🔊</button></div>
<p class="tiny">考古題常寫舊名 <span class="en-t">Cloud Functions</span>，看到就直接換成新名 <span class="en-t">Cloud Run functions</span> 來想，概念完全一樣：小段程式碼、被動觸發、不用管伺服器。</p>`,

`<h3>🧭 四個運算選項怎麼選：從「自己管多少」看</h3>
<p class="big">官方課程把選型講得很直白：<b>要多少控制權，就決定要自己管多少事</b>。從「你自己管一切」到「Google 幫你管到只剩程式碼」排一排，就是 <span class="en-t">Compute Engine → GKE → Cloud Run → Cloud Run functions</span>。另外，把既有的特殊工作負載搬上雲端（不重寫、原封不動）則是另外兩個專門的遷移方案。</p>
<div class="tw"><table>
<tr><th>產品</th><th>你自己管什麼</th><th>官方選型情境</th></tr>
<tr><td class="en-t">Compute Engine</td><td>整台 VM，含作業系統</td><td>需要完整掌控作業系統與硬體設定</td></tr>
<tr><td class="en-t">GKE</td><td>叢集設定、網路規則</td><td>複雜應用程式，需要自訂設定或專屬 Kubernetes 環境</td></tr>
<tr><td class="en-t">Cloud Run</td><td>幾乎不用管，交出容器就好</td><td>簡單、無狀態應用程式，要快速自動擴縮（含縮到 0）</td></tr>
<tr><td class="en-t">Cloud Run functions</td><td>只寫函式本身</td><td>單一用途、事件觸發的小段程式碼</td></tr>
</table></div>

`<h3>🌐 混合多雲三兄弟：GKE Enterprise、AlloyDB Omni、BigQuery Omni</h3>
<p class="big">多數企業不會一次全部搬進雲端，官方課程把「怎麼管跨雲、跨機房的系統」拆成幾個產品：<span class="en-t">GKE Enterprise</span>（舊名 <span class="en-t">Anthos</span>）用 <span class="en-t">attached clusters</span> 把 AWS、Azure 上既有的第三方 Kubernetes 叢集，也納進 Google Cloud 的統一管理；<span class="en-t">AlloyDB Omni</span> 是可下載安裝的 <span class="en-t">AlloyDB</span> 版本，讓你在地端、邊緣、其他雲上都能跑同一套相容 <span class="en-t">PostgreSQL</span> 的高效能資料庫；<span class="en-t">BigQuery Omni</span> 則是多雲分析方案，資料留在 AWS 或 Azure 原地不動，也能直接用 BigQuery 分析，不用先搬過來。</p>
<p>🎨 畫面：GKE Enterprise 像總公司派一個總管，把散在各地的分店（各雲的叢集）都收進同一套管理系統；AlloyDB Omni 像把同一套廚房設備複製到每個分店；BigQuery Omni 像派一個會計師直接飛到分店當地看帳，不用把帳本全部寄回總部。</p>
<div class="kw"><span class="k en-t">GKE Enterprise</span><span class="k en-t">AlloyDB Omni</span><span class="k en-t">BigQuery Omni</span></div>
<div class="ex"><span class="en-t">A multicloud analytics solution that lets you analyze data where it lives, whether in Google Cloud, AWS, or Azure.</span><button class="speak">🔊</button></div>
<p class="big">跨環境的<b>資料</b>怎麼管，官方另外用四張翻卡列了四個方案（考題會問「這個情境該用哪一個」）：</p>
<div class="tw"><table>
<tr><th>方案</th><th>官方怎麼說</th></tr>
<tr><td><b class="en-t">Cloud SQL</b></td><td>全託管的 <span class="en-t">MySQL</span>／<span class="en-t">PostgreSQL</span>／<span class="en-t">SQL Server</span>，在混合與多雲架構裡當「資料的錨」。可以把地端資料複製過來做災難復原，或把工作負載搬上雲，同時避免被單一廠商綁死</td></tr>
<tr><td><b class="en-t">AlloyDB Omni</b></td><td>可下載的地端版 AlloyDB，能跑在任何環境（地端、邊緣、其他雲），讓你在自己的機房跑高效能、AI-ready 的資料庫，準備好再搬上雲</td></tr>
<tr><td><b class="en-t">BigQuery Omni</b></td><td>多雲分析方案，資料放在 Google Cloud、AWS 還是 Azure 都能就地分析，省掉昂貴的搬資料，打破資料孤島</td></tr>
<tr><td><b class="en-t">Looker</b></td><td>不綁雲的 BI 平台，跨所有環境把資料整合成統一視角。商業指標定義一次，全公司分析都用同一套真相來源</td></tr>
</table></div>
<p class="tiny">四個都是為了「不要被單一雲端綁死」。認情境：要<b>託管關聯式資料庫當錨點</b>→ Cloud SQL；要<b>自己機房跑高效能資料庫</b>→ AlloyDB Omni；要<b>跨雲就地分析</b>→ BigQuery Omni；要<b>跨環境的統一報表與指標</b>→ Looker。官方另外還有 <span class="en-t">Google Distributed Cloud（GDC）</span>負責讓 Google Cloud 的軟硬體直接跑在地端機房或邊緣，這個名詞認得就好，不是本課重點。</p>`,

`<h3>🔌 API：讓不同程式互相溝通的規則 ＋ Apigee 幫你管好它</h3>
<p class="big"><span class="en-t">Application programming interface（API）</span>是一組指令，讓不同的軟體程式互相溝通。可以把 API 想成餐廳的服務生：服務生（API）跟客人（程式 A）點餐，把需求傳給廚房（程式 B），再把餐點（回應）送回客人手上——中間客人完全不用知道廚房怎麼運作。Google 自己就提供很多 API，例如可以搜尋網站的 API、地圖資料的 API、翻譯文字的 API。開放 API 能幫組織創造新產品、新收入來源、新的合作夥伴關係。等到組織真的開始對外開放 API，接下來要顧的是怎麼管理它：<span class="en-t">Apigee API Management</span> 就是 Google Cloud 用來營運 API 的平台，用更大的規模、安全性、自動化來管理 API，扮演一個聰明的閘道。</p>
<p>🎨 畫面：API 是服務生，負責點餐送餐；Apigee 則是餐廳經理，決定誰能進來點餐、要不要辦會員分級、要盯流量尖峰別把廚房擠爆、還要記帳算營收。</p>
<div class="kw"><span class="k en-t">API</span><span class="k en-t">application programming interface</span><span class="k en-t">Apigee API Management</span></div>
<div class="ex"><span class="en-t">An application programming interface (API) is a set of instructions that lets different software programs communicate with each other.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th>Apigee 四大官方效益</th><th>做什麼</th></tr>
<tr><td class="en-t">Security</td><td>用認證、授權、加密保護 API</td></tr>
<tr><td class="en-t">Analytics</td><td>即時與歷史流量分析</td></tr>
<tr><td class="en-t">Development tools</td><td>視覺化編輯器＋測試沙盒，簡化開發流程</td></tr>
<tr><td class="en-t">Traffic management</td><td>流量節流（throttling），避免尖峰把後端擠爆</td></tr>
</table></div>
<p class="tiny">官方案例 AccuWeather：本來只跟少數大型合作夥伴共享氣象資料，用 Apigee 之後可以把 API 包成不同等級賣給上千個獨立開發者，還能自動追蹤流量、計費——這正是 API 創造新收入來源的實例。</p>`,

`<h3>🏭 真實世界長怎樣：拿「跨國旅遊訂房網」看運算產品與 API 調度</h3>
<p class="big">想像你在營運類似 Agoda 的跨國旅遊訂房網，這課的運算產品是這樣配合跑起來的：</p>
<p><b>1. 四種運算模式（依照要自己管多少來選）</b>：<br>
・<b class="en-t">Compute Engine</b>（虛擬機器 VM）：需要完整控制底層作業系統，用來跑 15 年前特定商用版 Windows 舊套件（<span class="en-t">IaaS</span>，掌控度最高）。<br>
・<b class="en-t">GKE</b>（Google Kubernetes Engine）：核心搜尋引擎與訂單調度微服務，需要精細調度成百上千個容器叢集、跨區域自動擴增縮減。<br>
・<b class="en-t">Cloud Run</b>：快閃促銷網頁，打包成容器丟上去，平時沒人訪問自動縮到 0 個執行個體（一毛錢都不收），客人點進來 1 秒瞬間開機（Serverless Container）。<br>
・<b class="en-t">Cloud Run functions</b>（舊 Cloud Functions）：客人下訂成功刷卡完，觸發短短 10 行程式碼發送確認 Email，執行 0.5 秒後立刻關閉計費（輕量事件驅動）。</p>
<p><b>2. 跨出 Google 邊界的混合多雲管理</b> ➔ <b class="en-t">GKE Enterprise</b>（舊名 Anthos）<br>
有些法規要求極為嚴格的飯店會員伺服器必須留在地端機房，用一套集中控制台同時管好地端機房、AWS 與 Google Cloud 上的所有容器叢集。</p>
<p><b>3. API 經濟與變現</b> ➔ <b class="en-t">Apigee</b><br>
把全台飯店空房即時資料打包成 <span class="en-t">API</span> 開放給各大比價網站串接。Apigee 當數位收銀台與大門守衛，負責管控呼叫次數、安全驗證、甚至對外計費變現（<span class="en-t">API monetization</span>）。</p>
<p class="tiny">題目英文常這樣考：<span class="en-t">complete control over operating system</span>（Compute Engine）、<span class="en-t">manage and scale container clusters</span>（GKE）、<span class="en-t">serverless containers scaling to zero</span>（Cloud Run）、<span class="en-t">event-driven code execution</span>（Cloud Run functions）、<span class="en-t">manage API lifecycle and monetize</span>（Apigee）。</p>`,

     why:{A:'正解：<b>fine-grained control of traffic between the containers</b>（container 之間流量的細部控制，類似 Kubernetes network policy）加上對 scaling policies 的精細掌控，正是官方課程說「需要完整掌控就選 GKE」的情境，Cloud Run 這種全代管平台做不到這麼細的客製。',B:'App Engine 是 PaaS，把基礎設施都包起來讓你專心寫程式，新版考綱也已經把它移除；它給不了題目要的細部流量控制跟精細擴縮策略。',C:'Cloud Run 是簡單、全代管的容器平台，刻意把細節藏起來讓你不用管，跟題目要的 fine-grained control 方向相反。',D:'直接用 VM 要自己從頭搭容器編排跟流量控制的機制，不像 GKE 內建這些管理功能，效率差很多。'}},
    {no:8, stem:"Your company's development team is building an application that will be deployed on Cloud Run. You are designing a CI/CD pipeline so that any new version of the application can be deployed in the fewest number of steps possible using the CI/CD pipeline you are designing. You need to select a storage location for the images of the application after the CI part of your pipeline has built them. What should you do?",
     opts:['Create a Compute Engine image containing the application','Store the images in Container Registry','Store the images in Cloud Storage','Create a Compute Engine disk containing the application'],
     ans:'B', keys:['storage location for the images'],
     why:{A:'這是幫整台 VM 做映像檔，不是給 Cloud Run 用的容器映像檔存放位置，題目要的是 CI 建置完的容器映像檔放哪裡。',B:'正解：Cloud Run 部署的是容器映像檔，CI 建置完的映像檔標準做法是存進登錄檔（registry）服務，供 CD 階段直接拉取部署，步驟最少。',C:'Cloud Storage 是物件儲存，不是容器登錄檔，Cloud Run 沒辦法直接把 Cloud Storage 裡的檔案當容器映像檔部署，會多出額外轉換步驟。',D:'建磁碟一樣是給 VM 用的，不是容器化部署流程裡的映像檔存放方式。'}},
    {no:369, stem:'An organization wants to write and run small pieces of code in a serverless way that respond to events like huge discounts. Which Google Cloud compute solution should the organization use?',
     opts:['Google Kubernetes Engine','Cloud Functions','Bare Metal Solution','Compute Engine'],
     ans:'B', keys:['serverless way that respond to events'],
     why:{A:'GKE 適合持續運作、複雜的容器化應用，題目要的是 small pieces of code、serverless、respond to events，殺雞用牛刀。',B:'正解：事件觸發、跑一小段程式碼，就是 Cloud Functions 的定位；新版考綱新名叫 Cloud Run functions，觀念不變：event-driven、single-purpose。',C:'Bare Metal Solution 是給特殊授權、無法虛擬化的舊系統用裸機伺服器的，跟事件驅動的小段程式碼無關。',D:'Compute Engine 要自己管整台 VM，跟 serverless（不用管伺服器）的需求矛盾。'}},
    {no:58, stem:'An organization wants to scale their existing virtual machine architecture as quickly as possible. Why should the organization use VMware Engine?',
     opts:['To archive virtual machine instances.','To deploy custom APIs seamlessly.','To migrate virtual machines to containers.','To replatform virtual machines as they are.'],
     ans:'D', keys:['scale their existing virtual machine architecture'],
     why:{A:'VMware Engine 不是用來封存 VM 的，是用來搬遷並繼續運行現有 VM 環境。',B:'部署 API 是 Apigee 的事，跟搬遷既有 VM 架構無關。',C:'VMware Engine 保留的是既有虛擬化架構，不是把 VM 轉成容器，那是給容器遷移工具做的事。',D:'正解：官方定義 Google Cloud VMware Engine 就是讓既有 VMware 工作負載原封不動搬到雲端繼續跑，不用重新架構應用程式，也就是 replatform 但保留原樣。'}},
    {no:293, stem:'An organization has a large VMWare environment that they want to migrate to the cloud. They want to retain existing operational processes and tools. Which Google Cloud service should the organization use?',
     opts:['Google Cloud VMware Engine','Bare Metal Solution','VMWare vSphere','Compute Engine'],
     ans:'A', keys:['retain existing operational processes and tools'],
     why:{A:'正解：大型 VMware 環境要遷移、又要保留既有維運流程跟工具，正是 Google Cloud VMware Engine 官方定義的情境。',B:'Bare Metal Solution 是給無法虛擬化、需要裸機硬體的舊系統（例如 Oracle）用的，跟保留 VMware 環境的需求不同。',C:'VMWare vSphere 是 VMware 自家的虛擬化管理軟體本身，不是 Google Cloud 提供的遷移服務。',D:'Compute Engine 要重新在標準 VM 上建置環境，沒辦法直接保留既有 VMware 維運工具與流程。'}},
    {no:287, stem:'An organization needs to migrate specialized workloads to the cloud while maintaining their existing complex licensing and architecture. What Google Cloud solution should the organization use?',
     opts:['Compute Engine','Bare Metal Solution','Cloud Run','Cloud Functions'],
     ans:'B', keys:['maintaining their existing complex licensing and architecture'],
     why:{A:'Compute Engine 是一般標準 VM，沒辦法滿足複雜授權與架構這種特殊需求。',B:'正解：官方定義 Bare Metal Solution 就是給有複雜授權、特殊架構、需要專用裸機硬體的工作負載（例如舊版 Oracle）用的遷移方案。',C:'Cloud Run 是全代管的容器平台，跟保留既有複雜授權架構的裸機需求無關。',D:'Cloud Functions 是事件驅動的小段程式碼服務，跟遷移特殊授權的舊系統無關。'}},
    {no:80, stem:'Which Google Cloud product gives you a consistent platform for multi-cloud application deployments and extends other Google Cloud services to your environment?',
     opts:['Google Kubernetes Engine','Virtual Public Cloud','Compute Engine','Anthos'],
     ans:'D', keys:['consistent platform for multi-cloud application deployments'],
     why:{A:'GKE 本身管的是單一叢集容器調度，題目要的是跨多雲的一致平台，這是 GKE Enterprise（舊名 Anthos）在做的事，GKE 是它的基礎但不是同一個東西。',B:'這不是 Google Cloud 正式產品名稱（正確講法是 VPC，Virtual Private Cloud），也不是多雲管理平台。',C:'Compute Engine 是單一雲端上的 VM 服務，跟跨多雲一致部署無關。',D:'正解：題目講的「跨多雲一致平台、延伸 Google Cloud 服務到其他環境」正是 Anthos 的官方定位，新考綱已經改名叫 GKE Enterprise，概念不變：用 attached clusters 把其他雲的 Kubernetes 叢集也納入 Google Cloud 的統一管理。'}},
    {no:160, stem:'You are working in a company that provides different services to its customer. Now it also wants to offer some paid API services to its B2B customers for e.g. google provides google maps API, cloud vision API, and language translation API. You need to figure out the best solution for the service.',
     opts:['Java Programming Spring Boot Framework for to solve the problem of APIs management.','Cloud Functions with Firestore and payment gateways integration development.','Apigee API Management','Frontend & Backend Development with NodeJs and angular etc.'],
     ans:'C', keys:['paid API services to its B2B customers'],
     why:{A:'Java Spring Boot 是拿來寫程式的框架，不是專門做 API 管理（流量控管、計費分層、安全）的平台。',B:'Cloud Functions 加 Firestore 加金流串接是拿來開發功能的做法，不是專門的 API 管理平台，沒有內建的流量分析、安全閘道功能。',C:'正解：要把 API 開放給 B2B 客戶收費使用，正是 Apigee API Management 的官方定位：安全、分析、開發工具、流量控管四大效益都在。',D:'前後端框架開發一樣只是拿來寫程式的技術堆疊，不是 API 管理平台。'}},
    {no:291, stem:'A food delivery service needs access to real-time menu information from all partner restaurants. They also need to share customer order information with the restaurants in real time. What should the organization use?',
     opts:['Site reliability engineering (SRE)','An application programming interface (API)','A customized machine learning model','A multi-regional database'],
     ans:'B', keys:['share customer order information with the restaurants in real time'],
     why:{A:'SRE 是維運可靠度的做法，不是讓不同系統即時交換資料的機制。',B:'正解：不同系統（外送平台與餐廳系統）之間即時交換選單與訂單資訊，正是 API 的官方定義：讓不同軟體程式互相溝通的標準化介面。',C:'客製化 ML 模型跟即時資料交換無關，是用來做預測或辨識的。',D:'多區域資料庫解決的是資料的可用性與延遲，不是不同組織系統之間即時溝通的問題。'}},
    {no:249, stem:'What is the purpose of an application programming interface (API)?',
     opts:['To provide cloud plugins for integrated development environments','To manage multiple containerized workloads','To connect networks from different cloud providers','To provide a set of instructions that allow computer programs to communicate with each other'],
     ans:'D', keys:['purpose of an application programming interface (API)'],
     why:{A:'提供雲端 IDE 外掛不是 API 的定義，只是開發工具的一種功能。',B:'管理多個容器化工作負載是 Kubernetes／GKE 在做的事，不是 API 的用途。',C:'連接不同雲端供應商的網路是網路層的互聯（例如 Interconnect），不是 API 的定義。',D:'正解：官方定義 API 就是一組讓不同電腦程式互相溝通的指令規則，這題問的就是 API 最基本的定義。'}}

  mind: '這一課所有題目其實都在考同一件事：情境一出現，先抓「這題在講機密性、完整性，還是可用性」、「要驗證身分還是決定權限」、「威脅是誰造成的」——對到正確的資安詞彙，答案就浮出來了。',
  cards: [
`<h3>🛡️ CIA triad：資安的三隻腳</h3>
<p class="big">雲端資安的核心框架叫 <span class="en-t">CIA triad</span>，三個原則各自顧不同風險：<span class="en-t">confidentiality</span>（機密性）顧「誰能看」、<span class="en-t">integrity</span>（完整性）顧「資料有沒有被亂改」、<span class="en-t">availability</span>（可用性）顧「需要的時候拿不拿得到」。</p>
<p>🎨 畫面：保險箱只給對的人開（機密性）、裡面東西沒被人動過手腳（完整性）、你要用的時候箱子打得開（可用性）。</p>
<div class="kw"><span class="k en-t">confidentiality</span><span class="k en-t">integrity</span><span class="k en-t">availability</span><span class="k en-t">CIA triad</span></div>
<div class="ex"><span class="en-t"><mark>Availability</mark> is all about making sure that cloud systems and services are always accessible and ready for use by the right people when needed.</span><button class="speak" title="唸給我聽">🔊</button></div>
<p class="tiny">官方另外提到 <span class="en-t">control</span>（存取控制機制）和 <span class="en-t">compliance</span>（法規遵循）是把 CIA 三原則變成具體做法的兩個工具，常跟 CIA 一起出現在同一題裡。</p>`,

`<h3>🚪 Zero-trust architecture：預設誰都不能信</h3>
<p class="big"><span class="en-t">Zero-trust architecture</span> 假設沒有人或裝置天生可信，每次要存取資源前都要重新驗證身分、重新授權，不會因為「已經在公司內網」就直接放行。</p>
<p>🎨 畫面：辦公室裡每一道門都要刷卡，就算你剛剛才刷過上一道門。</p>
<div class="kw"><span class="k en-t">zero-trust architecture</span><span class="k en-t">authenticated</span><span class="k en-t">authorized</span></div>
<div class="ex"><span class="en-t">Every user and device must be <mark>authenticated and authorized</mark> before accessing resources.</span><button class="speak">🔊</button></div>
<p class="tiny">Google 資料中心本身也是用這一套設計的——不是只有帳號登入才叫 zero trust，硬體層級一樣套用。</p>`,

`<h3>🔑 Least privilege：只給剛好夠用的權限</h3>
<p class="big"><span class="en-t">Least privilege</span> 原則是只給使用者完成工作所需要的最小權限。跟它常被放在一起考的是 <span class="en-t">privileged access</span>（特權存取）——這種帳號能碰的資源範圍比一般使用者大，例如系統管理員要做疑難排解、資料還原。</p>
<p>🎨 畫面：業務只拿到 CRM 系統的鑰匙，拿不到財務系統或人事系統的鑰匙。</p>
<div class="kw"><span class="k en-t">least privilege</span><span class="k en-t">privileged access</span></div>
<div class="ex"><span class="en-t">A sales representative might only need access to a customer relationship management (CRM) system without requiring access to other systems like <mark>payroll or finance</mark>.</span><button class="speak">🔊</button></div>
<p class="tiny">在 Google Cloud 落地的標準做法是「建群組、把角色指派給群組」，而不是一個一個人給權限——後面 exam 題會遇到這個 pattern。</p>`,

`<h3>🔐 加密三狀態：at rest／in transit／in use</h3>
<p class="big">資料在不同狀態都要顧到加密：<span class="en-t">at rest</span>（靜止，存在硬碟或伺服器裡）、<span class="en-t">in transit</span>（傳輸中，在網路上移動）、<span class="en-t">in use</span>（使用中，正被電腦處理）。Google Cloud 預設把 at rest 和 in transit 都自動加密，不用你自己動手設定。</p>
<p>🎨 畫面：東西鎖在保險箱裡（at rest）、搬運途中放在上鎖的箱子（in transit）、打開來用的時候也用特殊技術包住不讓人偷看（in use）。</p>
<div class="kw"><span class="k en-t">at rest</span><span class="k en-t">in transit</span><span class="k en-t">in use</span><span class="k en-t">encryption</span><span class="k en-t">decryption</span></div>
<div class="ex"><span class="en-t">At Google Cloud, we <mark>automatically encrypt</mark> all customer content <mark>at rest</mark>, without any effort required from you.</span><button class="speak">🔊</button></div>
<p class="tiny"><span class="en-t">Encryption</span> 是把資料轉成看不懂的格式，<span class="en-t">decryption</span> 是用金鑰換回原本的樣子——金鑰保管好，資料才安全。官方還提到有更進階的技術能讓「使用中」的資料在記憶體裡也保持加密（Confidential Computing），但考綱只要求 at rest／in transit／in use 這三個狀態。</p>`,

`<h3>🪪 The three As：authentication／authorization／auditing</h3>
<p class="big">雲端身分管理靠三個 A：<span class="en-t">authentication</span>（驗證你是誰）、<span class="en-t">authorization</span>（決定你能做什麼）、<span class="en-t">auditing</span>（記錄誰做了什麼）。這三件事在 Google Cloud 由 <span class="en-t">IAM</span>（Identity and Access Management）統一管理。</p>
<p>🎨 畫面：authentication 像進大樓刷證件、authorization 像證件能開哪些門、auditing 像大樓監視器全程錄影存查。</p>
<div class="kw"><span class="k en-t">authentication</span><span class="k en-t">authorization</span><span class="k en-t">auditing</span><span class="k en-t">IAM</span></div>
<div class="ex"><span class="en-t">Authentication serves as the gatekeeper, because it <mark>verifies the identity</mark> of users or systems that seek access.</span><button class="speak">🔊</button></div>
<div class="tw"><table>
<tr><th>A</th><th>做什麼</th><th>畫面</th></tr>
<tr><td><b class="en-t">Authentication</b></td><td>驗證身分</td><td>刷證件</td></tr>
<tr><td><b class="en-t">Authorization</b></td><td>決定能做什麼</td><td>證件能開哪些門</td></tr>
<tr><td><b class="en-t">Auditing</b></td><td>記錄與追查行為</td><td>監視器錄影</td></tr>
